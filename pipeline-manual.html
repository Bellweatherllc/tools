<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Manual</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  /* ── Brand fonts (Bellweather, hosted at tools/fonts/) ── */
  @font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
  @font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap;}
  @font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
  @font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
  @font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-MediumItalic.woff2') format('woff2');font-weight:500;font-style:italic;font-display:swap;}

  :root{
    /* Brand palette */
    --limestone:#282828; --cotton:#F6F2EE; --brand-navy:#263860;
    --slate:#9091A0; --linen:#E5E1D8; --marble:#FFFFFF;
    /* Pipeline accents, for family resemblance with the tool this documents */
    --gold:#d8b64f; --gold-light:#f9e6ae; --pl-green:#2d7a3a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--cotton);font-family:'TT Norms Pro',sans-serif;color:var(--limestone);line-height:1.7;font-size:15.5px;}

  /* ── Page chrome ── */
  .masthead{border-bottom:1px solid var(--linen);background:var(--marble);}
  .masthead-inner{max-width:1080px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;gap:14px;}
  .masthead img{height:26px;display:block;}
  .masthead .mh-label{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);border-left:1px solid var(--linen);padding-left:14px;}

  .layout{display:grid;grid-template-columns:235px 1fr;max-width:1080px;margin:0 auto;gap:44px;padding:38px 28px 120px;}
  @media(max-width:840px){.layout{grid-template-columns:1fr;}.toc{position:static;max-height:none;margin-bottom:8px;}}

  /* ── TOC (built automatically from headings) ── */
  .toc{position:sticky;top:24px;align-self:start;max-height:calc(100vh - 48px);overflow-y:auto;font-size:12.5px;padding-right:8px;}
  .toc-part{font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin:20px 0 6px;}
  .toc-part:first-child{margin-top:0;}
  .toc a{display:block;color:var(--limestone);text-decoration:none;padding:3px 0 3px 10px;border-left:2px solid transparent;}
  .toc a:hover{border-left-color:var(--gold);color:#000;}

  /* ── Rendered document ── */
  #doc h1{font-family:'TT Norms Pro',sans-serif;font-weight:400;text-transform:uppercase;font-size:30px;letter-spacing:.02em;line-height:1.2;color:var(--limestone);}
  #doc h1 .accent{font-family:'Swear Text',serif;font-style:italic;font-weight:500;text-transform:none;letter-spacing:0;}
  /* first italic paragraph after title = subtitle; second = edition stamp */
  #doc h1 + p{color:var(--slate);font-size:14.5px;max-width:620px;margin-top:12px;}
  #doc h1 + p + p em{display:inline-block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:2px 9px;margin-top:6px;}

  #doc h2{font-family:'TT Norms Pro',sans-serif;font-weight:500;font-size:24px;margin:60px 0 6px;padding-top:28px;border-top:3px solid var(--brand-navy);color:var(--brand-navy);scroll-margin-top:20px;}
  #doc h2 + p{color:var(--slate);font-size:13.5px;max-width:560px;margin-bottom:8px;}

  #doc h3{font-family:'Swear Text',serif;font-weight:500;font-size:20px;margin:40px 0 10px;color:var(--limestone);scroll-margin-top:20px;}
  #doc h4{font-family:'TT Norms Pro',sans-serif;font-size:13.5px;font-weight:700;letter-spacing:.02em;margin:24px 0 6px;}

  #doc p{margin:0 0 14px;max-width:650px;}
  #doc ul,#doc ol{margin:0 0 14px 22px;max-width:630px;}
  #doc li{margin-bottom:8px;}
  #doc b,#doc strong{font-weight:700;}
  #doc em{font-family:'Swear Text',serif;font-style:italic;}
  #doc code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:rgba(38,56,96,.07);border-radius:4px;padding:1px 5px;}
  #doc a{color:var(--brand-navy);}

  /* blockquotes render as the gold aside boxes */
  #doc blockquote{background:var(--marble);border:1px solid var(--linen);border-left:4px solid var(--gold);border-radius:8px;padding:13px 17px;margin:18px 0;font-size:13.5px;max-width:650px;}
  #doc blockquote p{margin:0 0 8px;}
  #doc blockquote p:last-child{margin-bottom:0;}

  #doc hr{border:none;border-top:1px solid var(--linen);margin:32px 0;}

  /* loading / error states */
  .state{max-width:520px;margin:80px auto;text-align:center;color:var(--slate);font-size:14px;line-height:1.7;padding:0 24px;}
  .state b{color:var(--limestone);}

  @media print{
    .masthead,.toc{display:none;}
    .layout{display:block;padding:0;}
    body{font-size:12px;background:#fff;}
    #doc blockquote{break-inside:avoid;}
    #doc h2{break-before:page;}
    #doc h2:first-of-type{break-before:auto;}
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <img src="https://bellweatherllc.github.io/tools/logos/HorizontalLogo-B.svg" alt="Bellweather">
    <span class="mh-label">Pipeline Manual</span>
  </div>
</div>

<div class="layout">
  <nav class="toc" id="toc"></nav>
  <main id="doc">
    <div class="state" id="loadState">Loading the manual&hellip;</div>
  </main>
</div>

<script>
(function(){
  'use strict';
  // The words live in pipeline-manual.md, in the same folder as this page.
  // This shell fetches it, renders it, and builds the table of contents.
  // To edit the manual, edit the .md file only — this page never needs changes.
  var MD_FILE='pipeline-manual.md';

  fetch(MD_FILE,{cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(md){
    render(md);
  }).catch(function(err){
    document.getElementById('loadState').innerHTML=
      '<b>Couldn&rsquo;t load the manual&rsquo;s words.</b><br><br>'
      +'This page reads its content from <b>pipeline-manual.md</b>, which must sit in the same folder. '
      +'If you opened this file directly from your computer, that&rsquo;s the cause &mdash; it only works from the website. '
      +'If you&rsquo;re on the website and seeing this, the .md file is missing or unreachable ('+String(err.message||err)+').';
  });

  function render(md){
    marked.setOptions({headerIds:false,mangle:false});
    var doc=document.getElementById('doc');
    doc.innerHTML=marked.parse(md);

    // Title accent: set the em-dash-separated tail of the H1 in Swear italic,
    // matching the brand H1 treatment (sans + italic serif accent).
    var h1=doc.querySelector('h1');
    if(h1){
      var parts=h1.innerHTML.split('\u2014');
      if(parts.length===2){
        h1.innerHTML=parts[0]+'\u2014 <span class="accent">'+parts[1].trim()+'</span>';
      }
    }

    // Build the TOC from H2 (parts) and H3 (sections), assigning ids as we go.
    var toc=document.getElementById('toc');
    var html='', n=0;
    doc.querySelectorAll('h2,h3').forEach(function(h){
      n++;
      var id='s'+n; h.id=id;
      if(h.tagName==='H2'){
        html+='<div class="toc-part">'+h.textContent+'</div>';
      } else {
        html+='<a href="#'+id+'">'+h.textContent+'</a>';
      }
    });
    toc.innerHTML=html;
  }
})();
</script>
</body>
</html>
