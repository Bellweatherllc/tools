<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE System Map</title>
<link rel="icon" type="image/svg+xml" href="logos/favicon.svg">
<style>
@font-face { font-family:'TT Norms Pro'; src:url('fonts/TT_Norms_Pro_Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
@font-face { font-family:'TT Norms Pro'; src:url('fonts/TT_Norms_Pro_Medium.woff2') format('woff2'); font-weight:500; font-display:swap; }
@font-face { font-family:'TT Norms Pro'; src:url('fonts/TT_Norms_Pro_DemiBold.woff2') format('woff2'); font-weight:600; font-display:swap; }
@font-face { font-family:'TT Norms Pro'; src:url('fonts/TT_Norms_Pro_Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
@font-face { font-family:'Swear Display'; src:url('fonts/SwearDisplay-Medium.woff2') format('woff2'); font-weight:500; font-display:swap; }

:root {
  --bg:#F6F2EE; --surface:#FFFFFF; --surface-2:#EFEAE3; --line:#E5E1D8; --line-2:#CFC9BD;
  --ink:#282828; --ink-2:#5a5854; --ink-3:#8c8981;
  --navy:#263860; --accent:#263860; --accent-soft:rgba(38,56,96,.10);
  --write:#263860; --read:#8c8981; --link:#a8743a;
  --live:#3f7d4e; --testing:#b7862b; --dev:#4a6fa5; --reference:#8c8981; --missing:#b0413e;
  --tt-bg:#263860; --tt-ink:#fff; --tt-n:#E5E1D8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1b1b1a; --surface:#242423; --surface-2:#2d2c2a; --line:#3a3936; --line-2:#4a4844;
    --ink:#F6F2EE; --ink-2:#c9c4ba; --ink-3:#8f8a80;
    --accent:#9fb3de; --accent-soft:rgba(159,179,222,.14);
    --write:#9fb3de; --read:#7d7870; --link:#d1a066;
    --live:#6fb07f; --testing:#d9ad55; --dev:#86a7d8; --reference:#8f8a80; --missing:#e0716d;
    --tt-bg:#E5E1D8; --tt-ink:#282828; --tt-n:#263860;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#1b1b1a; --surface:#242423; --surface-2:#2d2c2a; --line:#3a3936; --line-2:#4a4844;
  --ink:#F6F2EE; --ink-2:#c9c4ba; --ink-3:#8f8a80;
  --accent:#9fb3de; --accent-soft:rgba(159,179,222,.14);
  --write:#9fb3de; --read:#7d7870; --link:#d1a066;
  --live:#6fb07f; --testing:#d9ad55; --dev:#86a7d8; --reference:#8f8a80; --missing:#e0716d;
  --tt-bg:#E5E1D8; --tt-ink:#282828; --tt-n:#263860;
  color-scheme: dark;
}

* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--bg); color:var(--ink); font:14px/1.45 'TT Norms Pro', system-ui, -apple-system, 'Segoe UI', sans-serif; }
button, input, select, textarea { font:inherit; color:inherit; }
a { color:var(--accent); }

header.top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 20px; background:var(--navy); color:#F6F2EE; }
header.top img { height:22px; }
header.top h1 { font-family:'Swear Display', Georgia, serif; font-weight:500; font-size:21px; margin:0; letter-spacing:.01em; }
.badge { font-size:10px; font-weight:700; letter-spacing:.08em; opacity:.8; border:1px solid rgba(246,242,238,.35); border-radius:4px; padding:1px 6px; }
header.top .sub { font-size:12px; opacity:.7; margin-left:auto; }
header.top .theme { background:none; border:1px solid rgba(246,242,238,.35); color:#F6F2EE; border-radius:6px; padding:3px 9px; cursor:pointer; font-size:12px; }

.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:10px 20px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:5; }
.toolbar input[type=search] { width:220px; max-width:100%; padding:6px 10px; border:1px solid var(--line-2); border-radius:6px; background:var(--bg); }
.seg { display:inline-flex; gap:4px; flex-wrap:wrap; align-items:center; }
.seg-label { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); margin-right:2px; }
.chip { border:1px solid var(--line-2); background:var(--bg); border-radius:999px; padding:3px 10px; font-size:12px; cursor:pointer; }
.chip[aria-pressed="true"] { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.btn { border:1px solid var(--line-2); background:var(--bg); border-radius:6px; padding:5px 11px; font-size:12.5px; cursor:pointer; }
.btn:hover { border-color:var(--accent); }
.btn.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.btn.danger { color:var(--missing); }
.btn[aria-pressed="true"] { background:var(--accent); color:var(--bg); border-color:var(--accent); }
.spacer { flex:1; }
.edit-only { display:none; }
body.editing .edit-only { display:inline-flex; }
.draft-flag { font-size:11.5px; color:var(--testing); display:none; }
body.has-draft .draft-flag { display:inline; }

main { display:grid; grid-template-columns:minmax(0,1fr) 380px; min-height:calc(100vh - 120px); }
.canvas { overflow:auto; padding:14px 10px 30px; }
.canvas svg { display:block; width:100%; min-width:980px; height:auto; }
main > .canvas, main > aside.panel { min-width:0; }
aside.panel { border-left:1px solid var(--line); background:var(--surface); padding:18px 20px 40px; overflow:auto; max-height:calc(100vh - 60px); position:sticky; top:52px; align-self:start; min-height:calc(100vh - 120px); }
@media (max-width: 900px) {
  main { grid-template-columns:1fr; }
  aside.panel { border-left:none; border-top:1px solid var(--line); max-height:none; position:static; }
  header.top, .toolbar { padding-left:16px; padding-right:16px; }
  header.top .sub { margin-left:0; width:100%; }
}

/* ── SVG ── */
svg text { font-family:'TT Norms Pro', system-ui, sans-serif; fill:var(--ink); }
.col-title { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; fill:var(--ink-3); }
.grp-title { font-size:11.5px; font-weight:700; fill:var(--ink-2); }
.grp-sub { font-size:10.5px; fill:var(--ink-3); }
.grp-band { fill:var(--surface-2); }
.node { cursor:pointer; }
.node rect.box { fill:var(--surface); stroke:var(--line-2); stroke-width:1; }
.node:hover rect.box { stroke:var(--accent); }
.node text.lbl { font-size:12.5px; font-weight:500; }
.node text.meta { font-size:10px; fill:var(--ink-3); }
.node .dot { stroke:var(--surface); stroke-width:1.5; }
.node.st-missing rect.box { stroke:var(--missing); stroke-dasharray:3 2; }
.node.st-missing text.lbl { fill:var(--missing); }
.node.sel rect.box { stroke:var(--accent); stroke-width:2; fill:var(--accent-soft); }
.node.hit rect.box { stroke:var(--link); stroke-width:1.6; }
.edge { fill:none; stroke-width:1.1; }
.edge.w { stroke:var(--write); opacity:.42; }
.edge.r { stroke:var(--read); stroke-dasharray:4 3; opacity:.5; }
.edge.rw { stroke:var(--write); stroke-width:1.8; opacity:.42; }
.edge.lk { stroke:var(--link); opacity:.55; }
svg.focus .edge { opacity:.05; }
svg.focus .edge.on { opacity:.95; stroke-width:2; }
svg.focus .node { opacity:.28; }
svg.focus .node.on { opacity:1; }
svg.focus .grp-title, svg.focus .grp-sub { opacity:.5; }
svg.hide-data .edge.w, svg.hide-data .edge.r, svg.hide-data .edge.rw { display:none; }
svg.hide-links .edge.lk { display:none; }
.legend text { font-size:11px; fill:var(--ink-2); }

/* ── Panel ── */
.panel h2 { font-family:'Swear Display', Georgia, serif; font-weight:500; font-size:22px; margin:0 0 4px; line-height:1.2; }
.panel .kicker { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); margin-bottom:6px; }
.panel h3 { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); margin:18px 0 6px; font-weight:700; }
.panel p { margin:6px 0; }
.panel ul { margin:4px 0; padding-left:18px; }
.panel li { margin:2px 0; }
.pill { display:inline-block; font-size:11px; border-radius:4px; padding:1px 7px; margin:0 4px 4px 0; background:var(--surface-2); color:var(--ink-2); }
.pill.st { color:#fff; }
.ref { display:inline-block; border:1px solid var(--line-2); border-radius:5px; padding:2px 8px; margin:0 5px 5px 0; font-size:12px; cursor:pointer; background:var(--bg); }
.ref:hover { border-color:var(--accent); }
.ref small { color:var(--ink-3); }
.kv { display:grid; grid-template-columns:90px 1fr; gap:3px 10px; font-size:13px; }
.kv dt { color:var(--ink-3); }
.kv dd { margin:0; word-break:break-word; }
.muted { color:var(--ink-3); }
.empty { color:var(--ink-3); font-style:italic; }
.intro p { color:var(--ink-2); }
.stat-row { display:flex; gap:18px; margin:12px 0 4px; flex-wrap:wrap; }
.stat b { display:block; font-size:22px; font-family:'Swear Display', Georgia, serif; font-weight:500; }
.stat span { font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.08em; }
.gap-list li { margin-bottom:6px; }

/* ── Edit form ── */
.form label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); margin:12px 0 4px; }
.form input, .form select, .form textarea { width:100%; border:1px solid var(--line-2); border-radius:6px; padding:6px 8px; background:var(--bg); }
.form textarea { min-height:70px; resize:vertical; }
.form .hint { font-size:11px; color:var(--ink-3); margin-top:3px; }
.rw-table { width:100%; border-collapse:collapse; font-size:12.5px; }
.rw-table th { text-align:left; font-size:10.5px; color:var(--ink-3); font-weight:600; padding:8px 0 2px; }
.rw-table td { padding:2px 0; border-bottom:1px solid var(--line); }
.rw-table td.c { width:34px; text-align:center; }
.form-actions { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }

dialog { border:1px solid var(--line-2); border-radius:10px; background:var(--surface); color:var(--ink); padding:18px; width:min(720px, calc(100vw - 32px)); }
dialog::backdrop { background:rgba(0,0,0,.35); }
dialog textarea { width:100%; min-height:50vh; font:12px/1.4 ui-monospace, Menlo, Consolas, monospace; border:1px solid var(--line-2); border-radius:6px; padding:8px; background:var(--bg); }

#tt { position:fixed; z-index:9999; background:var(--tt-bg); color:var(--tt-ink); font-size:11.5px; line-height:1.5; padding:6px 11px; border-radius:6px; pointer-events:none; opacity:0; transition:opacity .1s; box-shadow:0 4px 12px rgba(0,0,0,.22); max-width:280px; }
#tt.show { opacity:1; }
#tt .tt-n { font-weight:700; color:var(--tt-n); }
#tt .tt-d { font-size:11px; opacity:.85; }
#toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--tt-bg); color:var(--tt-ink); padding:8px 14px; border-radius:6px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9999; }
#toast.show { opacity:1; }
</style>
</head>
<body>

<header class="top">
  <img src="logos/HorizontalLogo-W.svg" alt="Bellweather">
  <h1>CORE System Map</h1>
  <span class="badge" id="versionBadge"></span>
  <span class="sub">Tools · the SharePoint lists behind them · where each lives</span>
  <button class="theme" id="themeBtn" type="button" aria-label="Toggle light or dark theme">Theme</button>
</header>

<div class="toolbar">
  <input type="search" id="q" placeholder="Search tools, lists, functions…" aria-label="Search">
  <div class="seg" role="group" aria-label="Layers">
    <span class="seg-label">Show</span>
    <button class="chip" id="layerData" aria-pressed="true" data-tip="Tool → list connections" data-tip-d="Solid = writes · dashed = reads only · thick = reads and writes">Data</button>
    <button class="chip" id="layerLinks" aria-pressed="true" data-tip="Tool → tool links" data-tip-d="Arcs on the left: one tool opens or deep-links into another">Tool links</button>
  </div>
  <div class="seg" role="group" aria-label="Location filter" id="locFilter">
    <span class="seg-label">Location</span>
  </div>
  <span class="spacer"></span>
  <span class="draft-flag" data-tip="You have unexported edits in this browser" data-tip-d="Export HTML to make them permanent, or Revert to discard">● Draft edits</span>
  <button class="btn" id="editBtn" aria-pressed="false" data-tip="Edit mode" data-tip-d="Click any tool or list to edit it. Edits save as a draft in this browser until exported.">Edit</button>
  <button class="btn edit-only" id="addToolBtn">+ Tool</button>
  <button class="btn edit-only" id="addStoreBtn">+ List / store</button>
  <button class="btn edit-only" id="jsonBtn" data-tip="View, copy or paste the raw map data (JSON)">Data JSON</button>
  <button class="btn edit-only primary" id="exportBtn" data-tip="Download core-system-map.html with your edits baked in" data-tip-d="Commit the downloaded file to the repo to publish it.">Export HTML</button>
  <button class="btn edit-only danger" id="revertBtn" data-tip="Discard draft edits and reload the published map">Revert</button>
</div>

<main>
  <div class="canvas" id="canvas"></div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<dialog id="jsonDlg">
  <h3 style="margin:0 0 8px;">Map data (JSON)</h3>
  <p class="muted" style="margin:0 0 10px;font-size:12.5px;">Edit directly, then Apply. This is the same block that lives in <code>&lt;script id="map-data"&gt;</code> inside the HTML file.</p>
  <textarea id="jsonTxt" spellcheck="false"></textarea>
  <div class="form-actions">
    <button class="btn primary" id="jsonApply">Apply</button>
    <button class="btn" id="jsonCopy">Copy</button>
    <button class="btn" id="jsonClose">Close</button>
  </div>
</dialog>

<div id="tt"></div>
<div id="toast"></div>

<!-- ═══════════════ MAP DATA — edit here (or in the page's Edit mode, then Export HTML) ═══════════════ -->
<script type="application/json" id="map-data">
{
 "statuses": [
  {
   "id": "live",
   "label": "Live",
   "color": "var(--live)"
  },
  {
   "id": "partial",
   "label": "Partly wired",
   "color": "var(--testing)"
  },
  {
   "id": "offline",
   "label": "No SharePoint",
   "color": "var(--dev)"
  },
  {
   "id": "reference",
   "label": "Reference",
   "color": "var(--reference)"
  },
  {
   "id": "missing",
   "label": "Linked, missing",
   "color": "var(--missing)"
  }
 ],
 "principles": [
  "SharePoint is authoritative from first load; localStorage is a read cache only.",
  "Graph $select / $expand name every field explicitly, lookups included.",
  "No SharePoint column is named Status — build state is BuildStatus.",
  "Lists use the CORE_ prefix. Older names (PB_, CP_, PA_, FBA-) stay as they are.",
  "Doc links are GUID-anchored; projects tie to folders by driveItem id. Phase folders are discovered at runtime.",
  "CORE never writes to Buildertrend. A human carries dates and invoices across.",
  "Clocks and risk signals are computed live, never stored.",
  "Deployed files never move or rename — the URL is the contract."
 ],
 "locations": [
  {
   "id": "bwcore",
   "label": "BWCore",
   "short": "BWCore",
   "access": "Open",
   "path": "/sites/BWCore",
   "holds": "Operational lists — projects, team, config, schedule, permits, budgets, design, process."

  {

   "label": "OperationsSecure",

   "id": "ops",

   "id": "planned",
   "label": "Planned lists (Roadmap)",

   "access": "Not built",

   "holds": "Lists named in the Roadmap stack that no tool reads or writes yet."
  }
 ],
 "libs": [
  {
   "id": "sherpa-auth",
   "short": "auth",

   "desc": "Shared MSAL sign-in: SherpaAuth.init / signIn / getToken / graph(). sessionStorage cache."
  },
  {
   "id": "sherpa-lookup",

  },
  {

 ],

  {

  {

<script>
// Captured before anything touches the DOM — Export HTML rewrites this with new data.
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

const CORE_VERSION = 'v1';
(() => { const v = document.getElementById('versionBadge'); if (v) v.textContent = CORE_VERSION; })();

const PAGES_BASE = 'https://bellweatherllc.github.io/tools/';
const DRAFT_KEY = 'core_sysmap_draft';
const NS = 'http://www.w3.org/2000/svg';

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

const PUBLISHED = JSON.parse(document.getElementById('map-data').textContent);
let MAP = JSON.parse(JSON.stringify(PUBLISHED));
{
  const d = lsGet(DRAFT_KEY);
  if (d) { try { MAP = JSON.parse(d); document.body.classList.add('has-draft'); } catch (e) { lsDel(DRAFT_KEY); } }
}

const state = { sel: null, q: '', loc: null, editing: false };

function escHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
function saveDraft() { lsSet(DRAFT_KEY, JSON.stringify(MAP)); document.body.classList.add('has-draft'); }

const byId = (arr, id) => arr.find(x => x.id === id);
const tool = id => byId(MAP.tools, id);
const store = id => byId(MAP.stores, id);
const loc = id => byId(MAP.locations, id);
const lib = id => byId(MAP.libs, id);
const statusOf = id => byId(MAP.statuses, id) || { id, label:id, color:'var(--reference)' };

// ── Derived relationships ─────────────────────────────────────
function edges() {
  const data = [], links = [];
  for (const t of MAP.tools) {
    const r = new Set(t.reads || []), w = new Set(t.writes || []);
    for (const s of new Set([...r, ...w])) {
      if (!store(s)) continue;
      data.push({ t: t.id, s, kind: r.has(s) && w.has(s) ? 'rw' : w.has(s) ? 'w' : 'r' });
    }
    for (const l of (t.links || [])) if (tool(l.to)) links.push({ from: t.id, to: l.to, note: l.note || '' });
  }
  return { data, links };
}
function related(id) {
  const { data, links } = edges(), set = new Set([id]);
  for (const e of data) { if (e.t === id) set.add(e.s); if (e.s === id) set.add(e.t); }
  for (const l of links) { if (l.from === id) set.add(l.to); if (l.to === id) set.add(l.from); }
  if (loc(id)) for (const s of MAP.stores) if (s.loc === id) { set.add(s.id); for (const e of data) if (e.s === s.id) set.add(e.t); }
  if (MAP.groups.some(g => g.id === id)) for (const t of MAP.tools) if (t.group === id) set.add(t.id);
  return set;
}
function matches(obj, q) {
  if (!q) return true;
  const hay = [obj.id, obj.label, obj.file, obj.purpose, obj.desc, obj.notes, ...(obj.functions || [])].join(' ').toLowerCase();
  return hay.includes(q);
}

// ── Layout + render ───────────────────────────────────────────
const L = { W: 1180, arcX: 190, toolX: 200, toolW: 270, storeX: 830, storeW: 300, rowH: 25, boxH: 20, grpHead: 34, grpGap: 14, top: 64 };

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, s, cls, anchor) { const t = el('text', { x, y, class: cls, 'text-anchor': anchor || null }, parent); t.textContent = s; return t; }
function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }

function render() {
  const pos = {};
  const svg = el('svg', { viewBox: '0 0 10 10', role: 'img', 'aria-label': 'CORE system map: each tool on the left, connected to the SharePoint lists and data stores on the right that it reads and writes, grouped by the SharePoint site that houses them; arcs on the left show tools that open other tools.' });
  const defs = el('defs', {}, svg);
  const mk = el('marker', { id: 'arr', viewBox: '0 0 8 8', refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L8,4 L0,8 z', fill: 'var(--link)' }, mk);

  const gBands = el('g', {}, svg), gEdges = el('g', {}, svg), gNodes = el('g', {}, svg);

  txt(svg, L.toolX, 30, 'Tools  ·  GitHub Pages', 'col-title');
  txt(svg, L.toolX, 46, 'bellweatherllc.github.io/tools/', 'grp-sub');
  txt(svg, L.storeX, 30, 'Data backbone  ·  where it lives', 'col-title');
  txt(svg, L.storeX, 46, 'SharePoint sites, drives & outside services', 'grp-sub');
  txt(svg, L.arcX - 6, 30, 'Opens', 'col-title', 'end');

  // Tools column
  let y = L.top;
  for (const g of MAP.groups) {
    const ts = MAP.tools.filter(t => t.group === g.id);
    if (!ts.length) continue;
    const h = L.grpHead + ts.length * L.rowH + 4;
    el('rect', { x: L.toolX - 8, y: y - 4, width: L.toolW + 16, height: h, rx: 8, class: 'grp-band' }, gBands);
    const gt = txt(gNodes, L.toolX, y + 14, g.label, 'grp-title');
    gt.setAttribute('data-gid', g.id);
    if (g.desc) txt(gNodes, L.toolX, y + 26, clip(g.desc, 46), 'grp-sub');
    let yy = y + L.grpHead;
    for (const t of ts) {
      pos[t.id] = { x: L.toolX, y: yy, cy: yy + L.boxH / 2 };
      drawNode(gNodes, t, 'tool', L.toolX, yy, L.toolW);
      yy += L.rowH;
    }
    y += h + L.grpGap;
  }
  const toolBottom = y;

  // Stores column
  y = L.top;
  for (const lc of MAP.locations) {
    const ss = MAP.stores.filter(s => s.loc === lc.id);
    if (!ss.length) continue;
    const h = L.grpHead + ss.length * L.rowH + 4;
    const band = el('rect', { x: L.storeX - 8, y: y - 4, width: L.storeW + 16, height: h, rx: 8, class: 'grp-band' }, gBands);
    if (lc.restricted) { band.setAttribute('stroke', 'var(--missing)'); band.setAttribute('stroke-dasharray', '4 3'); band.setAttribute('stroke-opacity', '.6'); }
    const hdr = el('g', { class: 'node', 'data-id': lc.id, 'data-tip': lc.label, 'data-tip-d': (lc.access ? lc.access + ' · ' : '') + (lc.holds || '') }, gNodes);
    txt(hdr, L.storeX, y + 14, lc.label, 'grp-title');
    txt(hdr, L.storeX + L.storeW, y + 14, lc.access || '', 'grp-sub', 'end');
    if (lc.path) txt(hdr, L.storeX, y + 26, clip(lc.path, 50), 'grp-sub');
    let yy = y + L.grpHead;
    for (const s of ss) {
      pos[s.id] = { x: L.storeX, y: yy, cy: yy + L.boxH / 2 };
      drawNode(gNodes, s, 'store', L.storeX, yy, L.storeW);
      yy += L.rowH;
    }
    y += h + L.grpGap;
  }
  const H = Math.max(toolBottom, y) + 70;

  // Edges
  const { data, links } = edges();
  for (const e of data) {
    const a = pos[e.t], b = pos[e.s]; if (!a || !b) continue;
    const x1 = L.toolX + L.toolW, x2 = L.storeX, mx = (x1 + x2) / 2;
    el('path', { d: `M${x1},${a.cy} C${mx},${a.cy} ${mx},${b.cy} ${x2},${b.cy}`, class: `edge ${e.kind}`, 'data-a': e.t, 'data-b': e.s }, gEdges);
  }
  for (const l of links) {
    const a = pos[l.from], b = pos[l.to]; if (!a || !b) continue;
    const dy = Math.abs(b.cy - a.cy), bulge = Math.min(L.arcX - 12, 18 + dy * 0.22);
    const x = L.toolX - 2;
    const p = el('path', { d: `M${x},${a.cy - 3} C${x - bulge},${a.cy - 3} ${x - bulge},${b.cy + 3} ${x},${b.cy + 3}`, class: 'edge lk', 'marker-end': 'url(#arr)', 'data-a': l.from, 'data-b': l.to }, gEdges);
    p.setAttribute('data-tip', `${tool(l.from).label} → ${tool(l.to).label}`);
    if (l.note) p.setAttribute('data-tip-d', l.note);
  }

  // Legend
  const lg = el('g', { class: 'legend', transform: `translate(${L.toolX},${H - 38})` }, svg);
  const items = [['w', 'writes'], ['r', 'reads'], ['rw', 'reads + writes'], ['lk', 'opens another tool']];
  let lx = 0;
  for (const [k, lbl] of items) {
    el('path', { d: `M${lx},0 L${lx + 26},0`, class: `edge ${k}`, style: 'opacity:.9' }, lg);
    txt(lg, lx + 32, 4, lbl); lx += 42 + lbl.length * 6.2;
  }
  lx += 10;
  for (const s of MAP.statuses) {
    el('circle', { cx: lx + 4, cy: 0, r: 4, fill: s.color }, lg);
    txt(lg, lx + 12, 4, s.label); lx += 26 + s.label.length * 6.2;
  }

  svg.setAttribute('viewBox', `0 0 ${L.W} ${H}`);
  svg.classList.toggle('hide-data', !document.getElementById('layerData').getAttribute('aria-pressed').includes('true'));
  svg.classList.toggle('hide-links', !document.getElementById('layerLinks').getAttribute('aria-pressed').includes('true'));
  const c = document.getElementById('canvas'); c.innerHTML = ''; c.appendChild(svg);
  applyFocus();
}

function drawNode(parent, obj, type, x, y, w) {
  const g = el('g', { class: 'node', 'data-id': obj.id, 'data-type': type }, parent);
  const tip = type === 'tool' ? (obj.purpose || '') : (obj.desc || '');
  g.setAttribute('data-tip', obj.label);
  if (tip) g.setAttribute('data-tip-d', tip);
  el('rect', { class: 'box', x, y, width: w, height: L.boxH, rx: 4 }, g);
  if (type === 'tool') {
    const st = statusOf(obj.status);
    g.classList.add('st-' + obj.status);
    el('circle', { class: 'dot', cx: x + 10, cy: y + L.boxH / 2, r: 4, fill: st.color }, g);
    txt(g, x + 20, y + 14, clip(obj.label, 27), 'lbl');
    const libs = (obj.libs || []).map(id => (lib(id) || {}).short || id);
    const meta = [obj.version, ...libs].filter(Boolean).join(' · ');
    if (meta) txt(g, x + w - 7, y + 13.5, clip(meta, 20), 'meta', 'end');
  } else {
    txt(g, x + 8, y + 14, clip(obj.label, 30), 'lbl');
    txt(g, x + w - 7, y + 13.5, obj.kind || '', 'meta', 'end');
  }
  return g;
}

function applyFocus() {
  const svg = document.querySelector('#canvas svg'); if (!svg) return;
  const q = state.q;
  let on = null;
  if (state.sel) on = related(state.sel);
  else if (state.loc) on = related(state.loc);
  let hits = null;
  if (q) { hits = new Set(); for (const o of [...MAP.tools, ...MAP.stores]) if (matches(o, q)) hits.add(o.id); }
  const active = on || hits;
  svg.classList.toggle('focus', !!active);
  svg.querySelectorAll('.node').forEach(n => {
    const id = n.getAttribute('data-id');
    n.classList.toggle('on', !!active && (active.has(id) || (on && hits && hits.has(id))));
    n.classList.toggle('sel', id === state.sel);
    n.classList.toggle('hit', !!hits && hits.has(id) && id !== state.sel);
  });
  svg.querySelectorAll('.edge').forEach(p => {
    const a = p.getAttribute('data-a'), b = p.getAttribute('data-b');
    let lit = false;
    if (on) { const f = state.sel || state.loc; lit = (a === f || b === f) || (loc(f) && on.has(a) && on.has(b)); }
    else if (hits) lit = hits.has(a) || hits.has(b);
    p.classList.toggle('on', !!lit);
  });
}

function wireForm() {
  const f = document.querySelector('#panel .form'); if (!f) return;
  const kind = f.dataset.kind, id = f.dataset.id;
  const val = n => { const x = f.querySelector(`[name="${n}"]`); return x ? x.value.trim() : ''; };
  f.querySelector('[data-act="save"]').onclick = () => {
    if (kind === 'tool') {
      const t = tool(id);
      Object.assign(t, { label: val('label') || t.label, file: val('file'), group: val('group'), status: val('status'), version: val('version'), purpose: val('purpose'), manual: val('manual'), notes: val('notes') });
      t.functions = val('functions').split('\n').map(x => x.trim()).filter(Boolean);
      t.reads = [...f.querySelectorAll('[data-r]:checked')].map(x => x.dataset.r);
      t.writes = [...f.querySelectorAll('[data-w]:checked')].map(x => x.dataset.w);
      t.links = val('links').split('\n').map(x => x.trim()).filter(Boolean).map(x => { const [to, ...n] = x.split('|'); return { to: to.trim(), note: n.join('|').trim() }; });
      t.libs = val('libs').split(',').map(x => x.trim()).filter(Boolean);
    } else if (kind === 'store') {
      Object.assign(store(id), { label: val('label'), loc: val('loc'), kind: val('kind'), desc: val('desc'), fields: val('fields'), notes: val('notes') });
    } else {
      Object.assign(loc(id), { label: val('label'), access: val('access'), path: val('path'), holds: val('holds') });
    }
    saveDraft(); render(); toast('Saved to draft');
  };
  f.querySelector('[data-act="cancel"]').onclick = () => { state.editing = false; setEditing(false); renderPanel(); };
  const del = f.querySelector('[data-act="del"]');
  if (del) del.onclick = () => {
    if (!confirm('Delete this from the map? (Draft only — nothing in SharePoint changes.)')) return;
    if (kind === 'tool') { MAP.tools = MAP.tools.filter(x => x.id !== id); MAP.tools.forEach(x => x.links = (x.links || []).filter(l => l.to !== id)); }
    else { MAP.stores = MAP.stores.filter(x => x.id !== id); MAP.tools.forEach(x => { x.reads = (x.reads || []).filter(r => r !== id); x.writes = (x.writes || []).filter(r => r !== id); }); }
    state.sel = null; saveDraft(); render(); renderPanel();
  };
}
function newId(base) { let id = base, n = 2; while (tool(id) || store(id) || loc(id)) id = base + '-' + n++; return id; }

function buildLocFilter() {
  const w = document.getElementById('locFilter');
  w.querySelectorAll('.chip').forEach(c => c.remove());
  for (const l of MAP.locations) {
    if (!MAP.stores.some(s => s.loc === l.id)) continue;
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = l.short || l.label; b.setAttribute('aria-pressed', 'false');
    b.setAttribute('data-tip', l.label); if (l.holds) b.setAttribute('data-tip-d', l.holds);

      state.sel = null; state.loc = on ? l.id : null;

// ── Tooltips via data-tip (shared engine pattern) ──
const TT = document.getElementById('tt');
function _tipHTML(el) {
  const n = el.getAttribute('data-tip') || '', d = el.getAttribute('data-tip-d') || '';
  return d ? `<div class="tt-n">${escHtml(n)}</div><div class="tt-d">${escHtml(d)}</div>` : escHtml(n);
}
function moveTT(e) {
  const tw = TT.offsetWidth || 140, th = TT.offsetHeight || 60, vw = innerWidth, vh = innerHeight;
  let top = e.clientY - th - 12; if (top < 4) top = Math.min(vh - th - 4, e.clientY + 18);
  let left = e.clientX + 14; if (left + tw > vw - 4) left = e.clientX - tw - 14;
  TT.style.left = Math.max(4, left) + 'px'; TT.style.top = Math.max(4, top) + 'px';
}
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) return; TT.innerHTML = _tipHTML(t); TT.classList.add('show'); moveTT(e); });
document.addEventListener('mousemove', e => { if (TT.classList.contains('show')) moveTT(e); });
document.addEventListener('mouseout', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && !(t.contains(e.relatedTarget))) TT.classList.remove('show'); });
document.querySelectorAll('button[data-tip]:not([aria-label])').forEach(b => b.setAttribute('aria-label', b.getAttribute('data-tip')));

buildLocFilter(); render(); renderPanel();
</script>
</body>
</html>
