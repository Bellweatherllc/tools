<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permit &amp; Zoning Tracker</title>
<!-- Favicon — canonical CORE head block (see project-pipeline.html for rationale). -->
<link rel="icon" type="image/png" sizes="32x32" href="https://bellweatherllc.github.io/tools/logos/favicon-32.png?v=6">
<link rel="icon" type="image/x-icon" href="https://bellweatherllc.github.io/tools/logos/favicon.ico?v=6">
<link rel="icon" type="image/svg+xml" sizes="any" href="https://bellweatherllc.github.io/tools/logos/favicon.svg?v=6">
<link rel="apple-touch-icon" href="https://bellweatherllc.github.io/tools/logos/apple-touch-icon.png?v=6">
<style>
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_DemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}

/* ── Tokens: carried from project-pipeline.html v878 (the primary design reference) ── */
:root{
  --app-h:44px;
  --navy:#282828;--gold:#d8b64f;--gl:#E5E1D8;
  --bg:#FAF9F7;--sfc:#ffffff;
  --ts:#9091A0;--tm:#B7A9A3;--bdr:#E5E1D8;
  --sep:#D4D1CC;--proj-row:#f0f0f0;
  /* Clock-state colors — functional indicators, aligned to pipeline tally semantics */
  --st-ok:#3b7fa8;--st-warn:#d07820;--st-over:#ac2828;--st-hold:#8a8a8a;--st-done:#019425;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'TT Norms Pro',sans-serif;background:var(--bg);-webkit-font-smoothing:antialiased;color:var(--navy);}
@keyframes bw-spin{to{transform:rotate(360deg);}}

/* ── APP HEADER ── */
.app-header{background:var(--navy);padding:7px 18px;display:flex;align-items:center;gap:11px;position:fixed;top:0;left:0;right:0;z-index:400;height:var(--app-h);}
.bw-logo{height:22px;width:auto;display:block;}
.hd{width:1px;height:16px;background:rgba(255,255,255,.15);}
.hdr-title{font-family:'Swear Text',serif;color:rgba(255,255,255,.55);font-size:13px;}
.hsp{flex:1;}
.proto-badge{font-size:10px;font-weight:600;letter-spacing:.08em;color:#ef4444;}
.save-indicator{display:flex;align-items:center;gap:5px;font-size:11px;min-width:64px;justify-content:flex-end;margin-right:8px;}
.save-indicator .si-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.save-indicator .si-spinner{width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.75);animation:bw-spin .8s linear infinite;flex-shrink:0;}
.save-indicator .si-txt{color:rgba(255,255,255,.4);}
.sync-stamp{font-size:10px;color:rgba(255,255,255,.35);white-space:nowrap;}
.view-nav{display:flex;gap:16px;margin-right:4px;flex-shrink:0;}
.view-btn{font-family:'TT Norms Pro',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.50);background:transparent;border:none;border-bottom:2px solid transparent;padding:4px 2px 5px;cursor:pointer;transition:color .15s,border-color .2s;}
.view-btn:hover{color:rgba(255,255,255,.80);}
.view-btn.active{color:#fff;border-bottom-color:var(--gold);}
.admin-btn{font-size:13px;background:none;border:none;color:rgba(255,255,255,.40);cursor:pointer;padding:2px 4px;}
.admin-btn:hover{color:rgba(255,255,255,.85);}

/* ── AUTH OVERLAY ── */
#authOverlay{position:fixed;inset:0;background:var(--navy);z-index:1000;display:flex;align-items:center;justify-content:center;}
#authOverlay.hidden{display:none;}
.auth-card{display:flex;flex-direction:column;align-items:center;gap:18px;padding:40px 44px 36px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.40);min-width:320px;text-align:center;}
.auth-logo{height:44px;width:auto;opacity:.90;}
.auth-title{font-family:'Swear Text',serif;font-size:18px;font-weight:700;color:var(--gl);letter-spacing:.02em;}
.auth-subtitle{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.35);}
.auth-version{font-size:9px;font-weight:700;letter-spacing:.10em;color:rgba(255,255,255,.20);margin-top:-8px;}
.auth-sign-in{font-family:'TT Norms Pro',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(216,182,79,.18);color:var(--gold);border:1px solid rgba(216,182,79,.40);border-radius:6px;padding:10px 28px;cursor:pointer;transition:background .14s,border-color .14s,box-shadow .14s;margin-top:4px;}
.auth-sign-in:hover{background:rgba(216,182,79,.28);border-color:rgba(216,182,79,.65);box-shadow:0 2px 12px rgba(216,182,79,.15);}
.auth-sign-in:disabled{opacity:.4;cursor:default;pointer-events:none;}
.auth-status{font-size:11px;color:rgba(255,255,255,.45);min-height:18px;transition:color .2s;}
.auth-spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--gold);border-radius:50%;animation:bw-spin .7s linear infinite;display:none;}

/* ── MAIN LAYOUT ── */
.main{padding:calc(var(--app-h) + 22px) 26px 60px;max-width:1180px;margin:0 auto;}
.view{display:none;}
.view.active{display:block;}
.banner{background:rgba(172,40,40,.08);border:1px solid rgba(172,40,40,.30);color:var(--st-over);border-radius:7px;padding:10px 14px;font-size:12px;margin-bottom:18px;display:none;}
.banner.info{background:rgba(216,182,79,.10);border-color:rgba(216,182,79,.45);color:#8a6c14;}
.banner.show{display:block;}

/* ── PROJECT GROUPS (Board view) ── */
.proj-group{background:var(--sfc);border:1px solid var(--bdr);border-radius:9px;margin-bottom:14px;overflow:hidden;}
.proj-hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--proj-row);cursor:pointer;border-bottom:1px solid var(--bdr);}
.proj-name{font-family:'Swear Text',serif;font-size:16px;font-weight:600;color:var(--navy);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.roll-chip{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:4px;padding:3px 9px;color:#fff;flex-shrink:0;}
.roll-ok{background:var(--st-ok);}
.roll-warn{background:var(--st-warn);}
.roll-over{background:var(--st-over);}
.roll-hold{background:var(--st-hold);}
.roll-done{background:var(--st-done);}
.proj-meta{font-size:12px;color:var(--ts);flex-shrink:0;}
.app-row{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .12s;}
.app-row:last-child{border-bottom:none;}
.app-row:hover{background:rgba(216,182,79,.05);}
.track-chip{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:4px;padding:3px 8px;flex-shrink:0;min-width:64px;text-align:center;}
.track-zoning{background:rgba(0,57,128,.10);color:#003980;border:1px solid rgba(0,57,128,.25);}
.track-permit{background:rgba(0,82,27,.08);color:#00521b;border:1px solid rgba(0,82,27,.25);}
.track-other{background:rgba(40,40,40,.06);color:var(--navy);border:1px solid var(--sep);}
.badge{font-size:8.5px;font-weight:800;letter-spacing:.05em;border-radius:3px;padding:2px 5px;flex-shrink:0;}
.badge.ez{background:rgba(216,182,79,.20);color:#8a6c14;border:1px solid rgba(216,182,79,.5);}
.badge.hist{background:rgba(155,97,39,.12);color:#9b6127;border:1px solid rgba(155,97,39,.4);}
.cmt-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--ts);border:1px solid var(--bdr);border-radius:10px;padding:1px 7px;flex-shrink:0;} /* v35 */
.app-jur{font-size:12px;color:var(--ts);flex-shrink:0;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Phase track */
.ph-track{display:flex;align-items:flex-start;gap:0;flex:1;min-width:0;justify-content:flex-start;} /* v32: steps pack left at fixed width */
.ph-step{display:flex;flex-direction:column;align-items:center;flex:0 0 68px;position:relative;} /* v32: compressed — was stretch-to-fill */
.ph-step::before{content:'';position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--bdr);}
.ph-step:first-child::before{display:none;}
.ph-step.done::before,.ph-step.active::before{background:var(--gold);}
.ph-dot{width:11px;height:11px;border-radius:50%;background:var(--sfc);border:2px solid var(--bdr);z-index:1;}
.ph-step.done .ph-dot{background:var(--gold);border-color:var(--gold);}
.ph-step.active .ph-dot{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(216,182,79,.25);}
.ph-step.active.st-over .ph-dot{border-color:var(--st-over);box-shadow:0 0 0 3px rgba(172,40,40,.22);}
.ph-step.active.st-warn .ph-dot{border-color:var(--st-warn);box-shadow:0 0 0 3px rgba(208,120,32,.22);}
.ph-step.done.st-done .ph-dot{background:var(--st-done);border-color:var(--st-done);}
.ph-step.active.st-done .ph-dot{border-color:var(--st-done);box-shadow:0 0 0 3px rgba(1,148,37,.22);} /* v33 */
.ph-lbl{font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tm);margin-top:4px;white-space:nowrap;}
.ph-step.done .ph-lbl,.ph-step.active .ph-lbl{color:var(--navy);}
.ph-timer{font-size:9.5px;font-weight:700;margin-top:1px;white-space:nowrap;}
.ph-timer.t-ok{color:var(--st-ok);}
.ph-timer.t-warn{color:var(--st-warn);}
.ph-timer.t-over{color:var(--st-over);font-weight:800;} /* v35 */
.ph-timer.t-age{color:var(--ts);}
.state-chip{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:3px 8px;flex-shrink:0;}
.state-hold{background:rgba(138,138,138,.14);color:var(--st-hold);border:1px solid rgba(138,138,138,.4);}
.state-closed{background:rgba(40,40,40,.85);color:#fff;}
.state-unknown{background:rgba(208,120,32,.10);color:var(--st-warn);border:1px solid rgba(208,120,32,.35);}

/* Intake */
.intake-wrap{margin-top:26px;}
.sec-title{font-family:'Swear Text',serif;font-size:13px;font-weight:600;color:var(--navy);letter-spacing:.02em;margin-bottom:10px;}
.intake-row{display:flex;align-items:center;gap:12px;background:var(--sfc);border:1px solid var(--bdr);border-radius:7px;padding:9px 14px;margin-bottom:7px;font-size:12px;}
.intake-name{font-weight:600;flex:1;}
.intake-note{font-size:10.5px;color:var(--ts);}

/* ── DETAIL DRAWER ── */
#detailOverlay{position:fixed;inset:0;background:rgba(40,40,40,.45);z-index:500;display:none;}
#detailOverlay.open{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--sfc);z-index:501;box-shadow:-8px 0 32px rgba(0,0,0,.25);transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;}
.drawer.open{transform:translateX(0);}
.drawer-hdr{background:var(--navy);padding:16px 20px;position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;}
.drawer-title{font-family:'Swear Text',serif;font-size:16px;font-weight:700;color:var(--gl);flex:1;min-width:0;}
.drawer-close{background:none;border:none;color:rgba(255,255,255,.55);font-size:18px;cursor:pointer;padding:2px 6px;}
.drawer-close:hover{color:#fff;}
.drawer-body{padding:18px 20px 40px;}
.d-app{border:1px solid var(--bdr);border-radius:8px;margin-bottom:16px;overflow:hidden;}
.d-app-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--proj-row);border-bottom:1px solid var(--bdr);}
.d-app-name{font-weight:600;font-size:12.5px;flex:1;}
.d-sec{padding:11px 14px;border-bottom:1px solid var(--bdr);}
.d-sec:last-child{border-bottom:none;}
.d-sec-title{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ts);margin-bottom:7px;}
.d-facts{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:11.5px;}
.d-fact b.over{color:var(--st-over);font-weight:800;} /* v35: overdue clock and target */
.d-fact b{font-weight:600;}
.d-fact span{color:var(--ts);font-size:10px;display:block;text-transform:uppercase;letter-spacing:.05em;}
.hist-row{display:flex;gap:9px;font-size:11px;padding:3px 0;align-items:baseline;}
.hist-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;position:relative;top:1px;}
.hist-stage{font-weight:600;min-width:110px;}
.hist-at{color:var(--ts);font-size:10.5px;}
.chk-row{display:flex;gap:8px;font-size:11.5px;padding:2.5px 0;align-items:baseline;}
.chk-box{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--sep);flex-shrink:0;position:relative;top:2px;font-size:9px;line-height:10px;text-align:center;color:#fff;}
.chk-box.on{background:var(--st-done);border-color:var(--st-done);}
.chk-txt.on{color:var(--ts);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25);}
.chk-grp{font-size:10px;font-weight:700;color:var(--navy);margin:7px 0 3px;letter-spacing:.03em;}
.d-owners{font-size:11.5px;}
.desc-txt{font-size:11.5px;line-height:1.55;white-space:pre-wrap;} /* v31 */
.cmt-txt{font-size:11.5px;line-height:1.5;white-space:pre-wrap;}
.cmt-meta{font-size:9.5px;color:var(--ts);margin:2px 0 8px;}

/* ── ABSOLUTES VIEW ── */
.abs-table{width:100%;border-collapse:collapse;background:var(--sfc);border:1px solid var(--bdr);border-radius:9px;overflow:hidden;font-size:13.5px;}
.abs-table th{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ts);text-align:left;padding:10px 14px;background:var(--proj-row);border-bottom:1px solid var(--bdr);}
.abs-table td{padding:9px 14px;border-bottom:1px solid var(--bdr);}
.abs-table tr:last-child td{border-bottom:none;}
.abs-proj{font-family:'Swear Text',serif;font-weight:600;font-size:15px;}
.bin{font-size:9px;font-weight:800;letter-spacing:.07em;border-radius:4px;padding:3px 9px;color:#fff;display:inline-block;}
.bin-on{background:var(--st-done);}
.bin-off{background:var(--st-over);}
.bin-na{background:none;color:var(--tm);border:1px solid var(--bdr);}
.abs-note-pending{font-size:10.5px;color:var(--tm);font-style:italic;}

/* ── ADMIN PANEL ── */
#adminPanel{position:fixed;top:calc(var(--app-h) + 8px);right:14px;z-index:450;background:var(--navy);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:16px 18px;width:320px;box-shadow:0 10px 32px rgba(0,0,0,.4);display:none;}
#adminPanel.open{display:block;}
.ap-title{font-family:'Swear Text',serif;font-size:13px;font-weight:700;color:var(--gl);margin-bottom:12px;}
.ap-field{margin-bottom:10px;}
.ap-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.40);display:block;margin-bottom:4px;}
.ap-inp{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:5px;color:#fff;font-family:inherit;font-size:11.5px;padding:7px 9px;outline:none;}
.ap-inp:focus{border-color:rgba(216,182,79,.6);}
.ap-actions{display:flex;gap:8px;margin-top:12px;}
.ap-btn{flex:1;font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:8px 0;cursor:pointer;border:1px solid rgba(216,182,79,.40);background:rgba(216,182,79,.16);color:var(--gold);}
.ap-btn:hover{background:rgba(216,182,79,.28);}
.ap-btn.secondary{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:rgba(255,255,255,.65);}
.ap-status{font-size:10.5px;color:rgba(255,255,255,.5);min-height:16px;margin-top:8px;}
.empty-note{color:var(--ts);font-size:12px;padding:26px 0;text-align:center;}
.board-readout{font-size:10.5px;color:var(--ts);margin:-6px 0 14px;line-height:1.5;}
.board-readout a{color:#8a6c14;text-decoration:none;font-weight:600;}
</style>
</head>
<body>

<div id="authOverlay">
  <div class="auth-card">
    <img class="auth-logo" src="https://bellweatherllc.github.io/tools/logos/Monogram-Linen.svg" alt="Bellweather">
    <div>
      <div class="auth-title">Permit &amp; Zoning Tracker</div>
      <div class="auth-subtitle">Bellweather Design Build</div>
    </div>
    <div class="auth-version" id="authVersionBadge">v35</div>
    <div class="auth-spinner" id="authSpinner"></div>
    <button class="auth-sign-in" id="authSignInBtn" onclick="doSignIn()">Sign in with Microsoft</button>
    <div class="auth-status" id="authStatus"></div>
  </div>
</div>

<div class="app-header">
  <img class="bw-logo" src="https://bellweatherllc.github.io/tools/logos/Monogram-Linen.svg" alt="Bellweather">
  <div class="hd"></div>
  <div class="hdr-title">Permit &amp; Zoning Tracker</div>
  <div class="proto-badge" id="versionBadge">v35</div>
  <div id="saveStatus" class="save-indicator"></div>
  <div class="sync-stamp" id="syncStamp"></div>
  <div class="hsp"></div>
  <nav class="view-nav">
    <button type="button" class="view-btn active" data-view="board" onclick="setView('board')">Board</button>
    <button type="button" class="view-btn" data-view="absolutes" onclick="setView('absolutes')">Absolutes</button>
  </nav>
  <button class="admin-btn" onclick="toggleAdmin()" title="Setup">&#9881;</button>
</div>

<div id="adminPanel">
  <div class="ap-title">Setup</div>
  <div class="ap-field"><label class="ap-lbl">Trello API Key</label><input class="ap-inp" id="apKey" autocomplete="off"></div>
  <div class="ap-field"><label class="ap-lbl">Trello Token</label><input class="ap-inp" id="apToken" type="password" autocomplete="off"></div>
  <div class="ap-field"><label class="ap-lbl">Permit Tracking Board ID</label><input class="ap-inp" id="apBoard" autocomplete="off" placeholder="board id or short link id"></div>
  <div class="ap-actions">
    <button class="ap-btn secondary" onclick="testTrello()">Test</button>
    <button class="ap-btn" onclick="saveAdmin()">Save to Config</button>
  </div>
  <div class="ap-status" id="apStatus"></div>
</div>

<div class="main">
  <div class="banner" id="bannerErr"></div>
  <div class="banner info" id="bannerInfo"></div>
  <div class="board-readout" id="boardReadout"></div>

  <div class="view active" id="view-board">
    <div id="boardContent"><div class="empty-note">Loading&hellip;</div></div>
    <div class="intake-wrap" id="intakeWrap" style="display:none;">
      <div class="sec-title">Incoming &mdash; awaiting permitting determination</div>
      <div id="intakeContent"></div>
    </div>
  </div>

  <div class="view" id="view-absolutes">
    <div id="absContent"><div class="empty-note">Loading&hellip;</div></div>
  </div>
</div>

<div id="detailOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-hdr">
    <div class="drawer-title" id="drawerTitle"></div>
    <button class="drawer-close" onclick="closeDrawer()">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   PERMIT & ZONING TRACKER — CORE tool
   Spec: Permit_Zoning_Tracker_Spec.md. Versioning continues the permit
   tracker prototype line (v23 → v24). Architecture: Trello is the working
   surface, CORE_Permits on BWCore is the system of record, this page is
   the sync agent (sync-on-view). Nobody edits permit status here; the fix

/* Stage vocabulary — mirrors the Trello tracking board lists (spec §2.1).
   clock: 'age' = days-in-stage timer; 'review' = SubmittedDate + ReviewDays
   business-day clock; 'none' = no clock. Unknown list names pass through
   unchanged and render neutrally (pass-unknown-through). */
const STAGES = [
  {name:'Incoming',                 clock:'none', intake:true},
  {name:'Prep',                     clock:'age'},
  {name:'With Arch/Eng',            clock:'age'},
  {name:'Ready to Submit',          clock:'age'},
  {name:'Submitted',                clock:'review'},
  {name:'In Review',                clock:'review'},
  {name:'Revisions Needed',         clock:'age'},
  {name:'Approved',                 clock:'none', terminal:'done'},
  {name:'Amendment',                clock:'age',  conditional:true}, // v33: appears on a card's track only while the card sits in it
  {name:'Completed',                clock:'none', terminal:'done'},  // v33: final terminal after Approved
  {name:'On Hold',                  clock:'none', hold:true},
  {name:'Closed — Denied/Withdrawn',clock:'none', terminal:'dead'}
];
const TRACK_STAGES = STAGES.filter(s=>!s.intake && !s.hold && s.terminal!=='dead'); // rendered phase track
const WARN_DAYS = 3; // business days remaining → "due soon"

async function getToken(){
  const acct=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0];
  if(!acct) throw new Error('no account');
  try{
    const r=await msalApp.acquireTokenSilent({scopes:SP_SCOPES,account:acct});

    await msalApp.acquireTokenRedirect({scopes:SP_SCOPES,account:acct});
  }
}

/* ═══ Graph helpers ═══ */
async function graphGet(url){
  const r=await fetch(url,{headers:{Authorization:'Bearer '+_token}});
  if(!r.ok) throw new Error('Graph GET '+r.status+' '+url);
  return r.json();
}
async function graphGetAll(url){
  let out=[],next=url;
  while(next){
    const d=await graphGet(next);
    out=out.concat(d.value||[]);
    next=d['@odata.nextLink']||null;
  }
  return out;
}
async function _graphWrite(method,url,body){
  const r=await fetch(url,{method,headers:{Authorization:'Bearer '+_token,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){
    let detail=''; try{ detail=(await r.text()).slice(0,300); }catch(e2){}
    throw new Error('Graph '+method+' '+r.status+(detail?' — '+detail:''));
  }
  return r.json();
}
async function graphPost(url,body){ return _graphWrite('POST',url,body); }
async function graphPatch(url,body){ return _graphWrite('PATCH',url,body); }

/* ═══ Trello helpers ═══ */
function tURL(path,params){
  const p=new URLSearchParams(params||{});
  p.set('key',_trelloCfg.apiKey); p.set('token',_trelloCfg.token);
  return 'https://api.trello.com/1/'+path+'?'+p.toString();
}
async function tGet(path,params){
  const r=await fetch(tURL(path,params));
  if(!r.ok) throw new Error('Trello '+r.status+' /'+path);
  return r.json();
}

/* ═══ Business-day math (weekends skipped; holidays not modeled in v1) ═══ */
function addBusinessDays(date,n){
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  let left=Math.round(n);
  while(left>0){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) left--; }
  return d;
}
function businessDaysBetween(a,b){ // signed: positive when b is after a
  const s=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const e=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  const sign=e>=s?1:-1;
  let lo=sign===1?s:e, hi=sign===1?e:s, n=0;
  const c=new Date(lo);
  while(c<hi){ c.setDate(c.getDate()+1); const w=c.getDay(); if(w!==0&&w!==6) n++; }
  return n*sign;
}
function calDays(a,b){ return Math.floor((b-a)/86400000); }
function fmtDate(d){ return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

}

/* v29: designer of record per project — read-only borrow from the Pipeline's domain.
   CORE_Projects.GanttData carries a designer person id ('sp-person-{itemId}') that
   resolves through CORE_TeamMembers.EmployeeName. Defensive throughout: any parse
   failure yields no owner, never an error. One-way read; the tracker never writes
   project or team data. */
async function loadProjectDesigners(){
  try{
    const [team,projs]=await Promise.all([
      graphGetAll(BWC_SITE+'/CORE_TeamMembers/items?$expand=fields&$select=id,fields'),
      graphGetAll(BWC_SITE+'/CORE_Projects/items?$expand=fields&$select=id,fields')
    ]);
    const personName={};
    team.forEach(it=>{ personName['sp-person-'+it.id]=(it.fields&&(it.fields.EmployeeName||it.fields.Title))||''; });
    DESIGNER_BY_PROJECT={};
    projs.forEach(it=>{
      const f=it.fields||{};
      const name=f.ProjectName||f.ClientName||f.Title||'';
      if(!name) return;
      let dId=null;
      if(f.GanttData){ try{ const gd=JSON.parse(f.GanttData); dId=(gd&&gd.designer)||null; }catch(e2){} }
      const dn=(dId&&personName[dId])||'';
      if(dn) DESIGNER_BY_PROJECT[normName(name)]=dn;
    });
  }catch(e){ console.warn('[designers]',e); }
}
async function setConfigRow(key,val){
  if(_cfgRows[key]){
    await graphPatch(BWC_SITE+'/CORE_Config/items/'+_cfgRows[key].id+'/fields',{Value:val});
    _cfgRows[key].value=val;
  }else{
    const d=await graphPost(BWC_SITE+'/CORE_Config/items',{fields:{Title:key,Key:key,Value:val}});
    _cfgRows[key]={id:d.id,value:val};
  }
}

/* ═══ Trello load & model build ═══ */
function normName(x){ return String(x==null?'':x).toLowerCase().replace(/[^a-z0-9]/g,''); }
function cfValue(card,defs,label){
  const def=defs.find(d=>normName(d.name)===normName(label));
  if(!def) return '';
  const item=(card.customFieldItems||[]).find(i=>i.idCustomField===def.id);
  if(!item) return '';
  if(item.idValue&&def.options){
    const opt=def.options.find(o=>o.id===item.idValue);
    return opt&&opt.value&&opt.value.text?opt.value.text:'';
  }
  if(item.value){
    if(item.value.text!=null) return item.value.text;
    if(item.value.number!=null) return item.value.number;
    if(item.value.date!=null) return item.value.date;
    if(item.value.checked!=null) return item.value.checked;
  }
  return '';
}

async function loadTrello(){
  const b=_trelloCfg.boardId;
  const [boardInfo,lists,cards,defs,actions]=await Promise.all([
    tGet('boards/'+b,{fields:'name,url'}),
    tGet('boards/'+b+'/lists',{fields:'name,pos'}),
    tGet('boards/'+b+'/cards',{fields:'name,idList,labels,dateLastActivity,cardRole,shortUrl,isTemplate,desc',
        customFieldItems:'true', checklists:'all', members:'true', member_fields:'fullName'}),
    tGet('boards/'+b+'/customFields',{}),
    tGet('boards/'+b+'/actions',{filter:'updateCard:idList,commentCard', limit:'1000',
        fields:'data,date', memberCreator:'true', memberCreator_fields:'fullName'})
  ]);
  const listName={}; lists.forEach(l=>listName[l.id]=l.name);

  // v31: comments per card — newest first, latest five
  const commentsByCard={};
  actions.forEach(a=>{
    if(a.type!=='commentCard') return;
    const cid=a.data&&a.data.card&&a.data.card.id;
    const txt=a.data&&a.data.text;
    if(!cid||!txt) return;
    const arr=(commentsByCard[cid]=commentsByCard[cid]||[]);
    if(arr.length<5) arr.push({text:txt, at:a.date, by:(a.memberCreator&&a.memberCreator.fullName)||''});
  });
  // Per-card stage history from board actions (ascending)
  const histByCard={};
  actions.slice().reverse().forEach(a=>{
    if(a.type==='commentCard') return; // v31: comments live in commentsByCard
    const cid=a.data&&a.data.card&&a.data.card.id;
    const after=a.data&&a.data.listAfter&&a.data.listAfter.name;
    if(!cid||!after) return;
    (histByCard[cid]=histByCard[cid]||[]).push({stage:after, at:a.date,
      by:(a.memberCreator&&a.memberCreator.fullName)||''});
  });

  APPS=[]; INTAKE=[];
  cards.forEach(c=>{
    // v30: utility cards stay out of the tracker — Trello-native templates are skipped
    // automatically, and any card wearing an "Ignore" label is skipped by convention
    if(c.isTemplate) return;
    if((c.labels||[]).some(l=>normName(l.name)==='ignore')) return;
    const stage=listName[c.idList]||'';
    const track=String(cfValue(c,defs,CF.track)||'');
    const model={
      cardId:c.id, sourceCardId:c.mirrorSourceId||'',
      name:c.name, url:c.shortUrl||'', cardRole:c.cardRole||'',
      stage, track,
      project:String(cfValue(c,defs,CF.project)||'').trim(),
      ptype:String(cfValue(c,defs,CF.ptype)||''),
      jur:String(cfValue(c,defs,CF.jur)||''),
      submitted:(function(){ const v=cfValue(c,defs,CF.submitted); return v?new Date(v):null; })(),
      reviewDays:(function(){ const v=cfValue(c,defs,CF.reviewdays); return v!==''?Number(v):null; })(),
      permitNum:String(cfValue(c,defs,CF.permitnum)||''),
      cardOwner:String(cfValue(c,defs,CF.owner)||'').trim(), // v32: the managing owner
      engOwner:(String(cfValue(c,defs,'arch eng owner')||'')||String(cfValue(c,defs,'eng owner')||'')).trim(), // v34: who owns the engineering dependency (blank = CardOwner)
      labels:(c.labels||[]).map(l=>l.name).filter(Boolean),
      owners:(c.members||[]).map(m=>m.fullName).filter(Boolean),
      desc:c.desc||'',
      comments:commentsByCard[c.id]||[],
      checklists:(c.checklists||[]).map(cl=>({name:cl.name,
        items:(cl.checkItems||[]).sort((a2,b2)=>a2.pos-b2.pos).map(i=>({text:i.name,done:i.state==='complete'}))})),
      history:histByCard[c.id]||[],
      lastActivity:c.dateLastActivity?new Date(c.dateLastActivity):null
    };
    model.stageEntered=model.history.length
      ? new Date(model.history[model.history.length-1].at)
      : (model.lastActivity||new Date());
    if(model.project&&!model.name.trim()) model.name=model.project;
    if(!model.project){ // fall back to name up to the em/en dash convention "{Project} — Permit"
      const m=model.name.split(/\s+[—–-]\s+/); if(m.length>1) model.project=m[0].trim(); else model.project=model.name.trim();
    }
    if(track) APPS.push(model); else INTAKE.push(model);
  });
  window._pzDebug={boardInfo,lists,cards,defs,actions}; // raw API data for troubleshooting
  hideBanner('bannerInfo');
  const ro=document.getElementById('boardReadout');
  if(ro) ro.innerHTML='Reading board <a href="'+esc(boardInfo.url||'#')+'" target="_blank" rel="noopener">'+esc(boardInfo.name||'?')+'</a> · '+cards.length+' card'+(cards.length===1?'':'s')+' · custom fields: '+(defs.length?defs.map(d=>esc(d.name)).join(' | '):'<b>none defined</b>');
  const defNames=new Set(defs.map(d=>normName(d.name)));
  const mirrors=cards.filter(c=>c.cardRole==='mirror');
  if(!defNames.has(normName(CF.track))){
    showBanner('bannerInfo','The tracking board has no “Track Type” custom field defined. Custom field definitions are per-board and do not travel with mirrored cards — define the spec §2.2 fields on the tracking board itself, then set values on each card from this board’s side.');
  }else if(APPS.length===0&&mirrors.length>0){
    showBanner('bannerInfo','Track Type is defined on this board, but no mirrored card carries a value for it. Open a mirror from the tracking board and set its Track Type. If Trello won’t accept custom field values on a mirror, that’s the §2.2 contingency — report back and we’ll switch to reading fields from the source cards.');
  }
  computeClocks();
}

/* ═══ Clocks ═══ */
function stageMeta(name){ return STAGES.find(s=>s.name.toLowerCase()===String(name).toLowerCase())||null; }
function stageRank(name){ return STAGES.findIndex(s=>s.name.toLowerCase()===String(name).toLowerCase()); } // v34

function computeClocks(){
  const now=new Date();
  APPS.forEach(a=>{
    const meta=stageMeta(a.stage);
    a.known=!!meta;
    a.terminal=meta?meta.terminal||null:null;
    a.hold=!!(meta&&meta.hold);
    a.target=null; a.daysLeft=null; a.ageDays=calDays(a.stageEntered,now);
    a.state='ok'; a.clockText='';
    if(a.hold){ a.state='hold'; a.clockText='on hold'; return; }
    if(a.terminal==='done'){ a.state='done'; a.clockText=''; return; }
    if(a.terminal==='dead'){ a.state='closed'; return; }
    if(!meta){ a.state='unknown'; a.clockText=a.stage||'no stage'; return; }
    if(meta.clock==='review'){
      if(a.submitted&&a.reviewDays!=null){
        a.target=addBusinessDays(a.submitted,a.reviewDays);
        a.daysLeft=businessDaysBetween(now,a.target);
        if(a.daysLeft<0){ a.state='over'; a.clockText='+'+Math.abs(a.daysLeft)+'d overdue'; }
        else if(a.daysLeft<=WARN_DAYS){ a.state='warn'; a.clockText=a.daysLeft+'d left'; }
        else { a.state='ok'; a.clockText=a.daysLeft+'d left'; }
      }else{
        a.state='warn'; a.clockText=a.submitted?'no review days':'no submitted date';
      }
    }else if(meta.clock==='age'){
      a.state='ok'; a.clockText=a.ageDays+'d in stage';
    }
  });
}

/* ═══ SharePoint mirror (CORE_Permits) ═══ */
function appToFields(a){
  return {
    Title:a.name,
    TrelloCardId:a.cardId,
    SourceCardId:a.sourceCardId||'',
    ProjectName:a.project,
    TrackType:a.track,
    PermitType:a.ptype,
    Jurisdiction:a.jur,
    Stage:a.stage,
    StageEnteredDate:a.stageEntered?a.stageEntered.toISOString():null,
    SubmittedDate:a.submitted?a.submitted.toISOString():null,
    ReviewDays:a.reviewDays,
    TargetDate:a.target?a.target.toISOString():null,
    PermitNumber:a.permitNum,
    Owners:a.cardOwner||a.owners.join(', '), // v32: CardOwner replaces members when present
    Labels:a.labels.join(', '),
    StageHistory:JSON.stringify(a.history),
    IsClosed:(a.terminal==='done'||a.terminal==='dead')
  };
}
function fieldsDiffer(f,row){
  const keys=Object.keys(f);
  for(const k of keys){
    let cur=row[k]; let neu=f[k];
    if(neu==null&&(cur==null||cur==='')) continue;
    if(k==='IsClosed'){ if(Boolean(cur)!==Boolean(neu)) return true; continue; }
    if(k==='ReviewDays'){ if(Number(cur||0)!==Number(neu||0)) return true; continue; }
    if(/Date$/.test(k)){
      const a2=cur?new Date(cur).getTime():0, b2=neu?new Date(neu).getTime():0;
      if(Math.abs(a2-b2)>60000) return true; continue;
    }
    if(String(cur==null?'':cur)!==String(neu==null?'':neu)) return true;
  }
  return false;
}
const REQUIRED_COLS=['TrelloCardId','SourceCardId','ProjectName','TrackType','PermitType','Jurisdiction','Stage','StageEnteredDate','SubmittedDate','ReviewDays','TargetDate','PermitNumber','Owners','Labels','StageHistory','IsClosed'];
let _presentCols=null; // internal names verified against the live list (v25)
async function verifyColumns(){
  const cols=await graphGetAll(BWC_SITE+'/CORE_Permits/columns?$select=name,displayName');
  const names=new Set(cols.map(c=>c.name));
  _presentCols=REQUIRED_COLS.filter(c=>names.has(c));
  const missing=REQUIRED_COLS.filter(c=>!names.has(c));
  if(missing.length){
    showBanner('bannerErr','CORE_Permits is missing these column internal names: '+missing.join(', ')+'. Columns renamed after creation keep their original internal name (spaces become _x0020_) — recreate them typing the exact spec name first. Syncing the '+_presentCols.length+' columns that do match.');
  }
}
function pruneFields(f){
  if(!_presentCols) return f;
  const out={Title:f.Title};
  _presentCols.forEach(k=>{ if(k in f) out[k]=f[k]; });
  return out;
}
async function syncToSharePoint(){
  if(!_spListOk) return;
  setSave('syncing');
  try{
    if(_presentCols===null) await verifyColumns();
    const items=await graphGetAll(BWC_SITE+'/CORE_Permits/items?$expand=fields&$select=id,fields&$top=200');
    SP_ROWS=items;
    const byCard={};
    items.forEach(it=>{ const cid=it.fields&&it.fields.TrelloCardId; if(cid) byCard[cid]=it; });
    if(_presentCols&&_presentCols.indexOf('TrelloCardId')===-1){
      setSave('err','No key column');
      showBanner('bannerErr','CORE_Permits has no TrelloCardId column (the stable key) — sync is paused to avoid creating duplicate rows. Recreate that column with the exact internal name TrelloCardId, then reload.');
      return;
    }
    let writes=0;
    for(const a of APPS){
      const f=pruneFields(appToFields(a));
      const row=byCard[a.cardId];
      if(!row){
        await graphPost(BWC_SITE+'/CORE_Permits/items',{fields:f}); writes++;
      }else if(fieldsDiffer(f,row.fields||{})){
        await graphPatch(BWC_SITE+'/CORE_Permits/items/'+row.id+'/fields',f); writes++;
      }
    }
    setSave('ok', writes?('Synced ('+writes+')'):'Synced');
    const st=document.getElementById('syncStamp');
    if(st) st.textContent='last sync '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  }catch(e){
    console.error('[sync]',e);
    if(String(e).indexOf('404')>-1){
      _spListOk=false;
      showBanner('bannerErr','CORE_Permits list not found on BWCore — create it per the spec (§3). Displaying live Trello data without a SharePoint mirror.');
      setSave('err','No mirror');
    }else{
      setSave('err');
      showBanner('bannerErr','SharePoint sync failed: '+String(e.message||e).slice(0,300));
    }
  }
}

/* ═══ Rendering ═══ */
const STATE_RANK={over:0,warn:1,unknown:2,hold:3,ok:4,done:5,closed:6};
function projectRollup(apps){
  const active=apps.filter(a=>a.state!=='done'&&a.state!=='closed');
  if(!active.length) return apps.length?'done':'ok';
  return active.slice().sort((a,b)=>STATE_RANK[a.state]-STATE_RANK[b.state])[0].state;
}
const ROLL_LBL={ok:'On Track',warn:'Due Soon',over:'Overdue',hold:'On Hold',done:'Complete',unknown:'Check'};
const ROLL_CLS={ok:'roll-ok',warn:'roll-warn',over:'roll-over',hold:'roll-hold',done:'roll-done',unknown:'roll-warn'};

function trackChipCls(t){
  const s=String(t).toLowerCase();
  if(s.indexOf('zon')>-1) return 'track-zoning';
  if(s.indexOf('permit')>-1) return 'track-permit';
  return 'track-other';
}
function phaseTrackHtml(a){
  const stages=TRACK_STAGES.filter(s=>!s.conditional||s.name.toLowerCase()===String(a.stage).toLowerCase()); // v33
  const idx=stages.findIndex(s=>s.name.toLowerCase()===String(a.stage).toLowerCase());
  return '<div class="ph-track">'+stages.map((s,i)=>{
    const done=idx>-1&&i<idx, active=i===idx;
    const stCls=active?(a.state==='over'?'st-over':a.state==='warn'?'st-warn':a.state==='done'?'st-done':''):(done&&a.state==='done'?'st-done':''); // v33: terminal dot goes green
    const timer=active&&a.clockText?('<div class="ph-timer '+(a.state==='over'?'t-over':a.state==='warn'?'t-warn':stageMeta(a.stage)&&stageMeta(a.stage).clock==='review'?'t-ok':'t-age')+'">'+esc(a.clockText)+'</div>'):'';
    const shortLbl=s.name==='Closed — Denied/Withdrawn'?'Closed':s.name==='With Arch/Eng'?'Arch/Eng':s.name==='Ready to Submit'?'Ready':s.name==='Revisions Needed'?'Revisions':s.name==='Completed'?'Complete':s.name;
    return '<div class="ph-step '+(done?'done':'')+(active?' active':'')+' '+stCls+'"><div class="ph-dot"></div><div class="ph-lbl">'+esc(shortLbl)+'</div>'+timer+'</div>';
  }).join('')+'</div>';
}
function appRowHtml(a){
  const badges=a.labels.map(l=>{
    const s=l.toLowerCase();
    if(s==='ez') return '<span class="badge ez">EZ</span>';
    if(s==='hist'||s.indexOf('histor')>-1) return '<span class="badge hist">HIST</span>';
    return '';
  }).join('');
  let mid;
  if(a.hold) mid='<span class="state-chip state-hold">On Hold</span><div class="hsp"></div>';
  else if(a.state==='closed') mid='<span class="state-chip state-closed">'+esc(a.stage)+'</span><div class="hsp"></div>';
  else if(a.state==='unknown') mid='<span class="state-chip state-unknown">'+esc(a.stage||'No stage')+'</span><div class="hsp"></div>';
  else mid=phaseTrackHtml(a);
  const cmt=a.comments&&a.comments.length?('<span class="cmt-badge" title="'+a.comments.length+' comment'+(a.comments.length>1?'s':'')+' — open for details">'
    +'<svg width="10" height="10" viewBox="0 0 16 16"><path d="M2 3h12v8H6l-4 3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'
    +a.comments.length+'</span>'):''; // v35: comments (not general activity) get a presence badge
  return '<div class="app-row" onclick="openDrawer(\''+esc(a.project).replace(/'/g,"\\'")+'\')">'+
    '<span class="track-chip '+trackChipCls(a.track)+'">'+esc(a.track)+'</span>'+badges+cmt+
    mid+'<span class="app-jur">'+esc(a.jur||'')+'</span></div>';
}
function renderBoard(){
  const wrap=document.getElementById('boardContent');
  const projects={};
  APPS.forEach(a=>{ (projects[a.project]=projects[a.project]||[]).push(a); });
  const names=Object.keys(projects).sort((a,b)=>{
    const ra=STATE_RANK[projectRollup(projects[a])], rb=STATE_RANK[projectRollup(projects[b])];
    return ra-rb||a.localeCompare(b);
  });
  if(!names.length){
    wrap.innerHTML='<div class="empty-note">No application cards found on the tracking board yet. Cards need a Track Type custom field to appear here.</div>';
  }else{
    wrap.innerHTML=names.map(n=>{
      const apps=projects[n];
      const roll=projectRollup(apps);
      return '<div class="proj-group"><div class="proj-hdr" onclick="openDrawer(\''+esc(n).replace(/'/g,"\\'")+'\')">'+
        '<div class="proj-name">'+esc(n)+'</div>'+
        '<div class="proj-meta">'+apps.length+' application'+(apps.length>1?'s':'')+'</div>'+
        '<span class="roll-chip '+ROLL_CLS[roll]+'">'+ROLL_LBL[roll]+'</span></div>'+
        apps.slice().sort((x,y)=>String(x.track).localeCompare(String(y.track))).map(appRowHtml).join('')+
      '</div>';
    }).join('');
  }
  const iw=document.getElementById('intakeWrap'), ic=document.getElementById('intakeContent');
  if(INTAKE.length){
    iw.style.display='block';
    ic.innerHTML=INTAKE.map(c=>'<div class="intake-row"><span class="intake-name">'+esc(c.name)+'</span>'+
      (c.cardRole==='mirror'?'<span class="intake-note">mirror</span>':'')+
      '<span class="intake-note">'+esc(c.stage)+'</span></div>').join('');
  }else iw.style.display='none';
}

function openDrawer(projectName){
  const apps=APPS.filter(a=>a.project===projectName);
  document.getElementById('drawerTitle').textContent=projectName;
  const body=document.getElementById('drawerBody');
  body.innerHTML=apps.map(a=>{
    const facts='<div class="d-facts">'+
      '<div class="d-fact"><span>Stage</span><b>'+esc(a.stage||'—')+'</b></div>'+
      '<div class="d-fact"><span>Clock</span><b'+(a.state==='over'?' class="over"':'')+'>'+esc(a.clockText||'—')+'</b></div>'+
      '<div class="d-fact"><span>Jurisdiction</span><b>'+esc(a.jur||'—')+'</b></div>'+
      '<div class="d-fact"><span>Permit Type</span><b>'+esc(a.ptype||'—')+'</b></div>'+
      '<div class="d-fact"><span>Submitted</span><b>'+fmtDate(a.submitted)+'</b></div>'+
      '<div class="d-fact"><span>Target</span><b'+(a.state==='over'?' class="over"':'')+'>'+fmtDate(a.target)+'</b></div>'+
      (a.permitNum?'<div class="d-fact"><span>Permit #</span><b>'+esc(a.permitNum)+'</b></div>':'')+
      (a.engOwner?'<div class="d-fact"><span>Arch/Eng Owner</span><b>'+esc(a.engOwner)+'</b></div>':'')+
      '</div>';
    const hist=a.history.length
      ? a.history.map(h=>'<div class="hist-row"><div class="hist-dot"></div><div class="hist-stage">'+esc(h.stage)+'</div><div class="hist-at">'+fmtDate(new Date(h.at))+(h.by?' · '+esc(h.by):'')+'</div></div>').join('')
      : '<div class="hist-at">No list moves recorded yet.</div>';
    const chks=a.checklists.length
      ? a.checklists.map(cl=>'<div class="chk-grp">'+esc(cl.name)+'</div>'+cl.items.map(i=>
          '<div class="chk-row"><div class="chk-box'+(i.done?' on':'')+'">'+(i.done?'✓':'')+'</div><div class="chk-txt'+(i.done?' on':'')+'">'+esc(i.text)+'</div></div>').join('')).join('')
      : '<div class="hist-at">No checklists on this card.</div>';
    return '<div class="d-app"><div class="d-app-hdr">'+
      '<span class="track-chip '+trackChipCls(a.track)+'">'+esc(a.track)+'</span>'+
      '<div class="d-app-name">'+esc(a.name)+'</div>'+
      (a.url?'<a href="'+esc(a.url)+'" target="_blank" rel="noopener" style="font-size:10px;color:#8a6c14;font-weight:700;text-decoration:none;">OPEN TRELLO CARD ↗</a>':'')+
      '</div>'+
      '<div class="d-sec"><div class="d-sec-title">Details</div>'+facts+'</div>'+
      (a.desc?'<div class="d-sec"><div class="d-sec-title">Description (from the card)</div><div class="desc-txt">'+esc(a.desc)+'</div></div>':'')+
      '<div class="d-sec"><div class="d-sec-title">Stage Journey</div>'+hist+'</div>'+
      (a.comments.length?'<div class="d-sec"><div class="d-sec-title">Latest Comments</div>'+a.comments.map(cm=>
        '<div class="cmt-txt">'+esc(cm.text)+'</div><div class="cmt-meta">'+esc(cm.by||'?')+' \u00b7 '+fmtDate(new Date(cm.at))+'</div>').join('')+'</div>':'')+
      '<div class="d-sec"><div class="d-sec-title">Checklist (read-only — edit on the card)</div>'+chks+'</div>'+
      ((a.cardOwner||a.owners.length)?'<div class="d-sec"><div class="d-sec-title">'+(a.cardOwner?'Managed By':'Owners')+'</div><div class="d-owners">'+esc(a.cardOwner||a.owners.join(', '))+'</div></div>':'')+
      '</div>';
  }).join('')||'<div class="empty-note">No applications for this project.</div>';
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function renderAbsolutes(){
  const wrap=document.getElementById('absContent');
  const projects={};
  APPS.forEach(a=>{ (projects[a.project]=projects[a.project]||[]).push(a); });
  const names=Object.keys(projects).sort();
  if(!names.length){ wrap.innerHTML='<div class="empty-note">Nothing to aggregate yet.</div>'; return; }
  const bin=apps=>{
    if(!apps.length) return '<span class="bin bin-na">—</span>';
    const r=projectRollup(apps);
    if(r==='done') return '<span class="bin bin-on">DONE</span>';
    if(r==='over'||r==='unknown') return '<span class="bin bin-off">OFF TRACK</span>';
    if(r==='hold') return '<span class="bin bin-na">HOLD</span>';
    return '<span class="bin bin-on">ON TRACK</span>';
  };
  wrap.innerHTML='<table class="abs-table"><thead><tr><th>Project</th><th>Owner</th><th>Arch/Eng</th><th>Zoning</th><th>Permit</th><th>Overall</th><th>Check-in Notes</th></tr></thead><tbody>'+
    names.map(n=>{
      const apps=projects[n];
      const z=apps.filter(a=>String(a.track).toLowerCase().indexOf('zon')>-1);
      const p=apps.filter(a=>String(a.track).toLowerCase().indexOf('permit')>-1);
      const owner=(function(){ // v32: CardOwner replaces the designer of record
        const set=[]; apps.forEach(a2=>{ if(a2.cardOwner&&set.indexOf(a2.cardOwner)===-1) set.push(a2.cardOwner); });
        return set.length?set.join(' / '):'\u2014';
      })();
      const ae=(function(){ // v34: Arch/Eng dependency — name of who owns it + where it stands
        const AE=stageRank('With Arch/Eng');
        const rel=apps.filter(a2=>String(a2.track).toLowerCase().indexOf('zon')===-1); // permit + engineering tracks
        if(!rel.length) return '<span class="bin bin-na">\u2014</span>';
        const nm=(function(){ const st=[]; rel.forEach(a2=>{ const o=a2.engOwner||a2.cardOwner; if(o&&st.indexOf(o)===-1) st.push(o); }); return st.join(' / '); })();
        const nmHtml=nm?'<div style="font-size:11px;margin-bottom:2px;">'+esc(nm)+'</div>':'';
        if(rel.some(a2=>stageRank(a2.stage)===AE)) return nmHtml+'<span class="bin bin-on">ON TRACK</span>';
        if(rel.some(a2=>a2.hold)) return nmHtml+'<span class="bin bin-na">HOLD</span>';
        if(rel.every(a2=>a2.terminal||stageRank(a2.stage)>AE)) return nmHtml+'<span class="bin bin-on">DONE</span>';
        return nmHtml+'<span class="bin bin-na">\u2014</span>';
      })();
      return '<tr><td class="abs-proj">'+esc(n)+'</td><td>'+esc(owner)+'</td><td>'+ae+'</td><td>'+bin(z)+'</td><td>'+bin(p)+'</td><td>'+bin(apps)+'</td>'+
        '<td class="abs-note-pending">weekly notes \u2014 storage home pending (spec \u00A76.3)</td></tr>';
    }).join('')+'</tbody></table>';
}

function setView(v){
  _view=v;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id==='view-'+v));
}

/* ═══ Admin panel ═══ */
function toggleAdmin(){ document.getElementById('adminPanel').classList.toggle('open'); }
function apStatus(m){ document.getElementById('apStatus').textContent=m||''; }
async function testTrello(){
  const key=document.getElementById('apKey').value.trim();
  const tok=document.getElementById('apToken').value.trim();
  const brd=document.getElementById('apBoard').value.trim();
  if(!key||!tok||!brd){ apStatus('All three fields are required.'); return; }
  apStatus('Testing…');
  try{
    const r=await fetch('https://api.trello.com/1/boards/'+encodeURIComponent(brd)+'?fields=name&key='+encodeURIComponent(key)+'&token='+encodeURIComponent(tok));
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    apStatus('Connected: "'+d.name+'"');
  }catch(e){ apStatus('Connection failed ('+e.message+').'); }
}
async function saveAdmin(){
  const key=document.getElementById('apKey').value.trim();
  const tok=document.getElementById('apToken').value.trim();
  const brd=document.getElementById('apBoard').value.trim();
  if(!key||!tok||!brd){ apStatus('All three fields are required.'); return; }
  apStatus('Saving to CORE_Config…');
  try{
    await setConfigRow('TrelloApiKey',key);
    await setConfigRow('TrelloToken',tok);
    await setConfigRow('TrelloPermitBoardId',brd);
    _trelloCfg={apiKey:key,token:tok,boardId:brd};
    apStatus('Saved. Reloading data…');
    await refreshAll();
    apStatus('Saved.');
  }catch(e){ console.error(e); apStatus('Save failed — check console.'); }
}

/* ═══ Boot ═══ */
async function refreshAll(){
  if(!_trelloCfg){ 
    showBanner('bannerInfo','Trello isn\u2019t configured yet. Open Setup (\u2699) and enter the API key, token, and tracking board ID \u2014 they save to CORE_Config.');
    document.getElementById('boardContent').innerHTML='<div class="empty-note">Waiting for Trello configuration.</div>';
    document.getElementById('absContent').innerHTML='<div class="empty-note">Waiting for Trello configuration.</div>';
    return;
  }
  hideBanner('bannerInfo');
  try{
    await loadTrello();
  }catch(e){
    console.error('[trello]',e);
    showBanner('bannerErr','Couldn\u2019t read the Trello board \u2014 check the credentials and board ID in Setup (\u2699). '+e.message);
    return;
  }
  hideBanner('bannerErr');
  renderBoard(); renderAbsolutes();
  // v29: ?project= deep link — open straight into that project's drawer (the
  // Pipeline's Permit & Zoning zone links here so nobody lands on a wall of projects)
  if(!_deepLinked){
    _deepLinked=true;
    const want=new URLSearchParams(location.search).get('project');
    if(want){
      const hit=APPS.find(a=>normName(a.project)===normName(want));
      if(hit) openDrawer(hit.project);
      else showBanner('bannerInfo','No permit applications on record yet for \u201C'+want+'\u201D.');
    }
  }
  syncToSharePoint(); // fire-and-monitor; render doesn't wait on the mirror
}

async function boot(){
  setAuthStatus('Connecting to SharePoint…');
  await getToken();
  setAuthStatus('Loading configuration…');
  try{ await loadConfig(); }
  catch(e){ console.error('[config]',e); setAuthStatus('Config load failed — check console.'); return; }
  document.getElementById('authOverlay').classList.add('hidden');
  // v32: designer-of-record fetch retired — CardOwner on the cards is the managing owner now (loadProjectDesigners kept above for possible reuse)
  await refreshAll();
}

(function(){
  const vb=document.getElementById('versionBadge'); if(vb) vb.textContent=CORE_VERSION;
  const ab=document.getElementById('authVersionBadge'); if(ab) ab.textContent=CORE_VERSION;
})();

msalApp.handleRedirectPromise().then(resp=>{
  if(resp&&resp.account) msalApp.setActiveAccount(resp.account);
  const acct=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0];
  if(acct){ msalApp.setActiveAccount(acct); boot().catch(e=>{ console.error('[boot]',e); setAuthStatus('Startup failed — check console.'); }); }
}).catch(e=>{ console.error('[msal]',e); setAuthStatus('Sign-in error — check console.'); });
</script>
