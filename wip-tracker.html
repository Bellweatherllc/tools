<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BW WIP Tracker</title>
<style>
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_DemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}

:root{
  --navy:#1f2e3e; --gold:#d8b64f; --gold-light:#f9e6ae;
  --bg:#f5f3ee; --surface:#fff; --text:#1f2e3e; --text-sec:#7a7a7a;
  --muted:#a3a3a3; --border:#e4dac4;
  --ok:#3b7fa8; --warn:#d07820; --over:#ac2828; --good:#00521b;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'TT Norms Pro',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

/* ── Auth overlay ── */
#authOverlay{position:fixed;inset:0;background:var(--navy);z-index:1000;display:flex;align-items:center;justify-content:center;}
.auth-card{text-align:center;max-width:340px;padding:30px;}
.auth-card img{height:54px;margin-bottom:18px;}
.auth-title{font-family:'Swear Text',serif;font-size:21px;color:#fff;font-weight:500;margin-bottom:4px;}
.auth-ver{font-size:9px;font-weight:700;letter-spacing:.10em;color:rgba(255,255,255,.20);margin-bottom:26px;}
.auth-btn{background:var(--gold);color:var(--navy);border:none;padding:11px 34px;border-radius:6px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}
.auth-btn:hover{background:var(--gold-light);}
.auth-btn:disabled{opacity:.5;cursor:default;}
#authStatus{margin-top:16px;font-size:12px;color:rgba(255,255,255,.6);min-height:18px;}
#authStatus.err{color:#e89090;}

/* ── Topbar ── */
.topbar{background:var(--navy);display:flex;align-items:center;gap:12px;padding:0 16px;height:48px;position:sticky;top:0;z-index:100;}
.topbar img{height:22px;display:block;}
.tb-div{width:1px;height:16px;background:rgba(255,255,255,.14);}
.tb-title{font-family:'Swear Text',serif;font-size:14px;color:rgba(255,255,255,.9);font-weight:500;white-space:nowrap;}
.tb-ver{font-size:10px;font-weight:600;letter-spacing:.08em;color:#ef4444;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.tb-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.85);padding:5px 13px;border-radius:5px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;}
.tb-btn:hover{background:rgba(255,255,255,.15);}
.acct-chip{font-size:11px;color:rgba(255,255,255,.55);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.manual-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.55);font-size:11px;font-weight:700;text-decoration:none;flex-shrink:0;transition:all .12s;}
.manual-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(216,182,79,.08);}

/* ── Layout ── */
.main{max-width:1180px;margin:0 auto;padding:22px 20px 60px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px;}
.card .lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-sec);margin-bottom:7px;}
.card .val{font-family:'Swear Text',serif;font-size:24px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums;}
.card .sub{font-size:11px;color:var(--text-sec);margin-top:6px;}
.card.gold-edge{border-top:3px solid var(--gold);}
.card.navy-edge{border-top:3px solid var(--navy);}
.card.pos .val{color:var(--over);}
.card.neg .val{color:var(--good);}
.netpos-toggle{display:block;margin-top:9px;font-size:11px;color:var(--text-sec);cursor:pointer;user-select:none;}
.netpos-toggle input{margin-right:5px;vertical-align:middle;}
.netpos-manual{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px;}
.netpos-manual input[type=number]{width:110px;border:1px solid var(--border);border-radius:6px;padding:6px 9px;font-family:inherit;font-size:12.5px;}
.netpos-manual select{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:12.5px;background:#fff;}
.netpos-manual button{border-radius:6px;padding:6px 12px;font-family:inherit;font-size:12px;cursor:pointer;border:1px solid var(--border);background:#fff;}
.netpos-manual button:hover{background:var(--bg);}
.netpos-manual button.secondary{color:var(--text-sec);}

h2.sec{font-family:'Swear Text',serif;font-size:17px;font-weight:500;margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
h2.sec .note{font-family:'TT Norms Pro',sans-serif;font-size:11px;font-weight:400;color:var(--text-sec);}

/* ── Source / freshness panel ── */
.src-panel{background:#fdf7e6;border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:8px;padding:14px 18px;font-size:12.5px;line-height:1.6;}
.src-panel.err{background:#fbeceb;border-left-color:var(--over);}
.src-panel b{font-weight:600;}
.src-path{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:11.5px;background:#fff;border:1px solid var(--border);border-radius:5px;padding:2px 7px;display:inline-block;margin:2px 0;}
.src-panel a{color:var(--navy);}
.src-meta{margin-top:8px;color:var(--text-sec);font-size:11.5px;}

table.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.tbl th{background:var(--navy);color:rgba(255,255,255,.85);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:9px 12px;text-align:right;white-space:nowrap;}
.tbl th:first-child{text-align:left;}
.tbl th.sortable{cursor:pointer;user-select:none;}
.tbl th.sortable:hover{background:#324a7a;}
.tbl td{padding:9px 12px;border-top:1px solid #efe9da;font-size:13px;text-align:right;font-variant-numeric:tabular-nums;}
.tbl td:first-child{text-align:left;font-weight:500;}
.tbl tr.total td{font-weight:700;background:#faf8f2;border-top:2px solid var(--border);}
.tbl .dim{color:var(--muted);}
.tbl .pos{color:var(--over);}
.tbl .neg{color:var(--good);}
.flag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:8px;margin-left:6px;vertical-align:1px;background:#f3e2ad;color:#5c4a12;cursor:help;}
.flag.bad{background:#f5d9d6;color:var(--over);}
.progress-mini{display:inline-flex;align-items:center;gap:6px;}
.progress-mini .bar{width:52px;height:6px;border-radius:3px;background:#eee9dc;overflow:hidden;}
.progress-mini .bar>span{display:block;height:100%;background:var(--gold);}

.unmatched{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:12.5px;color:var(--text-sec);}
.unmatched b{color:var(--text);}
.unmatched .row{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid #efe9da;}
.unmatched .row:first-of-type{border-top:none;}

#loadStatus{text-align:center;padding:60px 0;color:var(--text-sec);font-size:13px;}
#loadStatus.hidden,#main.hidden{display:none;}

/* ── Tooltip ── */
#tt{position:fixed;z-index:9999;background:var(--navy);color:#fff;font-size:11px;line-height:1.5;padding:6px 11px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 4px 12px rgba(0,0,0,.22);max-width:240px;}
#tt.show{opacity:1;}
#tt .tt-n{font-weight:700;color:var(--gold);}
#tt .tt-d{font-size:10px;color:rgba(255,255,255,.65);margin-top:2px;}

#toasts{position:fixed;bottom:20px;right:20px;z-index:900;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:7px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;max-width:380px;}
.toast.err{background:var(--over);}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;}

/* ── Stage badge, weak-match flag, override control ── */
.stage-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text-sec);}
.stage-badge.ca{background:#e6efe8;border-color:#cfe3d3;color:var(--good);}
.flag.weak{background:#fdeecb;color:#8a5a10;}
.ovr-btn{border:none;background:none;color:var(--ok);cursor:pointer;font-size:11px;padding:0 0 0 6px;text-decoration:underline;font-family:inherit;}
.ovr-btn:hover{color:var(--navy);}
.ovr-note{display:block;font-size:10.5px;color:var(--text-sec);font-weight:400;text-align:left;margin-top:2px;}

/* ── As-of control ── */
.asof-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;margin-bottom:14px;font-size:12.5px;flex-wrap:wrap;}
.asof-bar .asof-lbl{font-weight:600;color:var(--text);}
.asof-bar input[type=date]{border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-family:inherit;font-size:12.5px;background:#fff;color:var(--text);}
.asof-bar button{border:1px solid var(--border);background:#fff;border-radius:5px;padding:5px 11px;font-size:12px;font-family:inherit;cursor:pointer;}
.asof-bar button:hover:not(:disabled){background:var(--bg);}
.asof-bar button:disabled{opacity:.4;cursor:not-allowed;}
.asof-bar .asof-note{color:var(--text-sec);flex-basis:100%;}
.asof-bar.historical{background:#fdf7e6;border-left:4px solid var(--gold);}

/* ── Lock banner ── */
.reviewer-panel{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.reviewer-chip{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12.5px;}
.reviewer-chip.done{border-color:#bcd8c1;background:#f2f8f3;}
.reviewer-chip .rc-name{font-weight:700;}
.reviewer-chip .rc-state{color:var(--text-sec);}
.reviewer-chip.done .rc-state{color:var(--good);}
.reviewer-chip .rc-btn{border:1px solid var(--border);background:#fff;border-radius:5px;padding:5px 11px;font-size:12px;font-family:inherit;cursor:pointer;}
.reviewer-chip .rc-btn:hover:not(.locked-out){background:var(--bg);}
.reviewer-chip .rc-btn.locked-out{opacity:.4;cursor:not-allowed;}
.reviewer-panel.disabled .reviewer-chip{opacity:.5;}
.asof-lock-note{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;margin:-2px 0 10px;font-size:12px;color:var(--text-sec);}
.lock-banner{background:#eef3f6;border:1px solid var(--border);border-left:4px solid var(--ok);border-radius:8px;padding:12px 18px;margin-bottom:14px;font-size:12.5px;line-height:1.6;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.lock-banner b{font-weight:600;}
.lock-banner .actions{margin-left:auto;display:flex;gap:8px;}
.lock-banner .actions button{border:1px solid var(--border);background:#fff;border-radius:5px;padding:5px 11px;font-size:12px;font-family:inherit;cursor:pointer;}
.lock-banner .actions button:hover{background:var(--bg);}
.lock-banner .actions button:disabled{opacity:.6;cursor:wait;}

/* ── Override modal ── */
#ovrOverlay{position:fixed;inset:0;background:rgba(31,46,62,.55);z-index:800;display:none;align-items:center;justify-content:center;}
#ovrOverlay.open{display:flex;}
.ovr-panel{background:#fff;border-radius:10px;max-width:380px;width:92%;box-shadow:0 18px 50px rgba(0,0,0,.3);padding:20px 22px;}
.ovr-panel h3{font-family:'Swear Text',serif;font-size:16px;font-weight:500;margin-bottom:4px;}
.ovr-panel .sub{font-size:12px;color:var(--text-sec);margin-bottom:14px;}
.ovr-panel label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-sec);margin:12px 0 5px;}
.ovr-panel input[type=number],.ovr-panel textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:13px;}
.ovr-panel textarea{resize:vertical;min-height:52px;}
.ovr-foot{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.ovr-foot button{border-radius:6px;padding:7px 16px;font-family:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--border);background:#fff;}
.ovr-foot button.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
.ovr-foot button.clear{color:var(--over);border-color:#e0b8b4;margin-right:auto;}

@media print{
  .topbar,.src-panel,.unmatched,#ovrOverlay,.ovr-btn,.lock-banner .actions,.reviewer-panel,.asof-bar,.netpos-toggle,.netpos-manual,#toasts,#tt{display:none!important;}
  body{background:#fff;}
  #printHeader{display:block!important;margin-bottom:16px;}
  #printHeader h1{font-family:'Swear Text',serif;font-size:20px;margin-bottom:4px;}
  #printHeader .sub{font-size:12px;color:var(--text-sec);}
}
#printHeader{display:none;}
</style>
</head>
<body>

<div id="authOverlay">
  <div class="auth-card">
    <img src="https://bellweatherllc.github.io/tools/logos/Monogram-Linen.svg" alt="Bellweather">
    <div class="auth-title">BW WIP Tracker</div>
    <div class="auth-ver">VERSION <span id="authVersionBadge"></span></div>
    <button class="auth-btn" id="authSignInBtn">Sign in with Microsoft</button>
    <div id="authStatus"></div>
  </div>
</div>

<div class="topbar" id="topbar" style="display:none;">
  <img src="https://bellweatherllc.github.io/tools/logos/Monogram-Linen.svg" alt="Bw">
  <div class="tb-div"></div>
  <span class="tb-title">WIP Tracker</span>
  <span class="tb-ver" id="versionBadge"></span>
  <div class="tb-right">
    <button class="tb-btn" id="refreshBtn">Refresh</button>
    <a class="tb-btn" href="revenue-tracker.html">Revenue Tracker ↗</a>
    <span class="acct-chip" id="acctChip"></span>
    <a class="manual-btn" href="wip-tracker-manual.html" target="_blank" rel="noopener" data-tip="Help &amp; repair manual">?</a>
  </div>
</div>

<div id="loadStatus">Loading…</div>

<div class="main hidden" id="main">
  <div id="printHeader"><h1></h1><div class="sub"></div></div>
  <div class="asof-bar" id="asOfBar">
    <span class="asof-lbl">Viewing as of</span>
    <input type="date" id="asOfInput">
    <button type="button" id="asOfTodayBtn">Today</button>
    <span class="asof-note" id="asOfNote"></span>
  </div>
  <div id="lockBannerWrap"></div>
  <div class="src-panel" id="srcPanel">Loading invoicing export…</div>

  <h2 class="sec">Portfolio <span class="note" id="portfolioNote">DA Signed &amp; CA Signed jobs, live</span></h2>
  <div class="cards" id="cards"></div>

  <h2 class="sec">Projects
    <span class="note"
      data-tip="How earned revenue is calculated"
      data-tip-d="CA-Signed jobs: 20% of contract value at signing, plus the remaining 80% spread evenly across the construction schedule. Earlier stages have no formula — set a % complete by hand using the ✎ next to Earned.">(what's the formula?)</span>
  </h2>
  <div style="overflow-x:auto;"><table class="tbl" id="projTbl"></table></div>

  <div id="unmatchedWrap"></div>
</div>

<div id="ovrOverlay">
  <div class="ovr-panel">
    <h3 id="ovrTitle"></h3>
    <div class="sub" id="ovrSub"></div>
    <label for="ovrPct">Percent complete (overrides the formula)</label>
    <input type="number" id="ovrPct" min="0" max="100" step="1">
    <label for="ovrNote">Why (shows on hover)</label>
    <textarea id="ovrNote" placeholder="e.g. Substantially complete but windows are on backorder — not yet earned."></textarea>
    <div class="ovr-foot">
      <button class="clear" id="ovrClearBtn">Clear override</button>
      <button id="ovrCancelBtn">Cancel</button>
      <button class="primary" id="ovrSaveBtn">Save</button>
    </div>
  </div>
</div>

<div id="tt"></div>
<div id="toasts"></div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="lib/sherpa-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
'use strict';
// ════════════════════════════════════ VERSION
const CORE_VERSION='v11';
(()=>{ const a=document.getElementById('authVersionBadge'); if(a) a.textContent=CORE_VERSION;
       const v=document.getElementById('versionBadge');     if(v) v.textContent=CORE_VERSION; })();

// ════════════════════════════════════ CONFIG
const GRAPH='https://graph.microsoft.com/v1.0';
const BWC_SITE=GRAPH+'/sites/bellweather.sharepoint.com:/sites/BWCore:/lists';
const OPS_SITE_DRIVES=GRAPH+'/sites/bellweather.sharepoint.com:/sites/Operations:/drives';
const EPOCH=new Date('2025-01-05T00:00:00');   // Pipeline C.startDate — immutable, shared across CORE tools
const MS_WEEK=7*24*3600*1000;
const SIGNING_SHARE=0.20;   // owned the moment a CA is signed
const BUILD_SHARE=0.80;     // spread across the construction schedule
const INV_FOLDER_LABEL='Operations → FINANCIAL → 1. WIP Reports & Job Costs → BT_InvoicingReports_forWIPTool';
const INV_HOWTO='BuilderTrend → Financial → Invoice → All Jobs → Export';
const INCLUDED_STAGES=/^(da signed|ca signed)$/i;

// ════════════════════════════════════ STATE
let PROJECTS=[];   // {spId, name, clientName, stage, contract, constr:{startWeek,durWeeks}|null}
let INV=null;      // {rows:[{job,price,date}], byJob:Map, file, modified, exportedOn, folderUrl, error}
let OVERRIDES={};  // spId -> {pct, note, setBy, setAt}
let NETPOS_OVERRIDE=null;  // {value, setBy, setAt} — value is signed dollars, same sign convention as gap (>=0 = over)
let NETPOS_FORM_OPEN=false;  // whether the manual-entry form is expanded, independent of whether it's actually saved
let LOCK=null;     // existing lock record for the current period, or null
let VIEW_LOCK=false;   // true while showing the locked snapshot instead of live numbers
function startOfToday(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
let AS_OF=startOfToday();   // the date the whole page recalculates against — defaults to today
// End of the AS_OF day — the cutoff for "invoiced/complete as of that date." Everything
// (schedule progress, invoice cutoff) is recomputed against this instead of the real
// clock, so viewing a past date isn't just narrower, it's a genuinely different "now."
function asOfEnd(){ return new Date(AS_OF.getFullYear(),AS_OF.getMonth(),AS_OF.getDate(),23,59,59,999); }
function isToday(){ const t=startOfToday(); return AS_OF.getFullYear()===t.getFullYear()&&AS_OF.getMonth()===t.getMonth()&&AS_OF.getDate()===t.getDate(); }
function asOfLabel(){ return AS_OF.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function fmtInputDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// The period a lock targets is always whichever month is being viewed — not a fixed
// "real now." Locking while looking at August 31st locks August, never September.
function viewPeriod(){ return AS_OF.getFullYear()+'-'+String(AS_OF.getMonth()+1).padStart(2,'0'); }
function viewPeriodLabel(){ return AS_OF.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
function isLastDayOfMonth(d){ const next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1); return next.getMonth()!==d.getMonth(); }
// Locking only makes sense for today (the live, in-progress month) or the last day of a
// month you're approving retroactively — anything else is a mid-month snapshot that was
// never meant to be "the" figure for that month.
function canLockAsOf(){ return isToday()||isLastDayOfMonth(AS_OF); }

// ════════════════════════════════════ UTIL
function parseMoney(s){ const n=parseFloat(String(s==null?'':s).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function fmt$(v){ if(v==null||isNaN(v))return '—'; const neg=v<0; const a=Math.round(Math.abs(v)).toLocaleString(); return (neg?'−$':'$')+a; }
function fmtPct(v){ return v==null?'—':Math.round(v*100)+'%'; }
function esc(s){ const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function normName(s){ return String(s||'').toLowerCase().replace(/\(all\)/g,'').replace(/[^a-z]/g,''); }
function lev(a,b){
  if(a===b)return 0;
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function toast(msg,kind){
  const t=document.createElement('div'); t.className='toast '+(kind||'');
  t.innerHTML='<span class="tdot"></span><span></span>'; t.lastChild.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{ t.remove(); }, kind==='err'?8000:4000);
}
function fmtDate(iso){
  if(!iso) return null;
  try{ return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); }
  catch(e){ return iso; }
}

// ════════════════════════════════════ TOOLTIP (data-tip / data-tip-d — never native title)
const TT=document.getElementById('tt');
function showTT(html,e){ TT.innerHTML=html; TT.classList.add('show'); moveTT(e); }
function moveTT(e){
  const tw=TT.offsetWidth||140, th=TT.offsetHeight||40;
  const vw=window.innerWidth, vh=window.innerHeight;
  let top=e.clientY+16; if(top+th>vh-4) top=e.clientY-th-10;
  let left=e.clientX+14; if(left+tw>vw-4) left=e.clientX-tw-14;
  TT.style.left=Math.max(4,left)+'px'; TT.style.top=Math.max(4,top)+'px';
}
function hideTT(){ TT.classList.remove('show'); }
function tipHTML(el){
  const n=el.getAttribute('data-tip')||'', d=el.getAttribute('data-tip-d')||'';
  return d? '<div class="tt-n">'+esc(n)+'</div><div class="tt-d">'+esc(d)+'</div>' : esc(n);
}
document.addEventListener('mouseover',e=>{
  const t=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;
  if(!t||!t.getAttribute('data-tip')) return;
  showTT(tipHTML(t),e);
});
document.addEventListener('mousemove',e=>{ if(TT.classList.contains('show')) moveTT(e); });
document.addEventListener('mouseout',e=>{
  const t=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;
  if(!t) return;
  if(t.contains&&t.contains(e.relatedTarget)) return;

// ── As-of date control — recalculates schedule progress and the invoice cutoff against
// a chosen date instead of the real clock. Initialized once; Refresh must not reset it. ──
let _asOfInit=false;
function initAsOfControl(){
  if(_asOfInit) return; _asOfInit=true;
  const input=document.getElementById('asOfInput');
  input.min=fmtInputDate(EPOCH);
  input.max=fmtInputDate(startOfToday());
  input.value=fmtInputDate(AS_OF);
  input.addEventListener('change',async()=>{
    const v=input.value; if(!v) return;
    const [y,m,d]=v.split('-').map(Number);
    let picked=new Date(y,m-1,d);
    const today=startOfToday();
    if(picked>today) picked=today;
    if(picked<EPOCH) picked=new Date(EPOCH.getFullYear(),EPOCH.getMonth(),EPOCH.getDate());
    AS_OF=picked;
    input.value=fmtInputDate(AS_OF);
    if(!isToday()) VIEW_LOCK=false;
    recomputeInvoicedForAsOf();
    await loadLock();   // the relevant lock row moves with AS_OF's month
    renderAll();
  });
  document.getElementById('asOfTodayBtn').addEventListener('click',async()=>{
    AS_OF=startOfToday();
    input.value=fmtInputDate(AS_OF);
    recomputeInvoicedForAsOf();
    await loadLock();
    renderAll();
  });
}

// ── Lock the viewed month — each reviewer's own button, only usable by them, and only
// for today or a month-end date (see canLockAsOf) ──
async function onReviewerLock(key){
  const rows=window._wipRows||[];
  if(!rows.length){ toast('Nothing to lock yet — let the page finish loading.','err'); return; }
  if(!canLockAsOf()){ toast('Locking isn’t available for this date — pick today or the last day of a month.','err'); return; }
  if(myReviewerKey()!==key){ toast('Only '+REVIEWERS.find(r=>r.key===key).label+' can use this button.','err'); return; }
  const reviewer=REVIEWERS.find(r=>r.key===key);
  const other=REVIEWERS.find(r=>r.key!==key);
  const cur=(LOCK&&LOCK.period===viewPeriod())?LOCK:null;
  const alreadyFinal=!!(cur&&cur.finalized);
  const mine=cur&&cur.reviews&&cur.reviews[key];
  const otherDone=cur&&cur.reviews&&cur.reviews[other.key];
  const whenPhrase=isToday()?viewPeriodLabel():viewPeriodLabel()+' (as of '+asOfLabel()+')';
  let msg;
  if(alreadyFinal){
    msg=viewPeriodLabel()+' is already finalized. Locking again as '+reviewer.label+' starts a fresh two-person confirmation — both '+reviewer.label+' and '+other.label+' need to lock again before a new PDF is produced.\n\nContinue?';
  }else if(mine){
    msg='Update '+reviewer.label+'’s lock for '+whenPhrase+'?';
  }else if(otherDone){
    msg=other.label+' already locked '+viewPeriodLabel()+'. Locking now as '+reviewer.label+' finalizes the record and opens the print dialog to save a PDF.\n\nContinue?';
  }else{
    msg='Lock '+whenPhrase+' as '+reviewer.label+'? '+other.label+' will still need to lock separately before this is final.\n\nContinue?';
  }
  if(!confirm(msg)) return;
  try{
    if(alreadyFinal) LOCK={period:viewPeriod(),periodLabel:viewPeriodLabel(),reviews:{},finalized:false,finalizedAt:null};
    const wasFinal=!!(LOCK&&LOCK.finalized);
    const result=await addReview(key,rows);
    if(result.finalized&&!wasFinal){
      toast('Finalized — '+viewPeriodLabel()+' is locked','ok');
      VIEW_LOCK=true;
      renderAll();
      setTimeout(()=>window.print(),300);
    }else{
      toast(reviewer.label+'’s review is locked in','ok');
      renderAll();
    }
  }catch(e){ toast('Could not lock: '+(e.message||e),'err'); }
}

async function graphGetAll(url){
  let out=[], next=url;
  while(next){ const j=await SherpaAuth.graph(next); out=out.concat(j.value||[]); next=j['@odata.nextLink']||null; }
  return out;
}

// Scope: DA Signed and CA Signed only. Leads are excluded outright — nothing's
// been collected yet on a project that isn't even in design under contract.
async function loadProjects(){
  const items=await graphGetAll(BWC_SITE+'/CORE_Projects/items?$expand=fields&$select=id,fields');
  PROJECTS=[];
  items.forEach(item=>{
    const f=item.fields||{};
    const stage=f.PipelineStage||'';
    const clientName=f.ClientName||f.Title||'Unnamed';
    const name=f.ProjectName||clientName;
    let gd=null;
    if(f.GanttData){ try{ gd=JSON.parse(f.GanttData); }catch(e){ /* bad blob — no schedule */ } }
    const isSlot=(gd&&gd.isOpenSlot)||/^Slot\b/i.test(name);
    if(isSlot||!INCLUDED_STAGES.test(stage)) return;
    let constr=null;
    if(gd&&gd.productionLane&&Array.isArray(gd.productionLane.phases)){
      const ph=gd.productionLane.phases.find(p=>/^construction$/i.test(String(p.name||'').trim()));
      if(ph&&ph.durWeeks>0) constr={startWeek:ph.startWeek,durWeeks:ph.durWeeks};
    }
    PROJECTS.push({spId:String(item.id),name,clientName,stage,contract:parseMoney(f.EstimatedProjectValue),constr});
  });
}

let _invDriveId=null;
async function invDriveId(){
  if(_invDriveId) return _invDriveId;
  const data=await SherpaAuth.graph(OPS_SITE_DRIVES);
  const d=(data.value||[]).find(x=>/^financial$/i.test((x.name||'').trim()))
        ||(data.value||[]).find(x=>/financial/i.test(x.name||''));
  if(!d) throw new Error('FINANCIAL library not found on the Operations site');
  _invDriveId=d.id; return _invDriveId;

async function invChildren(driveId,itemId){
  const data=await SherpaAuth.graph(GRAPH+'/drives/'+driveId+'/items/'+itemId+'/children?$select=id,name,folder,file,webUrl,lastModifiedDateTime&$top=200');
  return data.value||[];
}
async function invFindNewest(){
  const drive=await invDriveId();
  const root=await SherpaAuth.graph(GRAPH+'/drives/'+drive+'/root?$select=id');
  const step=async(parentId,rx)=>{
    const kids=await invChildren(drive,parentId);
    const hit=kids.find(k=>k.folder&&rx.test((k.name||'').trim()));
    if(!hit) throw new Error('Folder not found under '+INV_FOLDER_LABEL+' — expected a match for '+rx);
    return hit;
  };
  const wipFolder=await step(root.id,/^1\.\s*wip reports/i);
  const invFolder=await step(wipFolder.id,/invoicingreports.*wiptool|bt_?invoicingreports/i);
  const kids=await invChildren(drive,invFolder.id);
  const isRpt=f=>!f.folder&&/\.xlsx?$/i.test(f.name||'');
  let files=kids.filter(isRpt);
  for(const d of kids.filter(f=>f.folder)){
    try{ files=files.concat((await invChildren(drive,d.id)).filter(isRpt)); }catch(_){}
  }
  if(!files.length) throw new Error('No .xls/.xlsx export found in '+INV_FOLDER_LABEL);
  files.sort((a,b)=>(b.lastModifiedDateTime||'').localeCompare(a.lastModifiedDateTime||''));
  return {file:files[0],drive,folderUrl:invFolder.webUrl};
}

function extractExportedOn(rows){
  for(let i=0;i<Math.min(rows.length,3);i++){
    const t=(rows[i]||[]).map(c=>c==null?'':String(c)).join(' ');
    const m=t.match(/exported on\s+(.+?)\)?\s*$/i);
    if(m) return m[1].trim();
  }
  return null;
}
// Parses every non-Draft invoice line into {job, price, date} — no cutoff applied here,
// so the same parsed rows can be re-aggregated for any AS_OF date without re-fetching or
// re-parsing the export.
function parseInvoiceRows(rows){
  let hdr=null,hIdx=-1;
  for(let i=0;i<rows.length;i++){
    const r=rows[i]; if(!r) continue;
    const texts=r.map(c=>String(c==null?'':c).trim().toLowerCase());
    if(texts.indexOf('status')>=0 && texts.indexOf('job')>=0){ hdr=texts; hIdx=i; break; }
  }
  if(!hdr) throw new Error('No header row found — expected columns including "Job" and "Status"');
  const col=k=>hdr.indexOf(k.toLowerCase());
  const cJob=col('job'), cStatus=col('status'), cPrice=col('total price'), cDeadline=col('deadline'), cDatePaid=col('date paid');
  if(cJob<0||cStatus<0||cPrice<0) throw new Error('Missing an expected column (Job / Status / Total Price) in the export');
  const num=v=>{ if(typeof v==='number') return v; const t=String(v==null?'':v).replace(/[$,\s]/g,''); const n=parseFloat(t); return isNaN(n)?0:n; };
  // No true "invoice date" column exists in this export. "Deadline" stands in for it —
  // checked against Date Paid across a real export, the median gap was 0 days, meaning
  // these invoices are effectively due on receipt, not NET-30. If that billing pattern
  // ever changes, this proxy needs revisiting.
  const excelDate=v=>(typeof v==='number'&&v)?new Date((v-25569)*86400000):null;
  const out=[];
  for(let i=hIdx+1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.length) continue;
    const job=String(r[cJob]||'').trim(); if(!job) continue;
    const status=String(r[cStatus]||'').trim();
    if(/^draft$/i.test(status)) continue;   // not actually invoiced yet, whatever its date says
    let d=cDeadline>=0?excelDate(r[cDeadline]):null;
    if(!d&&cDatePaid>=0) d=excelDate(r[cDatePaid]);
    out.push({job,price:num(r[cPrice]),date:d});
  }
  return out;
}
// Sums parsed invoice rows by job, keeping only those dated on or before the cutoff — a
// row with no date at all (neither Deadline nor Date Paid present) counts regardless,
// rather than being silently dropped for lack of a date.
function aggregateByJob(invRows,cutoff){
  const byJob=new Map();
  invRows.forEach(r=>{
    if(r.date&&r.date>cutoff) return;
    byJob.set(r.job,(byJob.get(r.job)||0)+r.price);
  });
  return byJob;
}
async function loadInvoicing(){
  try{
    const {file:f,drive,folderUrl}=await invFindNewest();
    const tok=await SherpaAuth.getToken();
    const dl=await fetch(GRAPH+'/drives/'+drive+'/items/'+f.id,{headers:{Authorization:'Bearer '+tok}});
    if(!dl.ok) throw new Error('Graph '+dl.status+' fetching '+f.name);
    const meta=await dl.json();
    const url=meta['@microsoft.graph.downloadUrl']; if(!url) throw new Error('No download URL for '+f.name);
    const buf=await (await fetch(url)).arrayBuffer();
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames.find(n=>/customer invoices/i.test(n))||wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
    const invRows=parseInvoiceRows(rows);
    INV={rows:invRows,byJob:aggregateByJob(invRows,asOfEnd()),file:f.name,modified:f.lastModifiedDateTime,exportedOn:extractExportedOn(rows),folderUrl,error:null};
  }catch(e){
    console.warn('[wip] invoicing load failed:',e);
    INV={rows:[],byJob:new Map(),file:null,modified:null,exportedOn:null,folderUrl:null,error:e.message||String(e)};
  }
}
// Called whenever AS_OF changes — cheap, in-memory re-aggregation, no re-fetch.
function recomputeInvoicedForAsOf(){
  if(INV&&INV.rows) INV.byJob=aggregateByJob(INV.rows,asOfEnd());
}

// ════════════════════════════════════ CORE_Config — shared key/value store
// Same list and {Title,Key,Value} shape the Pipeline already uses for its
// OPS cash-flow scenarios and other shared, lightweight state. No new
// SharePoint list or column needed for overrides or monthly locks.
let _cfgCache=null, _cfgPromise=null;
async function cfgAll(){
  if(_cfgCache) return _cfgCache;
  if(!_cfgPromise) _cfgPromise=graphGetAll(BWC_SITE+'/CORE_Config/items?$expand=fields&$select=id,fields').then(items=>{ _cfgCache=items; return items; });
  return _cfgPromise;
}
async function cfgGet(key){
  const items=await cfgAll();
  const row=items.find(it=>(it.fields||{}).Key===key);
  return row?{id:row.id,value:row.fields.Value}:null;
}
async function cfgSet(key,value){
  const items=await cfgAll();
  const row=items.find(it=>(it.fields||{}).Key===key);
  if(row){
    await SherpaAuth.graph(BWC_SITE+'/CORE_Config/items/'+row.id+'/fields',{method:'PATCH',body:JSON.stringify({Value:value})});
    row.fields.Value=value;
  }else{
    const created=await SherpaAuth.graph(BWC_SITE+'/CORE_Config/items',{method:'POST',body:JSON.stringify({fields:{Title:key,Key:key,Value:value}})});
    items.push({id:created.id,fields:{Key:key,Value:value}});
  }
}

// {computed, manual, value, override} — value is whichever of computed/override is active.
function computeNetPosition(rows){
  const withNums=rows.filter(r=>r.calc.earned!=null);
  const invoicedRows=rows.filter(r=>r.calc.invoiced!=null);
  const invoicedSum=invoicedRows.reduce((s,r)=>s+r.calc.invoiced,0);
  const earnedSum=withNums.reduce((s,r)=>s+(r.calc.earned||0),0);
  const computed=invoicedRows.length?invoicedSum-earnedSum:null;
  const manual=!!NETPOS_OVERRIDE;
  return {computed,manual,value:manual?NETPOS_OVERRIDE.value:computed,override:NETPOS_OVERRIDE};
}

// ── Monthly lock — a named slot for each of the two reviewers, not a generic
// "whoever's signed in" signature. A deliberate, human-triggered permanent
// record, one CORE_Config row per period (wip_lock_YYYY-MM) so it never
// competes with the 64k text-column ceiling other CORE_Config keys have hit
// before. Each reviewer's button only works when THEY are the one signed
// in — Ryan can't lock Joey's slot by clicking Joey's button while signed in
// as himself. The record "finalizes" — and only then produces a PDF — once
// both named slots are filled. Locking again after it's finalized starts a
// fresh two-slot cycle rather than silently amending a record already
// called final. ──
const REVIEWERS=[
  {key:'ryan', label:'Ryan', rx:/^ryan\b/i},
  {key:'joey', label:'Joey', rx:/^joey\b/i}
];
function identity(){
  const acct=SherpaAuth.getAccount();
  return {name:(acct&&(acct.name||acct.username))||'Unknown', email:(acct&&acct.username)||''};
}
function myReviewerKey(){
  const who=identity();
  const hit=REVIEWERS.find(r=>r.rx.test(who.name||''));
  return hit?hit.key:null;
}
// Re-run whenever AS_OF changes — the relevant period (and therefore the relevant
// CORE_Config row) moves with it. Cheap: cfgAll() only hits the network once per session.
async function loadLock(){
  try{ const row=await cfgGet('wip_lock_'+viewPeriod()); LOCK=row&&row.value?JSON.parse(row.value):null; }
  catch(e){ console.warn('[wip] lock load failed:',e); LOCK=null; }
}
async function addReview(reviewerKey,rows){
  const who=identity();
  const snapshot={
    by:who.name, byEmail:who.email, at:new Date().toISOString(), asOf:fmtInputDate(AS_OF),
    rows:rows.map(r=>({spId:r.p.spId,name:r.p.name,stage:r.p.stage,contract:r.p.contract,pct:r.calc.pct,earned:r.calc.earned,invoiced:r.calc.invoiced,gap:r.calc.gap,overridden:r.calc.overridden})),
    netPosition:computeNetPosition(rows)
  };
  const cur=(LOCK&&LOCK.period===viewPeriod())?LOCK:{period:viewPeriod(),periodLabel:viewPeriodLabel(),reviews:{},finalized:false,finalizedAt:null};
  cur.reviews[reviewerKey]=snapshot;
  cur.finalized=!!(cur.reviews.ryan&&cur.reviews.joey);
  cur.finalizedAt=cur.finalized?new Date().toISOString():null;
  await cfgSet('wip_lock_'+viewPeriod(),JSON.stringify(cur));
  LOCK=cur;
  return cur;
}
// Whichever slot was filled more recently — the state of the world at the
// moment the record actually became final, not whichever reviewer clicked first.
function finalSnapshot(lock){
  const a=lock.reviews.ryan, b=lock.reviews.joey;
  if(!a) return b; if(!b) return a;
  return a.at>b.at?a:b;
}

// ════════════════════════════════════ MATCH + COMPUTE
// Tokens (min 4 letters) back up the whole-string match: "Lee & Paulino" vs a
// BT job code like "LEEPAULINOL" already matches whole-string, but something
// like "Paulino & Lee" (surnames in the other order) wouldn't — a shared
// token still finds it, flagged as a weaker match so it stays checkable.
function tokens(s){ return String(s||'').toLowerCase().replace(/\(all\)/g,'').split(/[^a-z]+/).filter(t=>t.length>=4); }
function matchInvoices(){
  const matched=new Map();   // spId -> {total, weak}
  const unmatched=[];        // {job,invoiced}
  (INV.byJob||new Map()).forEach((invoiced,job)=>{
    const n=normName(job);
    let best=null,bestD=99;
    PROJECTS.forEach(p=>{
      [normName(p.clientName),normName(p.name)].forEach(cn=>{
        if(!cn) return;
        const d=(cn===n)?0:(cn.startsWith(n)||n.startsWith(cn))?1:lev(cn,n);
        if(d<bestD){ bestD=d; best=p; }
      });
    });
    let weak=false;
    if(!best||bestD>2){
      // A poor primary match (bestD>2) must not survive into the fallback — otherwise a
      // job with no real match anywhere silently glues itself to whichever project
      // happened to be *least* wrong, instead of correctly landing in "unmatched."
      // This is exactly how Jackson's invoiced total inflated to $2.15M: short, common
      // names are cheap to be the "closest" bad match for jobs that don't belong to them.
      best=null; bestD=99;
      // Fallback: any single name token (surname, usually) shared with the job code.
      let bestLen=0;
      PROJECTS.forEach(p=>{
        [...tokens(p.clientName),...tokens(p.name)].forEach(tok=>{
          if((n.includes(tok)||tok.includes(n))&&tok.length>bestLen){ bestLen=tok.length; best=p; weak=true; }
        });
      });
    }
    if(best){
      const cur=matched.get(best.spId)||{total:0,weak:false};
      matched.set(best.spId,{total:cur.total+invoiced,weak:cur.weak||weak});
    }else{ unmatched.push({job,invoiced}); }
  });
  return {matched,unmatched};
}
function weekAsOf(){ return Math.floor((asOfEnd().getTime()-EPOCH.getTime())/MS_WEEK); }
// A manual override always wins and sets earned = contract × override %, full stop —
// no signing/schedule split, just "mark it X%" the way Ryan and Joey would say it.
// Without one: CA-Signed jobs use the 20%-at-signing + schedule formula; every
// earlier stage has no formula to fall back on, so earned stays unset until
// someone sets it by hand — safer than guessing a number nobody signed off on.
function computeRow(p,matchedEntry,override){
  const invoiced = matchedEntry ? matchedEntry.total : null;
  const weakMatch = matchedEntry ? matchedEntry.weak : false;
  let pct=null;
  if(override){
    pct=override.pct;
  }else if(p.stage==='CA Signed'&&p.constr&&p.constr.durWeeks>0){
    const elapsed=weekAsOf()-p.constr.startWeek;
    pct=Math.max(0,Math.min(1,elapsed/p.constr.durWeeks));
  }
  let earned=null;
  if(p.contract){
    if(override){ earned=p.contract*override.pct; }
    else if(p.stage==='CA Signed'){ earned=p.contract*(SIGNING_SHARE+BUILD_SHARE*(pct==null?0:pct)); }
  }
  const gap=(earned!=null&&invoiced!=null)?invoiced-earned:null;
  return {pct,earned,invoiced,weakMatch,gap,overridden:!!override,override:override||null};
}

// ── Column sort — click a header to sort by it, click again to flip direction.
// Unclicked default stays the original "worst gap first" ordering. ──
const SORT_COLUMNS=[
  {key:'name',label:'Project',type:'str'},
  {key:'stage',label:'Stage',type:'str'},
  {key:'contract',label:'Contract Value',type:'num'},
  {key:'pct',label:'% Complete',type:'num'},
  {key:'earned',label:'Earned',type:'num'},
  {key:'invoiced',label:'Invoiced',type:'num'},
  {key:'gap',label:'Gap',type:'num'}
];
let SORT={key:null,dir:'desc'};   // key===null → default: |gap| descending
function sortKeyValue(r,key){
  switch(key){
    case 'name': return (r.p.name||'').toLowerCase();
    case 'stage': return (r.p.stage||'').toLowerCase();
    case 'contract': return r.p.contract||0;
    case 'pct': return r.calc.pct==null?-1:r.calc.pct;
    case 'earned': return r.calc.earned==null?-Infinity:r.calc.earned;
    case 'invoiced': return r.calc.invoiced==null?-Infinity:r.calc.invoiced;
    case 'gap': return r.calc.gap==null?-Infinity:r.calc.gap;
    default: return 0;
  }
}
function sortRows(rows){
  if(!SORT.key){ rows.sort((a,b)=>Math.abs(b.calc.gap||0)-Math.abs(a.calc.gap||0)); return; }
  const dir=SORT.dir==='asc'?1:-1;
  rows.sort((a,b)=>{
    const av=sortKeyValue(a,SORT.key), bv=sortKeyValue(b,SORT.key);
    if(typeof av==='string') return dir*av.localeCompare(bv);
    return dir*(av-bv);
  });
}
// Pure — builds the header + row markup without touching the DOM, so it can be
// reused both for the live page and for the offscreen node the PDF export renders from.
function tableHtml(rows,fromLock){
  let h='<tr>'+SORT_COLUMNS.map(c=>{

  }).join('')+'</tr>';
  sortRows(rows);
  rows.forEach(r=>{
    const c=r.calc;
    const gapCls=c.gap==null?'dim':(c.gap>=0?'pos':'neg');
    const gapTxt=c.gap==null?'—':fmt$(Math.abs(c.gap))+(c.gap>=0?' over':' under');
    const stageBadge='<span class="stage-badge'+(r.p.stage==='CA Signed'?' ca':'')+'">'+esc(r.p.stage||'—')+'</span>';
    const ovrBtn=(fromLock||!isToday())?'':' <button class="ovr-btn" data-ovr="'+esc(r.p.spId)+'">✎</button>';

      progress='<span class="dim">'+(r.p.stage==='CA Signed'?'no schedule':'not set')+'</span> <span class="flag bad" data-tip="'+(r.p.stage==='CA Signed'?'No construction schedule':'No formula pre-CA')+'" data-tip-d="'+esc(why)+'">!</span>'+ovrBtn;
    }else{
      const note=c.override&&c.override.note?'<span class="ovr-note" data-tip="Manual override" data-tip-d="'+esc(c.override.note)+' — set by '+esc(c.override.setBy||'')+'">'+esc(c.override.note.length>28?c.override.note.slice(0,28)+'…':c.override.note)+'</span>':'';
      progress='<span class="progress-mini"><span class="bar"><span style="width:'+Math.round(c.pct*100)+'%"></span></span>'+fmtPct(c.pct)+(c.overridden?' <span class="flag" data-tip="Manually set" data-tip-d="This is a manual override, not the formula.">manual</span>':'')+ovrBtn+note+'</span>';
    }

    const invTxt=c.invoiced==null?'<span class="dim">no BT match</span> <span class="flag bad" data-tip="Not matched to a BuilderTrend job" data-tip-d="No job in the latest BuilderTrend invoicing export matched this project by name. Check the export, or the project name in the Pipeline.">!</span>':fmt$(c.invoiced)+weakBadge;
    const contractTxt=r.p.contract?fmt$(r.p.contract):'<span class="dim">—</span> <span class="flag bad" data-tip="No contract value" data-tip-d="EstimatedProjectValue is empty for this project in the Pipeline — earned revenue can’t be calculated until it’s set.">!</span>';
    h+='<tr><td>'+esc(r.p.name)+'</td><td>'+stageBadge+'</td><td>'+contractTxt+'</td><td>'+progress+'</td><td>'+fmt$(c.earned)+'</td><td>'+invTxt+'</td><td class="'+gapCls+'">'+gapTxt+'</td></tr>';
  });
  return h;
}

async function boot(){

  document.getElementById('main').classList.add('hidden');
  try{
    await Promise.all([loadProjects(), loadInvoicing(), loadOverrides(), loadNetPosOverride(), loadLock()]);
    initAsOfControl();
    renderAll();
    document.getElementById('loadStatus').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
  }catch(e){
    console.error('[wip] boot failed:',e);
    document.getElementById('loadStatus').textContent='Failed to load: '+(e.message||e);
    toast('Load failed: '+(e.message||e),'err');
  }
}
async function main(){
  await SherpaAuth.init();
  if(!SherpaAuth.isSignedIn()){
    document.getElementById('authOverlay').style.display='flex';
    return;
  }
  document.getElementById('authOverlay').style.display='none';
  document.getElementById('topbar').style.display='flex';
  const acct=SherpaAuth.getAccount();
  if(acct) document.getElementById('acctChip').textContent=acct.username||acct.name||'';
  await boot();
}
main().catch(e=>{ console.error('[wip] init failed:',e); setAuthStatus('Init failed: '+(e.message||e),true); });
</script>
