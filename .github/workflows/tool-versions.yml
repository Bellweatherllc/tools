# Keeps tool-versions.json current: every page's version and last-modified time,
# read by bw-tool-index.html. Runs after each push to main and commits the file
# back only when it changed. The commit uses GITHUB_TOKEN, which never triggers
# another workflow run, so this can't loop.
name: Tool versions manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tool-versions.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tool-versions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: modified times come from git log

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build tool-versions.json
        run: node .github/scripts/build-tool-versions.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- tool-versions.json; then
            echo "tool-versions.json unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool-versions.json
          git commit -m "tool-versions.json: refresh"
          # Someone may have pushed while this ran: rebase onto it and retry.
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
