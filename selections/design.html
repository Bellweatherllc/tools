<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selections · Design</title>
<style>
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_DemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
/* CORE chrome: version badge (always #ef4444), tooltip, sign-in / job gate */
.ver{font:700 11px/1 var(--sans);letter-spacing:.08em;color:#ef4444;margin-left:6px;vertical-align:middle}
.jobsw{font:500 12px/1 var(--sans);margin-left:10px;color:inherit;opacity:.7;vertical-align:middle}
body:has(#previewBar:not([hidden])) .bwtb{display:none}   /* client preview: no internal chrome */
#tt{position:fixed;z-index:9999;pointer-events:none;background:#282828;color:#fff;font:400 12px/1.4 var(--sans);padding:6px 9px;border-radius:5px;max-width:280px;opacity:0;transition:opacity .1s}
#tt.show{opacity:1}
#tt .tt-d{opacity:.75;margin-top:2px}
#spGate{position:fixed;inset:0;z-index:9998;background:#F6F2EE;display:none;align-items:center;justify-content:center;text-align:center;padding:16px;font:400 15px/1.5 var(--sans);color:#282828;overflow:auto}
#spGate.show{display:flex}
#spGate h2{font:400 26px/1.2 var(--serif);margin:0 0 14px}
.spbtn,.spjob{font:600 15px/1 var(--sans);padding:12px 16px;border-radius:8px;border:1px solid #263860;background:#263860;color:#fff;cursor:pointer;margin-top:12px}
.spjobs{display:flex;flex-direction:column;align-items:stretch;min-width:min(320px,90vw)}
.spjob{background:#fff;color:#263860;margin-top:8px;text-align:left}
.spjob.last{border-width:2px}
.spjob span{font-weight:400;opacity:.6;margin-left:6px}
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --soft:#EEEFEC; --band:#E4E6E1; --sel:#F4F1ED; --sel-soft:#282828; --dec-bg:#8E91A0; --dec-ink:#FFFFFF; --ink:#1E2326; --muted:#646C74; --line:#DFE1DD; --line-strong:#C6CAC4;
  --accent:#2E4A55; --accent-ink:#FFFFFF; --accent-soft:#E1EAED;
  --ok:#3D6443; --ok-soft:#E3EDE2; --warn:#875C19; --warn-soft:#F3EADA; --over:#94392A; --over-soft:#F4E2DD;
  --scrim:rgba(20,24,26,.38);
  --serif:"Swear Text","Iowan Old Style",Georgia,serif;
  --sans:"TT Norms Pro","Helvetica Neue",Arial,sans-serif;
  --brand-ink:#282828;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141719; --surface:#1B1F22; --soft:#23282B; --band:#2A3034; --sel:#282828; --sel-soft:#F4F1ED; --dec-bg:#6E7282; --dec-ink:#FFFFFF; --ink:#E9EAE7; --muted:#9AA1A7; --line:#2F3539; --line-strong:#434A4F;
    --accent:#9CC0CC; --accent-ink:#11191C; --accent-soft:#213239;
    --ok:#93BA96; --ok-soft:#1F2E22; --warn:#D7AD66; --warn-soft:#33291A; --over:#E28B78; --over-soft:#3A221D;
    --scrim:rgba(0,0,0,.55);
    --brand-ink:#F6F2EE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141719; --surface:#1B1F22; --soft:#23282B; --band:#2A3034; --sel:#282828; --sel-soft:#F4F1ED; --dec-bg:#6E7282; --dec-ink:#FFFFFF; --ink:#E9EAE7; --muted:#9AA1A7; --line:#2F3539; --line-strong:#434A4F;
  --accent:#9CC0CC; --accent-ink:#11191C; --accent-soft:#213239;
  --ok:#93BA96; --ok-soft:#1F2E22; --warn:#D7AD66; --warn-soft:#33291A; --over:#E28B78; --over-soft:#3A221D;
  --scrim:rgba(0,0,0,.55);
  --brand-ink:#F6F2EE;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* Header */
.top{padding:40px 0 0}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.brand-row{display:flex;gap:24px;align-items:center}
.logo{height:84px;width:auto;max-width:200px;object-fit:contain;display:block}
@media (max-width:640px){.logo{height:56px}}
.studio{font-size:13px;color:var(--muted);margin:0}
.brandbar{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.wordmark{display:block;height:30px;width:auto;aspect-ratio:1342/188;color:var(--brand-ink);flex:none}
.brandbar .studio{letter-spacing:.14em;text-transform:uppercase;font-size:11px;padding-left:14px;border-left:1px solid var(--line-strong);line-height:1.2}
.brandbar .logo{height:44px}
.logo[hidden]{display:none}
@media (max-width:640px){.wordmark{height:24px}}
.seal{display:block;width:120px;height:auto;aspect-ratio:386/395;color:var(--brand-ink);flex:none}
.top .brand-row{gap:32px}
@media (max-width:640px){.top .brand-row{flex-wrap:wrap;gap:18px}}
.proj{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,56px);line-height:1.04;letter-spacing:-.012em;margin:6px 0 4px}
.sub{color:var(--muted);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:30px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;font-weight:500;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.preview-bar{background:var(--accent);color:var(--accent-ink);font-size:14px}
.preview-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.preview-bar button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:500}

/* Controls */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink)}
.btn.danger{color:var(--over)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--surface);padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:8px 10px;font-size:14px}
textarea.input{min-height:76px;resize:vertical}
.search{max-width:260px}
select.tier-sel{width:auto;padding:2px 6px;font-size:13px;min-height:0;height:26px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-size:14px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:22px 0 14px}
.toolbar .spacer{flex:1}

/* Summary */
.summary{display:flex;gap:36px;flex-wrap:wrap;padding:6px 0 22px;border-bottom:1px solid var(--line);margin-bottom:8px}
.summary div{min-width:120px}
.summary dt{font-size:13px;color:var(--muted)}
.summary dd{margin:2px 0 0;font-family:var(--serif);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.summary .over{color:var(--over)}
.summary .under{color:var(--ok)}
.note-line{font-size:14px;color:var(--muted);margin:0 0 18px}
.banner{background:var(--accent-soft);border-radius:8px;padding:12px 16px;font-size:14px;margin:0 0 18px}

/* Tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.sheet{width:100%;border-collapse:collapse;min-width:760px}
.sheet th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.sheet td{padding:5px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px;line-height:1.35}
.sheet .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet tr.row{cursor:pointer}
.sheet tr.row:hover td{background:var(--soft)}
.sheet tr.grp td{padding:9px 12px 7px;border-top:14px solid var(--bg);border-bottom:1px solid var(--line-strong);background:var(--band)}
.sheet tr.tot td{padding:16px 12px;border-top:2px solid var(--ink);border-bottom:0;vertical-align:middle}
.sheet tr.tot td.num{font-family:var(--serif);font-size:20px;font-weight:400}
.grp-title{font-family:var(--serif);font-size:19px;font-weight:400}
.grp-code{color:var(--muted);font-family:var(--sans);font-size:14px;margin-right:10px;font-variant-numeric:tabular-nums}
.grp-meta{float:right;font-size:13px;color:var(--muted);padding-top:5px}
.t-title{font-weight:500}
.t-sub{font-size:12px;color:var(--muted);line-height:1.25}
.muted{color:var(--muted)}
.overtext{color:var(--over)}
.oktext{color:var(--ok)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.selected{background:var(--sel-soft);color:var(--sel)}
.pill.considering{background:var(--warn-soft);color:var(--warn)}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.empty{padding:60px 0;text-align:center;color:var(--muted);max-width:520px;margin:0 auto}
.empty h3{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--ink);margin:0 0 8px}

/* Meetings list */
.mlist{display:grid;gap:12px;padding-bottom:40px}
.mcard{display:flex;justify-content:space-between;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;flex-wrap:wrap}
.mcard h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:0}
.mcard p{margin:2px 0 0;font-size:14px;color:var(--muted)}

/* Client view */
.room{padding:34px 0 8px;border-top:1px solid var(--line)}
.room:first-of-type{border-top:0}
.room h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 4px}
.room .later{font-size:14px;color:var(--muted);margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:22px;margin-top:16px}
.ccard{appearance:none;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.ccard .ph{aspect-ratio:1/1;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;overflow:hidden}
.ccard .ph img{width:100%;height:100%;object-fit:contain;padding:14px}
.ccard .k{font-size:13px;color:var(--muted);margin-top:10px}
.ccard .n{font-family:var(--serif);font-size:19px;line-height:1.25}
.ccard .d{font-size:13px;color:var(--muted)}
.mono{font-family:var(--serif);font-size:42px;color:var(--line-strong);font-style:italic}
.recap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:18px}
.recap h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0}
.rline{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rline:last-child{border-bottom:0}
.thumb{width:56px;height:56px;border-radius:6px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;padding:4px}
.imgs{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px}
.imgt{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.imgt .thumb{width:76px;height:76px}
.gal{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.gal .thumb{width:56px;height:56px;border:1px solid var(--line);cursor:pointer;padding:0;appearance:none}
.thumb .mono{font-size:22px}

/* Drawer */
dialog{border:0;padding:0;color:var(--ink);background:var(--surface)}
dialog::backdrop{background:var(--scrim)}
dialog.drawer{margin:0 0 0 auto;width:min(760px,100%);height:100%;max-height:100%;max-width:100%}
dialog.modal{width:min(760px,calc(100% - 24px));max-height:calc(100% - 48px);border-radius:12px}
.d-in{display:flex;flex-direction:column;height:100%;max-height:inherit}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:26px 28px 18px;border-bottom:1px solid var(--line)}
.d-head h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin:2px 0 0}
.d-kicker{font-size:13px;color:var(--muted)}
.d-body{overflow-y:auto;padding:8px 28px 40px;flex:1}
.d-sec{padding:22px 0;border-bottom:1px solid var(--line)}
.d-sec:last-child{border-bottom:0}
.d-sec h3{font-size:15px;font-weight:600;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.d-foot{padding:14px 28px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@media (max-width:640px){.d-head,.d-body,.d-foot{padding-left:18px;padding-right:18px}}
.calc{background:var(--soft);border-radius:8px;padding:14px;margin-top:4px}
.calc-out{font-size:14px;margin-top:6px}
.opts{display:grid;gap:12px}
.opt-row{display:grid;grid-template-columns:72px 1fr auto;gap:14px;border:1px solid var(--line);border-radius:8px;padding:12px;align-items:start}
.opt-row.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.opt-row{cursor:pointer}
.opt-row:hover{background:var(--soft)}
.opt-row.open{background:var(--surface)}
.opt-chev{color:var(--muted);margin-left:8px;font-size:12px}
.opt-detail{grid-column:1/-1;border-top:1px solid var(--line);margin-top:6px;padding-top:12px;cursor:default;font-size:14px}
.opt-detail .d-imgs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.opt-detail .d-imgs .thumb{width:120px;height:120px;background:#fff}
.opt-detail dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 18px;margin:0 0 12px}
.opt-detail dt{font-size:12px;color:var(--muted)}
.opt-detail dd{margin:2px 0 0}
.opt-detail h5{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 4px}
.opt-detail .pre{white-space:pre-line;line-height:1.5}
.opt-row .thumb{width:72px;height:72px}
.opt-row .nm{font-weight:600}
.opt-row .meta{font-size:13px;color:var(--muted)}
.opt-acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:2px}
.optform{border:1px solid var(--line-strong);border-radius:10px;padding:18px;margin-top:12px}
.optform h4{margin:0 0 4px;font-size:14px}
.optform .layer{font-size:13px;color:var(--muted);margin:0 0 12px}
.grid3o{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media (max-width:640px){.grid3o{grid-template-columns:1fr 1fr}.grid3o>:first-child{grid-column:1/-1}}
.odrop{display:grid;place-items:center;border:1.5px dashed var(--line-strong);border-radius:10px;min-height:84px;color:var(--muted);font-size:14px;cursor:pointer;margin:6px 0 10px;text-align:center;padding:10px}
.odrop u{color:var(--ink)}
.odrop.over{border-color:var(--ink);background:var(--soft)}
.odrop.small{min-height:0;display:inline-grid;padding:6px 12px;font-size:13px;margin:0}
.ofiles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ofile{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 4px 4px 10px;font-size:13px;max-width:100%}
.ofile a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.linkrow{display:flex;gap:6px}.linkrow .input{flex:1;min-width:0}
.team-tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:1px}
.odet{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.pill.decided{background:var(--dec-bg);color:var(--dec-ink)}
.finbox{border:1px solid var(--dec-bg);border-left:4px solid var(--dec-bg);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;background:var(--surface)}
.prep-head{margin:4px 0 18px}
.prep-row{display:grid;grid-template-columns:220px 1fr;gap:18px;border-top:1px solid var(--line-strong);padding:16px 0}
.prep-t{font-family:var(--serif);font-size:20px;margin:2px 0 6px}
.prep-k{font-size:14px;color:var(--muted)}.prep-k b{color:var(--ink);font-weight:600}
.prep-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;align-items:start}
.prep-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.prep-img{height:130px;display:grid;place-items:center;background:#fff;border-radius:6px;overflow:hidden}
.prep-img img{width:100%;height:130px;object-fit:contain;padding:6px;display:block}
.prep-n{font-weight:600;line-height:1.3}
.prep-p{font-size:13px;color:var(--muted)}.prep-p b{color:var(--ink)}
.prep-add{display:flex;flex-direction:column;gap:6px;align-items:flex-start;justify-content:center;border:1.5px dashed var(--line-strong);border-radius:10px;padding:14px;min-height:120px}
.prep-form .input{padding:6px 8px;font-size:14px}
@media (max-width:720px){.prep-row{grid-template-columns:1fr}}
.m-quick{max-width:340px;margin-top:2vh}
.m-opt .m-img{height:36vh;max-height:none;aspect-ratio:auto}
.m-opt .m-img img{width:100%;height:36vh;object-fit:contain;display:block}
.m-else{max-width:560px;margin-top:2vh}
.m-sumh{font-family:var(--serif);font-weight:400;font-size:clamp(18px,1.6vw,26px);margin:3vh 0 1vh}
.sheet.trk td{padding:2px 6px}
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:5px 6px;font:inherit;color:var(--ink);min-width:0}
.cell.num{text-align:right;font-variant-numeric:tabular-nums}
.cell.muted-cell{color:var(--muted)}
select.cell{appearance:none;-webkit-appearance:none;cursor:pointer}
.trow:hover .cell:not(:disabled){border-color:var(--line)}
.cell:focus{outline:none;border-color:var(--ink);background:var(--surface);color:var(--ink)}
.cell:disabled{color:var(--ink);opacity:1;cursor:default}

/* Project setup */
.setup-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 22px}

/* Schedules */

.sched h3{break-after:avoid;page-break-after:avoid}
.sched .scroll{break-before:avoid}

.sched-t td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.sched-t .thumb{width:40px;height:40px}

.sched-page>thead{display:none}

@media print{
  :root{--bg:#fff;--surface:#fff}
  body{background:#fff}
  .top,#toolbar,.no-print,#previewBar,#toast{display:none !important}

}

.m-recap{max-width:1100px}
.m-recap .rline{grid-template-columns:72px 1fr auto;font-size:clamp(15px,1.1vw,20px)}
.m-recap .thumb{width:72px;height:72px}
.m-totals{display:flex;gap:4vw;flex-wrap:wrap;margin:3vh 0}
.m-totals dt{font-size:clamp(13px,1vw,17px);color:var(--muted)}
.m-totals dd{margin:0;font-family:var(--serif);font-size:clamp(26px,2.4vw,44px);font-variant-numeric:tabular-nums}
.m-confirm{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:3vh;padding-top:3vh;border-top:1px solid var(--line)}
.m-confirm .input{font-size:clamp(18px,1.4vw,26px);width:180px;letter-spacing:.1em;text-transform:uppercase}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:8px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s ease;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}

/* ── CORE Tool Topbar (Bellweather Style Guide § Components) ── */
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-MediumItalic.woff2') format('woff2');font-weight:500;font-style:italic;font-display:swap;}
.bwtb{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:0 32px;min-height:56px;background:#263860;border-bottom:1px solid rgba(255,255,255,.14);color:#fff;font-family:'TT Norms Pro',-apple-system,BlinkMacSystemFont,sans-serif;position:relative;z-index:30}
.bwtb-left{display:flex;align-items:center;gap:16px;min-width:0}
.bwtb-logo{height:28px;width:auto;flex-shrink:0;display:block}
.bwtb-div{width:1px;height:28px;background:rgba(255,255,255,.18);flex-shrink:0}
.bwtb-title{font:500 18px/1.1 'Swear Text',Georgia,serif;color:#fff;white-space:nowrap}
.bwtb-title em{font-style:italic;opacity:.8}
.bwtb-sub{font:500 10px/1.2 'TT Norms Pro',sans-serif;color:#B7A9A3;text-transform:uppercase;letter-spacing:2px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.bwtb-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.bwtb-ver{font:700 10px/1 'TT Norms Pro',sans-serif;color:#ef4444;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:2px 7px;letter-spacing:.5px}
.bwtb-ver:empty{display:none}
.bwtb-dot{width:8px;height:8px;border-radius:50%;background:#B7A9A3;flex-shrink:0}
.bwtb-dot.on{background:#2d8a5e}
.bwtb-conn{font:600 11px/1 'TT Norms Pro',sans-serif;letter-spacing:.5px;color:rgba(255,255,255,.55);white-space:nowrap}
.bwtb-link{font:600 11px/1 'TT Norms Pro',sans-serif;letter-spacing:.5px;color:rgba(255,255,255,.75);text-decoration:none;white-space:nowrap}
.bwtb-link:hover{color:#fff}
.bwtb-left{overflow:hidden}
@media (max-width:640px){.bwtb{padding:0 16px;gap:12px}.bwtb-div,.bwtb-conn,.bwtb-app{display:none}.bwtb-logo{height:24px}.bwtb-left{gap:10px}.bwtb-title{font-size:17px}.bwtb:has(select) .bwtb-sub{display:none}}
</style>

/* tooltip engine: data-tip (+ optional data-tip-d detail line); hover devices only */
(()=>{const TT=document.getElementById('tt'); if(!TT||!matchMedia('(hover: hover)').matches) return;
  const tipOf=t=>{const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); const d=t.getAttribute('data-tip-d'); return e(t.getAttribute('data-tip'))+(d?'<div class="tt-d">'+e(d)+'</div>':'');};
  const move=e=>{const r=TT.getBoundingClientRect(); let x=e.clientX+12, y=e.clientY+14; if(x+r.width>innerWidth-8) x=e.clientX-r.width-12; if(y+r.height>innerHeight-8) y=e.clientY-r.height-14; TT.style.left=x+'px'; TT.style.top=y+'px';};
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t) return; TT.innerHTML=tipOf(t); TT.classList.add('show'); move(e);});
  document.addEventListener('mousemove',e=>{ if(TT.classList.contains('show')) move(e); });
  document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(t&&!(t.contains&&t.contains(e.relatedTarget))) TT.classList.remove('show');});
})();

/* ── SharePoint adapter: read + write ──────────────────────────────────────
   Stands in for the artifact database the Design screen was written against.
   items      ⇄ CORE_Selections + CORE_SelectionChoices + CORE_SelectionAllowances (one job)
   everything else (settings, meetings, boards, internal, schedules) ⇄ CORE_SelectionDesignDocs
   library + choicelib are shared across jobs (Job = _shared).
   Rules: every query filters on the indexed Job column; BT fields a person changes are
   listed in CoreEditedFields so Import never overwrites them; selections and choices are
   never hard-deleted (DesignStatus = removed / ChoiceStatus = Removed).                  */
(()=>{
  const GRAPH='https://graph.microsoft.com/v1.0';
  const LISTS=GRAPH+'/sites/bellweather.sharepoint.com:/sites/BWCore:/lists';
  const L={S:'CORE_Selections',C:'CORE_SelectionChoices',A:'CORE_SelectionAllowances',D:'CORE_SelectionDesignDocs',J:'CORE_SelectionJobs'};
  const SEL={
    S:'Title,Job,Category,Location,SelectionTotalCents,AllowanceLookupId,ImportTitle,DesignKey,DesignStatus,DesignData,CoreEditedFields',
    C:'Title,Job,SelectionLookupId,Description,PriceCents,ChoiceStatus,ImportTitle,DesignKey,DesignData,CoreEditedFields',
    A:'Title,Job,AllowanceCents,ImportTitle,CoreEditedFields',
    D:'Title,Job,Collection,DocId,Data'};
  const SHARED=new Set(['library','choicelib']);
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function g(url,opts){ for(let a=0;;a++){ try{ return await SherpaAuth.graph(url,opts); }catch(e){ if([429,503,504].includes(e.status)&&a<5){ await sleep(1500*2**a); continue; } if(e&&!e.code) e.code=e.status===403?'permission_denied':e.status===404?'not_found':'unavailable'; throw e; } } }
  async function gAll(url){ let out=[], next=url; while(next){ const j=await g(next); out=out.concat(j.value||[]); next=j['@odata.nextLink']||null; } return out; }
  const enc=v=>encodeURIComponent(String(v).replace(/'/g,"''"));
  const byJob=(list,job,sel)=>gAll(`${LISTS}/${list}/items?$filter=fields/Job eq '${enc(job)}'&$expand=fields($select=${sel})&$top=999`);
  const post=(list,fields)=>g(`${LISTS}/${list}/items`,{method:'POST',body:JSON.stringify({fields})});
  const patch=(list,id,fields)=>g(`${LISTS}/${list}/items/${id}/fields`,{method:'PATCH',body:JSON.stringify(fields)});
  const del=(list,id)=>g(`${LISTS}/${list}/items/${id}`,{method:'DELETE',raw:true});
  const parseJ=s=>{ try{ const v=JSON.parse(s||'{}'); return v&&typeof v==='object'?v:{}; }catch(e){ return {}; } };
  const clone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
  const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
  function merge(t,p){ const o=isObj(t)?clone(t):{}; for(const [k,v] of Object.entries(p||{})){ if(v===null) delete o[k]; else if(isObj(v)&&isObj(o[k])) o[k]=merge(o[k],v); else o[k]=clone(v); } return o; }
  const rid=()=>'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const edSet=s=>new Set(String(s||'').split(',').map(x=>x.trim()).filter(Boolean));

  // BT category label ⇄ the Design screen's division number
  const BT_CAT={1:'01 - Exterior Selections',2:'02 - Exterior Windows & Doors',3:'03 - Interior Doors & Carpentry',4:'04 - Appliances',5:'05 - Finishes & Millwork',6:'06 - Flooring & Tile',7:'07 - Plumbing',8:'08 - Electrical',9:'09 - HVAC',10:'10 - Hardware',11:'11 - Bathroom Accessories',12:'12 - Specialty: Glass & Mirror',14:'14 - Specialty: Misc.'};
  const catNum=l=>{ const m=String(l||'').match(/^\s*(\d+)/); return m?Number(m[1]):null; };
  const catLabel=n=>{ n=Number(n); if(!n) return ''; return BT_CAT[n]||(String(n).padStart(2,'0')+' - '+((typeof DIVS!=='undefined'&&DIVS[n-1])||'Other')); };

  let JOB=null, ME='';
  const items=new Map();                 // design id → item (what the screen sees)
  const meta=new Map();                  // design id → SharePoint bookkeeping
  const docs=new Map();                  // collection → Map(docId → data)
  const docSp=new Map();                 // "collection/docId" → SharePoint item id
  const ITEM_KEYS=new Set(['id','Title','Location','Category','AllowanceCents','Choices','DesignStatus']);
  const OPT_KEYS=new Set(['id','Title','PriceCents','desc']);
  const stamp=()=>({CoreEditedAt:new Date().toISOString(),CoreEditedBy:ME});

  function buildItem(s,chs,alw){
    const f=s.fields, dd=parseJ(f.DesignData), id=f.DesignKey||('sp-'+s.id);
    const live=chs.filter(c=>c.fields.ChoiceStatus!=='Removed').map(c=>({c,cd:parseJ(c.fields.DesignData)}))
      .sort((a,b)=>((a.cd.ord??1e9)-(b.cd.ord??1e9))||(Number(a.c.id)-Number(b.c.id)));
    const cm=new Map(), opts=[];
    for(const {c,cd} of live){ const cf=c.fields, oid=cf.DesignKey||('sp-'+c.id); delete cd.ord;
      opts.push({...cd,id:oid,Title:cf.Title||'',PriceCents:cf.PriceCents??null,desc:cf.Description||''});
      cm.set(oid,{spId:String(c.id),canon:{Title:cf.Title||'',PriceCents:cf.PriceCents??null,Description:cf.Description||'',ChoiceStatus:cf.ChoiceStatus||''},edited:edSet(cf.CoreEditedFields),importTitle:cf.ImportTitle||'',dd:JSON.stringify(cd)}); }
    const sel=live.filter(x=>x.c.fields.ChoiceStatus==='Selected');
    const item={allowanceType:'amount',...dd,id,Title:f.Title||'',Location:f.Location||'',Category:catNum(f.Category),
      AllowanceCents:alw?(alw.fields.AllowanceCents??0):0,Choices:opts,DesignStatus:f.DesignStatus||(sel.length?'selected':'open')};
    if(!('approval' in dd)&&sel.length) item.approval={optionId:sel[0].c.fields.DesignKey||('sp-'+sel[0].c.id)};
    meta.set(id,{spId:String(s.id),allowId:f.AllowanceLookupId!=null?String(f.AllowanceLookupId):null,allowCents:alw?(alw.fields.AllowanceCents??0):null,
      allowEdited:alw?edSet(alw.fields.CoreEditedFields):new Set(),canon:{Title:f.Title||'',Location:f.Location||'',Category:f.Category||''},
      edited:edSet(f.CoreEditedFields),importTitle:f.ImportTitle||'',designStatus:f.DesignStatus||'',designData:f.DesignData||'',
      total:f.SelectionTotalCents??null,approvalKey:JSON.stringify([item.approval&&item.approval.optionId||null,['selected','decided'].includes(item.DesignStatus)]),choices:cm});
    return item;
  }

  async function load(){
    const [S,C,A,D,DS]=await Promise.all([byJob(L.S,JOB,SEL.S),byJob(L.C,JOB,SEL.C),byJob(L.A,JOB,SEL.A),byJob(L.D,JOB,SEL.D),byJob(L.D,'_shared',SEL.D)]);
    const alw=new Map(A.map(a=>[String(a.id),a])), chBy=new Map();
    for(const c of C){ const k=String(c.fields.SelectionLookupId); if(!chBy.has(k)) chBy.set(k,[]); chBy.get(k).push(c); }
    for(const s of S){ if(s.fields.DesignStatus==='removed') continue; const it=buildItem(s,chBy.get(String(s.id))||[],s.fields.AllowanceLookupId!=null?alw.get(String(s.fields.AllowanceLookupId)):null); items.set(it.id,it); }
    for(const d of [...D,...DS]){ const f=d.fields; if(!f.Collection||!f.DocId) continue; if(!docs.has(f.Collection)) docs.set(f.Collection,new Map()); docs.get(f.Collection).set(f.DocId,parseJ(f.Data)); docSp.set(f.Collection+'/'+f.DocId,String(d.id)); }
    if(!docs.has('portal')) docs.set('portal',new Map());
    if(!docs.get('portal').has('settings')) docs.get('portal').set('settings',{projectName:JOB});   // shown until someone saves settings
    // selection tier dates come from the Pipeline (CORE_Projects → GanttData.tiers) when it has them
    try{ const t=await pipelineTiers(JOB); if(t&&Object.keys(t.dates).length){ const st=docs.get('portal').get('settings'); st.tierDates={...(st.tierDates||{}),...t.dates}; window.spTierSource=t; } }
    catch(e){ console.warn('Selections: could not read Pipeline tier dates',e); }
  }
  // Pipeline week w → that week's Friday. Week 0 is the week of Monday 2025-01-06 (Pipeline: CAL_ABS_EARLIEST 2025-01-01, weeks start Monday).
  const tierFriday=w=>new Date(Date.UTC(2025,0,10)+Math.round(w)*7*864e5).toISOString().slice(0,10);
  async function pipelineTiers(job){
    const rows=await gAll(`${LISTS}/CORE_Projects/items?$expand=fields($select=JobCode)&$top=999`);
    const hit=rows.find(r=>String(r.fields.JobCode||'').trim().toUpperCase()===String(job).trim().toUpperCase());
    if(!hit) return null;
    const it=await g(`${LISTS}/CORE_Projects/items/${hit.id}?$expand=fields($select=Title,JobCode,GanttData)`);
    const gd=parseJ(it.fields&&it.fields.GanttData), dates={};
    for(const t of (Array.isArray(gd.tiers)?gd.tiers:[])){ const n=Number(String(t&&t.name||'').replace(/\D/g,'')); if(n>=1&&n<=3&&Number.isFinite(t.week)) dates[n]=tierFriday(t.week); }
    return {dates,project:(it.fields&&it.fields.Title)||job};
  }

  /* writing one selection: canon fields, design data, allowance, choices */
  async function persistItem(id,it){
    let m=meta.get(id);
    if(!it){ if(!m) return; m.edited.add('DesignStatus'); await patch(L.S,m.spId,{DesignStatus:'removed',CoreEditedFields:[...m.edited].join(','),...stamp()}); meta.delete(id); return; }
    const canon={Title:String(it.Title||'').slice(0,255),Location:String(it.Location||'').slice(0,255),Category:catLabel(it.Category)};
    const dd={}; for(const [k,v] of Object.entries(it)) if(!ITEM_KEYS.has(k)) dd[k]=v;
    const dj=JSON.stringify(dd), ds=it.DesignStatus||'open';
    if(!m){
      const r=await post(L.S,{Title:canon.Title||'Untitled',Job:JOB,Location:canon.Location||null,Category:canon.Category||null,DesignKey:id,DesignStatus:ds,DesignData:dj,
        CoreEditedFields:'Title,Location,Category',...stamp()});
      m={spId:String(r.id),allowId:null,allowCents:null,allowEdited:new Set(),canon,edited:new Set(['Title','Location','Category']),importTitle:'',designStatus:ds,designData:dj,total:null,approvalKey:'[null,false]',choices:new Map()};
      meta.set(id,m);
    }else{
      const f={}, ch=[];
      for(const k of ['Title','Location','Category']) if((canon[k]||'')!==(m.canon[k]||'')){ f[k]=canon[k]||null; ch.push(k); }
      if(ch.includes('Title')&&!m.importTitle&&m.canon.Title){ f.ImportTitle=m.canon.Title; m.importTitle=m.canon.Title; }   // keeps Import matching after a rename
      if(ds!==m.designStatus) f.DesignStatus=ds;
      if(dj!==m.designData) f.DesignData=dj;
      if(ch.length){ ch.forEach(k=>m.edited.add(k)); Object.assign(f,{CoreEditedFields:[...m.edited].join(','),...stamp()}); }
      if(Object.keys(f).length) await patch(L.S,m.spId,f);
      m.canon=canon; m.designStatus=ds; m.designData=dj;
    }
    // allowance (its own list in BT)
    const ac=Math.round(Number(it.AllowanceCents)||0);
    if(m.allowId){ if(ac!==(m.allowCents??0)){ m.allowEdited.add('AllowanceCents'); await patch(L.A,m.allowId,{AllowanceCents:ac,CoreEditedFields:[...m.allowEdited].join(','),...stamp()}); m.allowCents=ac; } }
    else if(ac){ const r=await post(L.A,{Title:canon.Title||'Allowance',Job:JOB,AllowanceCents:ac,CoreEditedFields:'AllowanceCents',...stamp()}); m.allowId=String(r.id); m.allowCents=ac; m.allowEdited=new Set(['AllowanceCents']); await patch(L.S,m.spId,{AllowanceLookupId:m.allowId}); }
    // choices: approval decides Selected; untouched choices keep their BT status
    const approved=it.approval&&it.approval.optionId||null, decided=['selected','decided'].includes(ds);
    const akey=JSON.stringify([approved,decided]), approvalChanged=akey!==m.approvalKey;
    const seen=new Set(); let total=0, choicesChanged=false;
    for(const [n,o] of (it.Choices||[]).entries()){
      seen.add(o.id);
      const cm=m.choices.get(o.id);
      let status=cm?cm.canon.ChoiceStatus:'Considering';
      if(approvalChanged||!cm) status=(decided&&o.id===approved)?'Selected':(cm&&cm.canon.ChoiceStatus==='Selected'?'Considering':(cm?cm.canon.ChoiceStatus||'Considering':'Considering'));
      const canonC={Title:String(o.Title||'').slice(0,255),PriceCents:o.PriceCents==null||o.PriceCents===''?null:Math.round(Number(o.PriceCents)),Description:String(o.desc||''),ChoiceStatus:status};
      const cd={}; for(const [k,v] of Object.entries(o)) if(!OPT_KEYS.has(k)&&!k.startsWith('_')) cd[k]=v; cd.ord=n;
      const cdj=JSON.stringify(cd);
      if(!cm){
        const r=await post(L.C,{...canonC,Job:JOB,SelectionLookupId:m.spId,DesignKey:o.id,DesignData:cdj,CoreEditedFields:'Title,PriceCents,Description,ChoiceStatus',...stamp()});
        m.choices.set(o.id,{spId:String(r.id),canon:canonC,edited:new Set(['Title','PriceCents','Description','ChoiceStatus']),importTitle:'',dd:cdj}); choicesChanged=true;
      }else{
        const f={}, ch=[];
        for(const k of Object.keys(canonC)) if((canonC[k]??'')!==(cm.canon[k]??'')){ f[k]=canonC[k]; ch.push(k); }
        if(ch.includes('Title')&&!cm.importTitle&&cm.canon.Title){ f.ImportTitle=cm.canon.Title; cm.importTitle=cm.canon.Title; }
        if(cdj!==cm.dd) f.DesignData=cdj;
        if(ch.length){ ch.forEach(k=>cm.edited.add(k)); Object.assign(f,{CoreEditedFields:[...cm.edited].join(','),...stamp()}); choicesChanged=true; }
        if(Object.keys(f).length) await patch(L.C,cm.spId,f);
        cm.canon=canonC; cm.dd=cdj;
      }
      if(status==='Selected') total+=canonC.PriceCents||0;
    }
    for(const [oid,cm] of m.choices) if(!seen.has(oid)&&cm.canon.ChoiceStatus!=='Removed'){
      cm.edited.add('ChoiceStatus'); await patch(L.C,cm.spId,{ChoiceStatus:'Removed',CoreEditedFields:[...cm.edited].join(','),...stamp()});
      if(cm.canon.ChoiceStatus==='Selected') choicesChanged=true; cm.canon.ChoiceStatus='Removed';
    }
    m.approvalKey=akey;
    // Selection Total follows what's selected, so LC / Warehouse stay right
    if((choicesChanged||approvalChanged)&&total!==(m.total??0)){ m.edited.add('SelectionTotalCents'); await patch(L.S,m.spId,{SelectionTotalCents:total,CoreEditedFields:[...m.edited].join(','),...stamp()}); m.total=total; }
  }
  async function persistDoc(c,id,data){
    const key=c+'/'+id, sp=docSp.get(key);
    if(key==='portal/settings'&&data&&window.spTierSource){ data=clone(data); for(const n of Object.keys(window.spTierSource.dates)) if(data.tierDates) delete data.tierDates[n]; }   // Pipeline owns these
    if(data===undefined){ if(sp){ await del(L.D,sp); docSp.delete(key); } return; }
    const json=JSON.stringify(data);
    if(sp) await patch(L.D,sp,{Data:json});
    else{ const r=await post(L.D,{Title:key.slice(0,255),Job:SHARED.has(c)?'_shared':JOB,Collection:c,DocId:id,Data:json}); docSp.set(key,String(r.id)); }
  }

  /* the database API the Design screen calls */
  const subs={coll:new Map(),doc:new Map()};
  const getDoc=(c,id)=>c==='items'?items.get(id):(docs.get(c)||new Map()).get(id);
  const setLocal=(c,id,v)=>{ if(c==='items'){ v===undefined?items.delete(id):items.set(id,{...v,id}); return; } if(!docs.has(c)) docs.set(c,new Map()); v===undefined?docs.get(c).delete(id):docs.get(c).set(id,v); };
  const docSnap=(c,id)=>{ const d=getDoc(c,id); return {id,exists:d!==undefined,data:()=>{ const x=clone(d); if(x) delete x.id; return x; }}; };
  const collSnap=c=>{ const rows=c==='items'?[...items.values()].map(v=>[v.id,v]):[...(docs.get(c)||new Map()).entries()];
    const ds=rows.map(([id,v])=>({id,exists:true,data:()=>{ const x=clone(v); delete x.id; return x; }})); return {docs:ds,size:ds.length,empty:!ds.length}; };
  function emit(c,id){ (subs.coll.get(c)||new Set()).forEach(f=>f(collSnap(c))); (subs.doc.get(c+'/'+id)||new Set()).forEach(f=>f(docSnap(c,id))); }
  const chains=new Map();
  function write(c,id,op,data){
    const key=c+'/'+id;
    const run=async()=>{
      await ready;
      const before=clone(getDoc(c,id));
      let next; if(op==='set') next=clone(data); else if(op==='update'){ if(before===undefined) throw Object.assign(new Error('Not found'),{code:'not_found'}); next=merge(before,data); } else next=undefined;
      if(c==='items'&&next) next.id=id;
      setLocal(c,id,next); emit(c,id);
      try{ c==='items'?await persistItem(id,next):await persistDoc(c,id,next); }
      catch(e){ setLocal(c,id,before); emit(c,id); console.error('Selections: save failed',key,e); throw e; }
    };
    const p=(chains.get(key)||Promise.resolve()).then(run); chains.set(key,p.catch(()=>{})); return p;
  }
  function ref(c,id){ id=id||rid();
    return {id,path:c+'/'+id,
      onSnapshot(cb,err){ const k=c+'/'+id; if(!subs.doc.has(k)) subs.doc.set(k,new Set()); subs.doc.get(k).add(cb); ready.then(()=>cb(docSnap(c,id))).catch(e=>err&&err(e)); return ()=>subs.doc.get(k).delete(cb); },
      get:async()=>{ await ready; return docSnap(c,id); },
      set:data=>write(c,id,'set',data), update:data=>write(c,id,'update',data), delete:()=>write(c,id,'delete')}; }
  const db={
    doc:path=>{ const [c,...rest]=String(path).split('/'); return ref(c,rest.join('/')); },
    collection:c=>{ const col={ doc:id=>ref(c,id), limit:()=>col, add:async data=>{ const r=ref(c); await r.set(data); return r; },
      onSnapshot(cb,err){ if(!subs.coll.has(c)) subs.coll.set(c,new Set()); subs.coll.get(c).add(cb); ready.then(()=>cb(collSnap(c))).catch(e=>err&&err(e)); return ()=>subs.coll.get(c).delete(cb); } }; return col; } };

  /* sign-in and job choice, before anything loads */
  const gate=document.getElementById('spGate');
  function showGate(html){ gate.innerHTML=html; gate.classList.add('show'); }
  async function pickJob(){
    const q=new URLSearchParams(location.search).get('job'); if(q) return q;
    let rows=[]; try{ rows=await gAll(`${LISTS}/${L.J}/items?$expand=fields($select=Title,Job,Archived)&$top=999`); }catch(e){}
    const jobs=rows.map(x=>({name:x.fields.Job||x.fields.Title,archived:!!x.fields.Archived})).filter(j=>j.name).sort((a,b)=>a.archived-b.archived||a.name.localeCompare(b.name));
    let last=''; try{ last=localStorage.getItem('dz-job')||''; }catch(e){}
    return new Promise(res=>{
      showGate(`<div class="spjobs"><h2>Which job?</h2>${jobs.length?jobs.map(j=>`<button class="spjob${j.name===last?' last':''}" data-job="${j.name.replace(/"/g,'&quot;')}">${j.name.replace(/</g,'&lt;')}${j.archived?' <span>archived</span>':''}</button>`).join(''):'<p>No jobs yet. Import one on the setup page.</p>'}</div>`);
      gate.onclick=e=>{ const b=e.target.closest('[data-job]'); if(!b) return; const j=b.dataset.job; try{ localStorage.setItem('dz-job',j); }catch(_){}
        history.replaceState(null,'','?job='+encodeURIComponent(j)+location.hash); gate.classList.remove('show'); res(j); };
    });
  }
  const ready=(async()=>{
    await SherpaAuth.init();
    if(!SherpaAuth.isSignedIn()){
      showGate('<div><p>Sign in with your Bellweather Microsoft account to open a job.</p><button class="spbtn" id="spSignIn">Sign in</button><p id="spGateMsg"></p></div>');
      document.getElementById('spSignIn').onclick=()=>SherpaAuth.signIn().catch(e=>{ document.getElementById('spGateMsg').textContent='Sign-in failed: '+e.message; });
      await new Promise(()=>{});
    }
    const a=SherpaAuth.getAccount(); ME=(a&&(a.name||a.username))||'';
    JOB=await pickJob();
    bwSub('BWCore › '+JOB);
    await load();
    bwConn(true);
  })();
  ready.catch(e=>{ bwConn(false); showGate(`<div><p>Couldn’t open this job: ${String(e&&e.message||e).replace(/</g,'&lt;')}</p><p><a href="?">Choose another job</a></p></div>`); });

  function saveFile({filename,data}){ const url=URL.createObjectURL(new Blob([data])); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); return Promise.resolve({status:'saved'}); }
  window.claude={ use: async name=>{
    await ready;
    if(name==='db') return db;
    if(name==='user'){ const acct=SherpaAuth.getAccount(), me=acct&&(acct.username||acct.homeAccountId);
      return { id:async()=>me, profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{name:i===me?(acct.name||i):i}])), can:async()=>true, canEdit:async()=>true }; }
    if(name==='downloads') return {save:saveFile};
    return null;   // assets: uploads aren't wired to SharePoint yet, so upload controls stay hidden
  }};
})();
</script>
<script>
(() => {
"use strict";
const DIVS = ["Exterior Selections","Exterior Windows & Doors","Interior Doors & Carpentry","Appliances","Finishes & Millwork","Flooring & Tile","Plumbing","Electrical","HVAC","Hardware","Bathroom Accessories","Glass & Mirror","Specialty: Custom Closet fit-outs","Specialty: Misc","Paint/Stain/Wallcoverings","TBD selections"];
const divNum = n => { n = Number(n); return n >= 1 && n <= 16 ? n : 16; };
const divName = n => DIVS[divNum(n) - 1];
const divCode = n => String(divNum(n)).padStart(2, "0");
const ALLOW_TYPES = [["amount","Dollar allowance"],["owner","Owner-supplied"],["trade","Trade partner supplies"],["bmaterials","Building materials budget"],["included","Included"],["other","Other (describe)"]];
const ALLOW_LABEL = { included:"Included", bmaterials:"Building materials budget", owner:"Owner-supplied", trade:"Trade partner supplies" };
const ALLOW_CHIPS = ["amount", "owner", "trade", "bmaterials"];
const STATUS_LABEL = { selected:"Selected", decided:"Decided", considering:"Considering", open:"Choices ready", nochoice:"Needs choices" };

const S = {
  db:null, user:null, assets:null, myId:null, team:false, loaded:false,
  items:[], meetings:[], library:[], settings:{}, internal:{},
  view:null, group:"category", sheetGroup:"category", filter:"all", search:"", preview:false,
  drawerId:null, drawerDirty:false, drawerPending:false, optDraft:null, clientDrawer:false,
  meetingId:null, meetingIdx:0, names:{}, setup:{ rooms:[] }, forceRender:false, schedDiv:null, schedIssues:{}, schedPending:true, mbRoom:null, boards:{}, mbDrag:null, mbSel:null, mbLabels:true, mRoomView:false, mPreview:null
};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => (v === "" || v == null || isNaN(Number(v))) ? null : Number(v);
/* Money is stored and computed in integer cents. money() takes cents; dollars() / toCents() convert at input and display boundaries. */
const money = n => { if (n == null || n === "" || isNaN(Number(n))) return "—"; const c = Math.round(Number(n)); return (c < 0 ? "−" : "") + "$" + (Math.abs(c) / 100).toLocaleString("en-US", { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 }); };
const dollars = c => (c === "" || c == null || isNaN(Number(c))) ? null : Number(c) / 100;
const toCents = d => (d === "" || d == null || isNaN(Number(d))) ? null : Math.round(Number(d) * 100);
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmtDate = s => { if (!s) return ""; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s); return isNaN(d) ? "" : d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }); };
const nowIso = () => new Date().toISOString();
const rid = p => p + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const safeUrl = u => { u = String(u || "").trim(); return /^https?:\/\//i.test(u) || u.startsWith("/_blob/") ? u : ""; };
const initials = s => String(s || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase() || "?";

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3600); }
function errText(e) {
  const c = e && e.code;
  if (c === "invalid_argument") return "You don’t have permission to change this project.";
  if (c === "quota_exceeded") return "This project has reached its storage limit. Remove unused items and try again.";
  if (c === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
  if (c === "revoked") return "Access to this project changed. Reload the page.";
  return "That change didn’t save. Check your connection and try again.";
}
const chains = {};
function write(path, fn) {
  const p = (chains[path] || Promise.resolve()).then(fn);
  chains[path] = p.catch(() => {});
  return p.catch(e => { toast(errText(e)); throw e; });
}
const upd = (path, data) => write(path, () => S.db.doc(path).update(data));
const setDoc = (path, data) => write(path, () => S.db.doc(path).set(data));

/* ---------- item helpers ---------- */
const byId = id => S.items.find(i => i.id === id);
const isDollar = it => !it.allowanceType || it.allowanceType === "amount";
const explicitTier = it => [1, 2, 3].includes(Number(it && it.tier)) ? Number(it.tier) : null;
const catTier = it => { const v = Number(((S.settings && S.settings.tierByCategory) || {})[divNum(it && it.Category)]); return [1, 2, 3].includes(v) ? v : null; };
const tierOf = it => explicitTier(it) || catTier(it);
const tierDateN = n => n ? ((S.settings.tierDates || {})[n] || null) : null;
const tierDate = it => tierDateN(tierOf(it));
const tierOptions = (it, long) => { const cur = tierOf(it); return `<option value="" ${cur ? "" : "selected"}>—</option>` + [1, 2, 3].map(n => `<option value="${n}" ${cur === n ? "selected" : ""}>T${n}</option>`).join(""); };
const deadlineOptions = it => { const cur = tierOf(it); return `<option value="" ${cur ? "" : "selected"}>No deadline</option>` + [1, 2, 3].map(n => { const d = tierDateN(n); return `<option value="${n}" ${cur === n ? "selected" : ""}>${d ? fmtDate(d) : `Tier ${n}, date not set`}</option>`; }).join(""); };
const tierToStore = (it, v) => (v && v === catTier(it)) ? null : v;
const chosen = it => it && it.approval && it.approval.optionId ? (it.Choices || []).find(o => o.id === it.approval.optionId) || null : null;
const allowText = it => isDollar(it) ? money(it.AllowanceCents || 0) : it.allowanceType === "other" ? (it.allowanceNote || "See note") : ALLOW_LABEL[it.allowanceType] || "";
function statusOf(it) {
  if (it.DesignStatus === "selected" && chosen(it)) return "selected";
  if (it.DesignStatus === "decided" && chosen(it)) return "decided";
  if (it.DesignStatus === "considering") return "considering";
  return (it.Choices && it.Choices.length) ? "open" : "nochoice";
}
const isChosen = it => { const st = statusOf(it); return st === "selected" || st === "decided"; };
const DETAIL_CHECKS = [["maker", "Manufacturer"], ["model", "Model or SKU"], ["finish", "Finish or color"], ["specUrl", "Spec sheet link"]];
const missingDetails = o => DETAIL_CHECKS.filter(([k]) => !(k === "specUrl" ? (safeUrl(o.specUrl) || (o.spec && o.spec.url)) : String(o[k] || "").trim())).map(([, l]) => l);
function remaining(it) { if (!isDollar(it)) return null; const c = chosen(it); if (!c || num(c.PriceCents) == null) return null; return (num(it.AllowanceCents) || 0) - num(c.PriceCents); }
function vsAllow(allowance, allowanceType, price) {
  if (allowanceType && allowanceType !== "amount") return "";
  if (num(price) == null) return "";
  const d = (num(allowance) || 0) - num(price);
  if (d === 0) return "At allowance";
  return d > 0 ? money(d) + " under allowance" : money(-d) + " over allowance";
}
function calcValue(calc, qty) {
  if (!calc) return null;
  if (calc.kind === "unit") return num(calc.unitCents) == null ? null : Math.round((num(qty) || 1) * num(calc.unitCents));
  if (calc.kind === "sf") { if (num(calc.sf) == null || num(calc.rateCents) == null) return null; return Math.round(num(calc.sf) * num(calc.rateCents)) + (num(calc.groutCents) || 0) + (num(calc.thresholdCents) || 0) + (num(calc.otherCents) || 0); }
  return null;
}
function calcText(calc, qty) {
  if (!calc) return "";
  if (calc.kind === "unit" && num(calc.unitCents) != null) return `${num(qty) || 1} × ${money(calc.unitCents)}`;
  if (calc.kind === "sf" && num(calc.sf) != null) {
    const parts = [`${calc.sf} SF × ${money(calc.rateCents)}/SF`];
    if (num(calc.groutCents)) parts.push(`${money(calc.groutCents)} grout`);
    if (num(calc.thresholdCents)) parts.push(`${money(calc.thresholdCents)} threshold`);
    if (num(calc.otherCents)) parts.push(`${money(calc.otherCents)} ${calc.otherLabel || "other"}`);
    return parts.join(" + ");
  }
  return "";
}
function roomOrder() { const m = new Map(); for (const it of S.items) { const r = it.Location || "Unassigned", o = num(it.order) || 0; if (!m.has(r) || o < m.get(r)) m.set(r, o); } return m; }
function groupItems(list, mode) {
  const ro = roomOrder(), g = new Map();
  for (const it of list) { const k = mode === "category" ? divNum(it.Category) : mode === "tier" ? (tierOf(it) || 9) : (it.Location || "Unassigned"); if (!g.has(k)) g.set(k, []); g.get(k).push(it); }
  const keys = [...g.keys()].sort((a, b) => mode !== "room" ? a - b : ((ro.get(a) ?? 0) - (ro.get(b) ?? 0)) || String(a).localeCompare(String(b)));
  return keys.map(k => ({ key:k, mode, items: g.get(k).sort((a, b) => mode !== "room"
      ? ((num(a.sheetPos) ?? 1e9) - (num(b.sheetPos) ?? 1e9)) || ((ro.get(a.Location || "Unassigned") ?? 0) - (ro.get(b.Location || "Unassigned") ?? 0)) || ((num(a.order) || 0) - (num(b.order) || 0))
      : (num(a.order) || 0) - (num(b.order) || 0)) }));
}
const grpLabel = g => g.mode === "category" ? `<span class="grp-code">${divCode(g.key)}</span>${esc(divName(g.key))}`
  : g.mode === "tier" ? (g.key === 9 ? "No tier assigned" : `T${g.key}${tierDateN(g.key) ? `<span class="grp-code" style="margin-left:12px">${fmtDate(tierDateN(g.key))}</span>` : ""}`)
  : esc(g.key);
const rooms = () => [...roomOrder().entries()].sort((a, b) => a[1] - b[1]).map(e => e[0]);
const nextOrder = room => { const inRoom = S.items.filter(i => (i.Location || "") === room); const all = S.items.map(i => num(i.order) || 0); if (inRoom.length) return Math.max(...inRoom.map(i => num(i.order) || 0)) + 0.01; return (all.length ? Math.max(...all) : 0) + 1; };
function imgOrMono(src, name) { const u = safeUrl(src); return u ? `<img src="${esc(u)}" alt="" loading="lazy">` : `<span class="mono" aria-hidden="true">${esc(initials(name))}</span>`; }
function matches(it) { const q = S.search.trim().toLowerCase(); if (!q) return true; return `${it.Title || ""} ${it.Location || ""} ${divName(it.Category)} ${(chosen(it) || {}).Title || ""}`.toLowerCase().includes(q); }

async function fillNames(root) {
  const els = [...(root || document).querySelectorAll("[data-uid]")];
  const ids = [...new Set(els.map(e => e.dataset.uid).filter(Boolean))];
  if (!ids.length || !S.user) { els.forEach(e => { if (!e.textContent) e.textContent = "Bellweather"; }); return; }
  let ps = {};
  try { ps = await S.user.profiles(ids); } catch (_) {}

async function addRoomLines(name, lines) {
  let maxOrder = S.items.reduce((m, i) => Math.max(m, num(i.order) || 0), 0);
  const inRoom = S.items.filter(i => (i.Location || "") === name);
  const base = inRoom.length ? Math.max(...inRoom.map(i => num(i.order) || 0)) + 0.01 : Math.floor(maxOrder) + 1;
  const docs = (lines || []).map((l, k) => ({ Location: name, Title: l.Title, Category: divNum(l.Category), qty: null, allowanceType: l.allowanceType || "amount", AllowanceCents: 0, allowanceNote: l.allowanceNote || "", calc: null, basis: l.basis || "", order: Math.round((base + k * 0.01) * 1000) / 1000, DesignStatus: "open", Choices: [], approval: null, history: [], createdAt: nowIso() }));
  if (!docs.length) { S.items.push({ id: "_tmp", Location: name, order: base }); }
  for (let i = 0; i < docs.length; i += 10) await Promise.all(docs.slice(i, i + 10).map(d => S.db.collection("items").doc().set(d)));
  S.items = S.items.filter(i => i.id !== "_tmp");
  return docs.length;
}
async function addLineTo({ Location: room, Category: division }) {

async function saveCell(el) {
  const tr = el.closest("tr.trow"), it = tr && byId(tr.dataset.id); if (!it) return;
  const f = el.dataset.cell; let v = el.value;
  const data = {}, changes = [];
  if (f === "title") { v = v.trim() || "Untitled"; if (v === it.Title) return; data.Title = v; }
  else if (f === "room") { v = v.trim(); if (v === (it.Location || "")) return; data.Location = v; data.order = nextOrder(v); }
  else if (f === "division") { v = divNum(v); if (v === divNum(it.Category)) return; data.Category = v; }
  else if (f === "qty") { v = parseNum(v); if (v === num(it.qty)) { el.value = fmtNum(v); return; } data.qty = v; changes.push(`Quantity changed from ${it.qty ?? "none"} to ${v ?? "none"}`); }
  else if (f === "allowance") {
    const vd = parseNum(v); v = toCents(vd); const wasDollar = isDollar(it), old = wasDollar ? (num(it.AllowanceCents) || 0) : null;
    if (v == null) { el.value = ""; if (!wasDollar || old === 0) return; v = 0; } else el.value = v ? fmtNum(vd) : "";
    if (wasDollar && v === old) return;
    data.AllowanceCents = v; if (!wasDollar) data.allowanceType = "amount";
    changes.push(wasDollar ? `Allowance changed from ${money(old)} to ${money(v)}` : `Allowance set to ${money(v)} (was ${allowText(it)})`);
    S.trkPending = true;
  }
  else if (f === "allowanceType") { if (v === (it.allowanceType || "amount")) return; data.allowanceType = v; if (v !== "amount") data.AllowanceCents = 0; changes.push(`Allowance type changed from ${ALLOW_TYPES.find(t => t[0] === (it.allowanceType || "amount"))?.[1] || it.allowanceType} to ${ALLOW_TYPES.find(t => t[0] === v)?.[1] || v}`); }
  if (S.settings.finalized && changes.length) data.history = (it.history || []).concat(changes.map(text => ({ at: nowIso(), by: S.myId, text, reason: "" }))).slice(-40);
  Object.assign(it, data);
  const sm = $("#trkSummary"); if (sm) sm.innerHTML = trackerSummaryInner();
  try { await upd("items/" + it.id, data); } catch (_) {}
  if (f === "allowanceType" || f === "room" || f === "division") { S.trkPending = true; flushTracker(); }
}

async function saveDetails() {
  const it = byId(S.drawerId); if (!it) return;
  const atype = (document.querySelector('#drawer input[name="f-atype"]:checked') || {}).value || it.allowanceType || "amount";
  const data = {
    Title: $("#f-title").value.trim() || "Untitled",
    Location: $("#f-room").value.trim(),
    Category: divNum($("#f-div").value),
    tier: tierToStore(it, num($("#f-tier").value)),
    qty: num($("#f-qty").value),
    allowanceType: atype,
    basis: $("#f-basis").value.trim(),
    calc: it.calc || null
  };
  if (atype === "amount") data.AllowanceCents = $("#f-allow") ? (toCents(num($("#f-allow").value)) ?? 0) : (num(it.AllowanceCents) || 0);
  else data.AllowanceCents = 0;
  if (atype === "other") data.allowanceNote = $("#f-anote") ? $("#f-anote").value.trim() : (it.allowanceNote || "");
  const changes = [];
  const before = { allowanceCents: num(it.AllowanceCents) || 0, type: it.allowanceType || "amount", qty: num(it.qty) };
  if (before.type !== atype) changes.push(`Allowance type changed from ${ALLOW_TYPES.find(t => t[0] === before.type)?.[1] || before.type} to ${ALLOW_TYPES.find(t => t[0] === atype)[1]}`);

  if (before.qty !== data.qty) changes.push(`Quantity changed from ${before.qty ?? "none"} to ${data.qty ?? "none"}`);
  if (S.settings.finalized && changes.length) {

  }

}

/* ---------- boot ---------- */
function renderAll() { renderHeader(); renderTabs(); renderToolbar(); renderContent(); renderDrawerSafe(); renderMeetingSafe(); }
let rafQ = false;
function refresh() { if (rafQ) return; rafQ = true; requestAnimationFrame(() => { rafQ = false; renderHeader(); renderContent(); renderDrawerSafe(); renderMeetingSafe(); }); }
function fatal(msg) { $("#tabs").innerHTML = ""; $("#toolbar").innerHTML = ""; $("#content").innerHTML = `<div class="empty"><h3>This project can’t load here</h3><p>${msg}</p></div>`; }
const onErr = e => { if (e && (e.code === "revoked")) fatal("Your access to this project changed. Reload the page to continue."); };

async function init() {
  if (!window.claude || typeof window.claude.use !== "function") { fatal("Sign-in isn\u2019t available on this page."); return; }
  const [db, user, assets] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("assets")]);
  S.db = db; S.user = user; S.assets = assets;
  if (!db) { fatal("Sign in with your Bellweather account to open a job."); return; }
  if (user) {
    try { S.myId = await user.id(); } catch (_) {}
    let w = null, ed = false;
    try { w = await user.can("data.write"); } catch (_) {}
    try { ed = await user.canEdit(); } catch (_) {}

  renderHeader(); renderTabs(); renderToolbar();
  let got = { s:false, i:false, m:false };
  const ready = () => { if (got.s && got.i && got.m && !S.loaded) { S.loaded = true; if (S.team) S.view = "tracker"; renderAll(); } else if (S.loaded) refresh(); };
  db.doc("portal/settings").onSnapshot(s => { S.settings = s.exists ? s.data() : {}; got.s = true; renderToolbarIfTracker(); ready(); }, onErr);
  db.collection("items").onSnapshot(q => { S.items = q.docs.map(d => Object.assign({ id: d.id }, d.data())); got.i = true; ready(); }, onErr);
  db.collection("meetings").onSnapshot(q => { S.meetings = q.docs.map(d => Object.assign({ id: d.id }, d.data())); got.m = true; ready(); }, onErr);
  db.collection("boards").onSnapshot(q => { const o = {}; q.docs.forEach(d => { o[d.id] = d.data(); }); S.boards = o; if (S.loaded && S.view === "boards" && !S.mbDrag && Date.now() - (S.mbLastWrite || 0) > 2500) renderContent(); }, onErr);
  if (S.team) {
    db.collection("library").onSnapshot(q => { S.library = q.docs.map(d => Object.assign({ id: d.id }, d.data())); }, onErr);
    db.collection("internal").onSnapshot(q => { const o = {}; q.docs.forEach(d => { o[d.id] = d.data(); }); S.internal = o; }, onErr);
    db.collection("choicelib").onSnapshot(q => { S.choicelib = q.docs.map(d => Object.assign({ id: d.id }, d.data())); if (S.libPick && S.drawerId) { const b = $("#libList"), it = byId(S.drawerId); if (b && it) b.innerHTML = libListHtml(it); } if (S.view === "library" && !S.libEditing && S.loaded) renderContent(); }, onErr);

  }
