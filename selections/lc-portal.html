/* CORE chrome: version badge (always #ef4444), tooltip, sign-in gate */
.ver{font:700 11px/1 var(--sans);letter-spacing:.08em;color:#ef4444;vertical-align:middle;margin-left:6px;font-style:normal}
.ro{font:500 11px/1 var(--sans);color:var(--muted);vertical-align:middle;margin-left:8px;font-style:normal;letter-spacing:.02em}
.bulkbar[hidden]{display:none!important}
.spscroll{overflow-x:auto}
.sptab{width:100%;border-collapse:collapse;font-size:13px}
.sptab th,.sptab td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sptab th{font-weight:600;color:var(--muted);font-size:12px}
.sptab .n{text-align:right;white-space:nowrap}
.sptab tfoot td{font-weight:600;border-bottom:0}
.spcom{list-style:none;margin:0;padding:0}
.spcom li{padding:8px 0;border-bottom:1px solid var(--line)}
.spcom li:last-child{border-bottom:0}
.spbody{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.spdrop{display:grid;place-items:center;border:1.5px dashed var(--line-2);border-radius:10px;min-height:72px;color:var(--muted);font-size:14px;cursor:pointer;margin:6px 0 8px;text-align:center;padding:10px}
.spdrop u{color:var(--ink)}
.spdrop:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.spdrop.over{border-color:var(--ink);background:var(--wash)}
.spqrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.spqn{flex:1 1 170px;min-width:0;overflow-wrap:anywhere}
.spqk{font:inherit;padding:6px 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--paper);color:var(--ink)}
.spqx{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:2px 8px;cursor:pointer}
.spqs{font-size:13px;color:var(--muted)}
.spqs.ok{color:var(--go)}
.spqe{flex-basis:100%;color:#b3261e;font-size:13px}
.spqa{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 2px}
.spfiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:8px}
.spfile{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;font-size:12.5px}
.spthumb{display:block;aspect-ratio:1;background:var(--wash);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.spthumb img{width:100%;height:100%;object-fit:cover;display:block}
.spname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tt{position:fixed;z-index:9999;pointer-events:none;background:#282828;color:#fff;font:400 12px/1.4 var(--sans);padding:6px 9px;border-radius:5px;max-width:280px;opacity:0;transition:opacity .1s}
#tt.show{opacity:1}
#tt .tt-d{opacity:.75;margin-top:2px}
#spGate{position:fixed;inset:0;z-index:9998;background:#F6F2EE;display:none;align-items:center;justify-content:center;text-align:center;padding:16px;font:400 15px/1.5 var(--sans);color:#282828}
#spGate.show{display:flex}
#spGate button{font:600 14px/1 var(--sans);padding:11px 16px;border-radius:6px;border:1px solid #263860;background:#263860;color:#fff;cursor:pointer;margin-top:12px}

:root{
  --ink:#101820; --ink-2:#3d4247; --muted:#6f7276; --line:#e4e0d6; --line-2:#d6d2c4;
  --paper:#ffffff; --wash:#f5f3ee; --band:#e9e5db;
  --go:#4a6b52; --go-bg:#e4e9de; --warn:#9a4a33; --warn-bg:#f3e2da; --amber:#86662a; --amber-bg:#f1e9d9;
  --focus:#101820;
  --serif:"Swear Text",Georgia,"Times New Roman",serif;
  --sans:"TT Norms Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#f2efe8; --ink-2:#cdc8bc; --muted:#a3a5a7; --line:#2c3034; --line-2:#3d4246;
  --paper:#121518; --wash:#1b1f23; --band:#24292d;
  --go:#a9c4ad; --go-bg:#22302a; --warn:#e8a58e; --warn-bg:#3a241d; --amber:#dcc08a; --amber-bg:#33291a; --focus:#d6d2c4; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#f2efe8; --ink-2:#cdc8bc; --muted:#a3a5a7; --line:#2c3034; --line-2:#3d4246;
  --paper:#121518; --wash:#1b1f23; --band:#24292d;
  --go:#a9c4ad; --go-bg:#22302a; --warn:#e8a58e; --warn-bg:#3a241d; --amber:#dcc08a; --amber-bg:#33291a; --focus:#d6d2c4; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);color:var(--ink);border-bottom:1px solid var(--ink)}
.top-row{display:flex;align-items:baseline;gap:18px;padding:16px 0 10px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:28px;letter-spacing:-.01em;line-height:1;border:0;background:none;padding:0;color:inherit;cursor:pointer;text-align:left}
nav.views .homebtn{color:var(--ink);font-weight:600;margin-right:16px}
.bw{font-style:italic;letter-spacing:-.02em}
header.top{border-bottom:1px solid var(--ink)!important}
header.top .brand em{color:var(--muted)}
.brand em{color:var(--muted)}
.rdrop{border:1.5px dashed var(--line-2);border-radius:12px;padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:0 0 22px}
.rdrop.on{border-color:var(--ink);background:var(--wash)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.rcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line-2);border-radius:12px;background:var(--paper);padding:10px;cursor:pointer;font:inherit;color:inherit}
.rcard:hover{border-color:var(--ink)}
.rimg{width:100%;height:150px;border-radius:8px;background:var(--wash);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.rimg img{width:100%;height:100%;object-fit:cover;object-position:top}
.rtitle{font-weight:600} .rtitle .muted{color:var(--muted);font-weight:400}
.rmeta{font-size:13px;color:var(--ink-2)} .rwarn{font-size:12.5px;color:var(--warn)}
.rlist{max-height:44vh;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 2px}
.rlist .check{padding:8px 0}
.hero.contain{object-fit:contain;background:var(--wash);max-height:320px}
.pdf.big{display:block;padding:18px;text-align:center;background:var(--wash);border-radius:10px;margin-bottom:12px}
.rthumb{display:flex;flex-direction:column;gap:4px;align-items:flex-start;border:0;background:none;padding:0;cursor:pointer;font:inherit;font-size:12.5px;color:var(--ink-2);max-width:130px;text-align:left}
.rthumb img{width:110px;height:110px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line)}
.attn{border-top:2px solid var(--ink);margin-bottom:8px}
.tledit{float:right;font-size:13px;margin-top:2px}
.schedlist{border-top:1px solid var(--line);margin:4px 0 12px}
.schedrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.schedrow input[type=date]{border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink)}
.schedrow input[type=checkbox]{width:22px;height:22px}
.schedrow.custom .title{font-style:italic}
.rmstage{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);background:var(--paper);color:var(--warn);font-size:15px;line-height:18px;cursor:pointer;padding:0;flex:none}
.addstage{margin:0 0 14px} .addstage summary{cursor:pointer;color:var(--ink);font-weight:600;padding:6px 0}
.addstage[open] summary{margin-bottom:8px}
.tline{display:flex;gap:0;margin:4px 0 14px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.tstep{flex:1 0 96px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;padding:8px 8px 0 0;font:inherit;color:inherit;text-align:left;position:relative;cursor:pointer}
.tstep:disabled{cursor:default}
.tstep::before{content:"";position:absolute;top:13px;left:12px;right:0;height:2px;background:var(--line-2)}
.tstep:last-child::before{display:none}
.tdot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);position:relative;z-index:1}
.tstep.past .tdot{background:var(--ink)}
.tstep.next .tdot{background:var(--warn);border-color:var(--warn)}
.tstep.empty .tdot{border-style:dashed;border-color:var(--muted)}
.tl{font-size:12.5px;font-weight:600;margin-top:4px;line-height:1.2}
.td{font-size:12.5px;color:var(--ink-2)} .tstep.empty .td{color:var(--muted);font-style:italic}
.tstep:not(:disabled):hover .tl{text-decoration:underline;text-underline-offset:2px}
.where .late{color:var(--warn);font-weight:600}
.attnhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:22px 0 12px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.attnhead .chev{margin-top:-4px}
.chev.shut{transform:rotate(-45deg);margin-top:0}
.asum{display:flex;flex-wrap:wrap;gap:6px;margin-left:4px}
.apill .ico{width:13px;height:13px;vertical-align:-2px;margin-right:2px}
.atabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0 10px}
.atxt .aproj{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink)}
.atxt .aproj i{font-family:var(--sans);font-style:normal;font-size:13px;color:var(--muted);font-weight:400}
.atxt b{font-weight:500}
.atabs button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.atabs button span{font-size:12px;color:var(--muted);font-weight:600}
.atabs button .ico{width:14px;height:14px}
.atabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.atabs button[aria-selected="true"] span{color:var(--paper)}
.apill{font-size:13px;color:var(--ink-2);background:var(--wash);border-radius:999px;padding:2px 10px}
.attn.ok{border:0;background:var(--wash);border-radius:12px;padding:14px 16px;color:var(--ink-2);font-size:14.5px;margin:22px 0 6px}
.acount{display:inline-block;min-width:24px;padding:1px 8px;border-radius:999px;background:var(--warn);color:var(--paper);font-family:var(--sans);font-size:13px;font-weight:600;margin-left:6px;vertical-align:3px;text-align:center}
.arow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;cursor:pointer;font:inherit;color:inherit}
.arow:hover b{text-decoration:underline;text-underline-offset:3px}
.aic{font-size:18px;line-height:1.3}
.atxt{display:flex;flex-direction:column;min-width:0} .atxt span{font-size:13.5px;color:var(--ink-2)}
.pick{display:inline-flex;width:20px;height:20px;border:1.5px solid var(--ink-2);border-radius:5px;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-right:8px;vertical-align:-4px;background:var(--paper)}
.row.picked{background:var(--wash)}
.row.picked .pick{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px rgba(16,24,32,.15);max-width:calc(100% - 24px)}
.bulkbar .bcount{font-weight:600;margin-right:4px}
.pick-sel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pick-sel select{border:1px solid var(--line-2);border-radius:10px;padding:8px 30px 8px 10px;background:var(--paper);font:inherit;font-size:14px;color:var(--ink);cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:12;min-width:210px;background:var(--paper);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 10px 30px rgba(16,24,32,.12);padding:6px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;font:inherit;font-size:14.5px;color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--wash)}
.utoast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--paper);padding:10px 12px 10px 16px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 24px)}
.utoast.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.utoast button{border:1px solid var(--paper);background:transparent;color:var(--paper);border-radius:8px;padding:5px 12px;font:inherit;font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){.utoast{transition:none}}
.rcptplus{margin-left:12px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px 5px 10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;line-height:1}
.rcptplus span{font-size:13px;font-weight:500}
.rcptplus:hover{background:var(--ink);color:var(--paper)}
.rcptplus[hidden]{display:none}
.rcostwrap{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:12.5px;color:var(--muted)}
.rcost{width:90px;border:1px solid var(--line-2);border-radius:6px;padding:3px 6px;font:inherit;font-size:13px;background:var(--paper);color:var(--ink)}
.rprice{font-size:12.5px;font-weight:600;color:var(--go);white-space:nowrap}
.unm{margin:8px 0;font-size:13.5px} .unm summary{cursor:pointer;color:var(--warn)}
.mtag{display:inline;margin-left:0;font-size:inherit;font-weight:400;letter-spacing:0;color:inherit;background:none;border-radius:0;padding:0;vertical-align:baseline}
.facts.money .mhead{font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:500}
.kindlink{margin-right:auto;font-size:13px}
.sclose{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--paper);font-size:20px;line-height:30px;cursor:pointer;color:var(--ink-2);z-index:2}
.sclose:hover{border-color:var(--ink);color:var(--ink)}
.dtop{display:flex;gap:16px;align-items:flex-start;padding-right:40px;margin-bottom:14px}
.dphoto{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex:none;background:var(--wash)}
.dtitle{min-width:0}
.dtitle h3{margin:2px 0 4px}
.dstate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.dstate .late{color:var(--warn);font-weight:600}
.dalert{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.dactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0 16px;border-bottom:1px solid var(--line);margin-bottom:6px}

.dsec{padding:14px 0 4px;border-bottom:1px solid var(--line)}
.dsec:last-of-type{border-bottom:0}

.dsec .details{border:0;padding:4px 0 8px;margin:0}
.hist{font-weight:400!important;font-size:14px;color:var(--ink-2)}
.more.up .menu{top:auto;bottom:calc(100% + 6px)}
.menu .danger{color:var(--warn)}
.dhist{background:var(--wash);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-2);margin:0 0 12px}
.link.inl{font-size:inherit;color:inherit;text-decoration:underline;text-underline-offset:2px}
.rscope{margin:0 0 14px}
.rbox{border:1px solid var(--line-2);border-left:4px solid var(--jc);border-radius:12px;margin:0 0 18px;background:var(--paper);overflow:hidden}
.rboxhead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--wash);padding:14px 16px;cursor:pointer;font:inherit;color:inherit;text-align:left}

.jdot{width:10px;height:10px;border-radius:50%;background:var(--jc);flex:none}
.rbname{font-family:var(--serif);font-size:22px;font-weight:500}
.rbsum{font-size:13.5px;color:var(--ink-2);margin-left:4px}

.rbox.closed .chev{transform:rotate(-45deg);margin-top:0}
.rboxbody{padding:2px 16px 10px}

.rsubh{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px}

.tripbar{display:none}

  .pullview h2{font-size:26px;margin-bottom:2px}

/* receive + pull cards */
.list{border-top:2px solid var(--ink)}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}

.empty{padding:40px 0;color:var(--ink-2);max-width:56ch}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(16,24,32,.45);display:none;z-index:20}
.scrim.open{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:min(560px,100%);background:var(--paper);border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:21;transition:transform .22s ease;max-height:90vh;overflow:auto}
.sheet.open{transform:translate(-50%,0)}

.field{display:block;margin:0 0 14px}

.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.status-line{font-size:13px;color:var(--muted);padding:8px 0}

}

<script>
/* topbar: SharePoint connection state (green dot = connected) */
function bwConn(ok,label){ const d=document.getElementById('bwtbDot'), l=document.getElementById('bwtbConn'); if(d) d.classList.toggle('on',!!ok); if(l) l.textContent=label||(ok?'SharePoint':'Not connected'); }
function bwSub(t){ const el=document.getElementById('bwtbSub'); if(el) el.textContent=t; }
const CORE_VERSION = 'P8';
(()=>{['versionBadge'].forEach(id=>{const el=document.getElementById(id); if(el) el.textContent=CORE_VERSION;});})();

/* tooltip engine: data-tip (+ optional data-tip-d detail line) */
(()=>{const TT=document.getElementById('tt'); if(!TT) return;
  const tipOf=t=>{const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); const d=t.getAttribute('data-tip-d'); return e(t.getAttribute('data-tip'))+(d?'<div class="tt-d">'+e(d)+'</div>':'');};
  const move=e=>{const r=TT.getBoundingClientRect(); let x=e.clientX+12, y=e.clientY+14; if(x+r.width>innerWidth-8) x=e.clientX-r.width-12; if(y+r.height>innerHeight-8) y=e.clientY-r.height-14; TT.style.left=x+'px'; TT.style.top=y+'px';};
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t) return; TT.innerHTML=tipOf(t); TT.classList.add('show'); move(e);});
  document.addEventListener('mousemove',e=>{ if(TT.classList.contains('show')) move(e); });
  document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(t&&!(t.contains&&t.contains(e.relatedTarget))) TT.classList.remove('show');});
})();

/* ── SharePoint adapter: read + write ─────────────────────────────────────
   Stands in for the artifact database the LC code was written against.
   Loads ONE JOB AT A TIME (every query filters on the indexed Job column): the current
   job first, other active jobs in the background, archived jobs only when opened.
   items    ⇄ CORE_Selections (+ Choices, Allowances, Line items, Comments for display)
   checkins ⇄ OpsData.checkin on the selection; its BT fields are also written to their columns
   trips, receipts ⇄ CORE_SelectionDesignDocs (per job);  jobs ⇄ CORE_SelectionJobs
   BT fields changed here are listed in CoreEditedFields (Import keeps them).
   Nothing is hard-deleted: a deleted item gets DesignStatus = removed.                     */
(()=>{
  const GRAPH='https://graph.microsoft.com/v1.0';
  const LISTS=GRAPH+'/sites/bellweather.sharepoint.com:/sites/BWCore:/lists';
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function g(url,opts){ for(let a=0;;a++){ try{ return await SherpaAuth.graph(url,opts); }catch(e){ if([429,503,504].includes(e.status)&&a<5){ await sleep(1500*2**a); continue; } if(e&&!e.code) e.code=e.status===403?'permission_denied':'unavailable'; throw e; } } }
  async function gAll(url){ let out=[], next=url; while(next){ const j=await g(next); out=out.concat(j.value||[]); next=j['@odata.nextLink']||null; } return out; }
  const post=(list,fields)=>g(`${LISTS}/${list}/items`,{method:'POST',body:JSON.stringify({fields})});
  const patch=(list,id,fields)=>g(`${LISTS}/${list}/items/${id}/fields`,{method:'PATCH',body:JSON.stringify(fields)});
  const day=v=>v?String(v).slice(0,10):null;
  const num=v=>(typeof v==='number'&&isFinite(v))?v:null;
  const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const parseJ=v=>{ try{ const o=JSON.parse(v||'{}'); return o&&typeof o==='object'?o:{}; }catch(e){ return {}; } };
  const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
  const edSet=v=>new Set(String(v||'').split(',').map(x=>x.trim()).filter(Boolean));
  const jobFilter=job=>`$filter=fields/Job eq '${encodeURIComponent(String(job).replace(/'/g,"''"))}'`;
  const SEL={
    CORE_Selections:'Title,Job,Category,Location,DueDate,SelectionStatus,SelectionTotalCents,AllowanceLookupId,Ordered,OrderDate,LeadTime,OnHandLocation,ReceivedBy,DateReceived,Notes,ActualCostCents,DesignStatus,DesignKey,OpsData,CoreEditedFields',
    CORE_SelectionAllowances:'Title,Job,AllowanceCents,CoreEditedFields',
    CORE_SelectionChoices:'Title,Job,SelectionLookupId,Description,PriceCents,ChoiceStatus,CreatedBy,SelectedDate,SelectedBy',
    CORE_SelectionLineItems:'Title,Job,ChoiceLookupId,CostCode,CostType,Description,Qty,Unit,UnitPriceCents,PriceCents',
    CORE_SelectionComments:'Title,Job,SelectionLookupId,PostedBy,PostedAt,Body',
    CORE_SelectionDesignDocs:'Title,Job,Collection,DocId,Data'};
  const forJob=(list,job)=>gAll(`${LISTS}/${list}/items?${jobFilter(job)}&$expand=fields($select=${SEL[list]})&$top=999`)
    .catch(e=>{ if(e&&e.status===404&&list!=='CORE_Selections') return []; throw e; });   // optional lists may not exist yet
  let ME='', MEID='';
  const stamp=()=>({CoreEditedAt:new Date().toISOString(),CoreEditedBy:ME});

  // LC field → CORE_Selections column (BT canon). Everything else the LC stores goes in OpsData.
  const CANON={Title:'Title',Location:'Location',Category:'Category',OrderDate:'OrderDate',LeadTime:'LeadTime',OnHandLocation:'OnHandLocation',
    ReceivedBy:'ReceivedBy',DateReceived:'DateReceived',notes:'Notes',ActualCostCents:'ActualCostCents',SelectionTotalCents:'SelectionTotalCents'};
  const DATES=new Set(['OrderDate','DateReceived']), MONEY=new Set(['ActualCostCents','SelectionTotalCents']);
  const DERIVED=new Set(['id','spId','Job','DueDate','SelectionStatus','Ordered','lineItems','comments','choices','AllowanceCents','_bt']);
  const colValue=(col,v)=>{ if(v==null||v==='') return null; if(DATES.has(col)) return /^\d{4}-\d{2}-\d{2}$/.test(v)?v+'T12:00:00Z':v; if(MONEY.has(col)) return Math.round(Number(v)); if(col==='ReceivedBy') return v===MEID?ME:String(v).slice(0,255); return col==='Notes'?String(v):String(v).slice(0,255); };

  const M=new Map();             // item id → {spId, job, base, ops, edited, allowId, allowCents, allowEdited}
  const docs=new Map();          // 'trips' | 'receipts' → Map(id → data)
  const docSp=new Map();         // 'collection/id' → SharePoint item id
  const jobExtra=new Map();      // job name → extra job fields the LC keeps (address, custom milestones…)
  function compose(m){ const it={...m.base,...(m.ops.item||{})}; it.id=m.id; return it; }

  function build(job,sel,alw,cho,lis,com){
    const allow=new Map(alw.map(a=>[String(a.id),a.fields]));
    const chBy=new Map(), liBy=new Map(), coBy=new Map();
    for(const c of cho){ const k=String(c.fields.SelectionLookupId); if(!chBy.has(k)) chBy.set(k,[]); chBy.get(k).push({id:String(c.id),...c.fields}); }
    for(const l of lis){ const k=String(l.fields.ChoiceLookupId); if(!liBy.has(k)) liBy.set(k,[]); liBy.get(k).push(l.fields); }
    for(const m of com){ const k=String(m.fields.SelectionLookupId); if(!coBy.has(k)) coBy.set(k,[]); coBy.get(k).push(m.fields); }
    return sel.filter(x=>x.fields.DesignStatus!=='removed').map(x=>{   // removed on the Design screen
      const f=x.fields, chs=(chBy.get(String(x.id))||[]).filter(c=>!c.ChoiceStatus||c.ChoiceStatus==='Selected');
      const a=f.AllowanceLookupId!=null?allow.get(String(f.AllowanceLookupId)):null;
      const ord=f.Ordered||'';
      const fromOrdered=(ord.match(/^(?:yes|no)\s*,\s*(.+)$/i)||[])[1]||'';
      const fromChoice=(chs[0]&&chs[0].Title&&chs[0].Title.includes(' | '))?chs[0].Title.split(' | ')[0]:'';
      const id=f.DesignKey||('sp-'+x.id), ops=parseJ(f.OpsData);
      const base={ spId:String(x.id), Job:f.Job||job, Title:f.Title||null, Category:f.Category||null, Location:f.Location||null,
        DueDate:day(f.DueDate), SelectionStatus:f.SelectionStatus||null,
        SelectionTotalCents:num(f.SelectionTotalCents), AllowanceCents:a?num(a.AllowanceCents):null,
        Ordered:ord||null, OrderDate:day(f.OrderDate), LeadTime:f.LeadTime||null, OnHandLocation:f.OnHandLocation||null,
        ReceivedBy:f.ReceivedBy||null, DateReceived:day(f.DateReceived), ActualCostCents:num(f.ActualCostCents),
        type:chs.map(c=>c.Title).filter(Boolean).join(' + ')||null, vendor:(fromOrdered||fromChoice)||null,
        ownerSupplied:/^owner/i.test(ord), notes:f.Notes||null,
        choices:chs.map(c=>({Title:c.Title,Description:c.Description||''})),
        lineItems:chs.flatMap(c=>liBy.get(c.id)||[]),
        comments:(coBy.get(String(x.id))||[]).sort((p,q)=>String(q.PostedAt).localeCompare(String(p.PostedAt))) };
      const m={id,spId:String(x.id),job,base,ops:{item:ops.item||{},checkin:ops.checkin||null},edited:edSet(f.CoreEditedFields),
        allowId:f.AllowanceLookupId!=null?String(f.AllowanceLookupId):null,allowCents:a?num(a.AllowanceCents):null,allowEdited:a?edSet(a.CoreEditedFields):new Set()};
      M.set(id,m);
      return compose(m);
    });
  }

  let jobsP=null;
  function loadJobs(){
    if(jobsP) return jobsP;
    jobsP=(async()=>{
      try{
        const rows=await gAll(`${LISTS}/CORE_SelectionJobs/items?$expand=fields($select=Title,Job,Archived,LastImportedAt)&$top=999`);
        if(rows.length) return rows.map(x=>({spId:String(x.id),name:x.fields.Job||x.fields.Title, archived:!!x.fields.Archived, createdAt:Date.parse(x.fields.LastImportedAt||'')||0})).filter(j=>j.name);
      }catch(e){ if(!e||e.status!==404) throw e; }
      const rows=await gAll(`${LISTS}/CORE_Selections/items?$expand=fields($select=Job)&$top=999`);
      return [...new Set(rows.map(x=>x.fields.Job).filter(Boolean))].sort().map((name,i)=>({name,createdAt:i,archived:false}));
    })();
    jobsP.catch(()=>{ jobsP=null; });
    return jobsP;
  }
  const cache=new Map(), inflight=new Map(), subs={items:new Set(),checkins:new Set(),trips:new Set(),receipts:new Set(),jobs:new Set(),views:new Set()}; let itemsErr=null;
  const snap=rows=>({docs:rows.map(([id,d])=>({id,data:()=>clone(d)}))});
  const views={
    items:()=>[...cache.values()].flat().map(r=>[r.id,r]),
    checkins:()=>[...M.values()].filter(m=>m.ops.checkin&&cache.has(m.job)).map(m=>[m.id,m.ops.checkin]),
    trips:()=>[...(docs.get('trips')||new Map()).entries()],
    receipts:()=>[...(docs.get('receipts')||new Map()).entries()],
    views:()=>[...(docs.get('views')||new Map()).entries()],
    jobs:()=>[]};
  async function jobsView(){ const js=await loadJobs(); return js.map(j=>[String(j.name).toLowerCase().replace(/[^a-z0-9]+/g,'-'),{...(jobExtra.get(j.name)||{}),name:j.name,archived:j.archived,createdAt:j.createdAt}]); }
  function emit(which){ for(const c of which||['items','checkins','trips','receipts']){ if(c==='jobs'){ jobsView().then(r=>subs.jobs.forEach(f=>f(snap(r)))); continue; } const r=views[c](); subs[c].forEach(f=>f(snap(r))); } }
  function loadJob(job){
    if(!job||job==='All'||cache.has(job)) return Promise.resolve();
    if(inflight.has(job)) return inflight.get(job);
    const p=(async()=>{
      const lists=['CORE_Selections','CORE_SelectionAllowances','CORE_SelectionChoices','CORE_SelectionLineItems','CORE_SelectionComments','CORE_SelectionDesignDocs'];
      const [sel,alw,cho,lis,com,dd]=await Promise.all(lists.map(l=>forJob(l,job)));
      let gotJobDoc=false;
      for(const d of dd){ const f=d.fields; if(!['trips','receipts','jobs'].includes(f.Collection)) continue;
        if(f.Collection==='jobs'){ jobExtra.set(job,parseJ(f.Data)); docSp.set('jobs/'+job,String(d.id)); gotJobDoc=true; continue; }
        if(!docs.has(f.Collection)) docs.set(f.Collection,new Map()); docs.get(f.Collection).set(f.DocId,parseJ(f.Data)); docSp.set(f.Collection+'/'+f.DocId,String(d.id)); }
      cache.set(job,build(job,sel,alw,cho,lis,com)); emit();
      if(gotJobDoc) emit(['jobs']);   // timeline dates, address etc. arrive after the jobs list was first shown
    })();
    inflight.set(job,p); p.catch(()=>{}).finally(()=>inflight.delete(job));
    return p;
  }
  async function loadActive(except){
    const js=await loadJobs();
    for(const j of js) if(!j.archived&&j.name!==except){ try{ await loadJob(j.name); }catch(e){ console.warn('Selections: could not load',j.name,e); } }
  }
  window.spEnsureJob=job=>{ if(job==='All') loadActive(); else loadJob(job).catch(e=>itemsErr&&itemsErr(e)); };
  let started=null;
  function startItems(){
    if(started) return started;
    started=(async()=>{
      const js=await loadJobs();
      forJob('CORE_SelectionDesignDocs','_shared').then(dd=>{ if(!docs.has('views')) docs.set('views',new Map());
        for(const d of dd){ const f=d.fields; if(f.Collection!=='views') continue; docs.get('views').set(f.DocId,parseJ(f.Data)); docSp.set('views/'+f.DocId,String(d.id)); }
        emit(['views']); }).catch(e=>console.warn('Selections: could not load views',e));
      let cur=null; try{ cur=localStorage.getItem('bw-job'); }catch(e){}
      if(!js.some(j=>j.name===cur)) cur=(js.find(j=>!j.archived)||js[0]||{}).name;
      if(cur){ await loadJob(cur); }
      bwConn(true);
      if(!cache.size) emit();
      loadActive(cur);
    })();
    return started;
  }

  /* ── writes ── */
  const replaceInCache=(m,it)=>{ const arr=cache.get(m.job)||[]; const n=arr.findIndex(x=>x.id===m.id); if(it){ n<0?arr.push(it):arr[n]=it; } else if(n>=0) arr.splice(n,1); cache.set(m.job,arr); };
  async function saveItem(id,op,data){
    let m=M.get(id);
    if(op==='delete'){ if(!m) return; m.edited.add('DesignStatus'); replaceInCache(m,null); emit();
      try{ await patch('CORE_Selections',m.spId,{DesignStatus:'removed',CoreEditedFields:[...m.edited].join(','),...stamp()}); m.removed=true; }
      catch(e){ replaceInCache(m,compose(m)); emit(); throw e; } return; }
    if(!m){ // new item from the LC (add item, duplicate, change selection)
      const job=data.Job; if(!job) throw Object.assign(new Error('New item needs a job'),{code:'invalid'});
      const f={Title:String(data.Title||'New item').slice(0,255),Job:job,DesignKey:id,CoreEditedFields:'',...stamp()}, item={}, cols=[];
      for(const [k,v] of Object.entries(data)){ if(k==='Title'||k==='Job'||k==='id') continue; const col=CANON[k]; if(col){ const cv=colValue(col,v); if(cv!=null){ f[col]=cv; cols.push(col); } } else if(k!=='AllowanceCents'&&!DERIVED.has(k)&&v!==null) item[k]=v; }
      f.CoreEditedFields=['Title',...cols].join(','); f.OpsData=JSON.stringify({item});
      const r=await post('CORE_Selections',f);
      m={id,spId:String(r.id),job,base:{spId:String(r.id),Job:job,Title:f.Title,Category:data.Category||null,Location:data.Location||null,OrderDate:data.OrderDate||null,LeadTime:data.LeadTime||null,OnHandLocation:data.OnHandLocation||null,DateReceived:data.DateReceived||null,ReceivedBy:data.ReceivedBy||null,notes:data.notes||null,ActualCostCents:num(data.ActualCostCents),SelectionTotalCents:num(data.SelectionTotalCents),AllowanceCents:null,choices:[],lineItems:[],comments:[]},
        ops:{item,checkin:null},edited:new Set(['Title',...cols]),allowId:null,allowCents:null,allowEdited:new Set()};
      M.set(id,m);
      if(num(data.AllowanceCents)){ await saveAllowance(m,data.AllowanceCents); }
      replaceInCache(m,compose(m)); emit(); return;
    }
    // update (or set on an existing item, e.g. undo)
    const before={base:clone(m.base),ops:clone(m.ops),edited:new Set(m.edited),removed:m.removed};
    const f={}, cols=[];
    for(const [k,v] of Object.entries(data)){
      if(DERIVED.has(k)&&k!=='AllowanceCents') continue;
      if(k==='AllowanceCents') continue;
      const col=CANON[k];
      if(col){ const cv=colValue(col,v), cur=colValue(col,m.base[k]); if(String(cv??'')!==String(cur??'')){ f[col]=cv; cols.push(col); } m.base[k]=v??null; }
      else{ if(v===null) delete m.ops.item[k]; else m.ops.item[k]=clone(v); }
    }
    const opsJson=JSON.stringify(m.ops), opsChanged=opsJson!==JSON.stringify(before.ops);
    if(cols.length){ cols.forEach(c=>m.edited.add(c)); Object.assign(f,{CoreEditedFields:[...m.edited].join(','),...stamp()}); }
    if(opsChanged) f.OpsData=opsJson;
    if(op==='set'&&m.removed){ f.DesignStatus=null; m.removed=false; }
    replaceInCache(m,compose(m)); emit();
    try{
      if(Object.keys(f).length) await patch('CORE_Selections',m.spId,f);
      if('AllowanceCents' in data&&num(data.AllowanceCents)!==m.allowCents) await saveAllowance(m,data.AllowanceCents);
    }catch(e){ Object.assign(m,before); replaceInCache(m,m.removed?null:compose(m)); emit(); throw e; }
  }
  async function saveAllowance(m,v){
    const c=Math.round(Number(v)||0);
    if(m.allowId){ m.allowEdited.add('AllowanceCents'); await patch('CORE_SelectionAllowances',m.allowId,{AllowanceCents:c,CoreEditedFields:[...m.allowEdited].join(','),...stamp()}); }
    else{ const r=await post('CORE_SelectionAllowances',{Title:String(m.base.Title||'Allowance').slice(0,255),Job:m.job,AllowanceCents:c,CoreEditedFields:'AllowanceCents',...stamp()}); m.allowId=String(r.id); m.allowEdited=new Set(['AllowanceCents']); await patch('CORE_Selections',m.spId,{AllowanceLookupId:m.allowId}); }
    m.allowCents=c; m.base.AllowanceCents=c; replaceInCache(m,compose(m)); emit();
  }
  async function saveCheckin(id,op,data){
    const m=M.get(id); if(!m) throw Object.assign(new Error('Item not loaded'),{code:'not_found'});
    const before={base:clone(m.base),ops:clone(m.ops),edited:new Set(m.edited)};
    const next=op==='delete'?null:(op==='update'?{...(m.ops.checkin||{}),...data}:clone(data));
    const f={}, cols=[], cleared=new Set((next&&next._cleared)||[]);
    for(const k of Object.keys(CANON)){
      if(!['OnHandLocation','DateReceived','ReceivedBy','OrderDate','LeadTime','notes'].includes(k)) continue;
      let v; if(next&&k in next&&next[k]!==undefined) v=next[k]; else if(cleared.has(k)) v=null; else continue;
      const col=CANON[k], cv=colValue(col,v), cur=colValue(col,m.base[k]);
      if(String(cv??'')!==String(cur??'')){ f[col]=cv; cols.push(col); m.base[k]=v??null; }
    }
    m.ops.checkin=next;
    if(cols.length){ cols.forEach(c=>m.edited.add(c)); Object.assign(f,{CoreEditedFields:[...m.edited].join(','),...stamp()}); }
    f.OpsData=JSON.stringify(m.ops);
    replaceInCache(m,compose(m)); emit();
    try{ await patch('CORE_Selections',m.spId,f); }
    catch(e){ Object.assign(m,before); replaceInCache(m,compose(m)); emit(); throw e; }
  }
  async function saveDoc(c,id,op,data){
    if(!docs.has(c)) docs.set(c,new Map()); const map=docs.get(c), before=clone(map.get(id)), key=c+'/'+id;
    const next=op==='delete'?undefined:(op==='update'?{...(before||{}),...data}:clone(data));
    for(const [k,v] of Object.entries(next||{})) if(v===null) delete next[k];
    next===undefined?map.delete(id):map.set(id,next); emit([c]);
    try{
      const sp=docSp.get(key);
      if(next===undefined){ if(sp){ await g(`${LISTS}/CORE_SelectionDesignDocs/items/${sp}`,{method:'DELETE',raw:true}); docSp.delete(key); } return; }
      const json=JSON.stringify(next);
      if(sp) await patch('CORE_SelectionDesignDocs',sp,{Data:json});
      else{ const r=await post('CORE_SelectionDesignDocs',{Title:key.slice(0,255),Job:next.Job||'_shared',Collection:c,DocId:id,Data:json}); docSp.set(key,String(r.id)); }
    }catch(e){ before===undefined?map.delete(id):map.set(id,before); emit([c]); throw e; }
  }
  async function saveJob(slug,op,data){
    const js=await loadJobs(); let j=js.find(x=>String(x.name).toLowerCase().replace(/[^a-z0-9]+/g,'-')===slug)||(data&&js.find(x=>x.name===data.name));
    const name=(data&&data.name)||(j&&j.name); if(!name) throw Object.assign(new Error('Job needs a name'),{code:'invalid'});
    const extra={...(jobExtra.get(name)||{}),...(op==='update'?data:clone(data)||{})}; const archived=!!extra.archived; delete extra.archived; delete extra.name; delete extra.createdAt;
    if(j){ if(j.archived!==archived){ await patch('CORE_SelectionJobs',j.spId,{Archived:archived}); j.archived=archived; } }
    else{ const r=await post('CORE_SelectionJobs',{Title:name,Job:name,Archived:archived}); j={spId:String(r.id),name,archived,createdAt:Date.now()}; js.push(j); }
    jobExtra.set(name,extra);
    const key='jobs/'+name, json=JSON.stringify(extra), sp=docSp.get(key);
    if(sp) await patch('CORE_SelectionDesignDocs',sp,{Data:json}); else if(Object.keys(extra).length){ const r=await post('CORE_SelectionDesignDocs',{Title:key,Job:name,Collection:'jobs',DocId:name,Data:json}); docSp.set(key,String(r.id)); }
    emit(['jobs']);
  }
  const chains=new Map();
  function run(key,fn){ const p=(chains.get(key)||Promise.resolve()).then(fn); chains.set(key,p.catch(()=>{})); return p; }
  const rid=()=>'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  function write(c,id,op,data){
    return run(c+'/'+id,async()=>{ await startItems();
      if(c==='items') return saveItem(id,op,data);
      if(c==='checkins') return saveCheckin(id,op,data);
      if(c==='jobs') return saveJob(id,op,data);
      return saveDoc(c,id,op,data); });
  }
  function coll(name){
    const c={ limit:()=>c,
      doc:id=>{ id=id||rid(); return {id,set:d=>write(name,id,'set',d),update:d=>write(name,id,'update',d),replace:d=>write(name,id,'set',d),delete:()=>write(name,id,'delete'),
        get:async()=>{ await startItems(); const r=(name==='jobs'?await jobsView():views[name]()).find(x=>x[0]===id); return {exists:!!r,id,data:()=>r?clone(r[1]):undefined}; }}; },
      add:async d=>{ const id=rid(); await write(name,id,'set',d); return {id}; },
      onSnapshot(cb,err){ let live=true; const f=d=>{ if(live) cb(d); }; (subs[name]||new Set()).add(f);
        if(name==='items'){ itemsErr=e=>{ bwConn(false); if(live&&err) err(e); }; startItems().catch(itemsErr); }
        else if(name==='jobs') jobsView().then(r=>f(snap(r))).catch(e=>{ if(live&&err) err(e); });
        else startItems().then(()=>f(snap(views[name]?views[name]():[]))).catch(e=>{ if(live&&err) err(e); });
        return ()=>{ live=false; (subs[name]||new Set()).delete(f); }; } };
    return c;
  }

  /* detail sheet: what was chosen, cost line items, discussion, files */
  const usd2=v=>typeof v==='number'?(v/100).toLocaleString(undefined,{style:'currency',currency:'USD'}):'';
  const linkify=t=>t.replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.length>60?u.slice(0,57)+'…':u}</a>`);
  const when=v=>{ const d=new Date(v); return isNaN(d)?E(v):d.toLocaleString('en-US',{timeZone:'America/New_York',dateStyle:'medium',timeStyle:'short'}); };
  window.spDetailExtras=r=>{
    let h='';
    const CH=(r.choices||[]).filter(c=>c.Description);
    if(CH.length) h+=`<section class="dsec"><h4>What was chosen</h4>${CH.map(c=>`<details><summary>${E(c.Title)}</summary><div class="spbody">${linkify(E(c.Description))}</div></details>`).join('')}</section>`;
    const L=r.lineItems||[];
    if(L.length){
      const tot=L.reduce((a,x)=>a+(x.PriceCents||0),0);

  const filesByJob=new Map(); let libUrl=null;
  async function jobFiles(job){

  /* ── Files library: upload and tag ─────────────────────────────────────────────
     CORE_SelectionFiles is a DOCUMENT LIBRARY. A file is stored in a folder named for the job, then tagged Job + Selection (+ Choice) + Kind
     so every screen finds it. Small files go up in one call, big ones in chunks. A name clash renames the new file; nothing is overwritten or deleted.
     Kind decides who sees it: the Field screen never shows Quote files (they carry prices). */
  const FILE_KINDS=['Image','Manual','Cut sheet','Quote','Other'];
  const FILE_MAX=250*1024*1024, FILE_SIMPLE=4*1024*1024, FILE_CHUNK=320*1024*10;   // chunks must be a multiple of 320 KiB
  let _filesDrive=null;

    return;

/* ── views (prototype P3) ──
   The view title on the desk is the views menu; Edit opens every project with a star (starred = in this view).
   Each person has "My projects" (starts as the projects where they are the LC, becomes their own list once edited)
   plus any views they save. Everyone can open everyone's views; only the owner edits. "All Projects" is last. */
let VIEWS={}, curView=(()=>{try{return localStorage.getItem("bw-view")||""}catch(e){return ""}})(), veMode=null, veFor=null;
const first=s=>String(s||"").trim().split(/\s+/)[0]||"";
const meN=()=>(window.spMe||{}).name||"", meI=()=>(window.spMe||{}).id||"";
const MEF=()=>first(meN());
const lcs=()=>[...new Set(Object.keys(JOBS).map(n=>JOBS[n].lc).filter(Boolean))];
function people(){ const me=MEF(); return [...new Set([me,...lcs().sort(),...Object.values(VIEWS).map(v=>first(v.owner)).sort()])].filter(Boolean); }
function myViewFor(p){
  const d=Object.entries(VIEWS).find(([,v])=>v.kind==="my"&&first(v.owner)===p), name=p===MEF()?"My projects":p+"'s projects";
  return d?{id:"lc:"+p,docId:d[0],name,owner:p,kind:"my",rule:d[1].rule}:{id:"lc:"+p,name,owner:p,kind:"my",rule:{type:"lc",lc:p}};
}
function viewList(){
  const out=[];
  for(const p of people()){ out.push(myViewFor(p)); for(const [id,v] of Object.entries(VIEWS)) if(v.kind!=="my"&&first(v.owner)===p) out.push({id,...v,kind:"view"}); }
  out.push({id:"all",name:"All Projects",kind:"all",rule:{type:"all"}});
  return out;
}
function viewById(id){ return viewList().find(v=>v.id===id)||null; }
function cur(){ return viewById(curView)||viewById("lc:"+MEF())||viewById("all"); }
function viewJobs(v){ const r=(v&&v.rule)||{type:"all"}; return Object.keys(JOBS).filter(n=>r.type==="all"||(r.type==="lc"&&JOBS[n].lc===r.lc)||(r.type==="pick"&&(r.jobs||[]).includes(n))); }
function inView(n){ const v=cur(); return !v||v.rule.type==="all"||viewJobs(v).includes(n); }
const mine=v=>!!v&&(v.kind==="my"?v.owner===MEF():v.kind==="view"&&v.ownerId===meI());
function setView(id){ curView=id; try{localStorage.setItem("bw-view",id)}catch(e){} view="home"; history.replaceState(null,"","#home"); render(); window.scrollTo(0,0); }
const CHEV=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
function viewHead(){
  const v=cur(), n=viewJobs(v).filter(x=>!isArch(x)).length, all=Object.keys(JOBS).filter(x=>!isArch(x)).length;
  const who=v.kind==="all"?"":mine(v)?(v.kind==="my"&&v.rule.type==="lc"?"Projects where you are the LC":"Your view"):esc(v.owner)+"'s view";
  const empty=mine(v)&&!n;
  return `<div class="vhead"><div class="vrow"><button class="vtitle" id="vTitle" aria-haspopup="true" aria-expanded="${!$("#jm").hidden}">${esc(v.name)}${CHEV}</button>
    ${mine(v)?`<button class="vbtn" id="vEdit" aria-haspopup="true" aria-expanded="${!$("#pm").hidden}">Edit</button>`:""}
    ${v.kind==="view"&&!mine(v)?`<button class="vbtn" data-ve-copy="${esc(v.id)}">Copy to my views</button>`:""}</div>
    <div class="vmeta">${who?who+" · ":""}${v.kind==="all"?n+" projects":n+" of "+all+" projects"}${empty?" · Use Edit to star the projects you want here":""}</div></div>`;
}
function jmSync(){
  const b=$("#backBtn"); if(b) b.textContent="← "+cur().name;
  if($("#ps")&&!$("#ps").hidden) psRender();
  if(!$("#jm").hidden) jmRender();
  if(!$("#pm").hidden) pmRender();
}
/* views menu */
function jmRender(){
  const q=($("#jmQ").value||"").trim().toLowerCase(), v=cur(), V=viewList(), me=MEF();
  const hit=x=>!q||[x.name,x.owner].filter(Boolean).join(" ").toLowerCase().includes(q);
  const row=x=>{ const c=viewJobs(x).filter(n=>!isArch(n)).length;
    return `<button class="jm-row jm-view" data-setview="${esc(x.id)}" ${x.id===v.id?'aria-current="true"':""}><span class="jm-mark">${x.id===v.id?"✓":""}</span><span class="jm-name">${esc(x.name)}</span><span class="jm-num">${c} project${c===1?"":"s"}${x.id==="all"?'<kbd class="jm-key">A</kbd>':x.id==="lc:"+MEF()?'<kbd class="jm-key">M</kbd>':""}</span></button>`; };
  let html="";
  const all=V.find(x=>x.id==="all"); if(hit(all)) html+=row(all)+`<div class="jm-sep"></div>`;
  const mineV=V.filter(x=>x.kind!=="all"&&(x.kind==="my"?x.owner===me:mine(x))).filter(hit);
  if(mineV.length||!q){ html+=`<div class="jm-h">My views</div>`+mineV.map(row).join(""); if(!q) html+=`<button class="jm-add" data-ve-new>+ New view</button>`; }
  let ev=""; for(const p of people().filter(p=>p!==me)){ const L=V.filter(x=>x.kind!=="all"&&first(x.owner)===p&&!mine(x)).filter(hit); if(L.length) ev+=`<div class="jm-sub">${esc(p)}</div>`+L.map(row).join(""); }
  if(ev) html+=`<div class="jm-h">Everyone's views</div>`+ev;
  $("#jmList").innerHTML=html||`<div class="jm-empty">No view matches “${esc(q)}”.</div>`;
  $("#jmFoot").innerHTML="";
}
/* Edit: star the projects in this view */
function pmRender(){
  const v=cur(); if(!mine(v)){ pmClose(); return; }
  const q=($("#pmQ").value||"").trim().toLowerCase(), inV=new Set(viewJobs(v));
  const L=Object.keys(JOBS).filter(n=>!isArch(n)).sort((a,b)=>a.localeCompare(b)).filter(n=>{ const d=JOBS[n]||{}; return !q||[n,d.address,d.client,d.lc].filter(Boolean).join(" ").toLowerCase().includes(q); });
  $("#pmHead").innerHTML=`Star the projects that belong in <span class="pm-vname">${esc(v.name)}</span>. The list is every active project on the Pipeline.`;
  $("#pmList").innerHTML=L.map(n=>{ const on=inV.has(n), s=jobStats(n), d=JOBS[n]||{};
    return `<button class="pm-row" data-star="${esc(n)}" aria-pressed="${on}"><span class="pm-star" aria-hidden="true">${on?"★":"☆"}</span><span class="jm-name">${esc(n)}</span><span class="jm-num">${s.n?s.inn+" of "+s.n+" in":"No selections yet"}</span><span class="jm-meta">${d.lc?"LC "+esc(d.lc):"No LC yet"}</span></button>`; }).join("")||`<div class="jm-empty">No project matches “${esc(q)}”.</div>`;
  $("#pmFoot").innerHTML=`<span>${inV.size} starred</span>`+(v.kind==="view"?`<span><button class="jm-link" data-ve-rename>Rename</button><button class="jm-link" data-ve-del>Delete view</button></span>`:"")+`<button class="jm-link" data-pm-done>Done</button>`;
}
async function toggleStar(n){
  const v=cur(); if(!mine(v)) return;
  const jobs=new Set(v.rule.type==="pick"?(v.rule.jobs||[]):viewJobs(v));
  jobs.has(n)?jobs.delete(n):jobs.add(n);
  const rule={type:"pick",jobs:[...jobs]};
  const id=v.kind==="my"?(v.docId||"my-"+meI()):v.id;
  const doc=v.kind==="my"?{kind:"my",name:"My projects",owner:meN(),ownerId:meI(),rule,updatedAt:Date.now()}:{...VIEWS[v.id],rule,updatedAt:Date.now()};
  try{ await db.collection("views").doc(id).set(doc); }catch(e){ toast("Didn't save – try again"); }
}
/* popups */
function place(el,anchor,w){ const b=anchor.getBoundingClientRect(); w=Math.min(w,innerWidth-32); el.style.top=(b.bottom+8)+"px"; el.style.left=Math.max(16,Math.min(b.left,innerWidth-16-w))+"px"; }
function jmOpen(){ pmClose(); $("#jmQ").value=""; jmRender(); $("#jm").hidden=false; place($("#jm"),$("#vTitle"),380); syncAria(); setTimeout(()=>$("#jmQ").focus(),0); }
function jmClose(){ if($("#jm").hidden) return; $("#jm").hidden=true; syncAria(); }
function pmOpen(){ jmClose(); $("#pmQ").value=""; $("#pm").hidden=false; pmRender(); place($("#pm"),$("#vEdit")||$("#vTitle"),380); syncAria(); setTimeout(()=>$("#pmQ").focus(),0); }
function pmClose(){ if($("#pm").hidden) return; $("#pm").hidden=true; syncAria(); }
function syncAria(){ const t=$("#vTitle"), e=$("#vEdit"); if(t) t.setAttribute("aria-expanded",String(!$("#jm").hidden)); if(e) e.setAttribute("aria-expanded",String(!$("#pm").hidden)); }
$("#jmQ").addEventListener("input",jmRender);
$("#pmQ").addEventListener("input",pmRender);
for(const id of ["#jm","#pm"]) $(id).addEventListener("keydown",e=>{
  const rows=[...$(id).querySelectorAll(".jm-row,.pm-row")]; let i=rows.findIndex(r=>r.classList.contains("kb"));
  if(e.key==="Escape"){ e.stopPropagation(); id==="#jm"?jmClose():pmClose(); const f=id==="#jm"?$("#vTitle"):$("#vEdit"); if(f) f.focus(); }
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!rows.length) return; if(i>=0) rows[i].classList.remove("kb"); i=e.key==="ArrowDown"?Math.min(rows.length-1,i+1):Math.max(0,i-1); rows[i].classList.add("kb"); rows[i].scrollIntoView({block:"nearest"}); }
  else if(e.key==="Enter"&&e.target.matches("input")){ e.preventDefault(); const r=rows[i>=0?i:0]; if(r) r.click(); }
});
/* name dialog: new view, copy, rename */
function veOpen(mode,v){
  veMode=mode; veFor=v||null;
  $("#veTitle").textContent=mode==="rename"?"Rename view":mode==="copy"?"Copy view":"New view";
  $("#veName").value=mode==="rename"?v.name:mode==="copy"?v.name+" (copy)":"";
  $("#veSave").textContent=mode==="rename"?"Save":mode==="copy"?"Copy view":"Create view";
  $("#veMsg").textContent=""; $("#ve").hidden=false; setTimeout(()=>$("#veName").focus(),0);
}
function veClose(){ $("#ve").hidden=true; }
$("#veCancel").addEventListener("click",veClose);
$("#ve").addEventListener("click",e=>{ if(e.target.id==="ve") veClose(); });
$("#ve").addEventListener("keydown",e=>{ if(e.key==="Escape"){ e.stopPropagation(); veClose(); } if(e.key==="Enter"&&e.target.id==="veName"){ e.preventDefault(); $("#veSave").click(); } });
$("#veSave").addEventListener("click",async()=>{
  const name=$("#veName").value.trim(); if(!name){ $("#veMsg").textContent="Give the view a name."; return; }
  $("#veSave").disabled=true;
  try{
    if(veMode==="rename"){ await db.collection("views").doc(veFor.id).set({...VIEWS[veFor.id],name,updatedAt:Date.now()}); veClose(); toast("Renamed"); }
    else{ const id="v"+Date.now().toString(36), rule=veMode==="copy"?{type:"pick",jobs:viewJobs(veFor)}:{type:"pick",jobs:[]};
      await db.collection("views").doc(id).set({kind:"view",name,rule,owner:meN(),ownerId:meI(),createdAt:Date.now()});
      veClose(); setView(id); if(veMode==="new") setTimeout(pmOpen,60); toast(veMode==="copy"?"Copied – it's yours to change":"View created – star its projects"); }
  }catch(e){ $("#veMsg").textContent="Didn't save – try again."; }
  finally{ $("#veSave").disabled=false; }
});
document.addEventListener("click",e=>{
  if(e.target.closest("#vTitle")){ e.stopPropagation(); $("#jm").hidden?jmOpen():jmClose(); return; }
  if(e.target.closest("#vEdit")){ e.stopPropagation(); $("#pm").hidden?pmOpen():pmClose(); return; }
  const sv=e.target.closest("[data-setview]"); if(sv){ jmClose(); setView(sv.dataset.setview); return; }
  const st=e.target.closest("[data-star]"); if(st){ toggleStar(st.dataset.star); return; }
  if(e.target.closest("[data-pm-done]")){ pmClose(); return; }
  if(e.target.closest("[data-ve-new]")){ jmClose(); veOpen("new"); return; }
  if(e.target.closest("[data-ve-rename]")){ pmClose(); veOpen("rename",cur()); return; }
  const cp=e.target.closest("[data-ve-copy]"); if(cp){ veOpen("copy",viewById(cp.dataset.veCopy)); return; }
  if(e.target.closest("[data-ve-del]")){ const v=cur(), was=VIEWS[v.id]; pmClose();
    db.collection("views").doc(v.id).delete().then(()=>{ setView("lc:"+MEF()); undoToast("View deleted",async()=>{ await db.collection("views").doc(v.id).set(was); }); }).catch(()=>toast("Didn't delete – try again")); return; }
  if(!$("#jm").hidden&&!$("#jm").contains(e.target)) jmClose();
  if(!$("#pm").hidden&&!$("#pm").contains(e.target)) pmClose();
},true);
addEventListener("resize",()=>{ if(!$("#jm").hidden&&$("#vTitle")) place($("#jm"),$("#vTitle"),380); if(!$("#pm").hidden&&$("#vEdit")) place($("#pm"),$("#vEdit"),380); });

/* ── project switcher on project pages (prototype P4) ── */
function psRender(){
  const q=($("#psQ").value||"").trim().toLowerCase(), v=cur();
  const hit=n=>{ if(!q) return true; const d=JOBS[n]||{}; return [n,d.address,d.neighborhood,d.client,d.lc].filter(Boolean).join(" ").toLowerCase().includes(q); };
  const row=n=>{ const s=jobStats(n), nx=nextMs(n), on=n===job, d=JOBS[n]||{};
    return `<button class="jm-row" data-job="${esc(n)}" ${on?'aria-current="true"':""}><span class="jm-mark">${on?"✓":""}</span><span class="jm-name">${esc(n)}</span><span class="jm-num">${s.n?s.inn+" of "+s.n+" in":"No selections yet"}</span>
      <span class="jm-meta ${nx&&nx.soon?"soon":""}">${d.lc?"LC "+esc(d.lc):"No LC"}${nx?" · Next: "+esc(nx.label)+" · "+fmtDate(nx.date):""}</span></button>`; };
  const act=Object.keys(JOBS).filter(n=>!isArch(n)).sort((a,b)=>a.localeCompare(b));
  const inV=act.filter(n=>inView(n)&&hit(n)), out=act.filter(n=>!inView(n)&&hit(n));
  let html="";
  if(inV.length) html+=`<div class="jm-h">${v.kind==="all"?"All Projects":"In "+esc(v.name)}</div>`+inV.map(row).join("");
  if(out.length) html+=`<div class="jm-h">Other projects</div>`+out.map(row).join("");
  $("#psList").innerHTML=html||`<div class="jm-empty">No project matches “${esc(q)}”.</div>`;
}
function psOpen(){ jmClose(); pmClose(); $("#psQ").value=""; psRender(); $("#ps").hidden=false; place($("#ps"),$("#pswBtn"),380); $("#pswBtn").setAttribute("aria-expanded","true"); setTimeout(()=>$("#psQ").focus(),0); }
function psClose(){ if($("#ps").hidden) return; $("#ps").hidden=true; $("#pswBtn").setAttribute("aria-expanded","false"); }
$("#psQ").addEventListener("input",psRender);
$("#ps").addEventListener("keydown",e=>{
  const rows=[...$("#psList").querySelectorAll(".jm-row")]; let i=rows.findIndex(r=>r.classList.contains("kb"));
  if(e.key==="Escape"){ e.stopPropagation(); psClose(); $("#pswBtn").focus(); }
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!rows.length) return; if(i>=0) rows[i].classList.remove("kb"); i=e.key==="ArrowDown"?Math.min(rows.length-1,i+1):Math.max(0,i-1); rows[i].classList.add("kb"); rows[i].scrollIntoView({block:"nearest"}); }
  else if(e.key==="Enter"&&e.target.matches("input")){ e.preventDefault(); const r=rows[i>=0?i:0]; if(r) r.click(); }
});
document.addEventListener("click",e=>{

addEventListener("resize",()=>{ if(!$("#ps").hidden) place($("#ps"),$("#pswBtn"),380); });

/* ── project name as the switcher; M / A shortcuts (prototype P7) ── */
function ptitle(){ return `<button class="ptitle" id="pswBtn" aria-haspopup="true" aria-expanded="${!$("#ps").hidden}" aria-label="Switch project, now ${esc(job)}">${esc(job)}${CHEV}</button>`; }
function keyTo(id){
  jmClose(); pmClose(); psClose();
  if(cur().id===id&&view==="home") return;
  setView(id); toast((viewById(id)||{}).name||"");
}
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.repeat) return;
  const t=e.target; if(t&&t.closest&&t.closest("input,textarea,select,[contenteditable],dd[data-inline]")) return;

render();
(async()=>{
  if(!window.claude||!window.claude.use){loadError="Couldn\u2019t start: sign-in isn\u2019t available.";render();return}
  user=await window.claude.use("user");
  db=await window.claude.use("db");
  assets=await window.claude.use("assets");
  downloads=await window.claude.use("downloads").catch(()=>null);
  sampler=await window.claude.use("sample").catch(()=>null);
  if(!db){loadError="Sign in to see selections.";render();return}
  if(user){const c=await user.can("data.write");canWrite=c!==false;canEditSel=await user.canEdit().catch(()=>false)}
  db.collection("jobs").limit(200).onSnapshot(snap=>{
    const J={};snap.docs.map(d=>({...d.data(),_id:d.id})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(d=>{if(d&&d.name)J[d.name]=d});JOBS=J;jobsReady=true;
    if(!JOBS[job])job=Object.keys(JOBS).find(n=>!JOBS[n].archived)||Object.keys(JOBS)[0]||"";if(isArch(job))showArchived=true;render();
  },()=>{});
  db.collection("views").limit(500).onSnapshot(snap=>{ VIEWS={}; snap.docs.forEach(d=>{ VIEWS[d.id]=d.data(); }); render(); },()=>{});
  let gotItems=false,gotChecks=false;
  db.collection("items").limit(1000).onSnapshot(snap=>{
    rawItems=snap.docs.map(d=>({id:d.id,...d.data()}));gotItems=true;merge();ready=gotItems;render();
  },err=>{loadError=(err&&err.message)||"Connection lost.";render()});
  db.collection("trips").limit(1000).onSnapshot(snap=>{trips=snap.docs.map(d=>({id:d.id,...d.data()}));if(view==="pull")render()},()=>{});
  db.collection("receipts").limit(1000).onSnapshot(snap=>{receipts=snap.docs.map(d=>({id:d.id,...d.data()}));render();if(rcptOpen&&sheetMode==="receipt"){}},()=>{});
  db.collection("checkins").limit(1000).onSnapshot(snap=>{
    checks={};snap.docs.forEach(d=>{checks[d.id]=d.data()});gotChecks=true;merge();render();
  },()=>{});
})();
})();
