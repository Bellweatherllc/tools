<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263860">
<title>Selections · Warehouse</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://bellweatherllc.github.io/tools/logos/favicon-32.png?v=6">
<link rel="icon" type="image/x-icon" href="https://bellweatherllc.github.io/tools/logos/favicon.ico?v=6">
<link rel="icon" type="image/svg+xml" sizes="any" href="https://bellweatherllc.github.io/tools/logos/favicon.svg?v=6">
<link rel="apple-touch-icon" href="https://bellweatherllc.github.io/tools/logos/apple-touch-icon.png?v=6">
<style>
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_DemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-MediumItalic.woff2') format('woff2');font-weight:500;font-style:italic;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Italic.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap;}
:root{
  --ink:#101820; --ink-2:#3d4247; --muted:#6f7276; --line:#e4e0d6; --line-2:#d6d2c4;
  --paper:#ffffff; --wash:#f5f3ee; --band:#e9e5db;
  --go:#4a6b52; --go-bg:#e4e9de; --warn:#9a4a33; --warn-bg:#f3e2da; --amber:#86662a; --amber-bg:#f1e9d9;
  --canvas:#f2f3f4; --cardline:#e1e3e6; --badge:#ef4444;
  --serif:"Swear Text",Georgia,"Times New Roman",serif;
  --sans:"TT Norms Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --rail:132px; --panel:400px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#f2efe8; --ink-2:#cdc8bc; --muted:#a3a5a7; --line:#2c3034; --line-2:#3d4246;
  --paper:#121518; --wash:#1b1f23; --band:#24292d;
  --go:#a9c4ad; --go-bg:#22302a; --warn:#e8a58e; --warn-bg:#3a241d; --amber:#dcc08a; --amber-bg:#33291a;
  --canvas:#121518; --cardline:#3d4246; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#f2efe8; --ink-2:#cdc8bc; --muted:#a3a5a7; --line:#2c3034; --line-2:#3d4246;
  --paper:#121518; --wash:#1b1f23; --band:#24292d;
  --go:#a9c4ad; --go-bg:#22302a; --warn:#e8a58e; --warn-bg:#3a241d; --amber:#dcc08a; --amber-bg:#33291a;
  --canvas:#121518; --cardline:#3d4246; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100dvh}
/* CORE Tool Topbar, same as the LC screen */
.bwtb{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:0 24px;min-height:56px;background:#263860;border-bottom:1px solid rgba(255,255,255,.14);color:#fff;font-family:var(--sans)}
.bwtb-left{display:flex;align-items:center;gap:16px;min-width:0;overflow:hidden}
.bwtb-logo{height:28px;width:auto;flex-shrink:0;display:block}
.bwtb-div{width:1px;height:28px;background:rgba(255,255,255,.18);flex-shrink:0}
.bwtb-title{font:500 18px/1.1 'Swear Text',Georgia,serif;color:#fff;white-space:nowrap}
.bwtb-title em{font-style:italic;opacity:.8}
.bwtb-sub{font:500 10px/1.2 var(--sans);color:#B7A9A3;text-transform:uppercase;letter-spacing:2px;margin-top:3px;white-space:nowrap}
.bwtb-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.bwtb-ver{font:700 10px/1 var(--sans);color:#ef4444;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:2px 7px;letter-spacing:.5px}
.bwtb-dot{width:8px;height:8px;border-radius:50%;background:#B7A9A3;flex-shrink:0}
.bwtb-dot.on{background:#2d8a5e}
.bwtb-link{font:600 11px/1 var(--sans);letter-spacing:.5px;color:rgba(255,255,255,.75);background:none;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--canvas);border-bottom:1px solid var(--ink);padding-left:max(20px,env(safe-area-inset-left))}
.jobs{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.jobs::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:0 15px;min-height:42px;white-space:nowrap;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.search{min-height:42px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:var(--paper);width:300px;max-width:34vw}
.body{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--panel);min-height:0}
.body.nopanel{grid-template-columns:var(--rail) minmax(0,1fr) 0}
nav.rail{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 0;padding-left:env(safe-area-inset-left)}
nav.rail button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;min-height:88px;padding:8px 6px;font-size:14px;font-weight:500;color:var(--ink-2);position:relative;text-align:center;line-height:1.2}
nav.rail button svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.rail button[aria-current="page"]{color:var(--ink);background:var(--canvas)}
nav.rail button[aria-current="page"]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;background:var(--ink);border-radius:0 4px 4px 0}
.cnt{display:inline-block;min-width:22px;padding:0 7px;border-radius:999px;background:var(--band);color:var(--ink);font-size:13px;font-weight:600;line-height:22px;text-align:center}
.cnt.hot{background:var(--warn);color:var(--paper)}
nav.rail .cnt{position:absolute;top:10px;right:18px}
nav.rail .spacer{flex:1}
nav.rail .small{min-height:56px;font-size:13px;color:var(--muted)}
main{overflow-y:auto;background:var(--canvas);padding:24px 28px 80px;min-width:0;-webkit-overflow-scrolling:touch}
h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;letter-spacing:-.01em;margin:0 0 6px}
.lede{color:var(--ink-2);margin:0 0 18px}
.late{color:var(--warn);font-weight:600}
.amber{color:var(--amber);font-weight:600}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:15px}
.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:600}
.card{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--cardline);border-radius:12px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;min-height:72px}
button.card:active{background:var(--band)}
.card[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.card .main{flex:1;min-width:0}
.card .t{font-weight:600;font-size:18px}
.card .s{color:var(--muted);font-size:15px;margin-top:2px}
.card .side{text-align:right;white-space:nowrap;font-size:15px}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);flex:none}
.jobhead{display:flex;align-items:center;gap:10px;font-weight:600;margin:22px 0 10px;font-size:17px}
.jobhead:first-of-type{margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;font-size:17px}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line-2)}
.btn.small{min-height:44px;padding:0 16px;font-size:15px}
.btn.warn{background:var(--warn);border-color:var(--warn)}
.btn[disabled]{opacity:.4}
.btn.block{width:100%}
.link{background:none;border:0;padding:8px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.empty{background:var(--paper);border:1px dashed var(--cardline);border-radius:12px;padding:28px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}
.tag{display:inline-block;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--band);color:var(--ink-2)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.go{background:var(--go-bg);color:var(--go)}
.tag.amber{background:var(--amber-bg);color:var(--amber)}

/* panel */
aside.panel{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;padding:20px 20px 100px;min-width:0;-webkit-overflow-scrolling:touch}
.body.nopanel aside.panel{display:none}
.phead{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.phead h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;flex:1;line-height:1.2}
.x{border:0;background:var(--wash);border-radius:50%;width:44px;height:44px;font-size:22px;line-height:1;flex:none}
.pmeta{color:var(--muted);font-size:15px;margin-bottom:14px}
.field{display:block;margin:16px 0}
.field>span{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;min-height:50px;border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;background:var(--paper)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--paper);min-height:44px;font-size:15px;font-weight:500;border-left:1px solid var(--line-2);padding:0 6px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[aria-pressed="true"].bad{background:var(--warn);color:#fff}
.line{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.line.off{opacity:.55}
.line .row{display:flex;gap:12px;align-items:flex-start}
.line .row label{display:flex;gap:12px;align-items:flex-start;flex:1;min-height:44px}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--ink);flex:none;margin:0}
.line .seg{margin-top:10px}
.line .cnote{margin-top:8px;width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:10px;padding:8px 12px}
.baypick{display:grid;grid-template-columns:28px repeat(var(--cols),1fr);gap:6px;align-items:center}
.baypick .rl{font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.baypick button{min-height:48px;border:1px solid var(--line-2);border-radius:10px;background:var(--paper);font-weight:600;font-size:15px;position:relative;padding:0}
.baypick button.has{background:var(--band)}
.baypick button.mine{border:2px solid var(--jc,var(--ink))}
.baypick button.mine::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--jc,var(--ink))}
.baypick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bayextra{display:flex;gap:8px;margin-top:8px}
.bayextra button{flex:1;min-height:48px;border:1px solid var(--line-2);border-radius:10px;background:var(--paper);font-weight:600}
.bayextra button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hint{font-size:14px;color:var(--ink-2);background:var(--wash);border-radius:10px;padding:8px 12px;margin-top:8px}
.pfoot{position:sticky;bottom:-100px;background:var(--paper);padding:14px 0 0;margin-top:18px;border-top:1px solid var(--line);display:flex;gap:10px}
.pfoot .btn{flex:1}

/* bays */
.bays{display:flex;flex-direction:column;gap:8px;margin:8px 0 10px}
.bayrow{display:grid;grid-template-columns:24px repeat(var(--cols),minmax(0,1fr));gap:8px;align-items:stretch}
.bayrl{width:24px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
.bay{min-width:0;min-height:92px;border:1px solid var(--cardline);border-radius:10px;background:var(--paper);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:9px 11px;text-align:left}
.bay.empty{background:transparent;border-style:dashed;border-color:#d3d6da;color:var(--muted)}
.bay.miss{border-color:var(--warn);border-width:2px}
.bay[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.bay:active{border-color:var(--ink)}
.baytop{display:flex;justify-content:space-between;align-items:baseline;width:100%}
.bayid{font-size:13px;font-weight:600;color:var(--muted)}
.baycnt{font-family:var(--serif);font-size:24px;line-height:1}
.baynames{display:flex;flex-direction:column;gap:1px;margin-top:4px;width:100%}
.baynames span{display:flex;align-items:center;gap:5px;font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baynames i,.baylegend i{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.baynames em,.baylegend em{font-style:normal;color:var(--muted)}
.baynames .more{color:var(--muted)}
.baylegend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:14px;margin:4px 0 18px}
.baylegend span{display:inline-flex;align-items:center;gap:6px}
.stoksec{border-top:2px solid var(--ink);margin:22px 0 0;padding-top:10px}
.stoksec h4{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 4px}
.stoksec.warn h4{color:var(--warn)}
.stoksec>p{font-size:14px;color:var(--ink-2);margin:0 0 6px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:14px;color:var(--muted)}

/* pull */
.pullrow{display:flex;align-items:center;gap:16px;background:var(--paper);border:1px solid var(--cardline);border-radius:12px;padding:12px 16px;margin-bottom:8px;min-height:72px}
.pullrow.done{background:var(--go-bg);border-color:transparent}
.pullrow.done .t{text-decoration:line-through;text-decoration-color:var(--go)}
.pullrow label{display:flex;gap:16px;align-items:center;flex:1;min-width:0}
.pullrow input[type=checkbox]{width:34px;height:34px}
.bayhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px}
.bayhead b{font-size:22px;font-family:var(--serif);font-weight:500}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.filters .chip{min-height:40px;font-size:15px}
.stickybar{position:sticky;bottom:-80px;margin:18px -24px -80px;padding:12px 24px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--ink);display:flex;align-items:center;gap:12px}
.stickybar .grow{flex:1}

/* stock */
.tabs2{display:inline-flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;margin-bottom:16px}
.tabs2 button{border:0;background:var(--paper);min-height:48px;padding:0 20px;font-weight:600}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* changes drawer + toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);visibility:hidden;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 14px 12px 20px;display:flex;align-items:center;gap:16px;transition:transform .2s;z-index:50;max-width:92vw}
.toast.show{transform:translateX(-50%);visibility:visible}
.toast button{background:none;border:1px solid var(--paper);color:var(--paper);border-radius:10px;min-height:40px;padding:0 14px;font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--paper);z-index:40;transform:translateX(100%);transition:transform .2s;overflow-y:auto;padding:20px 20px 60px}
.drawer.open{transform:none}
.chg{font-size:14px;border-bottom:1px solid var(--line);padding:10px 0}
.chg code{font-size:13px;background:var(--wash);padding:1px 5px;border-radius:5px}
.chg .w{color:var(--muted)}

/* portrait tablet / small: rail to bottom, panel to sheet */
@media (max-width:960px){
  :root{--rail:0px}
  .body,.body.nopanel{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:fixed;left:0;right:0;bottom:0;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom);z-index:20}
  nav.rail button{flex:1;min-height:72px}
  nav.rail button[aria-current="page"]::before{left:16px;right:16px;top:0;bottom:auto;width:auto;height:4px;border-radius:0 0 4px 4px}
  nav.rail .cnt{right:auto;left:calc(50% + 6px);top:6px}
  nav.rail .spacer,nav.rail .small{display:none}
  main{padding-bottom:120px}
  aside.panel{position:fixed;left:0;right:0;bottom:0;height:82dvh;border-left:0;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);z-index:35;transform:translateY(105%);transition:transform .22s}
  .body:not(.nopanel) aside.panel{transform:none}
  .body.nopanel aside.panel{display:block}
  .search{width:200px}
  .stickybar{position:fixed;left:0;right:0;bottom:var(--railh,73px);margin:0;z-index:15}
  main{padding-bottom:200px}
}
@media (max-width:640px){
  .bwtb{padding:0 16px;gap:12px}.bwtb-div{display:none}.bwtb-logo{height:24px}
  .search{width:140px}
  .bayrow{gap:4px;grid-template-columns:18px repeat(var(--cols),minmax(0,1fr))}.bay{min-height:72px;padding:6px 7px}.baynames span{font-size:11.5px}
}
#gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--canvas)}
#gate .btn{margin-top:12px}
.hidden{display:none!important}
#tt{position:fixed;z-index:70;pointer-events:none;background:#282828;color:#fff;font:400 12px/1.4 var(--sans);padding:6px 9px;border-radius:5px;max-width:260px;opacity:0;transition:opacity .1s}
#tt.show{opacity:1}
#tt .tt-d{opacity:.75;margin-top:2px}
.loading{padding:40px 0;color:var(--muted)}
</style>
</head>
<body>
<div id="gate" class="hidden"><div>
  <p>Sign in with your Bellweather Microsoft account to use the warehouse screen.</p>
  <button class="btn" id="signInBtn">Sign in</button>
  <p class="note" id="gateMsg"></p>
</div></div>
<div id="appWrap" class="hidden">
<div class="app">
  <div>
  <header class="bwtb"><div class="bwtb-left"><img class="bwtb-logo" src="https://bellweatherllc.github.io/tools/logos/Monogram-W.svg" alt="Bellweather"><div class="bwtb-div"></div><div style="min-width:0"><div class="bwtb-title"><span class="bwtb-app">Selections </span><em>Warehouse</em></div><div class="bwtb-sub" id="bwtbSub"></div></div></div><div class="bwtb-right"><span class="bwtb-ver" id="versionBadge"></span><span class="bwtb-dot" id="bwtbDot"></span><span class="bwtb-conn" id="bwtbConn">Connecting…</span></div></header>
  <div class="top">

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="../lib/sherpa-auth.js"></script>
<script>
/* topbar: SharePoint connection state (green dot = connected) */
function bwConn(ok,label){ const d=document.getElementById('bwtbDot'), l=document.getElementById('bwtbConn'); if(d) d.classList.toggle('on',!!ok); if(l) l.textContent=label||(ok?'SharePoint':'Not connected'); }
function bwSub(t){ const el=document.getElementById('bwtbSub'); if(el) el.textContent=t; }
const CORE_VERSION = 'v6';
(()=>{['versionBadge'].forEach(id=>{const el=document.getElementById(id); if(el) el.textContent=CORE_VERSION;});})();
/* tooltip engine: data-tip (+ optional data-tip-d detail line); hover devices only */
(()=>{const TT=document.getElementById('tt'); if(!TT||!matchMedia('(hover: hover)').matches) return;
  const tipOf=t=>{const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); const d=t.getAttribute('data-tip-d'); return e(t.getAttribute('data-tip'))+(d?'<div class="tt-d">'+e(d)+'</div>':'');};
  const move=e=>{const r=TT.getBoundingClientRect(); let x=e.clientX+12, y=e.clientY+14; if(x+r.width>innerWidth-8) x=e.clientX-r.width-12; if(y+r.height>innerHeight-8) y=e.clientY-r.height-14; TT.style.left=x+'px'; TT.style.top=y+'px';};
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t) return; TT.innerHTML=tipOf(t); TT.classList.add('show'); move(e);});
  document.addEventListener('mousemove',e=>{ if(TT.classList.contains('show')) move(e); });
  document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(t&&!(t.contains&&t.contains(e.relatedTarget))) TT.classList.remove('show');});
})();

"use strict";
/* ── Data: SharePoint (BWCore). One indexed Job query per active job, never a whole list.
   Saves: BT fields OnHandLocation, DateReceived, ReceivedBy on CORE_Selections (listed in CoreEditedFields so Import keeps them);
   warehouse state in OpsData.checkin, with the names the LC and Field screens use (condition, damageNote, receivedAt, pulledAt,
   pulledBy, pulledFrom, returnNeeded, returnReason, returnedAt, auditedAt, auditMissing, moves).
   Unlisted deliveries and shop stock: CORE_SelectionDesignDocs, Job = _shared, Collection = unknownItems / shopStock. ── */
const GRAPH='https://graph.microsoft.com/v1.0';
const LISTS=GRAPH+'/sites/bellweather.sharepoint.com:/sites/BWCore:/lists';
async function gAll(url){ let out=[], next=url; while(next){ const j=await SherpaAuth.graph(next); out=out.concat(j.value||[]); next=j['@odata.nextLink']||null; } return out; }
async function gSend(url,method,body){ for(let a=0;;a++){ try{ return await SherpaAuth.graph(url,{method,body:body===undefined?undefined:JSON.stringify(body)}); }catch(e){ if([429,503,504].includes(e.status)&&a<5){ await new Promise(r=>setTimeout(r,1500*2**a)); continue; } throw e; } } }
const jobFilter=job=>`$filter=fields/Job eq '${encodeURIComponent(String(job).replace(/'/g,"''"))}'`;
const SEL_FIELDS='Title,Job,Category,Location,Ordered,OrderDate,LeadTime,OnHandLocation,DateReceived,ReceivedBy,DesignStatus,DesignKey,OpsData,CoreEditedFields';
const CH_FIELDS='Title,Job,SelectionLookupId,Description,ChoiceStatus';
const DOC_FIELDS='Title,Job,Collection,DocId,Data';
const parseJ=v=>{ try{ const o=JSON.parse(v||'{}'); return o&&typeof o==='object'?o:{}; }catch(e){ return {}; } };
const day=v=>v?String(v).slice(0,10):null;
const TODAY=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
let ME='', JOBS=[], items=[], unknown=[], stock=[], loaded=false, loadErr=null;
const JCOL=["#4a6b52","#9a4a33","#4d6478","#86662a","#7a5a78","#5f6b3a"];
const jobColor=j=>JCOL[Math.max(0,JOBS.indexOf(j))%JCOL.length];
// model numbers written in the choice description ("Model: K-2209-0", "SKU: …"), so the number on the box finds the item
function models(desc){ const out=[]; for(const l of String(desc||'').split('\n')){ const re=/\b(?:model(?:\s*(?:#|no\.?|number))?|sku|item(?:\s*#)?)\s*[:#]\s*([A-Z0-9][A-Z0-9#./-]{3,30})/ig; let m; while((m=re.exec(l))) out.push(m[1].replace(/[.,;]$/,'')); } return out; }
async function loadJobs(){
  try{ const rows=await gAll(`${LISTS}/CORE_SelectionJobs/items?$expand=fields($select=Title,Job,Archived)&$top=999`);
    if(rows.length) return rows.map(x=>({name:x.fields.Job||x.fields.Title,archived:!!x.fields.Archived})).filter(j=>j.name).sort((a,b)=>a.name.localeCompare(b.name)); }
  catch(e){ if(!e||e.status!==404) throw e; }
  const rows=await gAll(`${LISTS}/CORE_Selections/items?$expand=fields($select=Job)&$top=999`);
  return [...new Set(rows.map(x=>x.fields.Job).filter(Boolean))].sort().map(name=>({name,archived:false}));
}
async function loadJob(job){
  const [sel,cho]=await Promise.all([
    gAll(`${LISTS}/CORE_Selections/items?${jobFilter(job)}&$expand=fields($select=${SEL_FIELDS})&$top=999`),
    gAll(`${LISTS}/CORE_SelectionChoices/items?${jobFilter(job)}&$expand=fields($select=${CH_FIELDS})&$top=999`)]);
  const chBy=new Map();
  for(const c of cho){ if(c.fields.ChoiceStatus&&c.fields.ChoiceStatus!=='Selected') continue; const k=String(c.fields.SelectionLookupId); if(!chBy.has(k)) chBy.set(k,[]); chBy.get(k).push(c.fields); }
  return sel.filter(x=>x.fields.DesignStatus!=='removed').map(x=>{ const f=x.fields, chs=chBy.get(String(x.id))||[], ops=parseJ(f.OpsData);
    if(!ops.checkin||typeof ops.checkin!=='object') ops.checkin={};
    return {id:String(x.id),spId:String(x.id),key:f.DesignKey||('sp-'+x.id),Job:f.Job||job,Title:f.Title||'',Category:f.Category||'',Location:f.Location||'',
      Ordered:f.Ordered||'',OrderDate:day(f.OrderDate),LeadTime:f.LeadTime||'',OnHandLocation:normLoc(f.OnHandLocation),DateReceived:day(f.DateReceived),ReceivedBy:f.ReceivedBy||'',
      ChoiceTitle:(chs[0]&&chs[0].Title)||'',models:[...new Set(chs.flatMap(c=>models(c.Description)))],
      edited:new Set(String(f.CoreEditedFields||'').split(',').map(s=>s.trim()).filter(Boolean)),OpsData:ops}; });
}
async function loadShared(){
  try{ const rows=await gAll(`${LISTS}/CORE_SelectionDesignDocs/items?$filter=fields/Job eq '_shared'&$expand=fields($select=${DOC_FIELDS})&$top=999`);
    unknown=rows.filter(r=>r.fields.Collection==='unknownItems').map(r=>{ const d=parseJ(r.fields.Data); return {id:String(r.id),spId:String(r.id),raw:d,desc:d.what||d.model||'Unknown item',model:d.model||'',label:d.job||'',OnHandLocation:normLoc(d.bay)||'',date:day(d.at)||'',by:d.by||'',resolvedAt:d.resolvedAt||null}; });
    stock=rows.filter(r=>r.fields.Collection==='shopStock').map(r=>({...parseJ(r.fields.Data),id:String(r.id),spId:String(r.id)})); }
  catch(e){ console.warn('Warehouse: could not read CORE_SelectionDesignDocs',e); }
}
// one shared doc (unknownItems / shopStock): Data is the whole JSON object
async function saveShared(coll,obj){
  const data={...obj}; delete data.id; delete data.spId; delete data.raw;
  if(obj.spId){ await gSend(`${LISTS}/CORE_SelectionDesignDocs/items/${obj.spId}/fields`,'PATCH',{Data:JSON.stringify(data)}); return obj.spId; }
  const docId=(coll==='unknownItems'?'u':'s')+Date.now().toString(36);
  const r=await gSend(`${LISTS}/CORE_SelectionDesignDocs/items`,'POST',{fields:{Title:coll+'/'+docId,Job:'_shared',Collection:coll,DocId:docId,Data:JSON.stringify(data)}});
  return String(r.id);
}
// Bays: the LC screen's default (A–G × 1–5) plus any bay found in the data.
let BAYS=[],ROWS=[],MAXCOL=5;
const rowBays=r=>BAYS.filter(b=>b[0]===r);
function computeBays(){ const S=new Set(); for(const r of "ABCDEFG") for(let n=1;n<=5;n++) S.add(r+n);
  for(const r of [...items,...unknown,...stock]) if(/^stokley/i.test(r.OnHandLocation||r.bay||"")) for(const m of String(r.OnHandLocation||r.bay).matchAll(/\b([A-Z])\s?-?(\d{1,2})\b/g)) S.add(m[1]+m[2]);
  BAYS=[...S].sort((a,b)=>a[0].localeCompare(b[0])||parseInt(a.slice(1))-parseInt(b.slice(1)));
  ROWS=[...new Set(BAYS.map(b=>b[0]))]; MAXCOL=Math.max(1,...ROWS.map(r=>rowBays(r).length)); }
computeBays();
/* ---------- helpers ---------- */

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayDiff=d=>Math.round((new Date(d+"T12:00:00")-new Date(TODAY+"T12:00:00"))/864e5);
const fmtDate=d=>{if(!d)return "";const t=new Date(d+"T12:00:00");return isNaN(t)?d:t.toLocaleDateString(undefined,{month:"short",day:"numeric"})};
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
function normLoc(v){
  v=String(v||"").trim().replace(/\s+/g," "); if(!v||/^n\/?a$/i.test(v))return null;
  if(/^[A-Z]\s?-?\d{1,2}$/i.test(v))return "Stokley, "+v.replace(/[\s-]/g,"").toUpperCase();
  return v;
}
const isStokley=loc=>/^stokley/i.test(loc||"");
const baysOf=loc=>isStokley(loc)?[...String(loc).matchAll(/\b([A-Z])\s?-?(\d{1,2})\b/g)].map(m=>m[1]+m[2]).filter(b=>BAYS.includes(b)):[];
const vendorOf=r=>{const m=String(r.Ordered||"").match(/^yes,\s*(.+)$/i);if(m)return m[1].replace(/^no,\s*/i,"").trim();const c=String(r.ChoiceTitle||"").split("|")[0].trim();return c&&r.ChoiceTitle.includes("|")?c:""};
const product=r=>{const t=String(r.ChoiceTitle||"");return t.includes("|")?t.split("|").slice(1).join("|").trim():t};
const roomItem=r=>{const t=String(r.Title||"");const i=t.indexOf(":");return i>0?t.slice(i+1).trim():t};
const ck=r=>r.OpsData.checkin;
function state(r){
  const c=ck(r);
  if(c.installedAt)return "done";
  if(c.returnedAt)return "gone";
  if(c.returnNeeded)return "ret";
  if(/owner/i.test(r.Ordered||"")&&!r.OnHandLocation)return "owner";
  if(c.pulledAt||(r.OnHandLocation&&/^on\s?-?site$/i.test(r.OnHandLocation)))return "site";
  if(r.OnHandLocation||r.DateReceived)return "recv";
  if(r.OrderDate||/^yes/i.test(r.Ordered||""))return "ord";
  return "need";
}
const atStokley=r=>state(r)==="recv"&&isStokley(r.OnHandLocation);
function leadDays(l){const s=String(l||"").toLowerCase();let m=s.match(/(\d+)\s*(?:-|to)\s*(\d+)\s*(week|wk|day|month)/);let n,u;if(m){n=+m[2];u=m[3]}else{m=s.match(/(\d+)\s*(week|wk|day|month)/);if(!m)return null;n=+m[1];u=m[2]}return u.startsWith("day")?n:u.startsWith("month")?n*30:n*7}
function expected(r){if(!r.OrderDate)return null;const ld=leadDays(r.LeadTime);const d=new Date(r.OrderDate+"T12:00:00");d.setDate(d.getDate()+(ld==null?14:ld));return {d:d.toISOString().slice(0,10),assumed:ld==null}}
const inJob=r=>job==="all"||r.Job===job;
function match(r){if(!q)return true;const s=q.toLowerCase(), n=s.replace(/[^a-z0-9]/g,"");return [r.Title,r.ChoiceTitle,r.Ordered,r.Location,r.Job,r.OnHandLocation].some(v=>String(v||"").toLowerCase().includes(s))||(n.length>=3&&(r.models||[]).some(m=>m.toLowerCase().replace(/[^a-z0-9]/g,"").includes(n)))}
const byId=id=>items.find(r=>r.id===id);
const flagged=r=>{const c=ck(r);return (c.condition&&c.condition!=="OK"&&["recv","site"].includes(state(r)))||(c.auditMissing&&atStokley(r))||state(r)==="ret"};

/* ---------- writes: SharePoint ---------- */
const BTCOLS=["OnHandLocation","DateReceived","ReceivedBy"];
let undoStack=null;
const snap=r=>({id:r.id,OnHandLocation:r.OnHandLocation,DateReceived:r.DateReceived,ReceivedBy:r.ReceivedBy,checkin:JSON.parse(JSON.stringify(ck(r))),edited:new Set(r.edited)});
// patch: BT columns by canon name, plus checkin:{…} merged into OpsData.checkin (null removes a key); replaceCheckin swaps it whole (undo)
async function write(id,patch){
  const r=byId(id); if(!r) return null;
  const before=snap(r), f={};
  for(const k of BTCOLS) if(k in patch){ const v=patch[k]||null; r[k]=v||(k==="ReceivedBy"?"":null); f[k]=k==="DateReceived"?(v?v+"T12:00:00Z":null):v; r.edited.add(k); }
  if(patch.replaceCheckin) r.OpsData.checkin={...patch.replaceCheckin};
  if(patch.checkin){ const c=ck(r); for(const [k,v] of Object.entries(patch.checkin)){ if(v===null||v===undefined) delete c[k]; else c[k]=v; } }
  if(Array.isArray(ck(r).moves)&&ck(r).moves.length>30) ck(r).moves=ck(r).moves.slice(-30);
  ck(r).itemId=r.key;
  f.OpsData=JSON.stringify(r.OpsData);
  if(Object.keys(f).some(k=>BTCOLS.includes(k))) Object.assign(f,{CoreEditedFields:[...r.edited].join(","),CoreEditedAt:new Date().toISOString(),CoreEditedBy:ME});
  try{ await gSend(`${LISTS}/CORE_Selections/items/${r.spId}/fields`,"PATCH",f); }
  catch(e){ Object.assign(r,{OnHandLocation:before.OnHandLocation,DateReceived:before.DateReceived,ReceivedBy:before.ReceivedBy,edited:before.edited}); r.OpsData.checkin=before.checkin; throw e; }
  return before;
}
const errMsg=e=>e&&e.status===403?"You don't have permission to change this.":"Didn't save. Check the connection and try again.";
// runs the writes (four at a time), keeps what saved, says what didn't; Undo writes the saved ones back
async function batch(fnList,msg){
  const done=[]; let fail=null, nFail=0; const q2=[...fnList];
  render();
  await Promise.all(Array.from({length:Math.min(4,q2.length)},async()=>{ while(q2.length){ const f=q2.shift(); try{ const b=await f(); if(b) done.push(b); }catch(e){ fail=e; nFail++; } } }));
  undoStack=done.length?{befores:done}:null;
  render();
  if(nFail) toast(nFail===fnList.length?errMsg(fail):`${plural(nFail,"item")} didn't save. ${errMsg(fail)}`,false);
  else toast(msg,true);
}
async function undo(){
  if(!undoStack) return; const B=undoStack.befores; undoStack=null;
  let bad=0; for(const b of B){ try{ await write(b.id,{OnHandLocation:b.OnHandLocation,DateReceived:b.DateReceived,ReceivedBy:b.ReceivedBy,replaceCheckin:b.checkin}); }catch(e){ bad++; } }
  render(); toast(bad?`${plural(bad,"item")} couldn't be undone. Check the connection.`:"Undone");
}
/* ---------- UI state ---------- */
let view=(location.hash.slice(1)||"checkin"), job="all", q="";
if(!["checkin","bays","pull","flags","stock"].includes(view))view="checkin";
let sel=null;            // {kind:'order'|'bay'|'item'|'unknown'|'stock'|'newunknown'|'flag', key}
let draft=null;          // panel working copy
let pullCat="all", stockKind="tool", auditing=null;

const ICONS={
  checkin:'<svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  bays:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  pull:'<svg viewBox="0 0 24 24"><path d="M2 7h11v9H2zM13 10h5l3 3v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
  flags:'<svg viewBox="0 0 24 24"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
  stock:'<svg viewBox="0 0 24 24"><path d="M14 6l4 4-9 9H5v-4zM16 4l4 4"/></svg>',
};

/* ---------- render ---------- */
function render(){
  renderJobs(); renderRail();
  const m=$("#main");
  if(loadErr){m.innerHTML=`<div class="empty"><b>Can't reach SharePoint.</b>${esc(loadErr)} Reload to try again.</div>`;renderPanel();return}
  if(!loaded&&!items.length){m.innerHTML=`<p class="loading">Loading selections…</p>`;renderPanel();return}
  m.innerHTML=view==="checkin"?checkinView():view==="bays"?baysView():view==="pull"?pullView():view==="flags"?flagsView():stockView();
  renderPanel();
}
function renderJobs(){
  const showAll=view!=="pull"&&view!=="stock";
  if(view==="pull"&&job==="all")job=JOBS[0]||"all";
  $("#jobs").innerHTML=(view==="stock"?"":(showAll?`<button class="chip" data-job="all" aria-pressed="${job==="all"}">All jobs</button>`:"")+JOBS.map(j=>`<button class="chip" data-job="${esc(j)}" aria-pressed="${job===j}"><span class="dot" style="background:${jobColor(j)}"></span>${esc(j)}</button>`).join(""));
  $("#q").style.visibility=view==="bays"?"hidden":"";
}
function renderRail(){
  const waiting=items.filter(r=>inJob(r)&&state(r)==="ord").length;
  const nflag=items.filter(r=>inJob(r)&&flagged(r)).length+unknown.filter(u=>!u.resolvedAt).length;
  const low=stock.filter(stockLow).length;
  const b=(v,l,c,hot)=>`<button data-view="${v}" ${view===v?'aria-current="page"':""}>${ICONS[v]}<span>${l}</span>${c?`<span class="cnt ${hot?"hot":""}">${c}</span>`:""}</button>`;
  $("#rail").innerHTML=b("checkin","Check in",waiting)+b("bays","Bays")+b("pull","Pull for site")+b("flags","Returns & flags",nflag,true)+b("stock","Tools & supplies",low,true)
    +`<div class="spacer"></div><button class="small" data-act="theme">Light / dark</button>`;
}

/* ---- Check in ---- */
function orders(){
  const W=items.filter(r=>inJob(r)&&state(r)==="ord"&&match(r));
  const G={};
  for(const r of W){const key=r.Job+"|"+(vendorOf(r)||"?")+"|"+(r.OrderDate||"");(G[key]=G[key]||{key,job:r.Job,vendor:vendorOf(r),date:r.OrderDate,rows:[]}).rows.push(r)}
  return Object.values(G).map(g=>{const ex=g.rows.map(expected).filter(Boolean).sort((a,b)=>a.d.localeCompare(b.d));g.exp=ex[0]||null;return g})
    .sort((a,b)=>(a.exp?a.exp.d:"9").localeCompare(b.exp?b.exp.d:"9"));
}
const expTxt=e=>{if(!e)return `<span class="muted">No order date</span>`;const dd=dayDiff(e.d);return dd<0?`<span class="late">${plural(-dd,"day")} overdue</span>`:dd===0?`<b>Due today</b>`:`Due ${fmtDate(e.d)}`};
function checkinView(){
  const G=orders();
  const nItems=G.reduce((a,g)=>a+g.rows.length,0), late=G.filter(g=>g.exp&&dayDiff(g.exp.d)<0).length;
  const card=g=>`<button class="card" data-order="${esc(g.key)}" aria-current="${sel&&sel.kind==="order"&&sel.key===g.key}">
      <span class="dot" style="background:${jobColor(g.job)}"></span>
      <span class="main"><span class="t">${esc(g.vendor||"Vendor not listed")}</span><div class="s">${esc(g.job)} · ${plural(g.rows.length,"item")}${g.date?" · ordered "+fmtDate(g.date):""}</div><div class="s">${esc(g.rows.slice(0,3).map(roomItem).join(", "))}${g.rows.length>3?"…":""}</div></span>
      <span class="side">${expTxt(g.exp)}</span><span class="chev"></span></button>`;
  const recent=items.filter(r=>inJob(r)&&ck(r).checkedInAt).sort((a,b)=>ck(b).checkedInAt-ck(a).checkedInAt).slice(0,8);
  let body;
  if(!G.length)body=`<div class="empty"><b>${q?"Nothing matches.":"Nothing waiting."}</b>${q?"Try the vendor or the room.":"Every ordered item"+(job==="all"?"":" on "+esc(job))+" has been checked in."}</div>`;
  else if(job==="all")body=JOBS.filter(j=>G.some(g=>g.job===j)).map(j=>`<div class="jobhead"><span class="dot" style="background:${jobColor(j)}"></span>${esc(j)} <span class="cnt">${G.filter(g=>g.job===j).reduce((a,g)=>a+g.rows.length,0)}</span></div>${G.filter(g=>g.job===j).map(card).join("")}`).join("");
  else body=G.map(card).join("");
  return `<h1>Check in a delivery</h1><p class="lede">${plural(nItems,"item")} on order, grouped by vendor, soonest due first${late?` · <span class="late">${plural(late,"order")} overdue</span>`:""}. Tap the delivery that just arrived.</p>
  ${body}
  <button class="card" data-act="newunknown" style="border-style:dashed"><span class="main"><span class="t">Something arrived that isn't on the list</span><div class="s">Set it aside with a note and a bay. Your LC matches it up.</div></span><span class="chev"></span></button>

function bayPicker(cur,forJob){

  const mineL=Object.keys(mine);
  return `<div class="baypick" style="--cols:${MAXCOL};--jc:${forJob?jobColor(forJob):"var(--ink)"}" role="group" aria-label="Bay">${ROWS.map(rw=>`<span class="rl">${rw}</span>`+rowBays(rw).map(b=>`<button type="button" data-bay="${b}" class="${occ[b]?"has":""} ${mine[b]?"mine":""}" aria-pressed="${cur==="Stokley, "+b}">${b}</button>`).join("")+`<span style="grid-column:span ${MAXCOL-rowBays(rw).length}"></span>`.repeat(rowBays(rw).length<MAXCOL?1:0)).join("")}</div>
  <div class="bayextra"><button type="button" data-bay="Onsite" aria-pressed="${cur==="Onsite"}">Straight to site</button><button type="button" data-bay="Stokley" aria-pressed="${cur==="Stokley"}">Stokley, bay later</button></div>

}

/* ---- Bays ---- */
function bayContents(){
  const by={}; const vague=[];
  for(const r of items){if(!atStokley(r)||!inJob(r))continue;const bs=baysOf(r.OnHandLocation);if(!bs.length)vague.push(r);for(const b of bs)(by[b]=by[b]||[]).push(r)}
  for(const u of unknown){if(u.resolvedAt)continue;const b=baysOf(u.OnHandLocation)[0];if(b&&job==="all")(by[b]=by[b]||[]).push(u)}
  return {by,vague};
}
function baysView(){
  const {by,vague}=bayContents();
  const L=items.filter(r=>atStokley(r)&&inJob(r));
  const jobsIn=JOBS.filter(j=>L.some(r=>r.Job===j));
  const missing=L.filter(r=>ck(r).auditMissing);
  const tile=b=>{const its=by[b]||[];const real=its.filter(r=>r.OpsData);const js=[...new Set(real.map(r=>r.Job))];const miss=real.some(r=>ck(r).auditMissing||(ck(r).condition&&ck(r).condition!=="OK"&&!ck(r).resolvedAt));const unk=its.length-real.length;
    return `<button class="bay ${its.length?"":"empty"} ${miss?"miss":""}" data-baysel="${b}" aria-current="${sel&&sel.kind==="bay"&&sel.key===b}"><span class="baytop"><span class="bayid">${b}</span><span class="baycnt">${its.length||""}</span></span><span class="baynames">${js.slice(0,3).map(j=>`<span><i style="background:${jobColor(j)}"></i>${esc(j)}${js.length>1||unk?` <em>${real.filter(r=>r.Job===j).length}</em>`:""}</span>`).join("")}${js.length>3?`<span class="more">+${js.length-3} more</span>`:""}${unk?`<span><i style="background:var(--muted)"></i>Not on the list <em>${unk}</em></span>`:""}</span></button>`};
  return `<h1>Stokley</h1><p class="lede">${plural(L.length,"item")} in the warehouse${job==="all"?" across "+plural(jobsIn.length,"job"):" for "+esc(job)}. Tap a bay to see what's in it, move things or audit it.</p>
  <div class="bays" style="--cols:${MAXCOL}">${ROWS.map(rw=>`<div class="bayrow"><span class="bayrl">${rw}</span>${rowBays(rw).map(tile).join("")}</div>`).join("")}</div>
  <div class="baylegend">${jobsIn.map(j=>`<span><i style="background:${jobColor(j)}"></i>${esc(j)} <em>${L.filter(r=>r.Job===j).length}</em></span>`).join("")}</div>
  ${vague.length?`<div class="stoksec warn"><h4>No bay noted (${vague.length})</h4><p>These say "Stokley" but not which bay. Tap Set bay to give each one a bay.</p>${vague.map(r=>itemRow(r,"Set bay")).join("")}</div>`:""}
  ${missing.length?`<div class="stoksec warn"><h4>Not found in a bay audit (${missing.length})</h4>${missing.map(r=>itemRow(r)).join("")}</div>`:""}`;
}
function itemRow(r,btn){

}

/* ---- Pull for site ---- */
function pullView(){

  const cats=[...new Set(L.map(r=>r.Category).filter(Boolean))].sort();
  const F=L.filter(r=>pullCat==="all"||r.Category===pullCat);
  const shelves={}; for(const r of F){const k=ck(r).pulledAt?(ck(r).pulledFrom||"Stokley"):(baysOf(r.OnHandLocation)[0]||"Stokley, no bay");(shelves[k]=shelves[k]||[]).push(r)}
  const keys=Object.keys(shelves).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const left=F.filter(r=>!ck(r).pulledAt).length, done=F.length-left;
  const row=r=>`<div class="pullrow ${ck(r).pulledAt?"done":""}"><label><input type="checkbox" data-pull="${r.id}" ${ck(r).pulledAt?"checked":""}><span class="main"><span class="t" style="font-weight:600;font-size:18px">${esc(roomItem(r))}</span><div class="note">${esc([r.Location,product(r)].filter(Boolean).join(" · "))}</div>
    ${ck(r).condition&&ck(r).condition!=="OK"&&!ck(r).resolvedAt?`<div class="late" style="font-size:14px">${esc(ck(r).condition)}${ck(r).conditionNote?": "+esc(ck(r).conditionNote):""} – check with your LC first</div>`:""}</span></label>
    <span class="tag ${ck(r).pulledAt?"go":""}">${ck(r).pulledAt?"On the truck":esc(r.Location||"")}</span></div>`;
  return `<h1>Pull for ${esc(job)}</h1><p class="lede">${plural(left,"item")} waiting at Stokley, in bay order so you can walk the aisles. Tick each one as it goes on the truck.</p>
  ${cats.length>1?`<div class="filters"><button class="chip" data-pcat="all" aria-pressed="${pullCat==="all"}">Everything</button>${cats.map(c=>`<button class="chip" data-pcat="${esc(c)}" aria-pressed="${pullCat===c}">${esc(c.replace(/^\d+\s*-\s*/,""))}</button>`).join("")}</div>`:""}
  ${keys.map(k=>`<div class="bayhead"><b>${esc(k)}</b><span class="note">${plural(shelves[k].length,"item")}</span></div>${shelves[k].map(row).join("")}`).join("")||`<div class="empty"><b>Nothing to pull.</b>No received items for ${esc(job)} are waiting at Stokley${pullCat!=="all"?" in this category":""}.</div>`}

}

}

const stockLow=x=>x.kind==="supply"&&typeof x.min==="number"&&(+x.qty||0)<=x.min;
function stockView(){
  const kind=stockKind, L=stock.filter(x=>x.kind===kind&&(!q||[x.name,x.bay,x.group,x.out].join(" ").toLowerCase().includes(q.toLowerCase())));
  const groups=[...new Set(L.map(x=>x.group))];

    ${kind==="tool"?(x.out?`<button class="btn small" data-stock="back|${x.id}">Bring it back</button>`:`<button class="btn ghost small" data-stock="take|${x.id}">Take it</button>`):`<button class="btn ghost small" data-stock="use|${x.id}">Used one</button><button class="btn ghost small" data-stock="add|${x.id}">+ Restock</button>`}</div>`;
  return `<h1>Tools &amp; supplies</h1><p class="lede">Shop stock kept in the bays: who has which tool, and supplies running low.</p>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="tabs2"><button data-skind="tool" aria-pressed="${kind==="tool"}">Tools</button><button data-skind="supply" aria-pressed="${kind==="supply"}">Supplies</button></div><button class="btn ghost small" data-act="stnew" style="margin-bottom:16px">+ Add ${kind==="tool"?"a tool":"a supply"}</button></div>

/* ---- panel switch ---- */
function renderPanel(){
  const p=$("#panel"), b=$("#bodyEl");
  if(!sel){b.classList.add("nopanel");p.innerHTML="";return}
  b.classList.remove("nopanel");
  const keep=p.scrollTop;
  let html="";
  if(sel.kind==="order")html=orderPanel();
  else if(sel.kind==="bay")html=bayPanel();
  else if(sel.kind==="move")html=movePanel();
  else if(sel.kind==="unknown")html=unknownPanel();
  else if(sel.kind==="match")html=matchPanel();
  else if(sel.kind==="stock")html=stockPanel();
  else if(sel.kind==="stocknew")html=stockNewPanel();
  if(html===undefined)return;
  p.innerHTML=html; p.scrollTop=keep;
}
function movePanel(){
  const r=byId(sel.key);
  return `<div class="phead"><h2>Move ${esc(roomItem(r))}</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="pmeta">${esc(r.Job)} · now at ${esc(r.OnHandLocation||"no location")}</div>
  <div class="field"><span>Move it to</span>${bayPicker(null,r.Job)}</div>`;
}
function openPanel(s){sel=s;draft=null;auditing=null;render()}
function closePanel(){sel=null;draft=null;auditing=null;render();return ""}

/* ---------- actions ---------- */
function doCheckin(){
  const d=draft,g=d.g; d.date=$("#dDate").value||TODAY; d.by=$("#dBy").value.trim()||ME;
  const L=g.rows.filter(r=>d.on[r.id]);
  batch(L.map(r=>()=>{const c=d.cond[r.id]||"OK";return write(r.id,{OnHandLocation:d.bay,DateReceived:d.date,ReceivedBy:d.by||null,checkin:{OnHandLocation:d.bay,DateReceived:d.date,ReceivedBy:d.by||null,status:"Received",receivedAt:Date.now(),condition:c,damageNote:c==="OK"?null:(d.cnote[r.id]||null),moves:[...(ck(r).moves||[]),{at:Date.now(),to:d.bay,what:"Checked in",by:ME}]}})}),
    `${plural(L.length,"item")} checked in to ${d.bay.replace(/^Stokley, /,"")}${L.some(r=>(d.cond[r.id]||"OK")!=="OK")?" · flagged for your LC":""}`);
  sel=null;draft=null;render();
}
function doMove(id,to){
  const r=byId(id),from=r.OnHandLocation;
  batch([()=>write(id,{OnHandLocation:to,checkin:{OnHandLocation:to,auditMissing:null,moves:[...(ck(r).moves||[]),{at:Date.now(),from,to,what:to==="Onsite"?"To site":"Moved",by:ME}]}})],`${roomItem(r)} → ${to.replace(/^Stokley, /,"")}`);
  if(sel&&sel.kind==="bay"){draft=null;render()}else{sel=null;draft=null;render()}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-act],input[type=checkbox]"); if(!t)return;
  const ds=t.dataset;
  if(ds.view){view=ds.view;location.hash=view;sel=null;draft=null;auditing=null;q="";$("#q").value="";render();$("#main").scrollTop=0;return}
  if(ds.job){job=ds.job;sel=null;draft=null;render();return}
  if(ds.order){openPanel({kind:"order",key:ds.order});return}
  if(ds.baysel){openPanel({kind:"bay",key:ds.baysel});return}
  if(ds.move){if(sel&&sel.kind==="bay"){draft={moving:ds.move};render()}else openPanel({kind:"move",key:ds.move});return}
  if(ds.bay){
    const v=ds.bay==="Onsite"||ds.bay==="Stokley"?ds.bay:"Stokley, "+ds.bay;
    if(sel.kind==="order"){draft.bay=draft.bay===v?null:v;render();return}
    if(sel.kind==="unknown"){draft.desc=$("#uDesc").value;draft.label=$("#uLabel").value;draft.by=$("#uBy").value;draft.bay=v;render();return}
    if(sel.kind==="stocknew"){draft=draft||{};draft.bay=v;draft.name=$("#snName").value;render();return}
    if(sel.kind==="move")return doMove(sel.key,v);
    if(sel.kind==="bay"&&draft&&draft.moving)return doMove(draft.moving,v);
    return;
  }
  if(ds.on){draft.on[ds.on]=t.checked;render();return}
  if(ds.cond){const [id,c]=ds.cond.split("|");draft.cond[id]=c;render();const n=document.querySelector(`[data-cnote="${id}"]`);if(n)n.focus();return}
  if(ds.seen){draft.seen[ds.seen]=t.checked;render();return}
  if(ds.pull){const r=byId(ds.pull);
    if(t.checked)batch([()=>write(r.id,{OnHandLocation:"Onsite",checkin:{OnHandLocation:"Onsite",pulledAt:Date.now(),pulledBy:ME,pulledFrom:r.OnHandLocation,moves:[...(ck(r).moves||[]),{at:Date.now(),from:r.OnHandLocation,to:"Onsite",what:"Pulled",by:ME}]}})],`${roomItem(r)} on the truck`);
    else{const back=ck(r).pulledFrom||"Stokley";batch([()=>write(r.id,{OnHandLocation:back,checkin:{OnHandLocation:back,pulledAt:null,pulledBy:null,pulledFrom:null}})],`${roomItem(r)} back in ${String(back).replace(/^Stokley, /,"")}`);}
    return}
  if(ds.pcat){pullCat=ds.pcat;render();return}
  if(ds.skind){stockKind=ds.skind;render();return}
  if(ds.flag){const [a,id]=ds.flag.split("|");const r=byId(id);
    const note=(ck(r).receiverNote?ck(r).receiverNote+" · ":"");
    const P={resolve:[{checkin:{condition:"OK",damageNote:null,receiverNote:note+"Resolved "+fmtDate(TODAY)}},"Marked sorted"],return:[{checkin:{returnNeeded:"return",returnReason:[ck(r).condition,ck(r).damageNote].filter(Boolean).join(": ")}},"On the return list"],
      keep:[{checkin:{returnNeeded:null,returnReason:null,condition:"OK",damageNote:null}},"Keeping it"],returned:[{checkin:{returnedAt:TODAY}},"Marked returned"],found:[{checkin:{auditMissing:null,auditedAt:Date.now()}},"Found"]}[a];
    batch([()=>write(id,P[0])],P[1]+": "+roomItem(r));return}
  if(ds.umatch){openPanel({kind:"match",key:ds.umatch});return}
  if(ds.mjob){draft.job=ds.mjob;render();return}
  if(ds.mitem){const u=unknown.find(x=>x.id===sel.key),r=byId(ds.mitem); if(!u||!r) return;
    const dt=u.date||TODAY, at=u.OnHandLocation||"Stokley";
    sel=null;draft=null;
    batch([()=>write(r.id,{OnHandLocation:at,DateReceived:dt,ReceivedBy:u.by||null,checkin:{OnHandLocation:at,DateReceived:dt,ReceivedBy:u.by||null,status:"Received",receivedAt:Date.now(),condition:"OK",receiverNote:"Matched from an unlisted delivery: "+u.desc}})],`Matched to ${r.Title}`)
      .then(()=>saveShared("unknownItems",{...u.raw,resolvedAt:new Date().toISOString(),resolvedBy:ME,matchedTo:r.Job+" · "+r.Title,spId:u.spId})).then(()=>{u.resolvedAt=new Date().toISOString();render()}).catch(e=>toast(errMsg(e)));
    return}
  if(ds.stock){const [a,id]=ds.stock.split("|");const x=stock.find(s=>s.id===id); if(!x) return;
    if(a==="take"){openPanel({kind:"stock",key:id});return}
    const before={...x};
    if(a==="back"){x.out=null;}
    if(a==="use")x.qty=Math.max(0,(+x.qty||0)-1);
    if(a==="add")x.qty=(+x.qty||0)+1;
    x.log=[...(x.log||[]),{at:Date.now(),what:{back:"Brought back",use:"Used one",add:"Restocked one"}[a],by:ME}].slice(-30);
    render(); saveShared("shopStock",x).then(()=>toast({back:"Back in "+(x.bay||"the shop"),use:x.qty+" "+(x.unit||"")+" left",add:x.qty+" "+(x.unit||"")+" left"}[a])).catch(e=>{Object.assign(x,before);render();toast(errMsg(e))});return}
  if(ds.stto){const i=$("#stTo");if(i)i.value=ds.stto;return}
  const act=ds.act;
  if(!act)return;
  if(act==="close")return void closePanel();
  if(act==="docheckin")return doCheckin();
  if(act==="uncheck"){const r=byId(ds.id);batch([()=>write(r.id,{OnHandLocation:null,DateReceived:null,ReceivedBy:null,checkin:{OnHandLocation:null,DateReceived:null,ReceivedBy:null,status:null,receivedAt:null,condition:null,damageNote:null}})],`${roomItem(r)} back on the waiting list`);return}
  if(act==="newunknown"){openPanel({kind:"unknown",bayHint:ds.bayhint||null});return}
  if(act==="saveunknown"){const desc=$("#uDesc").value.trim();if(!desc){$("#uDesc").focus();toast("Say what it is first");return}
    if(!draft.bay){toast("Pick where you put it");return}
    const by=$("#uBy").value.trim()||ME, label=$("#uLabel").value.trim(), bay=draft.bay;
    const raw={model:"",job:label,what:desc,bay,at:new Date().toISOString(),by};
    t.disabled=true;
    saveShared("unknownItems",raw).then(spId=>{unknown.unshift({id:spId,spId,raw,desc,model:"",label,OnHandLocation:bay,date:TODAY,by,resolvedAt:null});sel=null;draft=null;computeBays();render();toast("Set aside in "+bay.replace(/^Stokley, /,""))})
      .catch(e=>{t.disabled=false;toast(errMsg(e))});return}
  if(act==="udismiss"){const u=unknown.find(x=>x.id===sel.key); if(!u) return; const at=new Date().toISOString();
    saveShared("unknownItems",{...u.raw,resolvedAt:at,resolvedBy:ME,spId:u.spId}).then(()=>{u.resolvedAt=at;sel=null;draft=null;render();toast("Marked dealt with")}).catch(e=>toast(errMsg(e)));return}
  if(act==="auditstart"){auditing=sel.key;draft={seen:{}};render();return}
  if(act==="auditcancel"){auditing=null;draft=null;render();return}
  if(act==="auditdone"){const {by}=bayContents();const real=(by[auditing]||[]).filter(r=>r.OpsData);const seen=draft.seen;
    const miss=real.filter(r=>!seen[r.id]).length;
    batch(real.map(r=>()=>write(r.id,{checkin:seen[r.id]?{auditedAt:Date.now(),auditMissing:null}:{auditMissing:Date.now()}})),`Audit of ${auditing} done${miss?" · "+plural(miss,"item")+" missing":" · all there"}`);
    auditing=null;draft=null;render();return}
  if(act==="movecancel"){draft=null;render();return}
  if(act==="pullall"){const L=items.filter(r=>r.Job===job&&atStokley(r)&&(pullCat==="all"||r.Category===pullCat));
    batch(L.map(r=>()=>write(r.id,{OnHandLocation:"Onsite",checkin:{OnHandLocation:"Onsite",pulledAt:Date.now(),pulledBy:ME,pulledFrom:r.OnHandLocation}})),`${plural(L.length,"item")} on the truck`);return}
  if(act==="copypull"){const L=items.filter(r=>r.Job===job&&(atStokley(r)||ck(r).pulledAt)).sort((a,b)=>String(a.OnHandLocation).localeCompare(String(b.OnHandLocation),undefined,{numeric:true}));
    const txt=`Pull list – ${job} – ${fmtDate(TODAY)}\n\n`+L.map(r=>`[${ck(r).pulledAt?"x":" "}] ${r.Title}\n    ${ck(r).pulledFrom||r.OnHandLocation}`).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Pull list copied"),()=>toast("Couldn't copy on this device"));return}
  if(act==="sttake"){const x=stock.find(s=>s.id===sel.key);const to=$("#stTo").value.trim();if(!to){$("#stTo").focus();return}const before={...x};x.out=to;x.outAt=Date.now();
    x.log=[...(x.log||[]),{at:Date.now(),what:"Taken to "+to,by:ME}].slice(-30);sel=null;render();
    saveShared("shopStock",x).then(()=>toast(x.name+" out with "+to)).catch(e=>{Object.assign(x,before);render();toast(errMsg(e))});return}
  if(act==="stnew"){openPanel({kind:"stocknew"});return}
  if(act==="stsave"){const name=$("#snName").value.trim();if(!name){$("#snName").focus();toast("Give it a name");return}
    const kind=stockKind, x={kind,name,group:$("#snGroup").value,bay:draft&&draft.bay||null};
    if(kind==="supply"){x.qty=Math.max(0,parseFloat($("#snQty").value)||0);x.unit=$("#snUnit").value.trim();const mn=parseFloat($("#snMin").value);if(!isNaN(mn))x.min=mn;}
    t.disabled=true;
    saveShared("shopStock",x).then(spId=>{stock.push({...x,id:spId,spId});sel=null;draft=null;computeBays();render();toast(name+" added")}).catch(e=>{t.disabled=false;toast(errMsg(e))});return}
  if(act==="theme"){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){q=t.value;const pos=t.selectionStart;$("#main").innerHTML=view==="checkin"?checkinView():view==="pull"?pullView():view==="flags"?flagsView():view==="stock"?stockView():baysView();return}
  if(t.dataset.cnote&&draft&&draft.cnote){draft.cnote[t.dataset.cnote]=t.value}
  if(t.id==="dDate"&&draft)draft.date=t.value;
  if(t.id==="dBy"&&draft)draft.by=t.value;
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sel)closePanel()});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==view&&["checkin","bays","pull","flags","stock"].includes(h)){view=h;sel=null;render()}});

let toastT;
function toast(msg,canUndo){
  $("#toastMsg").textContent=msg; const u=$("#toastUndo"); u.hidden=!canUndo; u.onclick=()=>{undo();};
  $("#toast").classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>{$("#toast").classList.remove("show")},canUndo?5000:2200);
}
/* ---------- start: sign in, then load every active job ---------- */
document.getElementById("signInBtn").onclick=()=>{const b=document.getElementById("signInBtn");b.disabled=true;document.getElementById("gateMsg").textContent="Signing in…";SherpaAuth.signIn().catch(err=>{b.disabled=false;document.getElementById("gateMsg").textContent="Sign-in failed: "+err.message})};
(async()=>{
  try{ await SherpaAuth.init(); }catch(e){ document.getElementById("gate").classList.remove("hidden"); document.getElementById("gateMsg").textContent=e.message; return; }
  if(!SherpaAuth.isSignedIn()){ document.getElementById("gate").classList.remove("hidden"); return; }
  document.getElementById("appWrap").classList.remove("hidden");
  { const a=SherpaAuth.getAccount(); ME=(a&&(a.name||a.username))||""; bwSub(ME); }
  render();
  let js;
  try{ js=await loadJobs(); bwConn(true); }catch(e){ bwConn(false); loadErr=e.message||String(e); render(); return; }
  JOBS=js.filter(j=>!j.archived).map(j=>j.name);
  const shared=loadShared();
  for(const j of JOBS){ try{ items=items.concat(await loadJob(j)); }catch(e){ console.warn("Warehouse: could not load",j,e); toast("Couldn't load "+j+". Reload to try again."); } computeBays(); render(); }
  await shared; loaded=true; computeBays(); render();
})();
</script>
</body>
