<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263860">
<title>Selections · Warehouse</title>
<style>
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_DemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
:root{
  --limestone:#282828; --cotton:#F6F2EE; --navy:#263860; --linen:#E5E1D8;
  --ink:#282828; --muted:#6b6862; --line:#e2ddd2; --paper:#fff;
  --site:#3f6b4a; --site-bg:#e3ebdf; --store:#86662a; --store-bg:#f1e9d9; --ord:#3d5a80; --ord-bg:#e2e8f1;
  --need:#9a3a2a; --need-bg:#f3dfd8; --own:#5f5a52; --own-bg:#ece8e1; --warn:#9a3a2a;
  --serif:"Swear Text",Georgia,serif; --sans:"TT Norms Pro","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cotton);color:var(--ink);font:400 16px/1.4 var(--sans)}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.note{color:var(--muted);font-size:13.5px}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font:400 20px/1.1 var(--serif);white-space:nowrap}
.ver{font:700 11px/1 var(--sans);letter-spacing:.08em;color:#ef4444;margin-left:6px;vertical-align:middle}
.ro{font:500 11px/1 var(--sans);opacity:.7;margin-left:6px}
.scope{appearance:none;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;font:600 14px/1 var(--sans);padding:8px 28px 8px 10px;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.scope option{color:#282828}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;color:rgba(255,255,255,.75);font:600 14.5px/1 var(--sans);padding:12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
.tabs .n{font-weight:500;opacity:.75;margin-left:4px}
.layout{max-width:1280px;margin:0 auto}
main{padding:12px 12px 100px}
.search{position:relative;margin:2px 0 10px}
.search input{width:100%;font:400 17px/1 var(--sans);padding:14px 14px 14px 42px;border-radius:10px;border:1px solid var(--line);background:#fff}
.search input::-webkit-search-cancel-button{display:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;font:500 13.5px/1 var(--sans);padding:8px 12px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 2px 6px}
.gh h2{font:400 19px/1.2 var(--serif);margin:0}
.gh h3{font:600 14px/1.2 var(--sans);margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.card.on{outline:2px solid var(--navy);outline-offset:-1px}
.card .main{flex:1;min-width:0}
.card .t{font-weight:600}
.meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.jobpill{display:inline-block;font:700 11.5px/1 var(--sans);letter-spacing:.03em;background:var(--navy);color:#fff;border-radius:5px;padding:4px 6px;margin-right:6px;vertical-align:1px}
.model{font:600 13.5px/1.3 ui-monospace,Menlo,Consolas,monospace;background:var(--cotton);border-radius:5px;padding:2px 6px;display:inline-block;margin-top:5px}
.tag{flex:none;font:600 12px/1 var(--sans);padding:6px 8px;border-radius:999px;white-space:nowrap}
.t-site{background:var(--site-bg);color:var(--site)} .t-store{background:var(--store-bg);color:var(--store)}
.t-ord{background:var(--ord-bg);color:var(--ord)} .t-need{background:var(--need-bg);color:var(--need)} .t-own{background:var(--own-bg);color:var(--own)}
.rough{font:700 11px/1 var(--sans);color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:3px 5px;margin-left:6px;vertical-align:1px}
.close{font:700 11px/1 var(--sans);color:var(--store);background:var(--store-bg);border-radius:4px;padding:3px 5px;margin-left:6px}
mark{background:#fde9a8;color:inherit;border-radius:2px}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.box{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:14px;margin:10px 0}
.btn{border:0;border-radius:10px;background:var(--navy);color:#fff;font:600 15px/1 var(--sans);padding:13px 16px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.warnline{color:var(--warn);font-size:13.5px;margin-top:4px}
/* detail: bottom sheet on phones, right-hand panel on tablets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateY(105%);transition:transform .2s}
.panel.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:0}
  main{padding:14px 18px 60px}
  .panel{position:sticky;top:var(--hdr,110px);transform:none;max-height:calc(100vh - var(--hdr,110px));border-radius:0;border-left:1px solid var(--line);z-index:1;height:calc(100vh - var(--hdr,110px));padding:16px 20px}
  .panel .grab,.panel .x{display:none}
  .scrim{display:none}
}
.panel h3{font:400 22px/1.2 var(--serif);margin:4px 36px 6px 0}
.x{position:absolute;right:10px;top:10px;border:0;background:var(--cotton);border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1;cursor:pointer}
.sec{border-top:1px solid var(--line);padding:12px 0}
.sec h4{font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.label{border:2px solid #282828;border-radius:6px;padding:12px;margin:8px 0;background:#fff}
.label .lj{font:700 26px/1 var(--sans);letter-spacing:.02em}
.label .lr{font:700 20px/1.1 var(--sans);margin-top:6px}
.label .li{font-size:15px;margin-top:6px}
.label .lm{font:600 14px/1 ui-monospace,Menlo,monospace;margin-top:6px}
.label .lb{font:700 15px/1 var(--sans);margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.placeholder{color:var(--muted);text-align:center;padding:40px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#282828;color:#fff;padding:11px 14px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#tt{position:fixed;z-index:70;pointer-events:none;background:#282828;color:#fff;font:400 12px/1.4 var(--sans);padding:6px 9px;border-radius:5px;max-width:260px;opacity:0;transition:opacity .1s}
#tt.show{opacity:1}
#tt .tt-d{opacity:.75;margin-top:2px}
@media print{
  body *{visibility:hidden}
  #printLabel,#printLabel *{visibility:visible}
  #printLabel{position:absolute;left:0;top:0;width:4in}
}
</style>
</head>
<body>
<div id="gate" class="hidden"><div>
  <p>Sign in with your Bellweather Microsoft account to see selections.</p>
  <button class="btn" id="signInBtn">Sign in</button>
  <p class="note" id="gateMsg"></p>
</div></div>

<div id="app" class="hidden">
  <header class="top" id="top">
    <div class="toprow">
      <div class="brand">Warehouse<span class="ver" id="versionBadge"></span><span class="ro" data-tip="Showing SharePoint data. Changes can't be saved from this page yet.">Read-only</span></div>
      <select class="scope" id="scope" aria-label="Jobs to show"></select>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="match" aria-selected="true">Match a delivery</button>
      <button role="tab" data-tab="expect" aria-selected="false">Expecting<span class="n" id="nExpect"></span></button>
      <button role="tab" data-tab="shelves" aria-selected="false">Shelves<span class="n" id="nShelves"></span></button>
    </nav>
  </header>
  <div class="layout">
    <main id="main"><div class="empty">Loading…</div></main>
    <aside class="panel" id="panel" aria-label="Details"><div class="placeholder">Pick an item to see where it goes.</div></aside>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div id="printLabel" class="hidden"></div>
<div class="toast" id="toast" role="status"></div>
<div id="tt"></div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="../lib/sherpa-auth.js"></script>
<script>
const CORE_VERSION = 'v2';
(()=>{['versionBadge'].forEach(id=>{const el=document.getElementById(id); if(el) el.textContent=CORE_VERSION;});})();

/* tooltip engine: data-tip (+ optional data-tip-d detail line); hover devices only */
(()=>{const TT=document.getElementById('tt'); if(!TT||!matchMedia('(hover: hover)').matches) return;
  const tipOf=t=>{const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); const d=t.getAttribute('data-tip-d'); return e(t.getAttribute('data-tip'))+(d?'<div class="tt-d">'+e(d)+'</div>':'');};
  const move=e=>{const r=TT.getBoundingClientRect(); let x=e.clientX+12, y=e.clientY+14; if(x+r.width>innerWidth-8) x=e.clientX-r.width-12; if(y+r.height>innerHeight-8) y=e.clientY-r.height-14; TT.style.left=x+'px'; TT.style.top=y+'px';};
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t) return; TT.innerHTML=tipOf(t); TT.classList.add('show'); move(e);});
  document.addEventListener('mousemove',e=>{ if(TT.classList.contains('show')) move(e); });
  document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(t&&!(t.contains&&t.contains(e.relatedTarget))) TT.classList.remove('show');});
})();

/* ── Data: SharePoint (BWCore), read-only. The warehouse works across jobs,
   so it loads each ACTIVE job with its own indexed Job query (never a whole list). ── */
const GRAPH='https://graph.microsoft.com/v1.0';
const LISTS=GRAPH+'/sites/bellweather.sharepoint.com:/sites/BWCore:/lists';
async function gAll(url){ let out=[], next=url; while(next){ const j=await SherpaAuth.graph(next); out=out.concat(j.value||[]); next=j['@odata.nextLink']||null; } return out; }
const jobFilter=job=>`$filter=fields/Job eq '${encodeURIComponent(String(job).replace(/'/g,"''"))}'`;
const SEL_FIELDS='Title,Job,Category,Location,Ordered,OrderDate,LeadTime,OnHandLocation,DateReceived,ReceivedBy,Notes,DesignStatus';
const CH_FIELDS='Title,Job,SelectionLookupId,Description,ChoiceStatus';
const day=v=>v?String(v).slice(0,10):null;

async function loadJobs(){
  try{
    const rows=await gAll(`${LISTS}/CORE_SelectionJobs/items?$expand=fields($select=Title,Job,Archived)&$top=999`);
    if(rows.length) return rows.map(x=>({name:x.fields.Job||x.fields.Title,archived:!!x.fields.Archived})).filter(j=>j.name).sort((a,b)=>a.name.localeCompare(b.name));
  }catch(e){ if(!e||e.status!==404) throw e; }
  const rows=await gAll(`${LISTS}/CORE_Selections/items?$expand=fields($select=Job)&$top=999`);
  return [...new Set(rows.map(x=>x.fields.Job).filter(Boolean))].sort().map(name=>({name,archived:false}));
}
async function loadJob(job){
  const [sel,cho]=await Promise.all([
    gAll(`${LISTS}/CORE_Selections/items?${jobFilter(job)}&$expand=fields($select=${SEL_FIELDS})&$top=999`),
    gAll(`${LISTS}/CORE_SelectionChoices/items?${jobFilter(job)}&$expand=fields($select=${CH_FIELDS})&$top=999`)]);
  const chBy=new Map();
  for(const c of cho){ if(c.fields.ChoiceStatus&&c.fields.ChoiceStatus!=='Selected') continue; const k=String(c.fields.SelectionLookupId); if(!chBy.has(k)) chBy.set(k,[]); chBy.get(k).push(c.fields); }
  return sel.filter(x=>x.fields.DesignStatus!=='removed').map(x=>{ const f=x.fields, room=f.Location||'Unassigned', chs=chBy.get(String(x.id))||[];
    const i={id:job+'/'+x.id, job:f.Job, title:f.Title||'', room, short:shortTitle(f.Title||'',room), category:f.Category||'',
      ordered:f.Ordered||'', orderDate:day(f.OrderDate), leadTime:f.LeadTime||'', onHand:f.OnHandLocation||'', received:day(f.DateReceived), receivedBy:f.ReceivedBy||'',
      notes:f.Notes||'', choices:chs};
    i.models=[...new Set(chs.flatMap(c=>models(c.Description)))];
    i.vendor=vendorOf(i); i.state=stateOf(i); i.rough=isRough(i); i.hay=haystack(i);
    return i; });
}

/* ── Reading BT's free-text fields ──────────────────────────────────────── */
function shortTitle(t,room){ const m=t.match(/^([^:]+):\s*(.+)$/); return m&&m[1].trim().toLowerCase()===String(room).toLowerCase()?m[2]:t; }
function stateOf(i){
  const oh=i.onHand.trim(), ord=i.ordered.trim();
  if(/^on\s?-?site$/i.test(oh)) return {k:'site',label:'On site'};
  if(/^owner/i.test(oh)||/^(no,\s*)?owner/i.test(ord)) return {k:'own',label:'Owner supplied'};
  if(oh) return {k:'store',label:bayOf(oh)||oh};
  if(i.received) return {k:'store',label:'Received, no bay'};
  if(i.orderDate||/^yes\b/i.test(ord)) return {k:'ord',label:'Expected'};
  return {k:'need',label:'Not ordered'};
}
const bayOf=oh=>{ const m=String(oh).match(/^stokley\b,?\s*(.*)$/i); return m?('Stokley'+(m[1]?' '+m[1].toUpperCase():'')):null; };
// "Yes, Build" → Build;  "Tague" → Tague;  choice "Kolbe | …" → Kolbe
function vendorOf(i){
  const o=i.ordered.replace(/^((yes|no)\b\s*,?\s*)+/i,'').trim();
  if(o&&!/^(n\/a|owner supplied)$/i.test(o)) return o.replace(/^build$/i,'Build.com');
  const t=i.choices[0]&&i.choices[0].Title||''; return t.includes(' | ')?t.split(' | ')[0]:'';
}
// model numbers written in the choice description ("Model: K-2209-0", "Model #: PRB15C01CG", "SKU: …")
function models(desc){
  const out=[];
  for(const l of String(desc||'').split('\n')){
    const re=/\b(?:model(?:\s*(?:#|no\.?|number))?|sku|item(?:\s*#)?)\s*[:#]\s*([A-Z0-9][A-Z0-9#./-]{3,30})/ig; let m;
    while((m=re.exec(l))) out.push(m[1].replace(/[.,;]$/,''));
  }
  return out;
}
const isRough=i=>/valve|rough|drain|p-?trap|supply kit|in-?wall|carrier|tub filler|mixing/i.test(i.title+' '+i.choices.map(c=>c.Title).join(' '));
function haystack(i){ return [i.job,i.title,i.room,i.category,i.onHand,i.ordered,i.vendor,i.notes,...i.models,...i.choices.map(c=>c.Title+' '+(c.Description||''))].join(' ').toLowerCase(); }
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
// one wrong, missing or extra character still counts as a close match (box vs BT model numbers)
function near(a,b){ if(Math.abs(a.length-b.length)>1||a.length<5) return false; let i=0,j=0,e=0;
  while(i<a.length&&j<b.length){ if(a[i]===b[j]){i++;j++;continue;} if(++e>1) return false; if(a.length>b.length) i++; else if(b.length>a.length) j++; else {i++;j++;} }
  return e+(a.length-i)+(b.length-j)<=1; }

/* ── State and helpers ──────────────────────────────────────────────────── */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pref=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem('wh-'+k); localStorage.setItem('wh-'+k,v); }catch(e){ return null; } };
let JOBS=[], byJob=new Map(), scope=pref('scope')||'All active', tab=pref('tab')||'match', q='', vendorF='All', shelfMode='bay', current=null;
const items=()=>{ const js=scope==='All active'?JOBS.filter(j=>!j.archived).map(j=>j.name):[scope]; return js.flatMap(j=>byJob.get(j)||[]); };
const terms=()=>q.toLowerCase().split(/\s+/).filter(Boolean);
function hl(text){ const ts=terms(); let h=esc(text); for(const t of ts){ const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); h=h.replace(/(<[^>]*>)|([^<]+)/g,(m,tg,tx)=>tg?tg:tx.replace(re,'<mark>$1</mark>')); } return h; }
const fmtDate=d=>{ if(!d) return ''; const t=new Date(d+'T12:00:00'); return isNaN(t)?d:t.toLocaleDateString(undefined,{month:'short',day:'numeric'}); };
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),3400); }
const tag=i=>`<span class="tag t-${i.state.k}">${esc(i.state.label)}</span>`;
function card(i,extra=''){
  const ch=i.choices.map(c=>c.Title).join(' + ');
  return `<div class="card ${current===i.id?'on':''}" role="button" tabindex="0" data-open="${esc(i.id)}"><div class="main">
    <div class="t"><span class="jobpill">${esc(i.job)}</span>${hl(i.short)}${i.rough?'<span class="rough" data-tip="Installs early (rough-in). Keep it apart from the finish items.">ROUGH-IN</span>':''}${extra}</div>
    <div class="meta">${hl(i.room)}${i.vendor?' · '+hl(i.vendor):''}${ch?' · '+hl(ch):''}</div>
    ${i.models.length?i.models.slice(0,3).map(m=>`<span class="model">${hl(m)}</span> `).join(''):''}</div>${tag(i)}</div>`;
}
function groups(list,key,order){ const g=new Map(); for(const i of list){ const k=key(i); if(!g.has(k)) g.set(k,[]); g.get(k).push(i); }
  return [...g.entries()].sort(order||((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}))); }

/* ── Views ──────────────────────────────────────────────────────────────── */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  const all=items();
  $('nExpect').textContent=all.filter(i=>i.state.k==='ord').length||'';
  $('nShelves').textContent=all.filter(i=>i.state.k==='store').length||'';
  let h='';
  if(tab==='match'){
    h+=`<div class="search"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="#282828" stroke-width="2"/><path d="M20 20l-4-4" stroke="#282828" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" value="${esc(q)}" placeholder="Model # from the box, vendor, or what it is" autocomplete="off" enterkeyhint="search" aria-label="Match a delivery"></div>`;
    if(!q) h+=`<p class="note">Type what's on the box. Searches ${esc(scope==='All active'?'every active job':scope)}, so mixed shipments still match. Model numbers match even with one character off.</p>`;
    else{
      const nq=norm(q), ts=terms();
      const exact=all.filter(i=>ts.every(t=>i.hay.includes(t)));
      const close=nq.length>=5?all.filter(i=>!exact.includes(i)&&i.models.some(m=>near(norm(m),nq))):[];
      const rank=i=>['ord','need','store','site','own'].indexOf(i.state.k);
      exact.sort((a,b)=>rank(a)-rank(b));
      if(exact.length) h+=`<div class="gh"><h3>${exact.length} match${exact.length===1?'':'es'}</h3></div>`+exact.map(i=>card(i)).join('');
      if(close.length) h+=`<div class="gh"><h3>Close model numbers</h3><span class="note">one character different</span></div>`+close.map(i=>card(i,'<span class="close">CLOSE MATCH</span>')).join('');
      if(!exact.length&&!close.length) h+=`<div class="box"><b>Nothing matches “${esc(q)}”.</b><p class="note">It may not be in BuilderTrend yet, or the box shows a different model number.</p><button class="btn ghost" data-unknown>Log it as an unknown item</button></div>`;
    }
  }
  else if(tab==='expect'){
    const L=all.filter(i=>i.state.k==='ord');
    const vendors=['All',...new Set(L.map(i=>i.vendor||'Vendor not noted').sort())];
    if(!vendors.includes(vendorF)) vendorF='All';
    h+=`<p class="note">Ordered and not checked in yet${scope==='All active'?', every active job':''}. Grouped by who it's coming from, so a delivery can be checked off in one place.</p>`;
    h+=`<div class="chips" role="group" aria-label="Vendor">${vendors.map(v=>`<button class="chip" data-vendor="${esc(v)}" aria-pressed="${v===vendorF}">${esc(v)}</button>`).join('')}</div>`;
    const M=L.filter(i=>vendorF==='All'||(i.vendor||'Vendor not noted')===vendorF);
    for(const [v,its] of groups(M,i=>i.vendor||'Vendor not noted')) h+=`<div class="gh"><h2>${esc(v)}</h2><span class="note">${its.length}</span></div>`+its.sort((a,b)=>String(a.orderDate||'').localeCompare(String(b.orderDate||''))).map(i=>card(i,i.orderDate?` <span class="note">· ordered ${fmtDate(i.orderDate)}</span>`:'')).join('');
    if(!M.length) h+='<div class="empty">Nothing on order right now.</div>';
  }
  else if(tab==='shelves'){
    const L=all.filter(i=>i.state.k==='store');
    h+=`<div class="chips"><button class="chip" data-shelf="bay" aria-pressed="${shelfMode==='bay'}">By bay</button><button class="chip" data-shelf="job" aria-pressed="${shelfMode==='job'}">By job, then room</button></div>`;
    if(shelfMode==='bay'){
      for(const [bay,its] of groups(L,i=>i.state.label)) h+=`<div class="gh"><h2>${esc(bay)}</h2><span class="note">${its.length} item${its.length===1?'':'s'} · ${new Set(its.map(i=>i.job)).size} job${new Set(its.map(i=>i.job)).size===1?'':'s'}</span></div>`+its.sort((a,b)=>a.job.localeCompare(b.job)||a.room.localeCompare(b.room)).map(i=>card(i)).join('');
    }else{
      for(const [job,its] of groups(L,i=>i.job)){
        const bays=[...new Set(its.map(i=>i.state.label))];
        h+=`<div class="gh"><h2>${esc(job)}</h2><span class="note">${its.length} in ${bays.length} spot${bays.length===1?'':'s'}</span></div>`;
        if(bays.length>2) h+=`<div class="warnline">Spread across ${bays.length} spots: ${esc(bays.join(', '))}. Consider consolidating by room.</div>`;
        const rough=its.filter(i=>i.rough);
        if(rough.length) h+=`<div class="gh"><h3>Rough-in: keep apart, installs first</h3></div>`+rough.map(i=>card(i)).join('');
        for(const [room,r] of groups(its.filter(i=>!i.rough),i=>i.room)) h+=`<div class="gh"><h3>${esc(room)}</h3></div>`+r.map(i=>card(i)).join('');
      }
    }
    if(!L.length) h+='<div class="empty">Nothing recorded on the shelves for these jobs.</div>';
  }
  $('main').innerHTML=h;
  const qi=$('q'); if(qi&&document.activeElement!==qi&&tab==='match'&&render.focusQ){ qi.focus(); qi.setSelectionRange(qi.value.length,qi.value.length); render.focusQ=false; }
}
const isWide=()=>matchMedia('(min-width:900px)').matches;
function showPanel(html){ $('panel').innerHTML=(isWide()?'':'<div class="grab"></div><button class="x" data-close aria-label="Close">×</button>')+html; $('panel').scrollTop=0;
  if(!isWide()){ $('panel').classList.add('open'); $('scrim').classList.add('open'); } }
function closePanel(){ $('panel').classList.remove('open'); $('scrim').classList.remove('open'); }
function labelHtml(i,bay){ return `<div class="label"><div class="lj">${esc(i.job)}</div><div class="lr">${esc(i.room)}</div><div class="li">${esc(i.short)}</div>${i.models[0]?`<div class="lm">${esc(i.models[0])}</div>`:''}${bay?`<div class="lb">${esc(bay)}</div>`:''}${i.rough?'<div class="lb">ROUGH-IN</div>':''}</div>`; }
function openItem(id){
  const i=items().find(x=>x.id===id)||[...byJob.values()].flat().find(x=>x.id===id); if(!i) return; current=id;
  const sameJob=(byJob.get(i.job)||[]).filter(x=>x.state.k==='store');
  const bays=[...new Set(sameJob.map(x=>x.state.label))];
  const roomBay=[...new Set(sameJob.filter(x=>x.room===i.room).map(x=>x.state.label))];
  const suggest=roomBay[0]||bays[0]||'';
  const kv=[['Job',i.job],['Room',i.room],['Status',i.state.label],i.vendor?['Coming from',i.vendor]:null,i.orderDate?['Ordered',fmtDate(i.orderDate)]:null,i.leadTime?['Lead time',i.leadTime]:null,i.ordered?['Ordered?',i.ordered]:null].filter(Boolean);
  showPanel(`<div class="note">${esc(i.category.replace(/^\d+\s*-\s*/,''))}${i.rough?' · <b style="color:var(--warn)">Rough-in</b>':''}</div>
    <h3>${esc(i.short)}</h3>${tag(i)}
    <div class="sec"><h4>Check the box against</h4>
      ${i.choices.map(c=>`<div style="font-weight:600">${esc(c.Title)}</div>`).join('')}
      ${i.models.length?`<div style="margin-top:6px">${i.models.map(m=>`<span class="model">${esc(m)}</span> `).join('')}</div>`:'<div class="note">No model number in BuilderTrend. Check the description.</div>'}
      ${i.choices.some(c=>c.Description)?`<details style="margin-top:8px"><summary>Full description</summary><div style="white-space:pre-wrap;font-size:14px">${esc(i.choices.map(c=>c.Description||'').join('\n\n'))}</div></details>`:''}
    </div>
    <div class="sec"><h4>Details</h4><dl class="kv">${kv.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
    <div class="sec"><h4>Where it goes</h4>
      ${suggest?`<p style="margin:0 0 6px">${esc(i.job)} ${roomBay.length?`<b>${esc(i.room)}</b> items are in`:'is stored in'} <b>${esc(suggest)}</b>${bays.length>1?` <span class="note">(job also in ${esc(bays.filter(b=>b!==suggest).join(', '))})</span>`:''}.</p>`:`<p class="note" style="margin:0 0 6px">Nothing for ${esc(i.job)} is on the shelves yet. Pick a free bay.</p>`}
      ${i.rough?'<p class="warnline" style="margin:0 0 6px">Rough-in part: store it with the job’s other rough-in items, not with its finish item.</p>':''}
      <label class="field"><span>Bay</span><input id="bay" value="${esc(suggest)}" placeholder="e.g. Stokley F4" autocomplete="off"></label>
      <div class="seg">${['OK','Damaged','Wrong item','Short'].map((c,n)=>`<button class="chip" data-cond="${c}" aria-pressed="${n===0}">${c}</button>`).join('')}</div>
      <div class="actions"><button class="btn" data-checkin data-tip="Not saved yet: this is a prototype.">Check in</button><button class="btn ghost" data-print>Print label</button></div>
    </div>
    <div class="sec"><h4>Label</h4><div id="labelPrev">${labelHtml(i,suggest)}</div></div>`);
  const bay=$('bay'); if(bay) bay.addEventListener('input',()=>{ $('labelPrev').innerHTML=labelHtml(i,bay.value.trim()); });
  if(isWide()) render();
}
function openUnknown(){
  current=null;
  showPanel(`<h3>Unknown item</h3><p class="note">Not in BuilderTrend, or the box doesn’t match. Set it aside and tell the LC instead of guessing.</p>
    <label class="field"><span>Model # on the box</span><input value="${esc(q)}"></label>
    <label class="field"><span>Which job, if you can tell</span><input placeholder="From the packing slip"></label>
    <label class="field"><span>What it looks like</span><input placeholder="e.g. chrome pop-up drain, Kohler box"></label>
    <div class="actions"><button class="btn" data-setaside>Set aside for LC</button></div>`);
  if(isWide()) render();
}

async function loadScope(){
  const js=scope==='All active'?JOBS.filter(j=>!j.archived).map(j=>j.name):[scope];
  $('main').innerHTML='<div class="empty">Loading…</div>';
  for(const j of js){ if(byJob.has(j)) continue; try{ byJob.set(j,await loadJob(j)); }catch(e){ toast('Couldn’t load '+j+': '+(e.message||e)); } render(); }
  render();
}
function setHdr(){ document.documentElement.style.setProperty('--hdr',$('top').offsetHeight+'px'); }

/* ── Events ─────────────────────────────────────────────────────────────── */
document.addEventListener('input',e=>{ if(e.target.id==='q'){ q=e.target.value.trim(); render.focusQ=true; render(); } });
document.addEventListener('click',e=>{
  const t=e.target;
  const tb=t.closest('[data-tab]'); if(tb){ tab=tb.dataset.tab; pref('tab',tab); render(); return; }
  const v=t.closest('[data-vendor]'); if(v){ vendorF=v.dataset.vendor; render(); return; }
  const s=t.closest('[data-shelf]'); if(s){ shelfMode=s.dataset.shelf; render(); return; }
  const c=t.closest('[data-cond]'); if(c){ c.parentNode.querySelectorAll('[data-cond]').forEach(b=>b.setAttribute('aria-pressed',String(b===c))); return; }
  if(t.closest('[data-checkin]')){ const bay=($('bay')||{}).value||''; toast(`Prototype: would check in${bay?' to '+bay:''}. Saving isn’t switched on yet.`); return; }
  if(t.closest('[data-print]')){ const p=$('printLabel'); p.innerHTML=$('labelPrev').innerHTML; p.classList.remove('hidden'); window.print(); p.classList.add('hidden'); return; }
  if(t.closest('[data-unknown]')){ openUnknown(); return; }
  if(t.closest('[data-setaside]')){ toast('Prototype: would add to the LC’s unknown-items list. Saving isn’t switched on yet.'); return; }
  const op=t.closest('[data-open]'); if(op){ openItem(op.dataset.open); return; }
  if(t.closest('[data-close]')||t===$('scrim')){ closePanel(); return; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePanel(); if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-open]')){ e.preventDefault(); openItem(e.target.dataset.open); } });
$('scope').onchange=e=>{ scope=e.target.value; pref('scope',scope); loadScope(); };
$('signInBtn').onclick=()=>{ $('signInBtn').disabled=true; $('gateMsg').textContent='Signing in…'; SherpaAuth.signIn().catch(err=>{ $('signInBtn').disabled=false; $('gateMsg').textContent='Sign-in failed: '+err.message; }); };
addEventListener('resize',setHdr);

(async()=>{
  try{ await SherpaAuth.init(); }catch(e){ $('gate').classList.remove('hidden'); $('gateMsg').textContent=e.message; return; }
  if(!SherpaAuth.isSignedIn()){ $('gate').classList.remove('hidden'); return; }
  $('app').classList.remove('hidden'); setHdr();
  try{ JOBS=await loadJobs(); }catch(e){ $('main').innerHTML=`<div class="empty">Couldn’t reach SharePoint: ${esc(e.message||e)}</div>`; return; }
  const active=JOBS.filter(j=>!j.archived);
  $('scope').innerHTML='<option>All active</option>'+active.map(j=>`<option>${esc(j.name)}</option>`).join('')+(JOBS.length>active.length?`<optgroup label="Archived">${JOBS.filter(j=>j.archived).map(j=>`<option>${esc(j.name)}</option>`).join('')}</optgroup>`:'');
  if(scope!=='All active'&&!JOBS.some(j=>j.name===scope)) scope='All active';
  $('scope').value=scope; loadScope();
})();
</script>
</body>
</html>
