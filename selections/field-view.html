<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263860">
<title>Selections · Field Mechanic</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://bellweatherllc.github.io/tools/logos/favicon-32.png?v=6">
<link rel="icon" type="image/x-icon" href="https://bellweatherllc.github.io/tools/logos/favicon.ico?v=6">
<link rel="icon" type="image/svg+xml" sizes="any" href="https://bellweatherllc.github.io/tools/logos/favicon.svg?v=6">
<link rel="apple-touch-icon" href="https://bellweatherllc.github.io/tools/logos/apple-touch-icon.png?v=6">
<style>
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_DemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
:root{
  --limestone:#282828; --cotton:#f2f3f4; --navy:#263860; --linen:#E5E1D8;
  --ink:#282828; --muted:#6b6862; --line:#e2ddd2; --paper:#fff;
  --site:#3f6b4a; --site-bg:#e3ebdf; --store:#86662a; --store-bg:#f1e9d9; --ord:#3d5a80; --ord-bg:#e2e8f1;
  --need:#9a3a2a; --need-bg:#f3dfd8; --own:#5f5a52; --own-bg:#ece8e1;
  --serif:"Swear Text",Georgia,serif; --sans:"TT Norms Pro","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cotton);color:var(--ink);font:400 16px/1.4 var(--sans)}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.practice{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 16px 0;padding:7px 10px;background:#f2c14e;color:#282828;border-radius:8px;font:600 13px/1.3 var(--sans)}
.practice a{color:#282828;text-decoration:underline;white-space:nowrap;padding:6px 2px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:env(safe-area-inset-top,0px) 0 10px;transition:top .2s}
/* scrolling down slides the brand/job bar away; search + tabs stay. Scrolling up brings it back. */
.top.away{top:calc(var(--away,56px) * -1)}
.top .search,.top .tabs{margin-left:16px;margin-right:16px}
.top .bwtb{border-bottom:0}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:400 20px/1.1 var(--serif);white-space:nowrap}
.ver{font:700 11px/1 var(--sans);letter-spacing:.08em;color:#ef4444;margin-left:6px;vertical-align:middle}
.ro{font:500 11px/1 var(--sans);opacity:.7;margin-left:6px}
.jrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.jname{flex:1;min-width:0;text-align:left;background:none;border:0;padding:14px 4px;min-height:52px;font:600 17px/1.2 var(--sans);overflow-wrap:anywhere}
.jrow.cur .jname::after{content:"  ✓";color:var(--site)}
.jstar{flex:none;width:52px;height:52px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.jstar[aria-pressed="true"]{color:#c98a0a}
.search{margin-top:10px;position:relative}
.search input{width:100%;font:400 16px/1 var(--sans);padding:12px 40px 12px 38px;border-radius:10px;border:0;background:#fff;color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;line-height:1;padding:6px 8px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.75);font:600 13.5px/1 var(--sans);padding:9px 2px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
/* body */
main{padding:10px 12px 110px;max-width:720px;margin:0 auto}
.note{color:var(--muted);font-size:13.5px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:relative}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;font:500 14px/1 var(--sans);padding:11px 14px;white-space:nowrap}
.chips .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.group{margin:6px 0 14px}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:10px 4px 8px;text-align:left;position:sticky;top:var(--hdr,150px);z-index:5;background:var(--cotton);transition:top .2s}
.gh h2{font:400 19px/1.2 var(--serif);margin:0}
.gh .note{white-space:nowrap}
.gh .gh-r{display:flex;align-items:center;gap:12px}
.link{border:0;background:none;color:var(--navy);font:600 14px/1 var(--sans);padding:10px 4px;margin:-10px -4px}
.card{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.card:active{background:#faf8f4}
.card{flex-wrap:wrap}
.card .specs{flex:1 0 100%;min-width:0;max-width:100%;margin-top:0}   /* chips run the full card width, under the thumbnail row */
.thumb{flex:none;width:52px;height:52px;border-radius:8px;background:var(--cotton);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#b3ad9f;overflow:hidden}
.thumb.has{background:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.hero{margin:10px 0 2px;width:100%;aspect-ratio:4/3;max-height:260px;border-radius:10px;background:var(--cotton);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#a39d90;overflow:hidden}
.hero a{display:block;width:100%;height:100%}
.hero img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.hero.none{aspect-ratio:auto;max-height:none;height:64px;flex-direction:row;gap:10px}   /* no picture: a slim strip, not a big empty box */
.hero.none .note{font-size:14px}
.imgs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}
.imgs a{flex:none;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--cotton);display:block}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.sgh{display:flex;justify-content:space-between;align-items:baseline;font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 4px 8px}
.chip .n{opacity:.6;font-weight:500;margin-left:4px}
.lrow{display:flex;align-items:center;gap:10px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:56px;margin-bottom:6px}
.lrow:active{background:#faf8f4}
.lrow .main{flex:1;min-width:0}
.lrow .t{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.lrow .c{color:var(--muted);font-size:13.5px;margin-top:1px}
.prog{margin:2px 0 14px;font-size:15px}
.prog .bar2{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.prog .bar2 i{display:block;height:100%;background:var(--site)}
.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font:400 19px/1.2 var(--serif);padding:14px 4px 10px;min-height:48px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"Show";font:600 14px/1 var(--sans);color:var(--navy);margin-left:auto;padding-left:12px}
.grp[open]>summary::after{content:"Hide"}
.grp>summary .note{margin-left:10px}
.acts.lead{margin:10px 0 0}
.acts.lead .btn{flex:1 1 0;white-space:nowrap}
.frow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow a{flex:1;min-width:0;display:block;padding:10px 0;color:var(--navy);font-weight:600;overflow-wrap:anywhere}
.frow .fk{display:block;font:600 11px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.shbtn{flex:none;width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.shbtn:active{background:var(--cotton)}
.fl{display:block;padding:11px 0;color:var(--navy);font-weight:600;overflow-wrap:anywhere}
.card .main{flex:1;min-width:0}
.card .t{font-weight:600;font-size:15.5px}
.card .c{color:var(--muted);font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.specs{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
.spec{font-size:12.5px;background:var(--cotton);border-radius:6px;padding:3px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spec b{font-weight:600}
.tag{flex:none;font:600 12px/1 var(--sans);padding:6px 8px;border-radius:999px;white-space:nowrap;max-width:42%;overflow:hidden;text-overflow:ellipsis}
.t-site{background:var(--site-bg);color:var(--site)} .t-store{background:var(--store-bg);color:var(--store)}
.t-ord{background:var(--ord-bg);color:var(--ord)} .t-need{background:var(--need-bg);color:var(--need)} .t-own{background:var(--own-bg);color:var(--own)}
mark{background:#fde9a8;color:inherit;border-radius:2px;padding:0 1px}
.selbox{flex:none;display:flex;align-items:center;justify-content:center;width:48px;height:48px;margin:-10px 0 -10px -12px}
.sel{width:26px;height:26px;margin:0;accent-color:var(--navy)}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar .bl{display:flex;align-items:center;gap:12px;font-weight:600}
.btn{border:0;border-radius:10px;background:var(--navy);color:#fff;font:600 15px/1 var(--sans);padding:13px 16px;min-height:48px}
.btn:disabled{opacity:.55}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:16px 16px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateY(100%);transition:transform .2s;max-width:720px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font:400 22px/1.2 var(--serif);margin:4px 36px 4px 0}
.x{position:absolute;right:10px;top:10px;border:0;background:var(--cotton);border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1}
.sec{border-top:1px solid var(--line);padding:12px 0}
.sec h4{font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
details summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:14.5px;padding:4px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
textarea{width:100%;font:400 16px/1.4 var(--sans);padding:10px;border:1px solid var(--line);border-radius:8px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs a{display:block;aspect-ratio:1;background:var(--cotton);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#282828;color:#fff;padding:11px 14px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
#gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#tt{position:fixed;z-index:70;pointer-events:none;background:#282828;color:#fff;font:400 12px/1.4 var(--sans);padding:6px 9px;border-radius:5px;max-width:260px;opacity:0;transition:opacity .1s}
#tt.show{opacity:1}
#tt .tt-d{opacity:.75;margin-top:2px}

/* ── CORE Tool Topbar (Bellweather Style Guide § Components) ── */
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-MediumItalic.woff2') format('woff2');font-weight:500;font-style:italic;font-display:swap;}
.bwtb{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:0 32px;min-height:56px;background:#263860;border-bottom:1px solid rgba(255,255,255,.14);color:#fff;font-family:'TT Norms Pro',-apple-system,BlinkMacSystemFont,sans-serif;position:relative;z-index:30}
.bwtb-left{display:flex;align-items:center;gap:16px;min-width:0}
.bwtb-logo{height:28px;width:auto;flex-shrink:0;display:block}
.bwtb-div{width:1px;height:28px;background:rgba(255,255,255,.18);flex-shrink:0}
.bwtb-title{font:500 18px/1.1 'Swear Text',Georgia,serif;color:#fff;white-space:nowrap}
.bwtb-title em{font-style:italic;opacity:.8}
.bwtb-sub{font:500 10px/1.2 'TT Norms Pro',sans-serif;color:#B7A9A3;text-transform:uppercase;letter-spacing:2px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.bwtb-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.bwtb-ver{font:700 10px/1 'TT Norms Pro',sans-serif;color:#ef4444;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:2px 7px;letter-spacing:.5px}
.bwtb-ver:empty{display:none}
.bwtb-dot{width:8px;height:8px;border-radius:50%;background:#B7A9A3;flex-shrink:0}
.bwtb-dot.on{background:#2d8a5e}
.bwtb-conn{font:600 11px/1 'TT Norms Pro',sans-serif;letter-spacing:.5px;color:rgba(255,255,255,.55);white-space:nowrap}
.bwtb-link{font:600 11px/1 'TT Norms Pro',sans-serif;letter-spacing:.5px;color:rgba(255,255,255,.75);text-decoration:none;white-space:nowrap}
.bwtb-link:hover{color:#fff}
.bwtb-left{overflow:hidden}
@media (max-width:640px){.bwtb{padding:0 16px;gap:12px}.bwtb-div,.bwtb-conn{display:none}.bwtb-logo{height:24px}.bwtb-left{gap:10px}.bwtb-title{font-size:17px}.bwtb-sub{display:block;color:#fff;opacity:.8;letter-spacing:1.5px}}
/* My projects button left of the search box (like the LC screen) */
.searchrow{display:flex;gap:8px;align-items:center;margin:10px 16px 0}
.searchrow .search{flex:1;min-width:0;margin:0}
.searchrow .search input{padding-top:10px;padding-bottom:10px;font-size:16px}
.viewsel{flex:none;display:flex;align-items:center;gap:6px;min-height:42px;padding:0 9px 0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:500 13px/1.1 'Swear Text',Georgia,serif;text-align:left;cursor:pointer}
.viewsel svg{flex:none;opacity:.85}
</style>
</head>
<body>
<div id="gate" class="hidden"><div>
  <p>Sign in with your Bellweather Microsoft account to see selections.</p>
  <p class="note hidden" id="gatePractice"><b>Practice mode.</b> You will see real data, but nothing you do is saved.</p>
  <button class="btn" id="signInBtn">Sign in</button>
  <p class="note" id="gateMsg"></p>
</div></div>

<div id="app" class="hidden">
  <header class="top" id="top">
    <header class="bwtb" id="bwtb"><div class="bwtb-left"><img class="bwtb-logo" src="https://bellweatherllc.github.io/tools/logos/Monogram-W.svg" alt="Bellweather"><div class="bwtb-div"></div><div style="min-width:0"><div class="bwtb-title"><span class="bwtb-app">Selections </span><em>Field Mechanic</em></div><div class="bwtb-sub" id="bwtbSub">BWCore</div></div></div><div class="bwtb-right"><span class="bwtb-ver" id="versionBadge"></span><span class="bwtb-dot" id="bwtbDot"></span><span class="bwtb-conn" id="bwtbConn">Connecting…</span></div></header>
    <div class="searchrow"><button class="viewsel" id="jobBtn" aria-haspopup="dialog" aria-label="Choose project"></button><div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="#282828" stroke-width="2"/><path d="M20 20l-4-4" stroke="#282828" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search this job…" autocomplete="off" enterkeyhint="search" aria-label="Search this job">
      <button class="clr hidden" id="qClear" aria-label="Clear search">×</button>
    </div></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="rooms" aria-selected="true">By room</button>
      <button role="tab" data-tab="check" aria-selected="false">Ready to install?</button>
      <button role="tab" data-tab="where" aria-selected="false">Where it is</button>
    </nav>
    <div class="practice hidden" id="practiceBar" role="status"><span>Practice mode: you see real data, but nothing is saved. Reload to start over.</span><a href="#" id="practiceExit">Exit</a></div>
  </header>
  <main id="main"><div class="empty">Loading…</div></main>
  <div class="bar hidden" id="bar"><div class="bl"><button class="link" id="barClear" aria-label="Clear selection">Clear</button><span id="barTxt"></span></div><button class="btn" id="barBtn" data-tip="Marks the selected items On site.">Brought to site</button></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle"></div>
<div class="toast" id="toast" role="status"></div>
<div id="tt"></div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="../lib/sherpa-auth.js"></script>
<script>
/* topbar: SharePoint connection state (green dot = connected) */
function bwConn(ok,label){ const d=document.getElementById('bwtbDot'), l=document.getElementById('bwtbConn'); if(d) d.classList.toggle('on',!!ok); if(l) l.textContent=label||(ok?'SharePoint':'Not connected'); }
function bwSub(t){ const el=document.getElementById('bwtbSub'); if(el) el.textContent=t; }
const CORE_VERSION = 'v16';
(()=>{['versionBadge'].forEach(id=>{const el=document.getElementById(id); if(el) el.textContent=CORE_VERSION;});})();

/* ── Practice mode ── Open the page with ?practice and it reads the real data but never writes anything.
   Every write goes through SherpaAuth.graph, so that one function refuses anything that is not a read and pretends it worked: the screen behaves as usual,
   and a reload starts over. Remembered preferences (last job, last tab, stars cache) are not written either.
   Microsoft sign-in sends the browser back to this address WITHOUT the ?practice part, so the choice is also kept for the tab (sessionStorage);
   the Exit link, or a new tab, clears it. If in doubt it stays in practice mode, which is the safe side. */
const PRACTICE=(()=>{ let on=false; try{ on=new URLSearchParams(location.search).has('practice'); if(on) sessionStorage.setItem('sf-practice','1'); else on=sessionStorage.getItem('sf-practice')==='1'; }catch(e){} return on; })();
if(PRACTICE){
  const realGraph=SherpaAuth.graph.bind(SherpaAuth); let fakeId=0;
  SherpaAuth.graph=(url,opts)=>{ const m=String((opts&&opts.method)||'GET').toUpperCase();
    if(m==='GET'||m==='HEAD') return realGraph(url,opts);
    return Promise.resolve(m==='POST'?{id:'practice-'+(++fakeId)}:{}); };   // looks like success; nothing is sent
  document.title='Practice · '+document.title;
  document.getElementById('practiceBar').classList.remove('hidden'); document.getElementById('gatePractice').classList.remove('hidden');
  document.getElementById('practiceExit').addEventListener('click',e=>{ e.preventDefault(); try{ sessionStorage.removeItem('sf-practice'); }catch(_){} location.href=location.pathname; });
}

/* tooltip engine: data-tip (+ optional data-tip-d detail line) */
(()=>{const TT=document.getElementById('tt'); if(!TT||!matchMedia('(hover: hover)').matches) return;   // touch screens: no hover tooltips
  const tipOf=t=>{const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); const d=t.getAttribute('data-tip-d'); return e(t.getAttribute('data-tip'))+(d?'<div class="tt-d">'+e(d)+'</div>':'');};
  const move=e=>{const r=TT.getBoundingClientRect(); let x=e.clientX+12, y=e.clientY+14; if(x+r.width>innerWidth-8) x=e.clientX-r.width-12; if(y+r.height>innerHeight-8) y=e.clientY-r.height-14; TT.style.left=x+'px'; TT.style.top=y+'px';};
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t) return; TT.innerHTML=tipOf(t); TT.classList.add('show'); move(e);});
  document.addEventListener('mousemove',e=>{ if(TT.classList.contains('show')) move(e); });
  document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(t&&!(t.contains&&t.contains(e.relatedTarget))) TT.classList.remove('show');});
})();

/* ── Data: SharePoint (BWCore), read-only, one job at a time ─────────────── */
const GRAPH='https://graph.microsoft.com/v1.0';
const LISTS=GRAPH+'/sites/bellweather.sharepoint.com:/sites/BWCore:/lists';
async function gAll(url){ let out=[], next=url; while(next){ const j=await SherpaAuth.graph(next); out=out.concat(j.value||[]); next=j['@odata.nextLink']||null; } return out; }
const jobFilter=job=>`$filter=fields/Job eq '${encodeURIComponent(String(job).replace(/'/g,"''"))}'`;
const SEL_FIELDS='Title,Job,Category,Location,DueDate,Ordered,OrderDate,LeadTime,OnHandLocation,DateReceived,Notes,DesignStatus,DesignKey,OpsData,CoreEditedFields';
const CH_FIELDS='Title,Job,SelectionLookupId,Description,ChoiceStatus';
const day=v=>v?String(v).slice(0,10):null;

async function loadJobs(){
  try{
    const rows=await gAll(`${LISTS}/CORE_SelectionJobs/items?$expand=fields($select=Title,Job,Archived)&$top=999`);
    if(rows.length) return rows.map(x=>({name:x.fields.Job||x.fields.Title,archived:!!x.fields.Archived})).filter(j=>j.name).sort((a,b)=>a.name.localeCompare(b.name));
  }catch(e){ if(!e||e.status!==404) throw e; }
  const rows=await gAll(`${LISTS}/CORE_Selections/items?$expand=fields($select=Job)&$top=999`);
  return [...new Set(rows.map(x=>x.fields.Job).filter(Boolean))].sort().map(name=>({name,archived:false}));
}
const cache=new Map();
async function loadJob(job){
  if(cache.has(job)) return cache.get(job);
  const [sel,cho]=await Promise.all([
    gAll(`${LISTS}/CORE_Selections/items?${jobFilter(job)}&$expand=fields($select=${SEL_FIELDS})&$top=999`),
    gAll(`${LISTS}/CORE_SelectionChoices/items?${jobFilter(job)}&$expand=fields($select=${CH_FIELDS})&$top=999`)]);
  const chBy=new Map();
  for(const c of cho){ if(c.fields.ChoiceStatus&&c.fields.ChoiceStatus!=='Selected') continue; const k=String(c.fields.SelectionLookupId); if(!chBy.has(k)) chBy.set(k,[]); chBy.get(k).push(c.fields); }
  const items=sel.filter(x=>x.fields.DesignStatus!=='removed').map(x=>{ const f=x.fields; const loc=f.Location||'Unassigned';
    const ops=parseJ(f.OpsData), ck=ops.checkin||{};
    return {id:String(x.id), key:f.DesignKey||('sp-'+x.id), edited:edSet(f.CoreEditedFields), ops, installed:ck.installedAt||null, job:f.Job, title:f.Title||'', room:loc, short:shortTitle(f.Title||'',loc), category:f.Category||'',
      ordered:f.Ordered||'', orderDate:day(f.OrderDate), leadTime:f.LeadTime||'', onHand:f.OnHandLocation||'', received:day(f.DateReceived), dueDate:day(f.DueDate),
      notes:f.Notes||'', choices:chBy.get(String(x.id))||[]}; });
  items.forEach(i=>{ i.state=stateOf(i); i.specs=i.choices.flatMap(c=>parseSpecs(c.Description)); i.hay=haystack(i); });
  cache.set(job,items); return items;
}
/* ── Saving ── BT fields edited here are listed in CoreEditedFields so Import keeps them.
   The check-in record in OpsData is the same one the LC and Warehouse screens use. */
const parseJ=v=>{ try{ const o=JSON.parse(v||'{}'); return o&&typeof o==='object'?o:{}; }catch(e){ return {}; } };
const edSet=v=>new Set(String(v||'').split(',').map(x=>x.trim()).filter(Boolean));
let ME='';
async function gPatch(id,fields){ for(let a=0;;a++){ try{ return await SherpaAuth.graph(`${LISTS}/CORE_Selections/items/${id}/fields`,{method:'PATCH',body:JSON.stringify(fields)}); }catch(e){ if([429,503,504].includes(e.status)&&a<5){ await new Promise(r=>setTimeout(r,1500*2**a)); continue; } throw e; } } }
const COLS={onHand:'OnHandLocation',received:'DateReceived',notes:'Notes'};
async function save(i,changes,checkin){
  const f={}, prev={...i, ops:JSON.parse(JSON.stringify(i.ops))};
  for(const [k,v] of Object.entries(changes)){ const col=COLS[k]; if(!col) continue; f[col]=col==='DateReceived'?(v?v+'T12:00:00Z':null):(v||null); i.edited.add(col); i[k]=v||''; }
  if(Object.keys(f).length) Object.assign(f,{CoreEditedFields:[...i.edited].join(','),CoreEditedAt:new Date().toISOString(),CoreEditedBy:ME});
  if(checkin){ i.ops.checkin={...(i.ops.checkin||{}),...checkin,itemId:i.key}; for(const [k,v] of Object.entries(checkin)) if(v===null) delete i.ops.checkin[k]; f.OpsData=JSON.stringify(i.ops); i.installed=i.ops.checkin.installedAt||null; }
  i.state=stateOf(i); i.hay=haystack(i);
  try{ await gPatch(i.id,f); }catch(e){ Object.assign(i,prev); i.state=stateOf(i); throw e; }
}
// files library is optional; thumbnails come from Graph each time (never stored)
const filesCache=new Map(), filesDone=new Map();   // filesDone: rows once the library has answered, so a sheet can draw them at once
function jobFiles(job){
  if(!filesCache.has(job)){
    const p=gAll(`${LISTS}/CORE_SelectionFiles/items?${jobFilter(job)}&$expand=fields($select=Job,SelectionLookupId,Kind,FileLeafRef),driveItem($select=id,name,webUrl)&$top=999`).catch(e=>{ if(e&&e.status===404) return []; throw e; });
    filesCache.set(job,p); p.then(r=>filesDone.set(job,r),()=>filesCache.delete(job));
  }
  return filesCache.get(job);
}

/* ── Starred jobs ── one row per person in CORE_SelectionDesignDocs: Job '_prefs', Collection 'fieldStars',
   DocId = sign-in name, Data = {"starred":[job names]}. SharePoint is the source; localStorage only paints the first frame. */
let UID='', STARS=new Set(), starRow=null, starQ=Promise.resolve();
const STAR_SVG=(on,sz)=>`<svg class="star" width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const cachedStars=()=>{ try{ const a=JSON.parse(pref('stars-'+UID)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } };
async function loadStars(){
  const rows=await gAll(`${LISTS}/CORE_SelectionDesignDocs/items?$filter=fields/Job eq '_prefs' and fields/Collection eq 'fieldStars'&$expand=fields($select=Title,Job,Collection,DocId,Data)&$top=999`);
  const mine=rows.find(r=>r.fields.DocId===UID);
  starRow=mine?String(mine.id):null;
  STARS=new Set(mine?(parseJ(mine.fields.Data).starred||[]):[]);
  pref('stars-'+UID,JSON.stringify([...STARS]));
}
async function saveStars(){
  const Data=JSON.stringify({starred:[...STARS]});
  if(starRow) await SherpaAuth.graph(`${LISTS}/CORE_SelectionDesignDocs/items/${starRow}/fields`,{method:'PATCH',body:JSON.stringify({Data})});
  else { const r=await SherpaAuth.graph(`${LISTS}/CORE_SelectionDesignDocs/items`,{method:'POST',body:JSON.stringify({fields:{Title:('fieldStars/'+UID).slice(0,255),Job:'_prefs',Collection:'fieldStars',DocId:UID,Data}})}); starRow=String(r.id); }
  pref('stars-'+UID,JSON.stringify([...STARS]));   // cache written only after SharePoint accepted it
}
function toggleStar(name){
  const had=STARS.has(name); had?STARS.delete(name):STARS.add(name);
  jobBtnLabel(); openJobs(true);
  starQ=starQ.then(saveStars).catch(()=>{ had?STARS.add(name):STARS.delete(name); jobBtnLabel(); if($('sheet').classList.contains('open')&&$('sheet').dataset.kind==='jobs') openJobs(true); toast('Couldn’t save the star. Check your connection and try again.'); });
}
function jobBtnLabel(){ $('jobBtn').innerHTML='<span>My<br>projects</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'; }
function openJobs(keepScroll){
  const sh=$('sheet'), top=sh.scrollTop;
  const starred=JOBS.filter(j=>STARS.has(j.name)), rest=JOBS.filter(j=>!STARS.has(j.name)&&!j.archived), arch=JOBS.filter(j=>!STARS.has(j.name)&&j.archived);
  const row=j=>{ const on=STARS.has(j.name); return `<div class="jrow${j.name===job?' cur':''}"><button class="jname" data-job="${esc(j.name)}">${esc(j.name)}</button><button class="jstar" data-star="${esc(j.name)}" aria-pressed="${on}" aria-label="${on?'Unstar':'Star'} ${esc(j.name)}">${STAR_SVG(on,24)}</button></div>`; };
  sh.dataset.kind='jobs';
  sh.innerHTML=`<div class="grab"></div><button class="x" data-close aria-label="Close">×</button><h3 id="sTitle">Projects</h3>`+
    (starred.length?`<div class="sec"><h4>My projects</h4>${starred.map(row).join('')}</div>`:`<p class="note" style="margin:6px 0 0">Star a project to add it to My projects.</p>`)+
    (rest.length?`<div class="sec"><h4>All projects</h4>${rest.map(row).join('')}</div>`:'')+
    (arch.length?`<div class="sec"><h4>Archived</h4>${arch.map(row).join('')}</div>`:'');
  $('scrim').classList.add('open'); sh.classList.add('open'); sh.scrollTop=keepScroll===true?top:0;
}

/* ── Pictures ── Designers add images to the CORE_SelectionFiles library (Kind = Image, tagged Job + Selection).
   Cards show a small thumbnail, the item sheet a large one; an item with no picture shows a placeholder icon.
   Thumbnail links come from Graph each time and live in memory only (links expire; never stored). Viewing only, no upload. */
const PH=sz=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5.2-5.2a1.5 1.5 0 0 1 2.1 0L16 17.5M14 15.5l1.8-1.8a1.5 1.5 0 0 1 2.1 0L21 16.8"/></svg>`;
const isImg=x=>x.fields.Kind==='Image'||(!x.fields.Kind&&/\.(jpe?g|png|gif|webp|heic)$/i.test((x.driveItem&&x.driveItem.name)||x.fields.FileLeafRef||''));
const imgIdx=new Map(), thumbP=new Map(), thumbUrl=new Map();   // job -> Map(selection id -> image rows); file id -> promise / medium URL
function imagesFor(j,rows){ if(!imgIdx.has(j)){ const m=new Map(); for(const x of rows||[]){ if(!isImg(x)) continue; const k=String(x.fields.SelectionLookupId); if(!m.has(k)) m.set(k,[]); m.get(k).push(x); } imgIdx.set(j,m); } return imgIdx.get(j); }
function thumbOf(fid){ if(!thumbP.has(fid)) thumbP.set(fid,SherpaAuth.graph(`${LISTS}/CORE_SelectionFiles/items/${fid}/driveItem/thumbnails?$select=medium,large`).then(t=>{ const o=(t&&t.value&&t.value[0])||{}; const r={medium:(o.medium&&o.medium.url)||null,large:(o.large&&o.large.url)||null}; if(r.medium) thumbUrl.set(fid,r.medium); return r; }).catch(()=>({medium:null,large:null}))); return thumbP.get(fid); }
function thumbHtml(i){ const f=(imgIdx.get(i.job)||new Map()).get(i.id), u=f&&thumbUrl.get(f[0].id); return `<div class="thumb${u?' has':''}" data-sel="${i.id}">${u?`<img src="${esc(u)}" alt="">`:PH(22)}</div>`; }
let thumbIO=null;
async function lazyThumbs(){   // only cards scrolled near the screen ask Graph for their picture
  const j=job; let rows; try{ rows=await jobFiles(j); }catch(e){ return; }
  if(job!==j) return;
  const idx=imagesFor(j,rows); if(!idx.size||!('IntersectionObserver' in window)) return;
  if(thumbIO) thumbIO.disconnect();
  thumbIO=new IntersectionObserver(es=>{ for(const en of es){ if(!en.isIntersecting) continue; thumbIO.unobserve(en.target); const el=en.target; thumbOf(idx.get(el.dataset.sel)[0].id).then(t=>{ if(t.medium&&el.isConnected){ el.innerHTML=`<img src="${esc(t.medium)}" alt="">`; el.classList.add('has'); } }); } },{rootMargin:'300px'});
  document.querySelectorAll('.thumb[data-sel]').forEach(el=>{ if(idx.has(el.dataset.sel)&&!el.classList.contains('has')) thumbIO.observe(el); });
}

/* ── Manuals & files ── Files come from CORE_SelectionFiles (Kind: Manual, Cut sheet, Other; Quote is never shown here, it carries prices).
   Product and spec-sheet links are the public URLs already written in a choice's description. The Share button opens the phone's own share sheet;
   a SharePoint file link only opens for people with access, so each row says who it opens for. */
const SHARE_SVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const PRIVATE_HOST=/(^|\.)(sharepoint\.com|buildertrend\.(net|com)|onedrive\.live\.com|1drv\.ms)$/i;
function productLinks(choices){
  const out=[], seen=new Set();
  for(const c of choices||[]) for(const m of String(c.Description||'').matchAll(/https?:\/\/[^\s<>"')\]]+/g)){
    try{ const u=new URL(m[0].replace(/[.,;:!?]+$/,'')); if(PRIVATE_HOST.test(u.hostname)||seen.has(u.href)) continue; seen.add(u.href);
      out.push({url:u.href,host:u.hostname.replace(/^www\./,''),kind:(/\.pdf(\?|$)/i.test(u.pathname)||/specification/i.test(u.pathname))?'Spec sheet':'Product page'}); }catch(e){}
  }
  return out.slice(0,5);
}
const fileKind=x=>{ const k=String(x.fields.Kind||'').trim().toLowerCase(); if(k) return k;   // no Kind set: guess from the file name
  const n=(x.driveItem&&x.driveItem.name)||x.fields.FileLeafRef||''; return /manual|install|instruction|owner.?s guide/i.test(n)?'manual':/cut ?sheet|spec/i.test(n)?'cut sheet':'other'; };
const KIND_LABEL={manual:'Manual','cut sheet':'Cut sheet'};
function renderFiles(i,files){
  const el=$('sFiles'); if(!el||el.dataset.id!==i.id) return;
  const rank=k=>({manual:0,'cut sheet':1}[k]??2);
  const fl=(files||[]).slice().sort((a,b)=>rank(fileKind(a))-rank(fileKind(b)));
  const links=productLinks(i.choices);
  const row=(kind,who,name,url)=>`<div class="frow"><a href="${esc(url)}" target="_blank" rel="noopener"><span class="fk">${esc(kind)} · ${who}</span>${esc(name)}</a><button class="shbtn" data-su="${esc(url)}" data-st="${esc(name)}" aria-label="Share ${esc(name)}">${SHARE_SVG}</button></div>`;
  const rows=fl.map(x=>{ const d=x.driveItem||{}, k=fileKind(x); return row(KIND_LABEL[k]||'File','staff only',d.name||x.fields.FileLeafRef||'File',d.webUrl||'#'); })
    .concat(links.map(l=>row(l.kind,'opens for anyone',l.host,l.url)));
  el.classList.toggle('hidden',!rows.length);
  el.innerHTML=rows.length?'<h4>Manuals &amp; files</h4>'+rows.join(''):'';
}
async function shareLink(url,title){
  if(navigator.share){ try{ await navigator.share({title,text:title,url}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }   // cancelled = do nothing
  try{ await navigator.clipboard.writeText(url); toast('Link copied. Paste it into a text or email.'); }
  catch(e){ toast('Couldn’t open sharing here. Press and hold the link to copy it.'); }
}

/* ── Interpreting the BT fields ─────────────────────────────────────────── */
function shortTitle(t,room){ const m=t.match(/^([^:]+):\s*(.+)$/); if(m&&m[1].trim().toLowerCase()===String(room).toLowerCase()) return m[2]; return t; }
// where the thing physically is, from BT's free-text fields
function stateOf(i){
  const oh=i.onHand.trim(), ord=i.ordered.trim();
  if(i.installed) return {k:'site',label:'Installed'};
  if(/^on\s?-?site$/i.test(oh)) return {k:'site',label:'On site'};
  if(/^owner/i.test(oh)||/^(no,\s*)?owner/i.test(ord)) return {k:'own',label:'Owner supplied'};
  if(oh) return {k:'store',label:oh.replace(/^stokley,?\s*/i,'Stokley ')};
  if(i.received) return {k:'store',label:'Received'};
  if(/^tbd/i.test(i.choices[0]&&i.choices[0].Title||'')) return {k:'need',label:'Not selected'};
  if(i.orderDate||/^yes\b/i.test(ord)) return {k:'ord',label:'Ordered'};
  return {k:'need',label:'Not ordered'};
}
const CHIP_KEYS=['Model','Model #','Color','Finish','Size','Door Style','Style','Tile Thickness','Thickness'];   // order = priority on a phone card
const SKIP_KEYS=/^(https?|www|allowance|date|quote|pricing|price|cost|total|lead time|source)$/i;
function parseSpecs(desc){
  const out=[];
  for(const raw of String(desc||'').split('\n')){
    const l=raw.replace(/^[•◦\s-]+/,'');
    const m=l.match(/^([A-Za-z][A-Za-z /#&-]{1,28}?)\s*:\s*(.{1,90})$/);
    if(!m||SKIP_KEYS.test(m[1].trim())) continue;
    out.push({k:m[1].trim(),v:m[2].trim()});
  }
  return out;
}
function haystack(i){ return [i.title,i.room,i.category,i.onHand,i.ordered,i.notes,...i.choices.map(c=>c.Title+' '+(c.Description||''))].join(' ').toLowerCase(); }

/* ── UI state ───────────────────────────────────────────────────────────── */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pref=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem('sf-'+k); if(PRACTICE) return null; localStorage.setItem('sf-'+k,v); }catch(e){ return null; } };
let JOBS=[], job=null, items=[], tab=pref('tab')||'rooms', q='', trade='All', roomF='All', whereF='All', whereS='All', hereOpen=false, picked=new Set();
const terms=()=>q.toLowerCase().split(/\s+/).filter(t=>t&&t!==String(job).toLowerCase());
function hl(text){ const ts=terms(); let h=esc(text); if(!ts.length) return h;
  for(const t of ts){ const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); h=h.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,'<mark>$1</mark>')); }
  return h; }
const matches=i=>terms().every(t=>i.hay.includes(t));
const tradeOf=i=>i.category.replace(/^\d+\s*-\s*/,'')||'Other';
const fmtDate=d=>{ if(!d) return ''; const t=new Date(d+'T12:00:00'); return isNaN(t)?d:t.toLocaleDateString(undefined,{month:'short',day:'numeric'}); };
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),3200); }
const tag=i=>`<span class="tag t-${i.state.k}">${esc(i.state.label)}</span>`;
function specChips(i){ const seen=new Set(); const chips=[];
  const rank=s=>CHIP_KEYS.findIndex(k=>k.toLowerCase()===s.k.toLowerCase());
  for(const s of i.specs.filter(s=>rank(s)>=0).sort((a,b)=>rank(a)-rank(b))){ const key=s.k.replace(/ #$/,''); if(seen.has(key.toLowerCase())) continue; seen.add(key.toLowerCase()); chips.push(`<span class="spec"><b>${esc(key)}</b> ${hl(s.v)}</span>`); if(chips.length>=3) break; }
  return chips.length?`<div class="specs">${chips.join('')}</div>`:''; }
function card(i,opts={}){
  const choice=i.choices.map(c=>c.Title).join(' + ');
  return `<div class="card" role="button" tabindex="0" data-open="${i.id}">
    ${opts.select?`<label class="selbox"><input type="checkbox" class="sel" data-pick="${i.id}" ${picked.has(i.id)?'checked':''} aria-label="Select ${esc(i.short)}"></label>`:''}
    ${thumbHtml(i)}
    <div class="main"><div class="t">${hl(opts.full?i.title:i.short)}</div>${choice?`<div class="c">${hl(choice)}</div>`:''}</div>${tag(i)}${specChips(i)}</div>`;
}
function grouped(list,keyFn,order){
  const g=new Map(); for(const i of list){ const k=keyFn(i); if(!g.has(k)) g.set(k,[]); g.get(k).push(i); }
  const keys=[...g.keys()].sort(order||((a,b)=>(a==='Unassigned')-(b==='Unassigned')||a.localeCompare(b)));
  return keys.map(k=>[k,g.get(k)]);
}

/* ── Views ──────────────────────────────────────────────────────────────── */
/* Ready to install?: for the chosen trade, what is not on site yet, what is owner supplied (arrival not tracked, so never assumed here), and what is on site. */
function checkSets(list){
  const L=list.filter(i=>trade==='All'||tradeOf(i)===trade);
  const byRoom=a=>a.slice().sort((x,y)=>(x.room==='Unassigned')-(y.room==='Unassigned')||x.room.localeCompare(y.room)||x.short.localeCompare(y.short));
  const todo=byRoom(L.filter(i=>!['site','own'].includes(i.state.k)));
  return {L,todo,pick:todo.filter(i=>i.state.k!=='need'),own:byRoom(L.filter(i=>i.state.k==='own')),here:byRoom(L.filter(i=>i.state.k==='site'))};
}
const lrow=(i,box)=>`<div class="lrow" role="button" tabindex="0" data-open="${i.id}">${box?`<label class="selbox"><input type="checkbox" class="sel" data-pick="${i.id}" ${picked.has(i.id)?'checked':''} aria-label="Select ${esc(i.short)}"></label>`:''}<div class="main"><div class="t">${hl(i.short)}</div><div class="c">${hl(i.room)}</div></div>${tag(i)}</div>`;
/* Where it is: group chips (with counts) and, inside a chosen group, a sub row: bays for Stokley, rooms for a big group. */
const W_ORDER=['On site','Stokley','Received','Ordered','Not ordered','Not selected','Owner supplied'];
const wBucket=i=>i.state.k==='store'&&/^stokley/i.test(i.state.label)?'Stokley':i.state.label;
const wRank=k=>{ const n=W_ORDER.indexOf(k); return n<0?W_ORDER.indexOf('Stokley')+.5:n; };
const wName=b=>b==='Stokley'?'At Stokley':b;
const noBay=i=>!String(i.state.label).replace(/^stokley\s*/i,'').trim();   // location just says "Stokley"
const NOBAY='\u2205 no bay';
// One rack serves one project, so the bay letters don't help you find anything. At Stokley splits into "No bay" (the ones to sort out) and rooms. The bay still shows on each card's tag.
const wSubKey=(b,i)=>(b==='Stokley'&&noBay(i))?NOBAY:i.room;
const subOrder=(x,y)=>(y===NOBAY)-(x===NOBAY)||(x==='Unassigned')-(y==='Unassigned')||x.localeCompare(y);
function whereVisible(list){   // -> {all:[[bucket,items]], groups:[[bucket,items shown,whole group]]} after the chips are applied
  const all=grouped(list,wBucket,(a,b)=>wRank(a)-wRank(b)||a.localeCompare(b));
  const sel=all.find(x=>x[0]===whereF);
  if(whereF!=='All'&&!sel){ whereF='All'; whereS='All'; }     // the chosen group emptied (e.g. everything moved on site)
  else if(sel&&whereS!=='All'&&!sel[1].some(i=>wSubKey(whereF,i)===whereS)) whereS='All';
  const groups=(whereF==='All'?all:all.filter(x=>x[0]===whereF)).map(([b,its])=>[b,(whereF!=='All'&&whereS!=='All')?its.filter(i=>wSubKey(b,i)===whereS):its,its]);
  return {all,groups};
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  $('qClear').classList.toggle('hidden',!q);
  const list=items.filter(matches);
  let h='';
  if(!items.length) h='<div class="empty">No selections for this job.</div>';
  else if(!list.length) h=`<div class="empty">Nothing in ${esc(job)} matches “${esc(q)}”.</div>`;
  else if(tab==='rooms'){
    const rooms=grouped(items,i=>i.room).map(g=>g[0]);
    if(rooms.length>1) h+=`<div class="chips" role="group" aria-label="Room">${['All',...rooms].map(r=>`<button class="chip" data-room="${esc(r)}" aria-pressed="${r===roomF}">${esc(r)}</button>`).join('')}</div>`;
    const RL=roomF==='All'?list:list.filter(i=>i.room===roomF);
    if(q||roomF!=='All') h+=`<p class="note">${RL.length} ${q?'match'+(RL.length===1?'':'es'):'item'+(RL.length===1?'':'s')} in ${esc(roomF==='All'?job:roomF)}</p>`;
    if(!RL.length) h+='<div class="empty">Nothing in this room matches.</div>';
    for(const [room,its] of grouped(RL,i=>i.room)) h+=`<section class="group"><div class="gh"><h2>${hl(room)}</h2><span class="note">${its.length}</span></div>${its.map(i=>card(i)).join('')}</section>`;
  }
  else if(tab==='check'){
    const trades=['All',...[...new Set(items.map(tradeOf))].sort()];
    if(!trades.includes(trade)) trade='All';
    h+=`<div class="chips" role="group" aria-label="Trade">${trades.map(t=>`<button class="chip" data-trade="${esc(t)}" aria-pressed="${t===trade}">${esc(t==='All'?'All trades':t)}</button>`).join('')}</div>`;
    const {L,todo,pick,own,here}=checkSets(list);
    const pct=L.length?Math.round(here.length/L.length*100):0;
    h+=`<div class="prog"><b>${here.length} of ${L.length}</b> on site${trade==='All'?'':' for '+esc(trade)}${own.length?` · ${own.length} owner supplied`:''}<div class="bar2" aria-hidden="true"><i style="width:${pct}%"></i></div></div>`;
    if(L.length&&!todo.length&&!own.length) h+='<p class="note" style="margin:0 4px 8px">Everything here is on site.</p>';
    const selHead=(key,arr)=>{ const all=arr.length&&arr.every(i=>picked.has(i.id)); return arr.length?`<button class="link" data-selall="${key}">${all?'Clear':'Select all'}</button>`:''; };
    if(todo.length) h+=`<section class="group"><div class="gh"><h2>Not on site yet</h2><span class="gh-r">${selHead('check-todo',pick)}<span class="note">${todo.length}</span></span></div>${todo.map(i=>lrow(i,i.state.k!=='need')).join('')}</section>`;
    if(own.length) h+=`<section class="group"><div class="gh"><h2>Owner supplied</h2><span class="gh-r">${selHead('check-own',own)}<span class="note">${own.length}</span></span></div><p class="note" style="margin:0 4px 8px">Arrival isn't tracked. Tick the ones you can see on site.</p>${own.map(i=>lrow(i,true)).join('')}</section>`;
    if(here.length) h+=`<details class="grp" id="hereBox"${hereOpen||(!todo.length&&!own.length)?' open':''}><summary><span>On site</span><span class="note">${here.length}</span></summary>${here.map(i=>lrow(i,false)).join('')}</details>`;
    if(!L.length) h+='<div class="empty">Nothing here matches.</div>';
  }
  else if(tab==='where'){
    const {all,groups}=whereVisible(list);
    h+=`<div class="chips" role="group" aria-label="Where">${[['All',list.length],...all.map(([k,its])=>[k,its.length])].map(([k,n])=>`<button class="chip" data-wf="${esc(k)}" aria-pressed="${k===whereF}">${esc(k==='All'?'All':wName(k))}<span class="n">${n}</span></button>`).join('')}</div>`;
    const sel=all.find(x=>x[0]===whereF);
    if(sel&&(sel[1].length>6||(whereF==='Stokley'&&sel[1].some(noBay)))){
      const keys=grouped(sel[1],i=>wSubKey(whereF,i),subOrder);
      h+=`<div class="chips" role="group" aria-label="Within ${esc(wName(whereF))}">${keys.map(([k,its])=>`<button class="chip" data-ws="${esc(k)}" aria-pressed="${k===whereS}">${esc(k===NOBAY?'No bay':k)}<span class="n">${its.length}</span></button>`).join('')}</div>`;
    }
    for(const [b,its,full] of groups){
      const sorted=b==='Stokley'?its.slice().sort((x,y)=>(x.room==='Unassigned')-(y.room==='Unassigned')||x.room.localeCompare(y.room)||x.state.label.localeCompare(y.state.label,undefined,{numeric:true})):its;
      const selAll=its.some(i=>i.state.k==='store')?(its.filter(i=>i.state.k==='store').every(i=>picked.has(i.id))?'Clear':'Select all'):'';
      // Stokley is in room order, then bay.
      // A big group is split under room headings only when rooms hold several items each (On site). With mostly one item per room (Owner supplied) headings would double the list, so it is a flat list in room order with full titles.
      const split=full.length>6&&grouped(full,i=>i.room).length*2<=full.length;
      const body=split
        ?grouped(sorted,i=>i.room).map(([room,r])=>`<div class="sgh"><span>${hl(room)}</span><span>${r.length}</span></div>${r.map(i=>card(i,{select:i.state.k==='store'})).join('')}`).join('')
        :(b==='Stokley'?sorted:its.slice().sort((x,y)=>(x.room==='Unassigned')-(y.room==='Unassigned')||x.room.localeCompare(y.room))).map(i=>card(i,{select:i.state.k==='store',full:true})).join('');
      const head=whereF==='All'||selAll;   // when a chip already names the group, its heading only stays if it carries Select all
      h+=`<section class="group" id="wg-${esc(b)}">${head?`<div class="gh"><h2>${esc(wName(b))}</h2><span class="gh-r">${selAll?`<button class="link" data-selall="${esc(b)}">${selAll}</button>`:''}<span class="note">${its.length}</span></span></div>`:''}${body}</section>`;
    }
  }
  const keepX={}; document.querySelectorAll('#main .chips').forEach(r=>{ keepX[r.getAttribute('aria-label')]=r.scrollLeft; });
  $('main').innerHTML=h;
  document.querySelectorAll('#main .chips').forEach(r=>{   // rows are rebuilt on every tap: keep where you had swiped to, and keep the chosen chip in view
    const k=r.getAttribute('aria-label'); if(keepX[k]) r.scrollLeft=keepX[k];
    const on=r.querySelector('[aria-pressed="true"]'); if(!on) return;
    const rr=r.getBoundingClientRect(), cr=on.getBoundingClientRect();
    if(cr.right>rr.right-8||cr.left<rr.left+8) r.scrollLeft=Math.max(0,r.scrollLeft+cr.left-rr.left-16);
  });
  const bar=$('bar'); bar.classList.toggle('hidden',!((tab==='where'||tab==='check')&&picked.size));
  $('barTxt').textContent=`${picked.size} selected`; $('barBtn').textContent=picked.size>1?`Brought to site (${picked.size})`:'Brought to site'; lazyThumbs();
}
// BT keeps "Order Date" and "Ordered?" (free text like "Yes, Build") apart. One line reads better: "Sep 29, Bedrosians", "Yes, Build", "No".
function orderedText(i){ const o=i.ordered.trim(), d=i.orderDate?fmtDate(i.orderDate):''; const m=o.match(/^(yes|no)\b[\s,:-]*(.*)$/i);
  if(m){ const rest=m[2].trim(); return d?[d,rest].filter(Boolean).join(', '):[m[1][0].toUpperCase()+m[1].slice(1).toLowerCase(),rest].filter(Boolean).join(', '); }
  return [d,o].filter(Boolean).join(', '); }
function openSheet(id,keepTop){
  const i=items.find(x=>x.id===id); if(!i) return;
  const here=['site','store','own'].includes(i.state.k), ck=i.ops.checkin||{}, isoDay=ms=>ms?new Date(ms).toISOString().slice(0,10):'';
  // the status tag above already says where it is, so this block only holds the dates
  const sl=String(i.state.label).trim(), whereTxt=i.state.k==='store'?(sl==='Received'?'Received, no location noted':sl==='Stokley'?'Stokley, no bay noted':sl):(['site','own'].includes(i.state.k)?sl:'');
  const where=[whereTxt?['Where',whereTxt]:null,orderedText(i)?['Ordered',orderedText(i)]:null,(!here&&i.leadTime)?['Lead time',i.leadTime]:null,i.received?['Received',fmtDate(i.received)]:null,
    (i.state.k==='site'&&ck.pulledAt)?['Brought to site',fmtDate(isoDay(ck.pulledAt))]:null,i.installed?['Installed',fmtDate(i.installed)]:null].filter(Boolean);
  const acts=[
    !['site','need'].includes(i.state.k)?`<button class="btn" data-act="site" data-id="${i.id}">Brought to site</button>`:'',
    i.state.label==='On site'?`<button class="btn" data-act="installed" data-id="${i.id}">Mark installed</button>`:'',
    i.state.label==='Installed'?`<button class="btn ghost" data-act="uninstall" data-id="${i.id}">Undo installed</button>`:'',
    i.state.k==='site'&&i.state.label!=='Installed'?`<button class="btn ghost" data-act="back" data-id="${i.id}">Back to Stokley…</button>`:''].join('');
  const specs=i.specs.filter((s,n,a)=>a.findIndex(x=>x.k.toLowerCase()===s.k.toLowerCase()&&x.v===s.v)===n);
  const known=filesDone.has(i.job), hasImg=known&&(filesDone.get(i.job)||[]).some(x=>String(x.fields.SelectionLookupId)===i.id&&isImg(x));   // until the library answers, start slim
  $('sheet').innerHTML=`<div class="grab"></div><button class="x" data-close aria-label="Close">×</button>
    <div class="note">${esc(i.job)} · ${esc(i.room)} · ${esc(tradeOf(i))}</div>
    <h3 id="sTitle">${esc(i.short)}</h3>
    ${acts?`<div class="acts lead">${acts}</div>`:''}
    <div class="hero${hasImg?'':' none'}" id="sHero" data-id="${i.id}">${PH(hasImg?40:24)}<div class="note">${known&&!hasImg?'No picture yet':''}</div></div>
    ${where.length?`<div class="sec"><h4>Order &amp; delivery</h4><dl class="kv">${where.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`:''}
    ${i.choices.map(c=>`<div class="sec"><h4>What it is</h4><div style="font-weight:600;margin-bottom:6px">${esc(c.Title)}</div>`+
      (specs.length?`<dl class="kv">${specs.slice(0,14).map(s=>`<dt>${esc(s.k)}</dt><dd>${esc(s.v)}</dd>`).join('')}</dl>`:'')+
      `</div>`).join('')}
    <div class="sec hidden" id="sFiles" data-id="${i.id}"></div>
    <div class="sec"><h4>Notes</h4><textarea id="nNotes" rows="3" placeholder="e.g. 2 of 3 boxes on site, one cracked">${esc(i.notes)}</textarea><div class="acts"><button class="btn ghost" data-act="notes" data-id="${i.id}">Save notes</button></div></div>
    ${i.choices.some(c=>c.Description)?`<div class="sec"><h4>Full description</h4>${i.choices.map(c=>c.Description?`<details style="margin-top:4px"><summary>${i.choices.length>1?esc(c.Title):'Show'}</summary><div class="desc">${esc(c.Description)}</div></details>`:'').join('')}</div>`:''}`;
  // Manuals & files are drawn before the scroll position is restored (product links at once, files too if the library already answered); otherwise the sheet is too short and the position is clamped.
  renderFiles(i,(filesDone.get(i.job)||[]).filter(x=>String(x.fields.SelectionLookupId)===i.id&&!isImg(x)&&fileKind(x)!=='quote'));
  $('sheet').dataset.kind='item'; $('scrim').classList.add('open'); $('sheet').classList.add('open'); $('sheet').scrollTop=typeof keepTop==='number'?keepTop:0;   // after an update the sheet stays where it was
  jobFiles(i.job).then(async rows=>{
    const hero=$('sHero'); if(!hero||hero.dataset.id!==i.id) return;
    const mine=(rows||[]).filter(x=>String(x.fields.SelectionLookupId)===i.id);
    const imgs=mine.filter(isImg), other=mine.filter(x=>!isImg(x)&&fileKind(x)!=='quote');
    renderFiles(i,other);
    if(!imgs.length){ hero.classList.add('none'); hero.querySelector('.note').textContent='No picture yet'; return; }
    hero.classList.remove('none');
    const [first,...more]=await Promise.all([thumbOf(imgs[0].id),...imgs.slice(1).map(x=>thumbOf(x.id))]);
    if($('sHero')!==hero||!hero.isConnected) return;
    const u=first.large||first.medium;
    if(!u){ hero.querySelector('.note').textContent='Picture couldn’t load'; return; }
    const link=x=>esc((x.driveItem&&x.driveItem.webUrl)||'#');
    hero.innerHTML=`<a href="${link(imgs[0])}" target="_blank" rel="noopener" aria-label="Open picture"><img src="${esc(u)}" alt="${esc(i.short)}"></a>`;
    const extra=more.map((t,n)=>t.medium?`<a href="${link(imgs[n+1])}" target="_blank" rel="noopener" aria-label="Open picture ${n+2}"><img src="${esc(t.medium)}" alt=""></a>`:'').join('');
    if(extra) hero.insertAdjacentHTML('afterend',`<div class="imgs">${extra}</div>`);
  }).catch(()=>{});
}
function closeSheet(){ $('scrim').classList.remove('open'); $('sheet').classList.remove('open'); }

async function pickJob(name){
  job=name; pref('job',name); bwSub(ME); picked.clear(); q=''; roomF='All'; whereF='All'; whereS='All'; $('q').value=''; $('q').placeholder='Search '+name+'…'; jobBtnLabel();
  $('main').innerHTML='<div class="empty">Loading…</div>';
  try{ items=await loadJob(name); }catch(e){ $('main').innerHTML=`<div class="empty">Couldn’t load ${esc(name)}: ${esc(e.message||e)}</div>`; return; }
  if(job===name) render();
}
function setHdrVar(){ const away=$('top').classList.contains('away')?$('bwtb').offsetHeight:0; document.documentElement.style.setProperty('--away',$('bwtb').offsetHeight+'px'); document.documentElement.style.setProperty('--hdr',($('top').offsetHeight-away)+'px'); }
let scrollAnchor=0;
function setAway(on){ const t=$('top'); if(t.classList.contains('away')===on) return; t.classList.toggle('away',on); setHdrVar(); }
addEventListener('scroll',()=>{ const y=Math.max(0,scrollY); if(y<48){ setAway(false); scrollAnchor=y; return; } if(Math.abs(y-scrollAnchor)<12) return; setAway(y>scrollAnchor); scrollAnchor=y; },{passive:true});

/* ── Events ─────────────────────────────────────────────────────────────── */
document.addEventListener('click',e=>{
  const t=e.target;
  const ac=t.closest('[data-act]'); if(ac){ act(ac.dataset.act,ac.dataset.id); return; }
  if(t.closest('.selbox')){ if(t.tagName==='INPUT'){ const id=t.dataset.pick; t.checked?picked.add(id):picked.delete(id); render(); } return; }   // label tap re-fires on the input
  const sa=t.closest('[data-selall]');
  if(sa&&String(sa.dataset.selall).startsWith('check-')){ const S=checkSets(items.filter(matches)); const L=sa.dataset.selall==='check-todo'?S.pick:S.own; const all=L.every(i=>picked.has(i.id)); L.forEach(i=>all?picked.delete(i.id):picked.add(i.id)); render(); return; }
  if(sa){ const g=whereVisible(items.filter(matches)).groups.find(x=>x[0]===sa.dataset.selall); const L=(g?g[1]:[]).filter(i=>i.state.k==='store'); const all=L.every(i=>picked.has(i.id)); L.forEach(i=>all?picked.delete(i.id):picked.add(i.id)); render(); return; }   // only this group's items, as filtered
  const wf=t.closest('[data-wf]'); if(wf){ whereF=wf.dataset.wf===whereF?'All':wf.dataset.wf; whereS='All'; render(); return; }
  const ws=t.closest('[data-ws]'); if(ws){ whereS=ws.dataset.ws===whereS?'All':ws.dataset.ws; render(); return; }
  const tb=t.closest('[data-tab]'); if(tb){ tab=tb.dataset.tab; pref('tab',tab); render(); window.scrollTo(0,0); setAway(false); return; }
  const tr=t.closest('[data-trade]'); if(tr){ trade=tr.dataset.trade; render(); return; }
  const rm=t.closest('[data-room]'); if(rm){ roomF=rm.dataset.room===roomF?'All':rm.dataset.room; render(); return; }
  const jb=t.closest('[data-job]'); if(jb){ closeSheet(); if(jb.dataset.job!==job) pickJob(jb.dataset.job); return; }
  const js=t.closest('[data-star]'); if(js){ toggleStar(js.dataset.star); return; }
  const su=t.closest('[data-su]'); if(su){ shareLink(su.dataset.su,su.dataset.st); return; }
  const op=t.closest('[data-open]'); if(op){ openSheet(op.dataset.open); return; }
  if(t.closest('[data-close]')||t===$('scrim')){ closeSheet(); return; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-open]')){ e.preventDefault(); openSheet(e.target.dataset.open); } });
$('q').addEventListener('input',e=>{ q=e.target.value.trim(); render(); });
$('qClear').onclick=()=>{ q=''; $('q').value=''; render(); $('q').focus(); };
$('jobBtn').onclick=()=>openJobs();
document.addEventListener('toggle',e=>{ if(e.target&&e.target.id==='hereBox') hereOpen=e.target.open; },true);   // keep the On site list open or shut across re-renders
const onSitePatch=i=>({checkin:{pulledAt:Date.now(),pulledFrom:i.onHand||null,pulledBy:ME},changes:{onHand:'Onsite',...(i.received?{}:{received:new Date().toISOString().slice(0,10)})}});
$('barClear').onclick=()=>{ picked.clear(); render(); };
$('barBtn').onclick=async()=>{
  const list=items.filter(i=>picked.has(i.id)); if(list.length>10&&!confirm(`Mark ${list.length} items as brought to site?`)) return;
  const btn=$('barBtn'); btn.disabled=true; let ok=0, bad=0;
  for(const i of list){ const p=onSitePatch(i); try{ await save(i,p.changes,p.checkin); ok++; picked.delete(i.id); }catch(e){ bad++; } }
  btn.disabled=false; render(); toast(bad?`${ok} marked on site, ${bad} didn’t save. Try again.`:`${ok} item${ok===1?'':'s'} marked on site.`);
};
async function act(kind,id){
  const i=items.find(x=>x.id===id); if(!i) return;
  try{
    if(kind==='site'){ const p=onSitePatch(i); await save(i,p.changes,p.checkin); toast('Marked on site.'); }
    else if(kind==='installed'){ await save(i,{},{installedAt:new Date().toISOString().slice(0,10),installedBy:ME}); toast('Marked installed.'); }
    else if(kind==='uninstall'){ await save(i,{},{installedAt:null,installedBy:null}); toast('Marked not installed.'); }
    else if(kind==='back'){ const bay=prompt('Which bay at Stokley? (e.g. F4)'); if(bay===null) return; const v=bay.trim()?('Stokley, '+bay.trim().replace(/^stokley,?\s*/i,'').toUpperCase()):'Stokley';
      await save(i,{onHand:v},{pulledAt:null,pulledFrom:null,pulledBy:null}); toast('Back at '+v+'.'); }
    else if(kind==='notes'){ await save(i,{notes:$('nNotes').value.trim()}); toast('Notes saved.'); }
    const top=$('sheet').scrollTop; render(); openSheet(id,top);
  }catch(e){ render(); toast(e&&e.status===403?'You don’t have permission to change this.':'Didn’t save. Check your connection and try again.'); }
}
$('signInBtn').onclick=()=>{ $('signInBtn').disabled=true; $('gateMsg').textContent='Signing in…'; SherpaAuth.signIn().catch(err=>{ $('signInBtn').disabled=false; $('gateMsg').textContent='Sign-in failed: '+err.message; }); };
addEventListener('resize',setHdrVar);

(async()=>{
  try{ await SherpaAuth.init(); }catch(e){ $('gate').classList.remove('hidden'); $('gateMsg').textContent=e.message; return; }
  if(!SherpaAuth.isSignedIn()){ $('gate').classList.remove('hidden'); return; }
  $('app').classList.remove('hidden'); setHdrVar();
  { const a=SherpaAuth.getAccount(); ME=(a&&(a.name||a.username))||''; UID=(a&&(a.username||a.name))||''; STARS=new Set(cachedStars()); }
  const starsP=loadStars().catch(()=>null);   // a failed stars read never blocks the app
  try{ JOBS=await loadJobs(); bwConn(true); }catch(e){ bwConn(false); $('main').innerHTML=`<div class="empty">Couldn’t reach SharePoint: ${esc(e.message||e)}</div>`; return; }
  const active=JOBS.filter(j=>!j.archived);
  await starsP;
  const last=pref('job'); const firstStar=JOBS.find(j=>STARS.has(j.name)&&!j.archived);
  const start=JOBS.some(j=>j.name===last)?last:((firstStar||active[0]||JOBS[0]||{}).name);
  if(!start){ $('main').innerHTML='<div class="empty">No jobs yet.</div>'; return; }
  pickJob(start);
})();
