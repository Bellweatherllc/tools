<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#263860">
<title>Selections · Device Viewer</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://bellweatherllc.github.io/tools/logos/favicon-32.png?v=6">
<link rel="icon" type="image/x-icon" href="https://bellweatherllc.github.io/tools/logos/favicon.ico?v=6">
<link rel="icon" type="image/svg+xml" sizes="any" href="https://bellweatherllc.github.io/tools/logos/favicon.svg?v=6">
<link rel="apple-touch-icon" href="https://bellweatherllc.github.io/tools/logos/apple-touch-icon.png?v=6">
<style>
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'TT Norms Pro';src:url('https://bellweatherllc.github.io/tools/fonts/TT_Norms_Pro_DemiBold.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-Medium.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Swear Text';src:url('https://bellweatherllc.github.io/tools/fonts/SwearText-MediumItalic.woff2') format('woff2');font-weight:500;font-style:italic;font-display:swap;}
:root{--ink:#101820;--ink-2:#3d4247;--muted:#6f7276;--line:#d6d2c4;--paper:#fff;--canvas:#f2f3f4;--bezel:#16191c;--bezel-edge:#3a3f44;--sans:"TT Norms Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font:400 15px/1.4 var(--sans);display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* CORE Tool Topbar */
.bwtb{display:flex;align-items:center;justify-content:space-between;gap:32px;padding:0 24px;min-height:56px;background:#263860;color:#fff;flex:none}
.bwtb-left{display:flex;align-items:center;gap:16px;min-width:0}
.bwtb-logo{height:28px;width:auto;display:block}
.bwtb-div{width:1px;height:28px;background:rgba(255,255,255,.18)}
.bwtb-title{font:500 18px/1.1 'Swear Text',Georgia,serif;white-space:nowrap}
.bwtb-title em{font-style:italic;opacity:.8}
.bwtb-sub{font:500 10px/1.2 var(--sans);color:#B7A9A3;text-transform:uppercase;letter-spacing:2px;margin-top:3px;white-space:nowrap}
.bwtb-right{display:flex;align-items:center;gap:14px}
.bwtb-ver{font:700 10px/1 var(--sans);color:#ef4444;letter-spacing:.5px}
.bwtb-dot{width:8px;height:8px;border-radius:50%;background:#B7A9A3}
.bwtb-dot.on{background:#2d8a5e}
.bwtb-conn{font:600 11px/1 var(--sans);letter-spacing:.5px;color:rgba(255,255,255,.55)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--ink);flex:none}
.grp{display:flex;align-items:center;gap:8px}
.grp>span{font-size:13px;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:0 14px;min-height:36px;font-weight:500;border-left:1px solid var(--line);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select{min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 10px}
.btn{min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.4}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--ink)}
.info{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.note{font-size:13px;color:var(--ink-2);padding:8px 20px;background:var(--paper);border-bottom:1px solid var(--line);flex:none}
.note b{color:#9a4a33}
.stage{flex:1;min-height:0;overflow:auto;display:flex;padding:24px}
.stage.fit{overflow:hidden}
.holder{margin:auto;flex:none;position:relative}
.device{position:absolute;top:0;left:0;transform-origin:0 0;background:var(--bezel);border:2px solid var(--bezel-edge);box-shadow:0 24px 60px rgba(0,0,0,.28)}
.screen{position:absolute;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.screen iframe{border:0;display:block;width:100%;background:#fff;flex:none}
.sb{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font:600 14px/1 -apple-system,system-ui,sans-serif;color:#000;background:#f4f4f4}
.sb .r{display:flex;gap:6px;align-items:center}
.sb .bat{width:24px;height:11px;border:1.5px solid #000;border-radius:3px;position:relative}
.sb .bat::after{content:"";position:absolute;inset:1.5px;right:5px;background:#000;border-radius:1px}
.url{flex:none;display:flex;align-items:center;justify-content:center;background:#f4f4f4;border-bottom:1px solid #ddd}
.url span{background:#e3e3e6;border-radius:10px;padding:6px 18px;font:500 13px/1 -apple-system,system-ui,sans-serif;color:#333;max-width:70%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb{flex:none;background:#f4f4f4;border-top:1px solid #ddd}
.edge{flex:none;background:#f3f3f3;border-bottom:1px solid #dcdcdc;font:400 12px/1 "Segoe UI",system-ui,sans-serif;color:#1b1b1b}
.edge .tabs{height:36px;display:flex;align-items:flex-end;padding:0 8px;background:#e8e8e8}
.edge .tab{height:30px;min-width:200px;max-width:240px;background:#f3f3f3;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:8px;padding:0 12px;white-space:nowrap;overflow:hidden}
.edge .tab i{width:14px;height:14px;border-radius:3px;background:#263860;flex:none}
.edge .addr{height:42px;display:flex;align-items:center;gap:10px;padding:0 10px}
.edge .addr b{width:22px;height:22px;border-radius:50%;background:#dedede;flex:none}
.edge .addr span{flex:1;height:30px;border-radius:15px;background:#fff;border:1px solid #d6d6d6;display:flex;align-items:center;padding:0 14px;color:#444;white-space:nowrap;overflow:hidden}
.task{flex:none;background:#e9eef6;border-top:1px solid #cfd6e2;display:flex;align-items:center;justify-content:center;gap:10px}
.task i{width:24px;height:24px;border-radius:5px;background:#9fb0cc}
.task i:first-child{background:#3b78d8}
.home{position:absolute;left:50%;transform:translateX(-50%);bottom:7px;width:134px;height:5px;border-radius:3px;background:#111;opacity:.8;pointer-events:none}
.cam{position:absolute;border-radius:50%;background:#2a2f34}
.notch{position:absolute;border-radius:20px;background:#000;z-index:2;pointer-events:none}
#gate{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#gate .btn{background:#263860;color:#fff;border-color:#263860;min-height:44px;padding:0 20px;margin-top:10px}
#tt{position:fixed;z-index:70;pointer-events:none;background:#282828;color:#fff;font:400 12px/1.4 var(--sans);padding:6px 9px;border-radius:5px;max-width:260px;opacity:0;transition:opacity .1s}
#tt.show{opacity:1}
#tt .tt-d{opacity:.75;margin-top:2px}
@media (max-width:760px){.info{display:none}}
</style>
</head>
<body>
<header class="bwtb"><div class="bwtb-left"><img class="bwtb-logo" src="https://bellweatherllc.github.io/tools/logos/Monogram-W.svg" alt="Bellweather"><div class="bwtb-div"></div><div><div class="bwtb-title"><span>Selections </span><em>Device Viewer</em></div><div class="bwtb-sub" id="bwtbSub"></div></div></div><div class="bwtb-right"><span class="bwtb-ver" id="versionBadge"></span><span class="bwtb-dot" id="bwtbDot"></span><span class="bwtb-conn" id="bwtbConn">Connecting…</span></div></header>
<div id="gate" class="hidden"><div>
  <p>Sign in with your Bellweather Microsoft account to see the screens with live data.</p>
  <button class="btn" id="signInBtn">Sign in</button>
  <p class="note" id="gateMsg" style="border:0;background:none"></p>
</div></div>
<div id="app" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0">
  <div class="bar">
    <div class="grp"><span>Screen</span><div class="seg" id="tools"></div></div>
    <div class="grp"><span>Device</span><select id="dev" aria-label="Device"></select></div>
    <button class="btn" id="rot" type="button" data-tip="Turn the device" aria-label="Rotate"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg><span id="rotl">Rotate</span></button>
    <div class="grp"><span>Size</span><div class="seg" id="size"><button type="button" data-size="fit" data-tip="Shrink the device to fit this window">Fit</button><button type="button" data-size="1" data-tip="One page pixel per screen pixel">1:1</button></div></div>
    <div class="grp"><span>Opened in</span><div class="seg" id="mode"></div></div>
    <label class="chk" id="practiceWrap" data-tip="Field Mechanic practice mode: real data, nothing is saved"><input type="checkbox" id="practice">Practice</label>
    <button class="btn" id="reload" type="button" data-tip="Reload the screen"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Reload</button>
    <div class="info" id="info"></div>
  </div>
  <div class="note" id="note"></div>
  <div class="stage" id="stage"><div class="holder" id="holder"><div class="device" id="device"></div></div></div>
</div>
<div id="tt"></div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="../lib/sherpa-auth.js"></script>
<script>
"use strict";
function bwConn(ok,label){ const d=document.getElementById('bwtbDot'), l=document.getElementById('bwtbConn'); if(d) d.classList.toggle('on',!!ok); if(l) l.textContent=label||(ok?'SharePoint':'Not connected'); }
function bwSub(t){ const el=document.getElementById('bwtbSub'); if(el) el.textContent=t; }
const CORE_VERSION = 'v1';
(()=>{['versionBadge'].forEach(id=>{const el=document.getElementById(id); if(el) el.textContent=CORE_VERSION;});})();

/* tooltip engine: data-tip (+ optional data-tip-d detail line); hover devices only */
(()=>{const TT=document.getElementById('tt'); if(!TT||!matchMedia('(hover: hover)').matches) return;
  const tipOf=t=>{const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); const d=t.getAttribute('data-tip-d'); return e(t.getAttribute('data-tip'))+(d?'<div class="tt-d">'+e(d)+'</div>':'');};
  const move=e=>{const r=TT.getBoundingClientRect(); let x=e.clientX+12, y=e.clientY+14; if(x+r.width>innerWidth-8) x=e.clientX-r.width-12; if(y+r.height>innerHeight-8) y=e.clientY-r.height-14; TT.style.left=x+'px'; TT.style.top=y+'px';};
  document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(!t) return; TT.innerHTML=tipOf(t); TT.classList.add('show'); move(e);});
  document.addEventListener('mousemove',e=>{ if(TT.classList.contains('show')) move(e); });
  document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'); if(t&&!(t.contains&&t.contains(e.relatedTarget))) TT.classList.remove('show');});
})();

/* ── Device Viewer: the live Selections screens, with live data, inside true-size device frames.
   Screens are framed from this same site, so they share this tab's sign-in. Each device is drawn at its
   screen size in CSS pixels, so a page's own phone/tablet layouts switch exactly as on the device.
   The device's safe-area insets are written into the framed page's styles (a frame can't receive them). ── */
const DEVICES=[
  {k:"surfacepro13",l:"Surface Pro 13\"",w:960,h:1440,kind:"tablet",os:"win"},
  {k:"surfacego",l:"Surface Go",w:853,h:1280,kind:"tablet",os:"win"},
  {k:"ipad11",l:"iPad / iPad Air 11\"",w:820,h:1180,kind:"tablet",os:"ios"},
  {k:"ipadpro13",l:"iPad Pro / Air 13\"",w:1032,h:1376,kind:"tablet",os:"ios"},
  {k:"galaxytab",l:"Samsung Galaxy Tab S9",w:800,h:1280,kind:"tablet",os:"android"},
  {k:"laptop15",l:"Laptop 15\" (1536 × 864)",w:1536,h:864,kind:"laptop",os:"win"},
  {k:"laptop14",l:"Laptop 14\" (1366 × 768)",w:1366,h:768,kind:"laptop",os:"win"},
  {k:"iphone17pro",l:"iPhone 17 Pro",w:402,h:874,kind:"phone",os:"ios",isl:62},
  {k:"iphone17promax",l:"iPhone 17 Pro Max",w:440,h:956,kind:"phone",os:"ios",isl:62},
  {k:"iphone16",l:"iPhone 16 / 15",w:393,h:852,kind:"phone",os:"ios",isl:59},
  {k:"iphonese",l:"iPhone SE",w:375,h:667,kind:"phone",os:"ios",home:true},
];
const SITE="bellweatherllc.github.io/tools/selections/";
const TOOLS=[
  {k:"lc",l:"LC",file:"lc-portal.html",dev:"laptop15",land:false,title:"LC"},
  {k:"warehouse",l:"Warehouse",file:"warehouse.html",dev:"surfacepro13",land:true,title:"Warehouse"},
  {k:"fm",l:"FM",file:"field-view.html",dev:"iphone17pro",land:false,title:"Field Mechanic",practice:true},
];
const MODES={win:[["edge","Edge"],["full","Full screen"]],ios:[["edge","Edge"],["safari","Safari"],["app","Home Screen"]],tab:[["edge","Edge"],["full","Full screen"]]};
const $=s=>document.querySelector(s);
const pref=(k,d)=>{try{const v=localStorage.getItem("dvl-"+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem("dvl-"+k,JSON.stringify(v))}catch(e){}};
let tool=pref("tool","warehouse"), size=pref("size","fit"), practice=pref("practice",true);
let devFor=pref("devFor",{}), landFor=pref("landFor",{}), modeFor=pref("modeFor",{});
const T=()=>TOOLS.find(t=>t.k===tool)||TOOLS[0];
const D=()=>DEVICES.find(d=>d.k===(devFor[tool]||T().dev))||DEVICES[0];
const land=()=>D().kind==="laptop"?false:(landFor[tool]!=null?landFor[tool]:T().land);
const modeSet=d=>d.kind==="phone"?MODES.ios:d.os==="win"?MODES.win:MODES.tab;
const modeKey=d=>d.kind==="phone"?"phone":d.os==="win"?"win":"tab";
const mode=()=>{const d=D(),m=modeFor[modeKey(d)];return modeSet(d).some(x=>x[0]===m)?m:"edge"};
const src=()=>T().file+(T().practice&&practice?"?practice":"");

// what sits around the page (heights in CSS px) and the safe-area insets the page is given
function bars(d,ls){
  const z={sb:0,url:0,edge:0,tb:0,task:0,inset:{top:0,right:0,bottom:0,left:0}}, m=mode();
  if(m==="full") return z;
  if(d.os==="win") return {...z,edge:78,task:48};
  if(d.kind==="tablet") return {...z,sb:24,url:50};
  const X=!d.home, isl=d.isl||0, side=X&&ls?{top:0,right:isl,bottom:21,left:isl}:z.inset;
  if(ls) return m==="app"?{...z,inset:side}:{...z,url:44,inset:side};
  if(m==="app") return X?{...z,sb:isl,inset:{...z.inset,bottom:34}}:{...z,sb:20};
  return X?{...z,sb:54,url:50,tb:50}:{...z,sb:20,url:50,tb:44};
}
const ENV=/env\(\s*safe-area-inset-(top|right|bottom|left)\s*(?:,[^()]*(?:\([^()]*\))?[^()]*)?\)/g;
let curInsets={top:0,right:0,bottom:0,left:0};
// rewrite env(safe-area-inset-*) in the framed page's style blocks; the original text is kept so it can change again without a reload
function applyInsets(){
  try{ const doc=$("#frame").contentDocument; if(!doc) return;
    doc.querySelectorAll("style").forEach(s=>{ if(s.dataset.dvOrig===undefined){ if(!ENV.test(s.textContent)) { ENV.lastIndex=0; return; } ENV.lastIndex=0; s.dataset.dvOrig=s.textContent; }
      s.textContent=s.dataset.dvOrig.replace(ENV,(m,k)=>curInsets[k]+"px"); }); }catch(e){}
}
let loadedSrc=null;
function build(){
  const d=D(), lap=d.kind==="laptop", ls=land(), w=ls?d.h:d.w, h=ls?d.w:d.h, b=bars(d,ls);
  $("#rot").disabled=lap; $("#practiceWrap").classList.toggle("hidden",!T().practice);
  const bez=lap?12:d.kind==="tablet"?22:14, rad=lap?8:d.kind==="tablet"?(d.os==="win"?14:38):56, phoneX=d.kind==="phone"&&!d.home;
  const dev=$("#device");
  if(!dev.firstChild){ dev.innerHTML=`<span class="cam"></span><div class="screen"><div class="sb"><span class="tm"></span><span class="r">●●● <span class="bat"></span></span></div><div class="edge"><div class="tabs"><div class="tab"><i></i><span class="tt"></span></div></div><div class="addr"><b></b><b></b><span class="ua"></span></div></div><div class="url"><span></span></div><iframe id="frame"></iframe><div class="tb"></div><div class="task"><i></i><i></i><i></i><i></i></div><span class="home"></span></div><span class="notch"></span>`;
    $("#frame").addEventListener("load",applyInsets); }
  const S=(sel,css)=>Object.assign(dev.querySelector(sel).style,css);
  Object.assign(dev.style,{width:(w+bez*2)+"px",height:(h+bez*2)+"px",borderRadius:(rad+bez)+"px"});
  S(".screen",{left:bez+"px",top:bez+"px",width:w+"px",height:h+"px",borderRadius:rad+"px"});
  S(".cam",d.kind==="tablet"?(ls?{display:"",left:(bez/2-3)+"px",top:"calc(50% - 3px)",width:"6px",height:"6px"}:{display:"",top:(bez/2-3)+"px",left:"calc(50% - 3px)",width:"6px",height:"6px"}):{display:"none"});
  S(".sb",{display:b.sb?"":"none",height:b.sb+"px",padding:phoneX?"6px 34px 0":"0 22px"});
  dev.querySelector(".tm").textContent=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}).replace(/\s?[AP]M/i,"");
  S(".edge",{display:b.edge?"":"none",height:b.edge+"px"}); dev.querySelector(".tt").textContent="Selections · "+T().title; dev.querySelector(".ua").textContent="https://"+SITE+src();
  S(".url",{display:b.url?"":"none",height:b.url+"px"}); dev.querySelector(".url span").textContent=SITE+T().file;
  const vh=h-b.sb-b.url-b.edge-b.tb-b.task;
  S("#frame",{height:vh+"px"}); $("#frame").setAttribute("aria-label","Selections "+T().title+" on "+d.l);
  S(".tb",{display:b.tb?"":"none",height:b.tb+"px"});
  S(".task",{display:b.task?"":"none",height:b.task+"px"});
  S(".home",{display:phoneX?"":"none",bottom:ls?"5px":"7px"});
  S(".notch",phoneX?(ls?{display:"",top:"50%",left:(bez+11)+"px",width:"34px",height:"122px",transform:"translateY(-50%)"}:{display:"",top:(bez+11)+"px",left:"50%",width:"122px",height:"34px",transform:"translateX(-50%)"}):{display:"none"});
  dev.dataset.w=w+bez*2; dev.dataset.h=h+bez*2;
  curInsets=b.inset; const insTxt=["top","right","bottom","left"].filter(k=>curInsets[k]).map(k=>k+" "+curInsets[k]).join(", ");
  $("#info").textContent=`${d.l} · ${w} × ${h} screen · page gets ${w} × ${vh}${insTxt?" · safe area: "+insTxt:""}`;
  $("#rotl").textContent=ls?"Portrait":"Landscape";
  $("#note").innerHTML=T().practice&&practice?"Live data in <b>practice mode</b>: nothing you do here is saved.":"<b>Live data:</b> this is the real screen. Changes save to SharePoint.";
  layout();
  if(loadedSrc!==src()){ loadedSrc=src(); $("#frame").src=src(); } else applyInsets();
}
function layout(){
  const dev=$("#device"),st=$("#stage"),hold=$("#holder");
  const W=+dev.dataset.w,H=+dev.dataset.h;
  st.classList.toggle("fit",size==="fit");
  const s=size==="fit"?Math.min(1,(st.clientWidth-48)/W,(st.clientHeight-48)/H):1;
  dev.style.transform=`scale(${s})`; hold.style.width=W*s+"px"; hold.style.height=H*s+"px";
  $("#info").textContent=$("#info").textContent.replace(/ · shown at \d+%$/,"")+(s<1?` · shown at ${Math.round(s*100)}%`:"");
}
function renderControls(){
  $("#tools").innerHTML=TOOLS.map(t=>`<button type="button" data-tool="${t.k}" aria-pressed="${t.k===tool}">${t.l}</button>`).join("");
  const d=D();
  $("#dev").innerHTML=["tablet","laptop","phone"].map(k=>`<optgroup label="${{tablet:"Tablets",laptop:"Laptops",phone:"Phones"}[k]}">${DEVICES.filter(x=>x.kind===k).map(x=>`<option value="${x.k}" ${x.k===d.k?"selected":""}>${x.l}</option>`).join("")}</optgroup>`).join("");
  document.querySelectorAll("#size button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.size===String(size))));
  $("#mode").innerHTML=modeSet(d).map(([k,l])=>`<button type="button" data-mode="${k}" aria-pressed="${k===mode()}">${l}</button>`).join("");
  $("#practice").checked=practice;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.tool){tool=t.dataset.tool;save("tool",tool);renderControls();build();}
  else if(t.dataset.size){size=t.dataset.size==="fit"?"fit":1;save("size",size);renderControls();layout();}
  else if(t.id==="rot"){landFor[tool]=!land();save("landFor",landFor);build();}
  else if(t.dataset.mode){modeFor[modeKey(D())]=t.dataset.mode;save("modeFor",modeFor);renderControls();build();}
  else if(t.id==="reload"){loadedSrc=null;build();}
});
$("#dev").addEventListener("change",e=>{devFor[tool]=e.target.value;save("devFor",devFor);
  const d=D(); if(landFor[tool]==null&&d.kind!==DEVICES.find(x=>x.k===T().dev).kind){landFor[tool]=d.kind==="tablet";save("landFor",landFor)}renderControls();build();});
$("#practice").addEventListener("change",e=>{practice=e.target.checked;save("practice",practice);build();});
window.addEventListener("resize",()=>{ if(!$("#app").classList.contains("hidden")) layout(); });
$("#signInBtn").onclick=()=>{ const b=$("#signInBtn"); b.disabled=true; $("#gateMsg").textContent="Signing in…"; SherpaAuth.signIn().catch(err=>{ b.disabled=false; $("#gateMsg").textContent="Sign-in failed: "+err.message; }); };

(async()=>{
  try{ await SherpaAuth.init(); }catch(e){ $("#gate").classList.remove("hidden"); $("#gateMsg").textContent=e.message; bwConn(false); return; }
  if(!SherpaAuth.isSignedIn()){ $("#gate").classList.remove("hidden"); bwConn(false,"Signed out"); return; }
  const a=SherpaAuth.getAccount(); bwSub((a&&(a.name||a.username))||""); bwConn(true);
  $("#app").classList.remove("hidden"); renderControls(); build();
})();
</script>
